<h2 mat-dialog-title>Timeline Status</h2>
<mat-dialog-content>
  <p-timeline [value]="values" align="alternate">
    <ng-template pTemplate="content" let-data>
      <mat-card>
        <mat-card-header>
          <mat-card-subtitle class="text-capitalize fw-bold">{{ data.title }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div>{{ data.text }}</div>
        </mat-card-content>
        <mat-card-actions align="right" class="align-right">
          <div>
            By <span class="text-capitalize">{{ data.createdBy }}</span> on {{ data.date | formatMediumDatetime }}
          </div>
        </mat-card-actions>
      </mat-card>
    </ng-template>
  </p-timeline>
</mat-dialog-content>
<mat-dialog-actions align="center" style="text-align: center; margin: 0 auto">
  <button mat-button mat-dialog-close class="confirm-button-no">Close</button>
</mat-dialog-actions>
