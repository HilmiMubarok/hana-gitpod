<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <div class="text-center p-5 alert-warning">
    {{ data.message }}
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button (click)="submit()" style="background: rgba(0, 136, 129, 1); color: #ffffff">Yes</button>
  <button mat-button mat-dialog-close style="background: rgb(228, 39, 39); color: #ffffff; margin-left: 15px">No</button>
</mat-dialog-actions>
