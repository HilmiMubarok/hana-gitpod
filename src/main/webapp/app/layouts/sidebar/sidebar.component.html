<div class="sidebar-content">
  <div class="py-5">
    <img src="../../../content/images/cash_logo.png" style="max-width: 250px" />
  </div>
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding [ngClass]="getClassActive(node.route)">
      <a routerLink="{{ node.route }}" routerLinkActive="active"> <button mat-icon-button disabled></button> {{ node.name }} </a>
    </mat-tree-node>
    <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
      <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
        <mat-icon class="mat-icon-rtl-mirror">
          {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
        </mat-icon>
      </button>
      {{ node.name }}
    </mat-tree-node>
  </mat-tree>
</div>
