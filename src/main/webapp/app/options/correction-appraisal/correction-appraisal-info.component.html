<h1 mat-dialog-title>Correction Appraisal Data</h1>
<div mat-dialog-content>
  <ol>
    <li>
      Halaman ini adalah untuk memperbaiki data appraisal dengan status aktif(bukan complete / cancel / reject) yang tidak memiliki person
      in charge
    </li>
    <li>Klik pada data kolom appraisal number, cif, customer name untuk copy ke clipboard</li>
  </ol>
</div>
<div mat-dialog-actions align="center">
  <button mat-button mat-dialog-close>Close</button>
</div>
