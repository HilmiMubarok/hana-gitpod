<div class="control-section">
  <div class="col-lg-8 w-100" id="dashboard_container">
    <ejs-dashboardlayout
      id="predefine_dashboard"
      #predefine_dashboard
      columns="6"
      [cellSpacing]="cellSpacing"
      [cellAspectRatio]="aspectRatio"
      [allowDragging]="false"
    >
      <e-panels>
        <!-- bar chart -->
        <e-panel [sizeX]="3" [sizeY]="3" [row]="0" [col]="0">
          <ng-template #header>
            <div>Chart 1</div>
          </ng-template>
          <ng-template #content>
            <jhi-bar-chart></jhi-bar-chart>
          </ng-template>
        </e-panel>
        <!-- bar chart -->
        <!-- pie chart -->
        <e-panel [sizeX]="3" [sizeY]="3" [row]="0" [col]="4">
          <ng-template #header>
            <div>Chart 2</div>
          </ng-template>
          <ng-template #content>
            <jhi-pie-chart></jhi-pie-chart>
          </ng-template>
        </e-panel>
        <!-- pie chart -->
        <!-- line chart -->
        <e-panel [sizeX]="6" [sizeY]="3" [row]="3" [col]="0">
          <ng-template #header>
            <div>Chart 3</div>
          </ng-template>
          <ng-template #content>
            <jhi-line-chart></jhi-line-chart>
          </ng-template>
        </e-panel>
        <!-- line chart -->
      </e-panels>
    </ejs-dashboardlayout>
  </div>
</div>
<mat-card class="w-100 my-2"
  ><label>Credit Approval System of Hana Bank <br />Version 1.0.30</label></mat-card
>
