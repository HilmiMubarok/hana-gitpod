<!-- Status -->
<div>
  <div *ngFor="let item of availableStatus" calss="status-container mb-3">
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ item.menuItemDescription }}</mat-card-title>
      </mat-card-header>
      <jhi-status-slides></jhi-status-slides>
    </mat-card>
  </div>

  <!-- Charts -->
  <div *ngIf="mergedChartData !== null" class="control-section mt-3">
    <mat-card *ngFor="let item of mergedChartData">
      <mat-card-header>
        <mat-card-title>{{ item.chartsTitle }}</mat-card-title>
      </mat-card-header>
      <jhi-charts-layout></jhi-charts-layout>
    </mat-card>
  </div>

  <div *ngIf="mergedChartData === null" class="control-section mt-3">
    <mat-card> No Charts Data Available </mat-card>
  </div>

  <mat-card id="footer" class="w-100 my-2"
    ><label>Credit Approval System of Hana Bank <br />Version 2.0.15</label></mat-card
  >
</div>
