<div *ngIf="type === 'dueDate'">
  <p-calendar
    style="text-align: center"
    *ngIf="mode === 'DAILY'"
    appendTo="body"
    [(ngModel)]="dueDateDates"
    (ngModelChange)="sendOutDate()"
    placeholder="Select Dates"
    [numberOfMonths]="1"
    dateFormat="yy/mm/dd"
    [readonlyInput]="true"
  >
  </p-calendar>
  <p-calendar
    style="text-align: center"
    *ngIf="mode === 'WEEKLY'"
    appendTo="body"
    view="month"
    [yearNavigator]="true"
    [(ngModel)]="dueDateDates"
    (ngModelChange)="sendOutDate()"
    placeholder="Select Dates"
    [numberOfMonths]="1"
    dateFormat="yy/mm/dd"
    [readonlyInput]="true"
  >
  </p-calendar>
  <p-calendar
    style="text-align: center"
    *ngIf="mode === 'MONTHLY'"
    appendTo="body"
    view="year"
    [(ngModel)]="dueDateDates"
    (ngModelChange)="sendOutDate()"
    placeholder="Select Dates"
    [numberOfMonths]="1"
    dateFormat="yy/mm/dd"
    [readonlyInput]="true"
  >
  </p-calendar>
</div>

<div *ngIf="type === 'progress'">
  <p-calendar
    *ngIf="mode === 'DAILY'"
    appendTo="body"
    [(ngModel)]="filterRange"
    (ngModelChange)="emitStartEndDate()"
    placeholder="Select Dates Range"
    inputId="mltimonths"
    [numberOfMonths]="1"
    selectionMode="range"
    dateFormat="yy/mm/dd"
    [readonlyInput]="true"
  >
  </p-calendar>
</div>
