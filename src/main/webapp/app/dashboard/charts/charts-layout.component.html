<div class="col-lg-8 w-100" id="dashboard_container">
  <ejs-dashboardlayout
    id="predefine_dashboard"
    #predefine_dashboard
    columns="6"
    [cellSpacing]="cellSpacing"
    [cellAspectRatio]="aspectRatio"
    [allowDragging]="false"
    [allowPushing]="false"
    [allowResizing]="false"
    [allowFloating]="false"
  >
    <e-panels>
      <!-- line chart -->
      <e-panel [sizeX]="splineSizeX" [sizeY]="splineSizeY" [row]="0" [col]="0">
        <ng-template #header>
          Completed Taks
          <div style="flex: 1 1 auto !important"></div>
          <!-- filter -->
          <jhi-dashboard-reuseable-calendar
            [mode]="progressInterval"
            [type]="'progress'"
            (output)="recieveStartThruDate($event)"
            [disableCalendar]="loadingProgress === undefined ? loadingCPDatas : loadingProgress"
          ></jhi-dashboard-reuseable-calendar>

          <p-dropdown
            [options]="intervalList"
            [(ngModel)]="_progressInterval"
            optionLabel="label"
            [disable]="loadingProgress === undefined ? loadingCPDatas : loadingProgress"
            (onChange)="progressIntervalOnChange(_progressInterval.id)"
          ></p-dropdown>
        </ng-template>
        <ng-template #content>
          <jhi-complete-task
            [dataSource]="progressDataSource"
            [interval]="progressInterval"
            [startDateThruDates]="startDateThruDate"
            [progressTypes]="progressType"
            [loadingData]="loadingProgress === undefined ? loadingCPDatas : loadingProgress"
          ></jhi-complete-task>
        </ng-template>
      </e-panel>

      <!-- pie chart -->
      <e-panel [sizeX]="pieSizeX" [sizeY]="pieSizeY" [row]="0" [col]="3">
        <ng-template #header>
          Summary Status Charts
          <div style="flex: 1 1 auto !important"></div>
          <!-- filter -->
        </ng-template>
        <ng-template #content>
          <jhi-pie-chart
            [dataSource]="summaryStatusDataSource"
            [loadingData]="loadingSummaryStatus === undefined ? loadingCPDatas : loadingSummaryStatus"
          ></jhi-pie-chart>
        </ng-template>
      </e-panel>
      <!-- bar chart -->
      <e-panel [sizeX]="columnSizeX" [sizeY]="columnSizeY" [row]="2" [col]="0">
        <ng-template #header>
          <div>Due Date Charts</div>
          <div style="flex: 1 1 auto !important"></div>
          <!-- filter -->
          <jhi-dashboard-reuseable-calendar
            [dueDates]="dueDateDates"
            [mode]="selectedDuedateInterval"
            [type]="'dueDate'"
            (output)="recievedDate($event)"
            [disableCalendar]="loadingDueDate === undefined ? loadingCPDatas : loadingDueDate"
          ></jhi-dashboard-reuseable-calendar>

          <p-dropdown
            [options]="intervalList"
            [(ngModel)]="_selectedDuedateInterval"
            optionLabel="label"
            [disable]="loadingDueDate === undefined ? loadingCPDatas : loadingDueDate"
            (onChange)="dueDateInterval(_selectedDuedateInterval.id)"
          ></p-dropdown>
        </ng-template>
        <ng-template #content>
          <jhi-bar-chart
            [dataSource]="dueDateDataSource"
            [interval]="selectedDuedateInterval"
            [loadingData]="loadingDueDate === undefined ? loadingCPDatas : loadingDueDate"
          ></jhi-bar-chart>
        </ng-template>
      </e-panel>
    </e-panels>
  </ejs-dashboardlayout>
</div>
