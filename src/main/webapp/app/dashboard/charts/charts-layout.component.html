<div class="col-lg-8 w-100" id="dashboard_container">
  <ejs-dashboardlayout
    id="predefine_dashboard"
    #predefine_dashboard
    columns="6"
    [cellSpacing]="cellSpacing"
    [cellAspectRatio]="aspectRatio"
    [allowDragging]="false"
    [allowPushing]="false"
    [allowResizing]="false"
    [allowFloating]="false"
  >
    <e-panels>
      <!-- bar chart -->
      <e-panel [sizeX]="columnSizeX" [sizeY]="columnSizeY" [row]="0" [col]="0">
        <ng-template #header>
          <div>Due Date Charts</div>
          <div style="flex: 1 1 auto !important"></div>
          <!-- filter -->
          <jhi-dashboard-reuseable-calendar
            [dueDates]="dueDateDates"
            [mode]="'singular'"
            (output)="recievedDate($event)"
          ></jhi-dashboard-reuseable-calendar>
          <p-dropdown
            id="status"
            [options]="intervalList"
            [(ngModel)]="_selectedInterval"
            optionLabel="label"
            (onChange)="dueDateInterval(_selectedInterval.id)"
          ></p-dropdown>
        </ng-template>
        <ng-template #content>
          <jhi-bar-chart [dataSource]="dueDateDataSource"></jhi-bar-chart>
        </ng-template>
      </e-panel>
      <!-- pie chart -->
      <e-panel [sizeX]="pieSizeX" [sizeY]="pieSizeY" [row]="0" [col]="3">
        <ng-template #header>
          Summary Status Charts
          <div style="flex: 1 1 auto !important"></div>
          <!-- filter -->
        </ng-template>
        <ng-template #content>
          <jhi-pie-chart [dataSource]="summaryStatusDataSource"></jhi-pie-chart>
        </ng-template>
      </e-panel>
      <!-- line chart -->
      <e-panel [sizeX]="splineSizeX" [sizeY]="splineSizeY" [row]="2" [col]="0">
        <ng-template #header>
          Progress Charts
          <div style="flex: 1 1 auto !important"></div>
          <!-- filter -->
          <jhi-dashboard-reuseable-calendar
            [filterData]="filteredLineChartData"
            [mode]="'range'"
            (output)="recieveFilteredProgress($event)"
          ></jhi-dashboard-reuseable-calendar>
        </ng-template>
        <ng-template #content>
          <jhi-line-chart [baseLineChartData]="filteredLineChartData"></jhi-line-chart>
        </ng-template>
      </e-panel>
    </e-panels>
  </ejs-dashboardlayout>
</div>
