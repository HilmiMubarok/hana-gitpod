<!--readOnly={{isReadOnly}}-->

<div *ngIf="dataType === 'string'">
  <ejs-textbox
    cssClass="e-outline"
    placeholder="{{name}}"
    floatLabelType="{{floatType}}"
    [(ngModel)]="valS"
    (keyup)="change($event.target.value)"
  ></ejs-textbox>
</div>

<div *ngIf="dataType === 'stringReadOnly'">
  <ejs-textbox
    readOnly="true"
    cssClass="e-outline"
    placeholder="{{name}}"
    floatLabelType="Auto"
    [(ngModel)]="valS"
    (keyup)="change($event.target.value)"
  ></ejs-textbox>
</div>

<div *ngIf="dataType === 'number' && dataFormat === 'empty'">
  <ejs-numerictextbox
    cssClass="e-outline"
    placeholder="{{name}}"
    floatLabelType="{{floatType}}"
    [(ngModel)]="valN"
    (keyup)="change($event.target.value)"
  ></ejs-numerictextbox>
</div>

<div *ngIf="dataType === 'numberReadOnly' && dataFormat === 'empty'">
  <ejs-numerictextbox
    readOnly="true"
    cssClass="e-outline"
    placeholder="{{name}}"
    floatLabelType="{{floatType}}"
    [(ngModel)]="valN"
    (keyup)="change($event.target.value)"
  ></ejs-numerictextbox>
</div>

<div *ngIf="dataType === 'number' && dataFormat != 'empty'">
  <ejs-numerictextbox
    cssClass="e-outline"
    placeholder="{{name}}"
    floatLabelType="{{floatType}}"
    [(ngModel)]="valN"
    (keyup)="change($event.target.value)"
    format="{{dataFormat}}"
  ></ejs-numerictextbox>
</div>

<div *ngIf="dataType === 'numberReadOnly' && dataFormat != 'empty'">
  <ejs-numerictextbox
    readOnly="true"
    cssClass="e-outline"
    placeholder="{{name}}"
    floatLabelType="{{floatType}}"
    [(ngModel)]="valN"
    (keyup)="change($event.target.value)"
    format="{{dataFormat}}"
  ></ejs-numerictextbox>
</div>
