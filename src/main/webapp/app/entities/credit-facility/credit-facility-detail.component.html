<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.creditFacility.home.viewLabel">Credit Facilities</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.creditFacility.detail.title">Credit Facility</span> {{ creditFacility.id }} </p-header>
    <jhi-credit-facility-view [item]="creditFacility" mode="item"> </jhi-credit-facility-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/credit-facility', creditFacility.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
