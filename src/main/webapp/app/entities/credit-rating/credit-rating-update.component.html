<div class="page-view" *ngIf="item$ | async as item">
  <p-panel>
    <ng-template pTemplate="header">
      <h5><span jhiTranslate="losgwApp.creditRating.home.createOrEditLabel">Credit Ratings</span></h5>
    </ng-template>
    <div class="card-deck" style="margin-bottom: 15px">
      <div class="card">
        <div class="card-block">
          <div class="mb-3">
            <jhi-ribbon ribbonN="Internal Credit Rating"></jhi-ribbon>
          </div>
          <div class="mb-3">
            <div class="form-group">
              <div class="d-flex justify-content-xl-center mb-3">
                <!--<jhi-textbox-string-readonly
                  [ngStyle]="{ width: '75%' }"
                  nameP="Credit Rating"
                  [valP]="item.creditRating"
                  (outputVal)="onValCRChanged($event)"
                ></jhi-textbox-string-readonly>--
                <!--<jhi-textbox-readonly [ngStyle]="{ width: '75%' }" nameP="Credit Rating" [valP]="item.id"></jhi-textbox-readonly>-->
                <jhi-textbox
                  [ngStyle]="{ width: '75%' }"
                  nameP="Credit Rating"
                  dataTypeP="string"
                  dataFormatP="empty"
                  [isReadOnlyP]="true"
                  [valSP]="item.creditRating"
                  (outputValSP)="onValCRChanged($event)"
                ></jhi-textbox>
              </div>
            </div>
            <div class="form-group">
              <div class="d-flex justify-content-xl-center mb-3">
                <!--<jhi-textbox-numeric-formated-readonly
                  [ngStyle]="{ width: '75%' }"
                  nameP="Internal Maximum LLL"
                  [valP]="item.internalMaxLLL"
                  (outputVal)="onValIMChanged($event)"
                ></jhi-textbox-numeric-formated-readonly>-->
                <!--<jhi-textbox-readonly [ngStyle]="{ width: '75%' }" nameP="Internal Maximum LLL" [valP]="item.internalMaxLLL"></jhi-textbox-readonly>-->
                <jhi-textbox
                  [ngStyle]="{ width: '75%' }"
                  nameP="Internal Maximum LLL"
                  dataTypeP="number"
                  dataFormatP="###.## '%'"
                  [isReadOnlyP]="true"
                  [valNP]="item.internalMaxLLL"
                  (outputValNP)="onValIMChanged($event)"
                ></jhi-textbox>
              </div>
            </div>
            <div class="form-group">
              <div class="d-flex justify-content-xl-center mb-3">
                <!--<jhi-textbox-string-readonly
                  [ngStyle]="{ width: '75%' }"
                  nameP="Equity Position as of"
                  [valP]="item.equityPosition"
                  (outputVal)="onValEPChanged($event)"
                ></jhi-textbox-string-readonly>-->
                <!--<jhi-textbox-readonly [ngStyle]="{ width: '75%' }" nameP="Equity Position as of" [valP]="item.equityPosition"></jhi-textbox-readonly>-->
                <jhi-textbox
                  [ngStyle]="{ width: '75%' }"
                  nameP="Equity Position as of"
                  dataTypeP="string"
                  dataFormatP="empty"
                  [isReadOnlyP]="true"
                  [valSP]="item.equityPosition"
                  (outputValSP)="onValEPChanged($event)"
                ></jhi-textbox>
              </div>
            </div>
            <div class="form-group">
              <div class="d-flex justify-content-xl-center mb-3">
                <!--<jhi-textbox-numeric-readonly
                  [ngStyle]="{ width: '75%' }"
                  nameP="LLL in IDR MI"
                  [valP]="item.idrMioLLL"
                  (outputVal)="onValLLLChanged($event)"
                ></jhi-textbox-numeric-readonly>-->
                <!--<jhi-textbox-readonly [ngStyle]="{ width: '75%' }" nameP="LLL in IDR MI" [valP]="item.idrMioLLL"></jhi-textbox-readonly>-->
                <jhi-textbox
                  [ngStyle]="{ width: '75%' }"
                  nameP="LLL in IDR MI"
                  dataTypeP="number"
                  dataFormatP="empty"
                  [isReadOnlyP]="true"
                  [valNP]="item.idrMioLLL"
                  (outputValNP)="onValLLLChanged($event)"
                ></jhi-textbox>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <jhi-ribbon ribbonN="External Credit Rating"></jhi-ribbon>
          </div>
          <div>
            <div class="container">
              <div class="row">
                <div class="col mb-3">
                  <!--<jhi-textbox-numeric nameP="Pefindo" [valP]="item.pefindo" (outputVal)="onValPefChanged($event)"></jhi-textbox-numeric>-->
                  <jhi-textbox
                    nameP="Pefindo"
                    dataTypeP="number"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valNP]="item.pefindo"
                    (outputValNP)="onValPefChanged($event)"
                  ></jhi-textbox>
                </div>
                <div class="col mb-3">
                  <!--<jhi-textbox-string nameP="SNP" [valP]="item.snp" (outputVal)="onValSNPChanged($event)"></jhi-textbox-string>-->
                  <jhi-textbox
                    nameP="SNP"
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valSP]="item.snp"
                    (outputValSP)="onValSNPChanged($event)"
                  ></jhi-textbox>
                </div>
              </div>

              <div class="row">
                <div class="col mb-3">
                  <!--<jhi-textbox-string nameP="Fitch" [valP]="item.fitch" (outputVal)="onValFitChanged($event)"></jhi-textbox-string>-->
                  <jhi-textbox
                    nameP="Fitch"
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valSP]="item.fitch"
                    (outputValSP)="onValFitChanged($event)"
                  ></jhi-textbox>
                </div>
                <div class="col mb-3">
                  <!--<jhi-textbox-string nameP="Moodys" [valP]="item.moodys" (outputVal)="onValMoodChanged($event)"></jhi-textbox-string>-->
                  <jhi-textbox
                    nameP="Moodys"
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valSP]="item.moodys"
                    (outputValSP)="onValMoodChanged($event)"
                  ></jhi-textbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end">
      <jhi-button [ngStyle]="{ 'margin-right': '1rem' }" typeB="info" (clickEv)="goToSave($event)"></jhi-button>
      <jhi-button typeB="danger" (clickEv)="goToPreviousState($event)"></jhi-button>
    </div>
  </p-panel>
</div>
