<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.creditRating.home.viewLabel">Credit Ratings</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.creditRating.detail.title">Credit Rating</span> {{ creditRating.id }} </p-header>
    <jhi-credit-rating-view [item]="creditRating" mode="item"> </jhi-credit-rating-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/credit-rating', creditRating.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
