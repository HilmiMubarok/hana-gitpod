<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div class="card-deck" style="margin-bottom: 15px">
      <div class="card">
        <div class="card-block">
          <div class="mb-3">
            <jhi-ribbon ribbonN="Internal Credit Rating"></jhi-ribbon>
          </div>
          <div class="mb-3">
            <div class="form-group">
              <div class="d-flex justify-content-xl-center mb-3">
                <jhi-textbox
                  [ngStyle]="{ width: '75%' }"
                  nameP="Credit Rating"
                  dataTypeP="string"
                  dataFormatP="empty"
                  [isReadOnlyP]="true"
                  [valSP]="item.creditRating"
                  (outputValSP)="onValCRChanged($event)"
                ></jhi-textbox>
              </div>
            </div>
            <div class="form-group">
              <div class="d-flex justify-content-xl-center mb-3">
                <jhi-textbox
                  [ngStyle]="{ width: '75%' }"
                  nameP="Internal Maximum LLL"
                  dataTypeP="number"
                  dataFormatP="###.## '%'"
                  [isReadOnlyP]="true"
                  [valNP]="item.internalMaxLLL"
                  (outputValNP)="onValIMChanged($event)"
                ></jhi-textbox>
              </div>
            </div>
            <div class="form-group">
              <div class="d-flex justify-content-xl-center mb-3">
                <jhi-textbox
                  [ngStyle]="{ width: '75%' }"
                  nameP="Equity Position as of"
                  dataTypeP="string"
                  dataFormatP="empty"
                  [isReadOnlyP]="true"
                  [valSP]="item.equityPosition"
                  (outputValSP)="onValEPChanged($event)"
                ></jhi-textbox>
              </div>
            </div>
            <div class="form-group">
              <div class="d-flex justify-content-xl-center mb-3">
                <jhi-textbox
                  [ngStyle]="{ width: '75%' }"
                  nameP="LLL in IDR MI"
                  dataTypeP="number"
                  dataFormatP="empty"
                  [isReadOnlyP]="true"
                  [valNP]="item.idrMioLLL"
                  (outputValNP)="onValLLLChanged($event)"
                ></jhi-textbox>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <jhi-ribbon ribbonN="External Credit Rating"></jhi-ribbon>
          </div>
          <div>
            <div class="container">
              <div class="row">
                <div class="col mb-3">
                  <jhi-textbox
                    nameP="Pefindo"
                    dataTypeP="number"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valNP]="item.pefindo"
                    (outputValNP)="onValPefChanged($event)"
                  ></jhi-textbox>
                </div>
                <div class="col mb-3">
                  <jhi-textbox
                    nameP="SNP"
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valSP]="item.snp"
                    (outputValSP)="onValSNPChanged($event)"
                  ></jhi-textbox>
                </div>
              </div>

              <div class="row">
                <div class="col mb-3">
                  <jhi-textbox
                    nameP="Fitch"
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valSP]="item.fitch"
                    (outputValSP)="onValFitChanged($event)"
                  ></jhi-textbox>
                </div>
                <div class="col mb-3">
                  <jhi-textbox
                    nameP="Moodys"
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valSP]="item.moodys"
                    (outputValSP)="onValMoodChanged($event)"
                  ></jhi-textbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
