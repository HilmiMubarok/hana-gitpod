<div class="e-card">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">MAKSIMUM INTERNAL CREDIT RATING</div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <div class="form-space">
              <div class="row my-3">
                <div class="col">
                  <!-- <div class="form-space"> -->
                  <ejs-textbox
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="true"
                    [valSP]="item.creditRating"
                    (outputValSP)="onValCRChanged($event)"
                    placeholder="Credit Rating"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  >
                  </ejs-textbox>
                </div>
              </div>

              <div class="row my-3">
                <div class="col">
                  <!-- <div class="form-space"> -->
                  <ejs-textbox
                    dataTypeP="number"
                    dataFormatP="###.## '%'"
                    [isReadOnlyP]="true"
                    [valNP]="item.internalMaxLLL"
                    (outputValNP)="onValIMChanged($event)"
                    placeholder="Internal Maksimum LLL"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  >
                  </ejs-textbox>
                </div>
              </div>

              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="true"
                    [valSP]="item.equityPosition"
                    (outputValSP)="onValEPChanged($event)"
                    placeholder="Equity Position"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  >
                  </ejs-textbox>
                </div>
              </div>

              <div class="row my-3">
                <div class="col">
                  <!-- <div class="form-space"> -->
                  <ejs-textbox
                    dataTypeP="number"
                    dataFormatP="empty"
                    [isReadOnlyP]="true"
                    [valNP]="item.idrMioLLL"
                    (outputValNP)="onValLLLChanged($event)"
                    placeholder="Maximum Internal Credit Rating (LLL IDR MIO)"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  >
                  </ejs-textbox>
                  <!-- </div> -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card-layout py-2">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">EXTERNAL CREDIT RATING</div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <div class="form-space">
              <div class="row my-3">
                <div class="col">
                  <!-- <div class="form-space"> -->
                  <ejs-textbox
                    dataTypeP="number"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valNP]="item.pefindo"
                    (outputValNP)="onValPefChanged($event)"
                    placeholder="Pefindo"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valSP]="item.snp"
                    (outputValSP)="onValSNPChanged($event)"
                    placeholder="SNP"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  >
                  </ejs-textbox>
                </div>
              </div>

              <div class="row my-3">
                <div class="col">
                  <!-- <div class="form-space"> -->
                  <ejs-textbox
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valSP]="item.fitch"
                    (outputValSP)="onValFitChanged($event)"
                    placeholder="Fitch"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    dataTypeP="string"
                    dataFormatP="empty"
                    [isReadOnlyP]="false"
                    [valSP]="item.moodys"
                    (outputValSP)="onValMoodChanged($event)"
                    placeholder="Moodys"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  >
                  </ejs-textbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="e-card-actions">
        <div class="d-flex justify-content-end">
          <!-- <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button> -->
        </div>
      </div>
    </div>
  </div>
</div>
