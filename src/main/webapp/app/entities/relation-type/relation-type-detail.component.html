<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.relationType.home.viewLabel">Relation Types</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.relationType.detail.title">Relation Type</span> {{ relationType.id }} </p-header>
    <jhi-relation-type-view [item]="relationType" mode="item"> </jhi-relation-type-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/relation-type', relationType.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
