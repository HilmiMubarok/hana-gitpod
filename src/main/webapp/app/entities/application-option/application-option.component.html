<mat-card>
  <mat-card-header>
    <mat-card-title>Application Option</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="applicationOptions" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef class="text-center">No</th>
        <td mat-cell *matCellDef="let element; let i = index" class="text-center">
          {{ i + 1 + paginator.pageIndex * paginator.pageSize }}.
        </td>
      </ng-container>
      <ng-container matColumnDef="key">
        <th mat-header-cell *matHeaderCellDef class="text-center">Key</th>
        <td mat-cell *matCellDef="let element" class="text-left">
          {{ element.id }}
        </td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef class="text-center">Description</th>
        <td mat-cell *matCellDef="let element" class="text-left">
          {{ element.description }}
        </td>
      </ng-container>
      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef class="text-center">Value</th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <span *ngIf="element.dataType === 'date'">
            {{ element.value | formatMediumDate }}
          </span>
          <span *ngIf="element.dataType !== 'date'">
            {{ element.value }}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef class="text-center">Action</th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
      <tr mat-row *matRowDef="let element; columns: displayColumns"></tr>
    </table>
    <mat-card *ngIf="loading" id="material-loading-bar">
      <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
    </mat-card>
    <mat-paginator
      showFirstLastButtons
      ngClass="transparant"
      [length]="paginatorLength"
      [pageSize]="paginatorPageSize"
      [pageSizeOptions]="paginatorPageSizeOption"
      (page)="loadDataLazy($event)"
    >
    </mat-paginator>
  </mat-card-content>
</mat-card>
