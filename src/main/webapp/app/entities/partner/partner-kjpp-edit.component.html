<div class="row">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Partner KJPP" url="/partner-kjpp"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Edit Partner KJPP</p>
        </div>
      </div>
    </div>
    <div class="e-card-content">
      <mat-card>
        <mat-card-header>
          <mat-card-subtitle class="fw-bold">Partner</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="row">
            <div class="col-12">
              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Name </mat-label>
                  <input matInput type="text" [(ngModel)]="partner.organization.groupName" [disabled]="isView" />
                </mat-form-field>
              </div>
			  <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Partner Code / ID </mat-label>
                  <input matInput type="text" [(ngModel)]="partner.partnerId" [disabled]="isView" />
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>From Date</mat-label>
                  <input matInput [matDatepicker]="pickerFromDate" [(ngModel)]="partner.fromDate" [disabled]="isView" />
                  <mat-hint>MM/DD/YYYY</mat-hint>
                  <mat-datepicker-toggle matSuffix [for]="pickerFromDate"></mat-datepicker-toggle>
                  <mat-datepicker #pickerFromDate></mat-datepicker>
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Thru Date</mat-label>
                  <input matInput [matDatepicker]="pickerThruDate" [(ngModel)]="partner.thruDate" [disabled]="isView" />
                  <mat-hint>MM/DD/YYYY</mat-hint>
                  <mat-datepicker-toggle matSuffix [for]="pickerThruDate"></mat-datepicker-toggle>
                  <mat-datepicker #pickerThruDate></mat-datepicker>
                </mat-form-field>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
      <br />
      <jhi-partner-organization-kjpp [partnerOrganization]="partner.organization"></jhi-partner-organization-kjpp>
      <br />
      <jhi-partner-contact-kjpp [partnerContact]="partner.contact" [isView]="isView"></jhi-partner-contact-kjpp>

      <br />
	  <mat-card-actions align="center">
		<button style="text-align: center; margin-top: 15px" type="submit" (click)="submit()" mat-raised-button color="primary">Save</button>
	  </mat-card-actions>
    </div>
  </div>
</div>
