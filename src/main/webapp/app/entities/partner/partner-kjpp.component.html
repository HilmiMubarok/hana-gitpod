<div class="row remove-row-scroll">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Partner KJPP" url="/partner-kjpp"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Partner KJPP</p>
        </div>
      </div>
    </div>

    <mat-card style="margin: 1rem">
      <mat-card-content>
        <div class="col-12">
          <div class="mt-3">
            <mat-form-field appearance="outline" class="w-100">
              <input (keyup.enter)="search()" matInput placeholder="Search in here..." type="text" [(ngModel)]="currentSearch" />
              <button *ngIf="patnerSrc === false" matSuffix mat-icon-button aria-label="Clear" (click)="search()">
                <mat-icon>search</mat-icon>
              </button>

              <button *ngIf="patnerSrc === true" matSuffix mat-icon-button aria-label="Clear" (click)="closeSearch()">
                <mat-icon>close</mat-icon>
              </button>
            </mat-form-field>
            <!-- <button mat-raised-button color="primary" (click)="rebuildIndex()" class="btn-lg w-100" *jhiHasAnyAuthority="['ROLE_ADMIN']">
                REBUILD INDEX
              </button> -->
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card style="margin: 1rem">
      <table mat-table [dataSource]="items" class="mat-table-expand" multiTemplateDataRows>
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef width="5%" class="rounding-table-left grid-index-right">No</th>
          <td mat-cell *matCellDef="let element; let i = dataIndex" class="grid-index-right">
            {{ i + 1 + paginator.pageIndex * paginator.pageSize }}.
          </td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="grid-index-left">Partner Name</th>
          <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.organization.groupName }}</td>
        </ng-container>
        <ng-container matColumnDef="roleId">
          <th mat-header-cell *matHeaderCellDef class="grid-index-left">Role</th>
          <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.roleId }}</td>
        </ng-container>

        <ng-container matColumnDef="statusDescription">
          <th mat-header-cell *matHeaderCellDef class="grid-index-left">Status</th>
          <td mat-cell *matCellDef="let element" class="grid-index-left">
            <mat-chip>{{ element.statusDescription }}</mat-chip>
          </td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="grid-index-left">Action</th>
          <td mat-cell *matCellDef="let element" class="grid-index-left text-lowercase">
            <a
              href="javascript:void();"
              [routerLink]="['/partner-kjpp', element.id, 'view']"
              mat-icon-button
              (click)="$event.stopPropagation()"
            >
              <mat-icon>remove_red_eye</mat-icon>
            </a>
            <a
              href="javascript:void();"
              [routerLink]="['/partner-kjpp', element.id, 'edit']"
              mat-icon-button
              (click)="$event.stopPropagation()"
            >
              <mat-icon>create</mat-icon>
            </a>
          </td>
        </ng-container>
        <ng-container matColumnDef="expand">
          <th mat-header-cell *matHeaderCellDef aria-label="row actions" class="grid-index-left rounding-table-right">&nbsp;</th>
          <td mat-cell *matCellDef="let element">
            <!-- <button
              mat-icon-button
              aria-label="expand row"
              (click)="expandedElement = expandedElement === element ? null : element; $event.stopPropagation()"
            >
              <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
              <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
            </button> -->
          </td>
        </ng-container>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumnsExpand.length">No records found.</td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="displayedColumnsExpand"></tr>
        <tr
          mat-row
          *matRowDef="let element; columns: displayedColumnsExpand"
          [class.mat-expanded-row]="expandedElement === element"
          class="mat-element-row"
          (click)="expandedElement = expandedElement === element ? null : element"
        ></tr>
        <!-- <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="mat-detail-row"></tr> -->
      </table>
      <mat-card *ngIf="loading" id="material-loading-bar">
        <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
      </mat-card>
      <mat-paginator
        showFirstLastButtons
        ngClass="transparant"
        [length]="paginatorLength"
        [pageSize]="paginatorPageSize"
        [pageSizeOptions]="paginatorPageSizeOption"
        (page)="loadDataLazy($event)"
      >
      </mat-paginator>
    </mat-card>
    <div class="e-card-actions">
      <div class="d-flex justify-content-center mb-3 mt-3">
        <button mat-raised-button [routerLink]="['./createkjpp']" class="button-styling">ADD NEW KJPP</button>
      </div>
    </div>
  </div>
</div>
