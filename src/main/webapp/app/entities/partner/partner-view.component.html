<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partner.partnerId" for="field_partnerId">Partner Id</label>
        <input
          type="text"
          class="form-control"
          name="partnerId"
          id="field_partnerId"
          [(ngModel)]="item.partnerId"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partner.partyId" for="field_partyId">Party Id</label>
        <input type="text" class="form-control" name="partyId" id="field_partyId" [(ngModel)]="item.partyId" [disabled]="readOnly()" />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partner.roleId" for="field_roleId">Role Id</label>
        <input type="text" class="form-control" name="roleId" id="field_roleId" [(ngModel)]="item.roleId" [disabled]="readOnly()" />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partner.customer" for="field_customer">Customer</label>
        <div class="form-check">
          <label class="form-check-label">
            <p-checkbox
              name="input_customer"
              label="{{ 'losgwApp.partner.customer' | translate }}"
              [(ngModel)]="item.customer"
              [binary]="true"
              [disabled]="readOnly()"
            >
            </p-checkbox>
          </label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partner.vendor" for="field_vendor">Vendor</label>
        <div class="form-check">
          <label class="form-check-label">
            <p-checkbox
              name="input_vendor"
              label="{{ 'losgwApp.partner.vendor' | translate }}"
              [(ngModel)]="item.vendor"
              [binary]="true"
              [disabled]="readOnly()"
            >
            </p-checkbox>
          </label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partner.paymentProvider" for="field_paymentProvider"
          >Payment Provider</label
        >
        <div class="form-check">
          <label class="form-check-label">
            <p-checkbox
              name="input_paymentProvider"
              label="{{ 'losgwApp.partner.paymentProvider' | translate }}"
              [(ngModel)]="item.paymentProvider"
              [binary]="true"
              [disabled]="readOnly()"
            >
            </p-checkbox>
          </label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partner.fromDate" for="field_fromDate">From Date</label>
        <div class="input-group">
          <p-calendar
            inputId="field_fromDate"
            name="input_fromDate"
            [(ngModel)]="item.fromDate"
            dateFormat="dd-mm-yy"
            [showTime]="false"
            hourFormat="24"
            [showSeconds]="true"
            [showIcon]="true"
            [hideOnDateTimeSelect]="true"
            [disabled]="readOnly()"
          >
          </p-calendar>
        </div>
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partner.thruDate" for="field_thruDate">Thru Date</label>
        <div class="input-group">
          <p-calendar
            inputId="field_thruDate"
            name="input_thruDate"
            [(ngModel)]="item.thruDate"
            dateFormat="dd-mm-yy"
            [showTime]="false"
            hourFormat="24"
            [showSeconds]="true"
            [showIcon]="true"
            [hideOnDateTimeSelect]="true"
            [disabled]="readOnly()"
          >
          </p-calendar>
        </div>
      </div>

      <div class="form-group">
        <label jhiTranslate="losgwApp.partner.organization" for="field_organization">Organization</label>
        <select
          class="form-control"
          id="field_organization"
          name="organization"
          [(ngModel)]="item.organizationId"
          [disabled]="organizationId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="partyGroupOption.id" *ngFor="let partyGroupOption of partygroups; trackBy: trackPartyGroupById">
            {{ partyGroupOption.id }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.partner.status" for="field_status">Status</label>
        <select
          class="form-control"
          id="field_status"
          name="status"
          [(ngModel)]="item.statusId"
          [disabled]="statusId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="statusItemOption.id" *ngFor="let statusItemOption of statusitems; trackBy: trackStatusItemById">
            {{ statusItemOption.description }}
          </option>
        </select>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
