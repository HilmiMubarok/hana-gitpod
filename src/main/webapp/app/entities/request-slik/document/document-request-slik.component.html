<mat-card>
  <mat-card-header>
    <mat-card-subtitle>Documents</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="data$ | async" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef class="grid-index-number">No</th>
        <td mat-cell *matCellDef="let i = index" class="grid-index-number">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="docName">
        <th mat-header-cell *matHeaderCellDef class="grid-index-label-string">Document Name</th>
        <td mat-cell *matCellDef="let element" class="grid-index-label-string">{{ element.tags['docName'] }}</td>
      </ng-container>
      <ng-container matColumnDef="docDate">
        <th mat-header-cell *matHeaderCellDef class="grid-index-label-string">Document Issued Date</th>
        <td mat-cell *matCellDef="let element" class="grid-index-label-string">{{ element.tags['docDate'] | formatMediumDate }}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef class="grid-index-label-string">Action</th>
        <td mat-cell *matCellDef="let element" class="grid-index-label-string">
          <button mat-icon-button (click)="openDialog('view', element)">
            <mat-icon>remove_red_eye</mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="openDialog('edit', element)"
            *ngIf="requestSlik.status === 'DRAFT' || requestSlik.status === 'RETURN_TO_RM'"
          >
            <mat-icon>create</mat-icon>
          </button>
          <button mat-icon-button *ngIf="requestSlik.status === 'DRAFT' || requestSlik.status === 'RETURN_TO_RM'" (click)="delete(element)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
  <mat-card-actions align="center">
    <button
      mat-raised-button
      color="primary"
      (click)="openDialog('add', null)"
      *ngIf="requestSlik.status === 'DRAFT' || requestSlik.status === 'RETURN_TO_RM'"
    >
      <mat-icon>add</mat-icon> UPLOAD
    </button>
  </mat-card-actions>
</mat-card>
