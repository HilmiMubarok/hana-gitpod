<mat-card>
  <mat-card-header>
    <mat-card-subtitle class="header-title">Documents</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="data$ | async" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="docName">
        <th mat-header-cell *matHeaderCellDef>Document Name</th>
        <td mat-cell *matCellDef="let element">{{ element.tags['docName'] }}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="openDialog('view', element)">
            <mat-icon>remove_red_eye</mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="openDialog('edit', element)"
            *ngIf="requestSlik.status === reqSlikStatus.DRAFT || requestSlik.status === reqSlikStatus.RETURN_TO_RM"
          >
            <mat-icon>create</mat-icon>
          </button>
          <button
            mat-icon-button
            *ngIf="requestSlik.status === reqSlikStatus.DRAFT || requestSlik.status === reqSlikStatus.RETURN_TO_RM"
            (click)="delete(element)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
  <mat-card-actions align="center">
    <button
      mat-raised-button
      class="button-styling"
      (click)="openDialog('add', null)"
      *ngIf="requestSlik.status === reqSlikStatus.DRAFT || requestSlik.status === reqSlikStatus.RETURN_TO_RM"
    >
      <mat-icon>add</mat-icon> UPLOAD
    </button>
    <button mat-raised-button class="button-styling" (click)="download()">
      <!-- <mat-icon *ngIf="!isLoading">get_app</mat-icon> -->
      <mat-icon>get_app</mat-icon>

      <!-- add spinner when downloading -->
      <!-- <mat-spinner *ngIf="isLoading" diameter="20" style="display: inline-block"></mat-spinner> -->

      {{ downloadAllLabel }}
    </button>
  </mat-card-actions>
</mat-card>
