<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.documentType.home.viewLabel">Document Types</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.documentType.detail.title">Document Type</span> {{ documentType.id }} </p-header>
    <jhi-document-type-view [item]="documentType" mode="item"> </jhi-document-type-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/document-type', documentType.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
