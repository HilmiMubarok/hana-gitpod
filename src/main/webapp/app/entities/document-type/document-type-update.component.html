<div class="row remove-row-scroll">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <!-- <e-breadcrumb-item text="Document Checklist" url="/document-type"></e-breadcrumb-item> -->
            <e-breadcrumb-item text="Update Document Checklist" url="/internal/element.id/'view'"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Update Document Checklist</p>
        </div>
      </div>
    </div>
    <div style="margin: 1rem">
      <mat-card>
        <mat-card-header>
          <mat-card-subtitle class="fw-bold">Document Checklist</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Customer Type</mat-label>
                  <mat-select [(ngModel)]="documentType.customerType">
                    <mat-option value="">- Please Select -</mat-option>
                    <mat-option *ngFor="let item of customerTypeValue" [value]="item">
                      {{ item }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Document</mat-label>
                  <input matInput type="text" [(ngModel)]="documentType.rootDescription" [disabled]="true" />
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Document Type</mat-label>
                  <input matInput type="text" [(ngModel)]="documentType.parentDescription" [disabled]="true" />
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Document Name </mat-label>
                  <input matInput type="text" [(ngModel)]="documentType.description" />
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Category</mat-label>
                  <mat-select [(ngModel)]="documentType.category">
                    <mat-option value="">- Please Select -</mat-option>

                    <mat-option *ngFor="let item of categoryValue" [value]="item">
                      {{ item }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Status</mat-label>
                  <mat-select [(ngModel)]="documentType.statusId">
                    <mat-option value="">- Please Select -</mat-option>
                    <mat-option *ngFor="let item of statusValue" [value]="item.id">
                      {{ item.description }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
      <mat-card-actions align="center">
        <button class="submit-button" mat-raised-button type="submit" (click)="saveData()">
          <label class="submit-label">Save</label>
        </button>
      </mat-card-actions>
    </div>
  </div>
</div>
