<mat-card>
  <mat-card-header>
    <mat-card-title>{{ label.title }}</mat-card-title>
    <mat-card-subtitle>{{ label.subTitle }}</mat-card-subtitle>
  </mat-card-header>
  <mat-content>
    <mat-card>
      <mat-card-title>{{ label.contentTitle }}</mat-card-title>
      <mat-content>
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label class="text-capitalize">{{ label.employeeCode }}</mat-label>
            <input matInput type="text" name="employeeCode" [(ngModel)]="item.employeeCode" />
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label class="text-capitalize">{{ label.registrationDate }}</mat-label>
            <input matInput [(ngModel)]="item.registrationDate" name="registrationDate" [matDatepicker]="picker" disabled />
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker disabled="false"></mat-datepicker>
          </mat-form-field>
        </div>
        <jhi-person-employee-view [item]="item.person"></jhi-person-employee-view>
        <div class="form-group">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label class="text-capitalize">{{ label.internalName }}</mat-label>
            <mat-select [(ngModel)]="item.internalId" name="internalId">
              <mat-option *ngFor="let item of internals" [value]="item.id">
                {{ item.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label class="text-capitalize">{{ label.employmentType }}</mat-label>
            <mat-select [(ngModel)]="item.employmentTypeId" name="employmentTypeId">
              <mat-option *ngFor="let item of employmenttypes" [value]="item.id">
                {{ item.description }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </mat-content>
    </mat-card>
  </mat-content>
  <mat-card-actions align="center" class="my-3">
    <a mat-raised-button (click)="previousState()" class="me-3 btn-lg text-uppercase"> back</a>
    <button mat-raised-button class="btn-lg text-uppercase" (click)="save()" color="primary">submit</button>
  </mat-card-actions>
</mat-card>
