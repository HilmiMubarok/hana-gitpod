<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.employee.home.createOrEditLabel">Employees</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{employee.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a class="btn" (click)="print()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Print current data">
              <span><fa-icon icon="print"></fa-icon> &nbsp;{{ 'entity.action.print' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.employee.employeeCode" for="field_employeeCode"
                  >Employee Code</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="employeeCode"
                  id="field_employeeCode"
                  [(ngModel)]="item.employeeCode"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.employee.registrationDate" for="field_registrationDate"
                  >Registration Date</label
                >
                <div class="input-group">
                  <p-calendar
                    inputId="field_registrationDate"
                    name="input_registrationDate"
                    [(ngModel)]="item.registrationDate"
                    dateFormat="dd-mm-yy"
                    [showTime]="false"
                    hourFormat="24"
                    [showSeconds]="true"
                    [showIcon]="true"
                    [hideOnDateTimeSelect]="true"
                    [disabled]="readOnly()"
                  ></p-calendar>
                </div>
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.employee.fromDate" for="field_fromDate">From Date</label>
                <div class="input-group">
                  <p-calendar
                    inputId="field_fromDate"
                    name="input_fromDate"
                    [(ngModel)]="item.fromDate"
                    dateFormat="dd-mm-yy"
                    [showTime]="false"
                    hourFormat="24"
                    [showSeconds]="true"
                    [showIcon]="true"
                    [hideOnDateTimeSelect]="true"
                    [disabled]="readOnly()"
                  ></p-calendar>
                </div>
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.employee.thruDate" for="field_thruDate">Thru Date</label>
                <div class="input-group">
                  <p-calendar
                    inputId="field_thruDate"
                    name="input_thruDate"
                    [(ngModel)]="item.thruDate"
                    dateFormat="dd-mm-yy"
                    [showTime]="false"
                    hourFormat="24"
                    [showSeconds]="true"
                    [showIcon]="true"
                    [hideOnDateTimeSelect]="true"
                    [disabled]="readOnly()"
                  ></p-calendar>
                </div>
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.employee.role" for="field_role">Role</label>
                <select
                  class="form-control"
                  id="field_role"
                  name="role"
                  [(ngModel)]="item.roleId"
                  [disabled]="roleId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="roleTypeOption.id" *ngFor="let roleTypeOption of roletypes; trackBy: trackRoleTypeById">
                    {{ roleTypeOption.description }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.employee.person" for="field_person">Person</label>
                <select
                  class="form-control"
                  id="field_person"
                  name="person"
                  [(ngModel)]="item.personId"
                  [disabled]="personId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="personOption.id" *ngFor="let personOption of people; trackBy: trackPersonById">
                    {{ personOption.name }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.employee.internal" for="field_internal">Internal</label>
                <select
                  class="form-control"
                  id="field_internal"
                  name="internal"
                  [(ngModel)]="item.internalId"
                  [disabled]="internalId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="internalOption.id" *ngFor="let internalOption of internals; trackBy: trackInternalById">
                    {{ internalOption.name }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.employee.employmentType" for="field_employmentType">Employment Type</label>
                <select
                  class="form-control"
                  id="field_employmentType"
                  name="employmentType"
                  [(ngModel)]="item.employmentTypeId"
                  [disabled]="employmentTypeId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="employmentTypeOption.id"
                    *ngFor="let employmentTypeOption of employmenttypes; trackBy: trackEmploymentTypeById"
                  >
                    {{ employmentTypeOption.description }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
