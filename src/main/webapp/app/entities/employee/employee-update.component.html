<div class="row remove-row-scroll">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <!-- <e-breadcrumb-item text="Employee" url="/employee"></e-breadcrumb-item> -->
            <e-breadcrumb-item text="Update Employee" url="/internal/element.id/'edit'"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="openCancelDialog()" />
            <span class="back-prefix" (click)="openCancelDialog()">Back | </span>
          </div>
          <p class="e-card-sub-title">{{ labelStr }}</p>
        </div>
      </div>
    </div>
    <div style="margin: 1rem">
      <mat-card>
        <mat-card-header> </mat-card-header>
        <mat-card-content>
          <div class="row">
            <div class="col-12">
              <jhi-person-employee-view [item]="item.person"></jhi-person-employee-view>
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>NIK</mat-label>
                <input matInput type="text" [(ngModel)]="item.employeeCode" />
              </mat-form-field>
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label class="text-capitalize">Active Date</mat-label>
                  <input
                    placeholder="Active Date"
                    matInput
                    [(ngModel)]="item.registrationDate"
                    name="registrationDate"
                    [matDatepicker]="picker"
                    disabled
                  />
                  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                  <mat-datepicker #picker disabled="false"></mat-datepicker>
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Non Active Date</mat-label>
                  <input matInput [(ngModel)]="thruDateTMP" name="thruDate" [matDatepicker]="pickerThruDate" disabled />
                  <mat-datepicker-toggle matSuffix [for]="pickerThruDate"></mat-datepicker-toggle>
                  <mat-datepicker #pickerThruDate disabled="false"></mat-datepicker>
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Branch</mat-label>
                  <mat-select [(ngModel)]="item.internalId">
                    <mat-option value="">Please Select</mat-option>
                    <mat-option *ngFor="let item of branchtype" [value]="item.id" (click)="choosedBranch(item)">
                      {{ item.name }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Segmen</mat-label>
                <input matInput type="text" [(ngModel)]="segmentModel" disabled />
              </mat-form-field>
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Description </mat-label>
                  <mat-select [(ngModel)]="item.statusId">
                    <mat-option *ngFor="let ax of desc" [value]="ax.id">
                      {{ ax.description }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card-actions align="center">
        <button class="submit-button" mat-raised-button type="submit" (click)="submit()">
          <label class="submit-label">Save</label>
        </button>
        <!-- <button
          mat-raised-button
          class="submit-button"
          (click)="openCancelDialog()"
          style="background: rgba(0, 136, 129, 1); color: #ffffff; margin-left: 13px !important; margin-top: 25px !important"
        >
          Back
        </button> -->
      </mat-card-actions>
    </div>
  </div>
</div>
