<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.employee.home.viewLabel">Employees</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.employee.detail.title">Employee</span> {{ employee.id }} </p-header>
    <jhi-employee-view [item]="employee" mode="item"> </jhi-employee-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/employee', employee.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
