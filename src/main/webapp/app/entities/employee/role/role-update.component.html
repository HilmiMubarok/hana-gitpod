<div class="row remove-row-scroll">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Position" url="/employee"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="openCancelDialog()" />
            <span class="back-prefix" (click)="openCancelDialog()">Back | </span>
          </div>
          <p class="e-card-sub-title">Update Position</p>
        </div>
      </div>
    </div>
    <div style="margin: 1rem">
      <mat-card>
        <mat-card-content>
          <div class="row">
            <div class="col-12">
              <jhi-person-employee-view mode="view" [item]="item.person"></jhi-person-employee-view>
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>NIK</mat-label>
                <input matInput type="text" [(ngModel)]="item.employeeCode" disabled />
              </mat-form-field>
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label class="text-capitalize">Active Date</mat-label>
                  <input
                    placeholder="Active Date"
                    matInput
                    [(ngModel)]="item.registrationDate"
                    name="registrationDate"
                    [matDatepicker]="picker"
                    disabled
                  />
                  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                  <mat-datepicker #picker disabled="true"></mat-datepicker>
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100">
                  <mat-label>Non Active Date</mat-label>
                  <input matInput [(ngModel)]="thruDateTMP" name="thruDate" [matDatepicker]="pickerThruDate" disabled />
                  <mat-datepicker-toggle matSuffix [for]="pickerThruDate"></mat-datepicker-toggle>
                  <mat-datepicker #pickerThruDate disabled="true"></mat-datepicker>
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Branch</mat-label>
                  <mat-select [(ngModel)]="item.internalId" disabled>
                    <mat-option *ngFor="let ax of branchtype" [value]="ax.id">
                      {{ ax.name }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Segmen</mat-label>
                <input matInput type="text" [(ngModel)]="segmentModel" disabled />
              </mat-form-field>
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Status </mat-label>
                  <mat-select [(ngModel)]="item.statusId" disabled>
                    <mat-option *ngFor="let ax of desc" [value]="ax.id">
                      {{ ax.description }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>

            <div class="col-12" align="center" class="button-styling-moz">
              <button class="button-styling" type="submit" (click)="openDialog({})" mat-raised-button style="margin-bottom: 5px">
                Add Position
              </button>
              <table mat-table [dataSource]="itemsPartner" class="mat-table-expand" multiTemplateDataRows>
                <ng-container matColumnDef="no">
                  <th mat-header-cell *matHeaderCellDef width="5%" class="rounding-table-left grid-index-right">No</th>
                  <td mat-cell *matCellDef="let element; let i = dataIndex" class="grid-index-right">{{ i + 1 }}.</td>
                </ng-container>
                <ng-container matColumnDef="positionTypeId">
                  <th mat-header-cell *matHeaderCellDef class="grid-index-left">Position Type</th>
                  <td class="text-center" mat-cell *matCellDef="let element" class="grid-index-left">{{ element.positionTypeId }}</td>
                </ng-container>
                <ng-container matColumnDef="internalName">
                  <th mat-header-cell *matHeaderCellDef class="grid-index-left">Branch</th>
                  <td class="text-center" mat-cell *matCellDef="let element" class="grid-index-left">{{ element.internalName }}</td>
                </ng-container>
                <ng-container matColumnDef="statusDescription">
                  <th mat-header-cell *matHeaderCellDef class="grid-index-left">Status</th>
                  <td class="text-center" mat-cell *matCellDef="let element" class="grid-index-left">{{ element.statusDescription }}</td>
                </ng-container>
                <ng-container matColumnDef="action">
                  <th mat-header-cell *matHeaderCellDef class="grid-index-left">Action</th>
                  <td mat-cell *matCellDef="let element" class="grid-index-left rounding-table-right">
                    <a href="javascript:void();" mat-icon-button (click)="openDialog(element)">
                      <mat-icon>edit</mat-icon>
                    </a>
                  </td>
                </ng-container>

                <tr class="mat-row" *matNoDataRow>
                  <td class="mat-cell" style="text-align: center" [attr.colspan]="displayedColumnsExpandP.length">No records found.</td>
                </tr>
                <tr mat-header-row *matHeaderRowDef="displayedColumnsExpandP"></tr>
                <tr
                  mat-row
                  *matRowDef="let element; columns: displayedColumnsExpandP"
                  [class.mat-expanded-row]="expandedElement === element"
                  class="mat-element-row"
                  (click)="expandedElement = expandedElement === element ? null : element"
                ></tr>
              </table>
              <mat-card *ngIf="loading" id="material-loading-bar">
                <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
              </mat-card>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card-actions align="center" class="button-styling-moz">
        <button class="button-styling" style="text-align: center; margin-top: 15px" type="submit" (click)="submit()" mat-raised-button>
          Save
        </button>
      </mat-card-actions>
    </div>
  </div>
</div>
