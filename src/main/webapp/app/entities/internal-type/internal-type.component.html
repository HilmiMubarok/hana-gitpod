<div class="row">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Internal Type" url="/internal-type"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Internal Type</p>
        </div>
      </div>
    </div>
    <div class="e-card-content">
      <table mat-table [dataSource]="items" class="mat-table-expand" multiTemplateDataRows>
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef class="text-center">No</th>
          <td mat-cell *matCellDef="let element; let i = dataIndex" class="text-center">
            {{ i + 1 + paginator.pageIndex * paginator.pageSize }}.
          </td>
        </ng-container>
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="text-center">ID</th>
          <td mat-cell *matCellDef="let element" class="text-center">
            {{ element.id }}
          </td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="text-center">Description</th>
          <td mat-cell *matCellDef="let element" class="text-center">{{ element.description }}</td>
        </ng-container>

        <ng-container matColumnDef="parentDescription">
          <th mat-header-cell *matHeaderCellDef class="text-center">Parent</th>
          <td mat-cell *matCellDef="let element" class="text-center">
            {{ element.parentDescription }}
          </td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="text-center">Action</th>
          <td mat-cell *matCellDef="let element" class="text-center text-lowercase">
            <a
              href="javascript:void();"
              [routerLink]="['/internal-type', element.id, 'view']"
              mat-icon-button
              (click)="$event.stopPropagation()"
            >
              <mat-icon>remove_red_eye</mat-icon>
            </a>

            <a
              href="javascript:void();"
              [routerLink]="['/internal-type', element.id, 'edit']"
              mat-icon-button
              (click)="$event.stopPropagation()"
            >
              <mat-icon>edit</mat-icon>
            </a>
          </td>
        </ng-container>
        <ng-container matColumnDef="expand">
          <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
          <td mat-cell *matCellDef="let element">
            <!-- <button
                    mat-icon-button
                    aria-label="expand row"
                    (click)="expandedElement = expandedElement === element ? null : element; $event.stopPropagation()"
                  >
                    <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
                    <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
                  </button> -->
          </td>
        </ng-container>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumnsExpand.length">No records found.</td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="displayedColumnsExpand"></tr>
        <tr
          mat-row
          *matRowDef="let element; columns: displayedColumnsExpand"
          [class.mat-expanded-row]="expandedElement === element"
          class="mat-element-row"
          (click)="expandedElement = expandedElement === element ? null : element"
        ></tr>
        <!-- <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="mat-detail-row"></tr> -->
      </table>
      <mat-card *ngIf="loading" id="material-loading-bar">
        <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
      </mat-card>
      <mat-paginator
        showFirstLastButtons
        ngClass="transparant"
        [length]="paginatorLength"
        [pageSize]="paginatorPageSize"
        [pageSizeOptions]="paginatorPageSizeOption"
        (page)="loadDataLazy($event)"
      >
      </mat-paginator>
    </div>
    <div class="e-card-actions">
      <div class="d-flex justify-content-center mb-3 mt-3">
        <!-- <button mat-raised-button [routerLink]="['./new']">ADD INTERNAL TYPE</button> -->
        <!-- <button mat-raised-button style="margin-left: 5px">UPLOAD</button>
            <button mat-raised-button style="margin-left: 5px" (click)="generate()">DOWNLOAD</button> -->
      </div>
    </div>
  </div>
</div>
