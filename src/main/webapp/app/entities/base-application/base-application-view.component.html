<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.baseApplication.applicationNumber" for="field_applicationNumber"
          >Application Number</label
        >
        <input
          type="text"
          class="form-control"
          name="applicationNumber"
          id="field_applicationNumber"
          [(ngModel)]="item.applicationNumber"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.baseApplication.description" for="field_description">Description</label>
        <input
          type="text"
          class="form-control"
          name="description"
          id="field_description"
          [(ngModel)]="item.description"
          [disabled]="readOnly()"
        />
      </div>

      <div class="form-group">
        <label jhiTranslate="losgwApp.baseApplication.applicationType" for="field_applicationType">Application Type</label>
        <select
          class="form-control"
          id="field_applicationType"
          name="applicationType"
          [(ngModel)]="item.applicationTypeId"
          [disabled]="applicationTypeId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option
            [ngValue]="applicationTypeOption.id"
            *ngFor="let applicationTypeOption of applicationtypes; trackBy: trackApplicationTypeById"
          >
            {{ applicationTypeOption.description }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.baseApplication.internal" for="field_internal">Internal</label>
        <select
          class="form-control"
          id="field_internal"
          name="internal"
          [(ngModel)]="item.internalId"
          [disabled]="internalId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="partyGroupOption.id" *ngFor="let partyGroupOption of partygroups; trackBy: trackPartyGroupById">
            {{ partyGroupOption.name }}
          </option>
        </select>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
