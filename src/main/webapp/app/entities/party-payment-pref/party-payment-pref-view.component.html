<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div class="row">
      <div class="col-6">
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Account Number</mat-label>
            <input matInput type="text" [(ngModel)]="item.accountNumber" />
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Payment Method</mat-label>
            <mat-select [(ngModel)]="item.paymentMethodTypeId">
              <mat-option value="">Please Select</mat-option>
              <mat-option *ngFor="let item of paymentmethodtypes" [value]="item.id">
                {{ item.description }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="col-6"></div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'view'">
    <div class="row w-100">
      <div class="col-6">
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Account Number</mat-label>
            <input matInput type="text" [(ngModel)]="item.accountNumber" disabled />
          </mat-form-field>
        </div>
      </div>
      <div class="col-6">
        <div class="form-group">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Payment Method</mat-label>
            <mat-select [(ngModel)]="item.paymentMethodTypeId" disabled>
              <mat-option value="">Please Select</mat-option>
              <mat-option *ngFor="let item of paymentmethodtypes" [value]="item.id">
                {{ item.description }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
