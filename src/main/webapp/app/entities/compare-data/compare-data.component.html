<!--Tab menu Dar Revision Final dan Previous DAR-->
<ejs-menu [enableScrolling]="true" cssClass="e-rounded-menu e-custom-scroll" [items]="menuItemsAll" (select)="setMenu($event)"></ejs-menu>
<!--END Tab menu Dar Revision Final dan Previous DAR-->

<!-- Dar Revision Final-->
<ng-container *ngIf="selectedMenu === 'DAR REVISION FINAL'; else previousDar">
  <!--  Loan Facility -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; margin-bottom: 16px; color: #008881">
    <div class="e-card-header-title">DAR REVISION</div>
  </div>

  <!-- Get Entity. if (darRevHistory) get Entity, else empty-->
  <ng-container *ngIf="creditProposal.attributes['darRevHistory']; else LoanFacilityNotFound">
    <jhi-compare-data-loan-facility [dataFrom]="'entity'"></jhi-compare-data-loan-facility>
  </ng-container>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; margin-bottom: 16px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>

  <!--Get Previous History, else empty-->
  <ng-container *ngIf="creditProposal.attributes['previousHistory']; else LoanFacilityNotFound">
    <jhi-compare-data-loan-facility [dataFrom]="'previousHistory'"></jhi-compare-data-loan-facility>
  </ng-container>

  <!--  End Loan Facility -->

  <!-- Collateral Info -->

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; margin-bottom: 16px; color: #008881">
    <div class="e-card-header-title">DAR REVISION</div>
  </div>

  <ng-container *ngIf="creditProposal.attributes['darRevHistory']; else CollateralNotFound">
    <jhi-credit-proposal-collateral-info
      [collateralProperties]="collateralProperties"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
      [collateralPropertyGroupData]="collateralPropertyGroupData"
    >
    </jhi-credit-proposal-collateral-info>
  </ng-container>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; margin-bottom: 16px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>

  <ng-container *ngIf="creditProposal.attributes['previousHistory']; else CollateralNotFound">
    <jhi-collateral-info-history
      *ngIf="creditProposal.attributes['previousHistory']"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
      [collateralProperties]="collateralProperties"
      [collateralPropertyGroupData]="collateralPropertyGroupData"
    >
    </jhi-collateral-info-history>
  </ng-container>

  <!-- End Collateral Info -->

  <!-- Covenant -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">DAR REVISION</div>
  </div>

  <!-- Get Entity. if (darRevHistory) get Entity, else empty-->
  <ng-container *ngIf="creditProposal.attributes['darRevHistory']; else CovenantNotFound">
    <jhi-compare-data-covenant [dataFrom]="'entity'" [setActiveMenu]="'COVENANT'"></jhi-compare-data-covenant>
  </ng-container>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; margin-bottom: 16px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>

  <!--Get Previous History, else empty-->
  <ng-container *ngIf="creditProposal.attributes['previousHistory']; else CovenantNotFound">
    <jhi-compare-data-covenant [dataFrom]="'previousHistory'" [setActiveMenu]="'COVENANT'"></jhi-compare-data-covenant>
  </ng-container>

  <!-- End Covenant -->

  <!-- Deviation -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">DAR REVISION</div>
  </div>

  <!-- Get Entity. if (darRevHistory) get Entity, else empty-->
  <ng-container *ngIf="creditProposal.attributes['darRevHistory']; else DeviationNotFound">
    <jhi-compare-data-covenant [dataFrom]="'entity'" [setActiveMenu]="'DEVIATION'"></jhi-compare-data-covenant>
  </ng-container>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; margin-bottom: 16px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>

  <!--Get Previous History, else empty-->
  <ng-container *ngIf="creditProposal.attributes['previousHistory']; else DeviationNotFound">
    <jhi-compare-data-covenant [dataFrom]="'previousHistory'" [setActiveMenu]="'DEVIATION'"></jhi-compare-data-covenant>
  </ng-container>

  <!-- End Deviation -->
</ng-container>

<!--End Dar Revision Final-->
