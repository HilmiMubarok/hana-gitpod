<h2 mat-dialog-title>ADD / EDIT CREDIT AGREEMENT CLAUSAL</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-12">
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Sequence</mat-label>
          <input matInput type="number" [(ngModel)]="masterCreditAgreementClausal.sequence" required />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field appearance="outline" class="w-100 pr-1">
          <mat-label>Category</mat-label>
          <mat-select [(ngModel)]="masterCreditAgreementClausal.parameterCategoryId" required>
            <mat-option value="">- Please Select -</mat-option>
            <mat-option *ngFor="let item of parameterCategory" [value]="item.parameterCategoryId">
              {{ item.parameterCategoryDescription }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Code</mat-label>
          <input matInput type="text" [(ngModel)]="masterCreditAgreementClausal.code" required />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Description</mat-label>
          <input matInput type="text" [(ngModel)]="masterCreditAgreementClausal.description" required />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field appearance="outline" class="w-100 pr-1">
          <mat-label>Status</mat-label>
          <mat-select [(ngModel)]="masterCreditAgreementClausal.statusId" required>
            <mat-option value="">- Please Select -</mat-option>
            <mat-option *ngFor="let item of statusValue" [value]="item.statusId"> {{ item.statusDescription }} </mat-option>
          </mat-select>
        </mat-form-field>
      </section>
    </div>
  </div>
  <mat-card>
    <mat-card-header>
      <mat-card-subtitle>Clausal</mat-card-subtitle>
    </mat-card-header>
    <div class="mt-2">
      <ejs-documenteditorcontainer
        #document_editor_containers
        [headers]="customHeadersJWT"
        [enableToolbar]="true"
        [enableLocalPaste]="false"
        height="100vh"
        style="display: block"
        [spellcheck]="false"
        [enableSpellCheck]="false"
        (keyDown)="onKeyDown($event)"
        (created)="onCreate()"
      >
      </ejs-documenteditorcontainer>
    </div>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-raised-button class="confirm-button-no" (click)="openCancelDialog()">CLOSE</button>
  <button mat-raised-button class="confirm-button-yes" (click)="onSave()">SAVE</button>
</mat-dialog-actions>
