<mat-card>
  <mat-card-header>
    <mat-card-subtitle>Legal Lending Limit Parameter</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="items" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef class="text-center">No</th>
        <td mat-cell *matCellDef="let element; let i = index" class="text-center">
          {{ i + 1 + paginator.pageIndex * paginator.pageSize }}.
        </td>
      </ng-container>
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef class="text-center">Legal Lending Limit Type</th>
        <td mat-cell *matCellDef="let element" class="text-center text-capitalize">{{ element.code }}</td>
      </ng-container>
      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef class="text-center">Percentage</th>
        <td mat-cell *matCellDef="let element" class="text-center text-capitalize">{{ element.value }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="text-center">Status</th>
        <td mat-cell *matCellDef="let element" class="text-center text-capitalize">{{ element.statusId }}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef class="text-center">Action</th>
        <td mat-cell *matCellDef="let element" class="text-left text-capitalize">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
      <tr mat-row *matRowDef="let element; columns: displayColumns"></tr>
    </table>
    <mat-card *ngIf="loading" id="material-loading-bar">
      <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
    </mat-card>
    <mat-paginator
      showFirstLastButtons
      ngClass="transparant"
      [length]="paginatorLength"
      [pageSize]="paginatorPageSize"
      [pageSizeOptions]="paginatorPageSizeOption"
      (page)="loadDataLazy($event)"
    >
    </mat-paginator>
  </mat-card-content>
  <mat-card-actions align="right">
    <button mat-raised-button (click)="openDialog()">ADD</button>
  </mat-card-actions>
</mat-card>
