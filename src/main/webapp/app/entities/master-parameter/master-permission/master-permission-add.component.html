<div class="row">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Menu Permission" url="/Permission"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="openCancelDialog()" />
            <span class="back-prefix" (click)="openCancelDialog()">Back | </span>
          </div>
          <p class="e-card-sub-title">Add New Permission</p>
        </div>
      </div>
    </div>
    <div style="margin: 1rem">
      <mat-card>
        <mat-card-header>
          <mat-card-subtitle class="fw-bold">Add Permission</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="form-group">
            <mat-form-field appearance="outline" class="w-100 pr-1">
              <mat-label>Menu</mat-label>
              <mat-select [(ngModel)]="newListMenuItem.menuStatusItem.menuItemId" (selectionChange)="onSelectMenu($event.value)">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option *ngFor="let item of listMenuItem" [value]="item.id">
                  {{ item.description }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field appearance="outline" class="w-100 pr-1">
              <mat-label>Status</mat-label>
              <mat-select
                [(ngModel)]="newListMenuItem.menuStatusItem"
                [disabled]="disableStatusField"
                (selectionChange)="onSelectStatus($event.value)"
              >
                <mat-option value="">{{ statusMessage }}</mat-option>
                <mat-option *ngFor="let item of listStatus" [value]="item">
                  {{ item.statusDescription }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field appearance="outline" class="w-100 pr-1">
              <mat-label>Position </mat-label>
              <mat-select [(ngModel)]="positionId" [disabled]="disablePositionField" (selectionChange)="onSelectPosition($event.value)">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option *ngFor="let item of listPositionType" [value]="item.positionId">
                  {{ item.positionDescription }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </mat-card-content>
      </mat-card>

      <br />

      <mat-card-actions align="center" class="align-center">
        <button class="submit-button button-styling" type="submit" mat-raised-button (click)="saveData()">Save</button>
      </mat-card-actions>
    </div>
  </div>
</div>
