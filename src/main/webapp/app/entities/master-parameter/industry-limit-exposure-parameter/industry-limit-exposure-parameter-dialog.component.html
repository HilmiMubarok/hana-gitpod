<h2 mat-dialog-title>ADD / EDIT INDUSTRY LIMIT EXPOSURE PARAMETER</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-12">
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Industry</mat-label>
          <input matInput type="text" [(ngModel)]="industryLimitExposure.industry" />
        </mat-form-field>
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Industry Label</mat-label>
          <input matInput type="text" [(ngModel)]="industryLimitExposure.industryLabel" />
        </mat-form-field>
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Limit (In % From Total O/S Loan)</mat-label>
          <input matInput type="number" [(ngModel)]="industryLimitExposure.limitPercentage" />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Limit</mat-label>
          <input
            matInput
            type="text"
            [ngModel]="industryLimitExposure.limitNominal | number: '1.2-2'"
            (ngModelChange)="industryLimitExposure.limitNominal = numberInputChanged($event)"
          />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Remaining Balance</mat-label>
          <input
            matInput
            type="text"
            [ngModel]="industryLimitExposure.remainingBalance | number: '1.2-2'"
            (ngModelChange)="industryLimitExposure.remainingBalance = numberInputChanged($event)"
          />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Industry Limit Exposure</mat-label>
          <input
            matInput
            type="text"
            [ngModel]="industryLimitExposure.industryLimitExposure | number: '1.2-2'"
            (ngModelChange)="industryLimitExposure.industryLimitExposure = numberInputChanged($event)"
          />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field appearance="outline" class="w-100 pr-1">
          <mat-label>Status</mat-label>
          <mat-select [(ngModel)]="industryLimitExposure.statusId">
            <mat-option value="">- Please Select -</mat-option>
            <mat-option *ngFor="let item of statusValue" [value]="item.statusId">
              {{ item.statusDescription }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </section>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-raised-button class="confirm-button-no" (click)="openCancelDialog()">CLOSE</button>
  <button mat-raised-button class="confirm-button-yes" (click)="save()">SAVE</button>
</mat-dialog-actions>
