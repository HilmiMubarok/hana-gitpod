<div>
  <div *ngIf="mode === 'edit'">
    <h2 mat-dialog-title>EDIT Collateral Parameter</h2>
  </div>
  <div *ngIf="mode === 'add'">
    <h2 mat-dialog-title>ADD Collateral Parameter</h2>
  </div>
  <mat-dialog-content>
    <div class="row">
      <div class="col-12">
        <section class="mt-2">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Collateral Type</mat-label>
            <mat-select name="collateralType" [(ngModel)]="collateralParameter.collateralTypeId">
              <mat-option value="">- Please Select -</mat-option>
              <mat-option *ngFor="let item of listCollateralType" [value]="item.id">
                {{ item.description }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </section>
        <section class="mt-2">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Collateral Code</mat-label>
            <input matInput type="text" required [(ngModel)]="collateralParameter.collateralTypeCode" [disabled]="mode === 'edit'" />
          </mat-form-field>
        </section>
        <section class="mt-2">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Collateral Code Description</mat-label>
            <input matInput type="text" required [(ngModel)]="collateralParameter.collateralTypeCodeDescription" />
          </mat-form-field>
        </section>
        <section class="mt-2">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Collateral Detail Code</mat-label>
            <input matInput type="text" required [(ngModel)]="collateralParameter.collateralDetailTypeCode" [disabled]="mode === 'edit'" />
          </mat-form-field>
        </section>
        <section class="mt-2">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Collateral Detail Description</mat-label>
            <input matInput type="text" required [(ngModel)]="collateralParameter.collateralDetailTypeDescription" />
          </mat-form-field>
        </section>
        <section class="mt-2">
          <mat-form-field appearance="outline" class="w-100 pr-1">
            <mat-label>Status</mat-label>
            <mat-select [(ngModel)]="collateralParameter.statusId">
              <mat-option value="">- Please Select -</mat-option>
              <mat-option *ngFor="let item of statusValue" [value]="item.statusId">
                {{ item.statusDescription }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </section>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="center">
    <button mat-raised-button class="confirm-button-no" (click)="openCancelDialog()">CLOSE</button>
    <button mat-raised-button class="confirm-button-yes" (click)="onSave()">SAVE</button>
  </mat-dialog-actions>
</div>
