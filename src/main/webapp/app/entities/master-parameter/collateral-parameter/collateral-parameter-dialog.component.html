<h2 mat-dialog-title>ADD / EDIT Collateral Parameter</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-12">
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Collateral Type</mat-label>
          <mat-select name="collateralType" [(ngModel)]="collateralParameter.collateralType">
            <mat-option value="">- Please Select -</mat-option>
            <mat-option *ngFor="let item of listCollateralType" [value]="item.id">
              {{ item.description }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Collateral Code</mat-label>
          <input matInput type="text" required [(ngModel)]="collateralParameter.collateralTypeCode" />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Collateral Code Description</mat-label>
          <input matInput type="text" required [(ngModel)]="collateralParameter.collateralTypeCodeDescription" />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Collateral Detail Code</mat-label>
          <input matInput type="text" required [(ngModel)]="collateralParameter.collateralDetailTypeCode" />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Collateral Detail Description</mat-label>
          <input matInput type="text" required [(ngModel)]="collateralParameter.collateralDetailTypeDescription" />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field appearance="outline" class="w-100 pr-1">
          <mat-label>Status</mat-label>
          <mat-select [(ngModel)]="collateralParameter.statusId">
            <mat-option value="">- Please Select -</mat-option>
            <mat-option *ngFor="let item of statusValue" [value]="item.statusId">
              {{ item.statusDescription }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </section>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button (click)="onSave()" style="background: rgba(0, 136, 129, 1); color: #ffffff">SAVE</button>
  <button mat-button mat-dialog-close style="background: rgb(228, 39, 39); color: #ffffff">CLOSE</button>
</mat-dialog-actions>
