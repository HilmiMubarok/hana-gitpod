<div *ngIf="mode === 'edit'">
  <h2 mat-dialog-title>EDIT Collateral Propose Pricing Parameter</h2>
</div>
<div *ngIf="mode === 'add'">
  <h2 mat-dialog-title>ADD Collateral Propose Pricing Parameter</h2>
</div>
<mat-dialog-content>
  <div class="row">
    <div class="col-12">
      <!-- Untuk Kebutuhan Add Data -->
      <section class="mt-2" [hidden]="true">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Id</mat-label>
          <input matInput type="text" [(ngModel)]="collateralProposePricingParameter.collateralParameterId" />
        </mat-form-field>
      </section>
      <!-- =================================== -->
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Collateral Parameter Detail Type</mat-label>
          <input matInput type="text" [(ngModel)]="collateralProposePricingParameter.collateralParameterDetailType" disabled />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Propose Pricing Code</mat-label>
          <input
            matInput
            type="text"
            [(ngModel)]="collateralProposePricingParameter.proposePricingCode"
            required
            [disabled]="mode === 'edit'"
          />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Propose Pricing</mat-label>
          <input matInput type="text" [(ngModel)]="collateralProposePricingParameter.proposePricing" required />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field appearance="outline" class="w-100 pr-1">
          <mat-label>Status</mat-label>
          <mat-select [(ngModel)]="collateralProposePricingParameter.statusId">
            <mat-option value="">- Please Select -</mat-option>
            <mat-option *ngFor="let item of statusValue" [value]="item.statusId">
              {{ item.statusDescription }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </section>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-raised-button class="confirm-button-no" (click)="openCancelDialog()">CLOSE</button>
  <button mat-raised-button class="confirm-button-yes" (click)="save()">SAVE</button>
</mat-dialog-actions>
