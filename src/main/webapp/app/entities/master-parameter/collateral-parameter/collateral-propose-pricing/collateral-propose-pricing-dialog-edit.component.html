<h2 mat-dialog-title>EDIT Collateral Propose Pricing Parameter</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-12">
      <!-- Untuk Kebutuhan Add Data -->
      <section class="mt-2" [hidden]="true">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Id</mat-label>
          <input matInput type="text" [(ngModel)]="collateralProposePricingParameter.collateralParameterId" />
        </mat-form-field>
      </section>
      <!-- =================================== -->
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Collateral Parameter Detail Type</mat-label>
          <input matInput type="text" [(ngModel)]="collateralProposePricingParameter.collateralParameterDetailType" />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Propose Pricing Code</mat-label>
          <input matInput type="text" [(ngModel)]="collateralProposePricingParameter.proposePricingCode" />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Propose Pricing</mat-label>
          <input matInput type="text" [(ngModel)]="collateralProposePricingParameter.proposePricing" />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field appearance="outline" class="w-100 pr-1">
          <mat-label>Status</mat-label>
          <mat-select [(ngModel)]="collateralProposePricingParameter.statusId">
            <mat-option value="">- Please Select -</mat-option>
            <mat-option *ngFor="let item of statusValue" [value]="item.statusId">
              {{ item.statusDescription }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </section>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button (click)="save()">SAVE</button>
  <button mat-button mat-dialog-close>CLOSE</button>
</mat-dialog-actions>
