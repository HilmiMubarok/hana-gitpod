<div class="row">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="List of Value" url="/list-of-value-parameter"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">List of Value</p>
        </div>
      </div>
    </div>
    <div class="e-card-content">
      <div style="float: right">
        <section class="mt-2">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Type LOV</mat-label>
            <mat-select name="status" (selectionChange)="onSelect($event.value)">
              <mat-option value="">- Please Select -</mat-option>
              <mat-option *ngFor="let item of listGeneralLov" [value]="item.id">
                {{ item.description }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </section>
      </div>
      <table mat-table [dataSource]="items" class="w-100">
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef class="grid-index">No</th>
          <td mat-cell *matCellDef="let element; let i = index" class="grid-index-label">
            {{ i + 1 + paginator.pageIndex * paginator.pageSize }}.
          </td>
        </ng-container>
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef class="grid-index">Code</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label text-capitalize">{{ element.code }}</td>
        </ng-container>
        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef class="grid-index">Desccription</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label text-capitalize">{{ element.value }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="grid-index">Status</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label text-capitalize">{{ element.statusId }}</td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="grid-index">Action</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label text-capitalize">
            <button mat-icon-button (click)="openDialogEdit(element, 'edit')">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
        <tr mat-row *matRowDef="let element; columns: displayColumns"></tr>
      </table>
      <mat-paginator
        showFirstLastButtons
        ngClass="transparant"
        [length]="paginatorLength"
        [pageSize]="paginatorPageSize"
        [pageSizeOptions]="paginatorPageSizeOption"
        (page)="loadDataLazy($event)"
      >
      </mat-paginator>
    </div>
    <div class="e-card-actions">
      <div class="d-flex justify-content-center mb-3 mt-3">
        <button mat-raised-button (click)="openDialog()" SAVE style="background: rgba(0, 136, 129, 1); color: #ffffff">ADD</button>
      </div>
    </div>
  </div>
</div>
