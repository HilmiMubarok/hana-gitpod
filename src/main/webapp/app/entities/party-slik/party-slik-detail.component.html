<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.partySlik.home.viewLabel">Party Sliks</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.partySlik.detail.title">Party Slik</span> {{ partySlik.id }} </p-header>
    <jhi-party-slik-view [item]="partySlik" mode="item"> </jhi-party-slik-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/party-slik', partySlik.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
