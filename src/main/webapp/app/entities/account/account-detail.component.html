<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.account.home.viewLabel">Accounts</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.account.detail.title">Account</span> {{ account.id }} </p-header>
    <jhi-account-view [item]="account" mode="item"> </jhi-account-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/account', account.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
