<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group">
        <ejs-textbox
          placeholder="address1"
          [(ngModel)]="item.address1"
          cssClass="e-outline"
          rows="3"
          [multiline]="true"
          floatLabelType="Auto"
        >
        </ejs-textbox>
      </div>
      <div class="form-group">
        <ejs-dropdownlist
          id="ddlelementCountry"
          floatLabelType="Always"
          #listCountry
          [dataSource]="country"
          [fields]="stateBoundaryFields"
          placeholder="Select Country"
          (change)="selectCountry($event)"
        ></ejs-dropdownlist>
      </div>
      <div class="form-group">
        <ejs-dropdownlist
          id="ddlelementProvince"
          floatLabelType="Always"
          #listProvince
          [dataSource]="province"
          [fields]="stateBoundaryFields"
          placeholder="Select Province"
          (change)="selectProvince($event)"
        ></ejs-dropdownlist>
      </div>
      <div class="form-group">
        <ejs-dropdownlist
          id="ddlelementCity"
          floatLabelType="Always"
          #listCity
          [dataSource]="cities"
          [fields]="stateBoundaryFields"
          placeholder="Select City"
          (change)="selectCity($event)"
        ></ejs-dropdownlist>
      </div>
      <div class="form-group">
        <ejs-dropdownlist
          id="ddlelementDistrict"
          floatLabelType="Always"
          #listDistrict
          [dataSource]="districts"
          [fields]="stateBoundaryFields"
          placeholder="Select District"
          (change)="selectDistrict($event)"
        ></ejs-dropdownlist>
      </div>
      <div class="form-group">
        <ejs-textbox placeholder="Postal Code" [(ngModel)]="postalCode" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
      </div>
      <!-- <div class="form-group">
            <label class="form-control-label" jhiTranslate="losgwApp.postalAddress.address2" for="field_address2">Address 2</label>
            <input type="text" class="form-control" name="address2" id="field_address2"
                [(ngModel)]="item.address2"  [disabled]="readOnly()"/>
        </div> -->
      <!-- <div class="form-group">
            <label class="form-control-label" jhiTranslate="losgwApp.postalAddress.latitude" for="field_latitude">Latitude</label>
            <input currencyMask class="form-control" name="latitude" id="field_latitude"
                [(ngModel)]="item.latitude"
                [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 4 }"
                [disabled]="readOnly()"/>
        </div>
        <div class="form-group">
            <label class="form-control-label" jhiTranslate="losgwApp.postalAddress.longitude" for="field_longitude">Longitude</label>
            <input currencyMask class="form-control" name="longitude" id="field_longitude"
                [(ngModel)]="item.longitude"
                [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 4 }"
                [disabled]="readOnly()"/>
        </div> -->
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
