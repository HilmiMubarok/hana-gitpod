<div class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title"></div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <div class="e-card-content">
          <div class="form-space">
            <div class="row my-3">
              <div class="col-2">
                <!-- <div class="form-space"> -->
                <div class="e-headertext">Customer Type</div>
              </div>
              <div class="col-2">
                <ejs-radiobutton label="Individu" name="{{ data }}"></ejs-radiobutton>
                <!-- </div> -->
              </div>
              <div class="col-2">
                <ejs-radiobutton label="Badan Usaha" name="{{ data }}"></ejs-radiobutton>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="CIF" [(ngModel)]="item.cif" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Identity Type" [(ngModel)]="item.identityTypeId" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Complate Name" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Identity Number" [(ngModel)]="item.identityNumber" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Company Type" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="NPWP" [(ngModel)]="item.npwp" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Contact Person Name" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox
                  [(ngModel)]="item.establishDate"
                  placeholder="Deed Of Established Date"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                >
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <div class="row">
                  <div class="col-4">
                    <ejs-textbox placeholder="Country Code" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                  </div>
                  <div class="col-8">
                    <ejs-textbox placeholder="Handphone Number" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                  </div>
                </div>
                <!-- <div class="form-space"> -->
              </div>
              <div class="col">
                <ejs-textbox
                  [(ngModel)]="item.deedOfEstablishNo"
                  placeholder="Deed Of Established No"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                >
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Email" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Deed Of Established Nota" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Relantions With Keb Hana Bank" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Deed Of Established Place" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-dropdownlist
                  [(ngModel)]="item.lineOfBusinessId"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  id="ddlelement"
                  [dataSource]="data"
                  placeholder="Line Of Business"
                ></ejs-dropdownlist>
              </div>
              <div class="col">
                <ejs-textbox placeholder="SIUP" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="SID Code" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <div class="row">
                  <div class="col-6">
                    <ejs-textbox [multiline]="true" placeholder="Existing Customer Since" floatLabelType="Auto" cssClass="e-outline">
                    </ejs-textbox>
                  </div>
                  <div class="col-6">
                    <ejs-textbox [multiline]="true" placeholder="Existing Debtor Since" floatLabelType="Auto" cssClass="e-outline">
                    </ejs-textbox>
                  </div>
                </div>
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="SID" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Account Number (IDR)" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox [multiline]="true" placeholder="LBU Remark" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Account Number (USD)" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-dropdownlist
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  id="ddlelement"
                  [dataSource]="data"
                  placeholder="Collectibility Status"
                ></ejs-dropdownlist>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Credit Scoring" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Call Category Report" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox [(ngModel)]="item.pepId" placeholder="PEP" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col-2">
                <!-- <div class="form-space"> -->
                <div class="e-headertext">Correspodence Address</div>
              </div>
              <div class="col-2">
                <ejs-radiobutton label="Sesuai Kantor" name="{{ data }}"></ejs-radiobutton>
                <!-- </div> -->
              </div>
              <div class="col-2">
                <ejs-radiobutton label="Sesuai Pabrik" name="{{ data }}"></ejs-radiobutton>
                <!-- </div> -->
              </div>
            </div>

            <!-- <div class="d-flex radio-btn justify-content-around">
              <ejs-radiobutton label="Iya" name="{{ data }}"></ejs-radiobutton>
              <ejs-radiobutton label="Tidak" name="{{ data }}" checked="true"></ejs-radiobutton>
            </div> -->

            <hr />

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Model Disetor" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Penjualan Tahunan" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Category Debitur" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Klasifikasi UMKM" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col-6">
                <ejs-textbox placeholder="IFC & Risk Category" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
            </div>

            <!-- <div class="row my-3">
              <div class="col-6">
                <ejs-textbox placeholder="Venue" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
            </div> -->
          </div>
        </div>
        <div class="e-card-actions"></div>
      </div>
    </div>
  </div>
</div>
<div class="d-flex justify-content-end">
  <!-- <jhi-button typeB="secondary" (clickEv)="addToGrid($event)"></jhi-button> -->
</div>
