<div class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">
              <!-- <span class="title-header">Business Activity</span> -->
              CUSTOMER INFO
            </div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <div class="e-card-content">
          <div class="form-space">
            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="CIF" [(ngModel)]="item.cif" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col-2">
                <!-- <div class="form-space"> -->
                <div color="#A3A3A3" class="e-headertext">Customer Status</div>
              </div>
              <div class="col-2">
                <ejs-radiobutton label="New" name="{{ data }}"></ejs-radiobutton>
                <!-- </div> -->
              </div>
              <div class="col-2">
                <ejs-radiobutton label="Existing" name="{{ data }}"></ejs-radiobutton>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col-2">
                <!-- <div class="form-space"> -->
                <div color="#A3A3A3" class="e-headertext">Customer Type</div>
              </div>
              <div class="col-2">
                <ejs-radiobutton label="Individu" name="{{ data }}"></ejs-radiobutton>
                <!-- </div> -->
              </div>
              <div class="col-2">
                <ejs-radiobutton label="Badan Usaha" name="{{ data }}"></ejs-radiobutton>
                <!-- </div> -->
              </div>
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Nomor NPWP" [(ngModel)]="item.npwp" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Debtor Names" [(ngModel)]="item.customerName" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox
                  placeholder="Relantions With Keb Hana Bank"
                  [(ngModel)]="item.relationWithHana"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                >
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox [(ngModel)]="item.pic" placeholder="PIC" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <div class="row">
                  <div class="col-6">
                    <ejs-textbox
                      [(ngModel)]="item.customerSince"
                      placeholder="Existing Customer Since"
                      floatLabelType="Auto"
                      cssClass="e-outline"
                    >
                    </ejs-textbox>
                  </div>
                  <div class="col-6">
                    <ejs-textbox placeholder="Years" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                  </div>
                </div>
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox [(ngModel)]="item.contactPhoneNumber" placeholder="Phone Number" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
              </div>
              <div class="col">
                <div class="row">
                  <div class="col-6">
                    <ejs-textbox
                      [(ngModel)]="item.createdDate"
                      placeholder="Existing Debtor Since"
                      floatLabelType="Auto"
                      cssClass="e-outline"
                    >
                    </ejs-textbox>
                  </div>
                  <div class="col-6">
                    <ejs-textbox placeholder="Years" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                  </div>
                </div>
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Mobile Number" [(ngModel)]="item.otherPhone1" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Account Number (IDR)" [(ngModel)]="item.abbreviation" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="FAX" [(ngModel)]="item.faxOffice" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Account Number (USD)" [(ngModel)]="item.abbreviation" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Email Address" [(ngModel)]="item.officeMail" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
              </div>
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-dropdownlist
                  [(ngModel)]="item.collectabilityStatus"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  id="ddlelement"
                  [dataSource]="data"
                  placeholder="Collectibility Status"
                ></ejs-dropdownlist>
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="NIK Address" [multiline]="true" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Modal Disetor" [(ngModel)]="item.depositCapital" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox
                  placeholder="Domisili Address"
                  [multiline]="true"
                  [(ngModel)]="item.address1"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                >
                </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Penjualan Tahunan" [(ngModel)]="item.annualSales" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Line Of Business" [(ngModel)]="item.lineOfBusinessId" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
              </div>
              <div class="col">
                <ejs-dropdownlist
                  [(ngModel)]="item.umkmCategory"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  id="ddlelement"
                  [dataSource]="data"
                  placeholder="Category Debitur"
                ></ejs-dropdownlist>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Economic Sector" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
              <div class="col">
                <ejs-dropdownlist
                  [(ngModel)]="item.umkmClassification"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  id="ddlelement"
                  [dataSource]="data"
                  placeholder="Klasifikasi UMKM"
                ></ejs-dropdownlist>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="SID Code" [(ngModel)]="item.custInfoSystemName" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox placeholder="Credit Scoring" [(ngModel)]="item.CreditRating" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="SID" [(ngModel)]="item.custInfoSystemCode" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
              </div>
              <div class="col">
                <ejs-textbox
                  [(ngModel)]="item.callReportCategory"
                  placeholder="IFC & Risk Category"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                >
                </ejs-textbox>
                <!-- </div> -->
              </div>
            </div>

            <div class="row my-3">
              <div class="col-6">
                <!-- <div class="form-space"> -->
                <ejs-textbox placeholder="Kode LBU" [(ngModel)]="item.gnrlBankReportCode" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
              </div>
            </div>

            <div class="row my-3">
              <div class="col-6">
                <!-- <div class="form-space"> -->
                <ejs-textbox [(ngModel)]="item.gnrlBankReport" placeholder="LBU Remark" floatLabelType="Auto" cssClass="e-outline">
                </ejs-textbox>
              </div>
            </div>
          </div>
        </div>
        <div class="e-card-actions">
          <!-- <button class="btn-info" ejs-button (click)="saveData()">Save</button> -->
        </div>
      </div>
    </div>
  </div>
</div>
<div class="d-flex justify-content-end">
  <!-- <jhi-button typeB="secondary" (clickEv)="addToGrid($event)"></jhi-button> -->
</div>
