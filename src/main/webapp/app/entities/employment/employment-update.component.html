<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.employment.home.createOrEditLabel">Employments</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{employment.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item" *ngFor="let task of tasks$ | async">
            <a class="btn" (click)="processTask(task)" style="cursor: pointer" tooltip="{{ task.description }}" *ngIf="!readOnly()">
              <span><fa-icon [icon]="task.icon"></fa-icon> &nbsp;{{ task.caption }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.employment.fromDate" for="field_fromDate">From Date</label>
                <div class="input-group">
                  <p-calendar
                    inputId="field_fromDate"
                    name="input_fromDate"
                    [(ngModel)]="item.fromDate"
                    dateFormat="dd-mm-yy"
                    [showTime]="false"
                    hourFormat="24"
                    [showSeconds]="true"
                    [showIcon]="true"
                    [hideOnDateTimeSelect]="true"
                    [disabled]="readOnly()"
                  ></p-calendar>
                </div>
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.employment.thruDate" for="field_thruDate">Thru Date</label>
                <div class="input-group">
                  <p-calendar
                    inputId="field_thruDate"
                    name="input_thruDate"
                    [(ngModel)]="item.thruDate"
                    dateFormat="dd-mm-yy"
                    [showTime]="false"
                    hourFormat="24"
                    [showSeconds]="true"
                    [showIcon]="true"
                    [hideOnDateTimeSelect]="true"
                    [disabled]="readOnly()"
                  ></p-calendar>
                </div>
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.employment.relationType" for="field_relationType">Relation Type</label>
                <select
                  class="form-control"
                  id="field_relationType"
                  name="relationType"
                  [(ngModel)]="item.relationTypeId"
                  [disabled]="relationTypeId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="relationTypeOption.id"
                    *ngFor="let relationTypeOption of relationtypes; trackBy: trackRelationTypeById"
                  >
                    {{ relationTypeOption.description }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.employment.partyTo" for="field_partyTo">Party To</label>
                <select
                  class="form-control"
                  id="field_partyTo"
                  name="partyTo"
                  [(ngModel)]="item.partyToId"
                  [disabled]="partyToId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">
                    {{ partyOption.name }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.employment.partyFrom" for="field_partyFrom">Party From</label>
                <select
                  class="form-control"
                  id="field_partyFrom"
                  name="partyFrom"
                  [(ngModel)]="item.partyFromId"
                  [disabled]="partyFromId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">
                    {{ partyOption.name }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
