<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.employment.fromDate" for="field_fromDate">From Date</label>
        <div class="input-group">
          <p-calendar
            inputId="field_fromDate"
            name="input_fromDate"
            [(ngModel)]="item.fromDate"
            dateFormat="dd-mm-yy"
            [showTime]="false"
            hourFormat="24"
            [showSeconds]="true"
            [showIcon]="true"
            [hideOnDateTimeSelect]="true"
            [disabled]="readOnly()"
          >
          </p-calendar>
        </div>
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.employment.thruDate" for="field_thruDate">Thru Date</label>
        <div class="input-group">
          <p-calendar
            inputId="field_thruDate"
            name="input_thruDate"
            [(ngModel)]="item.thruDate"
            dateFormat="dd-mm-yy"
            [showTime]="false"
            hourFormat="24"
            [showSeconds]="true"
            [showIcon]="true"
            [hideOnDateTimeSelect]="true"
            [disabled]="readOnly()"
          >
          </p-calendar>
        </div>
      </div>

      <div class="form-group">
        <label jhiTranslate="losgwApp.employment.relationType" for="field_relationType">Relation Type</label>
        <select
          class="form-control"
          id="field_relationType"
          name="relationType"
          [(ngModel)]="item.relationTypeId"
          [disabled]="relationTypeId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="relationTypeOption.id" *ngFor="let relationTypeOption of relationtypes; trackBy: trackRelationTypeById">
            {{ relationTypeOption.description }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.employment.partyTo" for="field_partyTo">Party To</label>
        <select
          class="form-control"
          id="field_partyTo"
          name="partyTo"
          [(ngModel)]="item.partyToId"
          [disabled]="partyToId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">{{ partyOption.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.employment.partyFrom" for="field_partyFrom">Party From</label>
        <select
          class="form-control"
          id="field_partyFrom"
          name="partyFrom"
          [(ngModel)]="item.partyFromId"
          [disabled]="partyFromId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">{{ partyOption.name }}</option>
        </select>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
