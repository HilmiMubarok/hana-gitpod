<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.partyIdentification.home.viewLabel">Party Identifications</span>
  </h5>
  <p-panel>
    <p-header>
      <span jhiTranslate="losgwApp.partyIdentification.detail.title">Party Identification</span> {{ partyIdentification.id }}
    </p-header>
    <jhi-party-identification-view [item]="partyIdentification" mode="item"> </jhi-party-identification-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/party-identification', partyIdentification.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
