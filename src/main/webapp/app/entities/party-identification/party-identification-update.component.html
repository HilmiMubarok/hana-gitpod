<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.partyIdentification.home.createOrEditLabel">Party Identifications</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{partyIdentification.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.partyIdentification.value" for="field_value">Value</label>
                <input type="text" class="form-control" name="value" id="field_value" [(ngModel)]="item.value" [disabled]="readOnly()" />
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.partyIdentification.identificationType" for="field_identificationType"
                  >Identification Type</label
                >
                <select
                  class="form-control"
                  id="field_identificationType"
                  name="identificationType"
                  [(ngModel)]="item.identificationTypeId"
                  [disabled]="identificationTypeId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="identificationTypeOption.id"
                    *ngFor="let identificationTypeOption of identificationtypes; trackBy: trackIdentificationTypeById"
                  >
                    {{ identificationTypeOption.description }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.partyIdentification.party" for="field_party">Party</label>
                <select
                  class="form-control"
                  id="field_party"
                  name="party"
                  [(ngModel)]="item.partyId"
                  [disabled]="partyId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">
                    {{ partyOption.id }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
