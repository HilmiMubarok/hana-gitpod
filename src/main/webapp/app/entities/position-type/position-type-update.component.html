<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.positionType.home.createOrEditLabel">Position Types</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{positionType.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a class="btn" (click)="print()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Print current data">
              <span><fa-icon icon="print"></fa-icon> &nbsp;{{ 'entity.action.print' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.positionType.description" for="field_description"
                  >Description</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="description"
                  id="field_description"
                  [(ngModel)]="item.description"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.positionType.title" for="field_title">Title</label>
                <input type="text" class="form-control" name="title" id="field_title" [(ngModel)]="item.title" [disabled]="readOnly()" />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.positionType.numOfPosition" for="field_numOfPosition"
                  >Num Of Position</label
                >
                <input
                  currencyMask
                  class="form-control"
                  name="numOfPosition"
                  id="field_numOfPosition"
                  [(ngModel)]="item.numOfPosition"
                  [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
                  [disabled]="readOnly()"
                />
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.positionType.parent" for="field_parent">Parent</label>
                <select
                  class="form-control"
                  id="field_parent"
                  name="parent"
                  [(ngModel)]="item.parentId"
                  [disabled]="parentId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="positionTypeOption.id"
                    *ngFor="let positionTypeOption of positiontypes; trackBy: trackPositionTypeById"
                  >
                    {{ positionTypeOption.description }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.positionType.internalType" for="field_internalType">Internal Type</label>
                <select
                  class="form-control"
                  id="field_internalType"
                  name="internalType"
                  [(ngModel)]="item.internalTypeId"
                  [disabled]="internalTypeId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="internalTypeOption.id"
                    *ngFor="let internalTypeOption of internaltypes; trackBy: trackInternalTypeById"
                  >
                    {{ internalTypeOption.description }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
