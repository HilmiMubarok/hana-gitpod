<div class="row">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Position Type" url="/position-type"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Update Position Type</p>
        </div>
      </div>
    </div>
    <div class="e-card-content">
      <mat-card>
        <mat-card-header>
          <mat-card-subtitle class="fw-bold">Position Type</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="row">
            <div class="col-12">
              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Position Type Id</mat-label>
                  <input matInput type="text" [(ngModel)]="model.id" />
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Position Name</mat-label>
                  <input matInput type="text" [(ngModel)]="model.description" />
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Title</mat-label>
                  <input matInput type="text" [(ngModel)]="model.title" />
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Num Of Position</mat-label>
                  <input matInput type="text" [(ngModel)]="model.numOfPosition" />
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Parent</mat-label>
                  <mat-select [(ngModel)]="model.parentId">
                    <mat-option *ngFor="let ax of positiontypes" [value]="ax.id">
                      {{ ax.description }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Internal</mat-label>
                  <mat-select [(ngModel)]="model.internalTypeId">
                    <mat-option *ngFor="let ax of internaltypes" [value]="ax.id">
                      {{ ax.description }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card-actions align="center">
        <button style="text-align: center; margin-top: 15px" type="submit" (click)="submit()" mat-raised-button color="primary">
          Save
        </button>
      </mat-card-actions>
    </div>
  </div>
</div>
