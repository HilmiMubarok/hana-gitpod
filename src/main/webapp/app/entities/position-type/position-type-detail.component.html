<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.positionType.home.viewLabel">Position Types</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.positionType.detail.title">Position Type</span> {{ positionType.id }} </p-header>
    <jhi-position-type-view [item]="positionType" mode="item"> </jhi-position-type-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/position-type', positionType.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
