<div>
  <div class="card">
    <span class="title">General Risk Acceptance Criteria </span>

    <div class="grid-table mb-5">
      <ejs-grid [dataSource]="data">
        <e-columns>
          <e-column field="No" headerText="No" textAlign="left" width="10"></e-column>
          <e-column field="Parameter" headerText="Parameter" width="70"></e-column>
          <e-column textAlign="Center" width="20">
            <ng-template #template let-data>
              <ejs-radiobutton label="yes" name="data.value"></ejs-radiobutton>
              <ejs-radiobutton label="no" name="data.value"></ejs-radiobutton>
            </ng-template>
          </e-column>
        </e-columns>
      </ejs-grid>
    </div>

    <span class="title"> Risk Acceptance Criteria </span>
    <div class="grid-table mb-5">
      <ejs-grid [dataSource]="data">
        <e-columns>
          <e-column field="No" headerText="No" textAlign="left" width="15"></e-column>
          <e-column field="Parameter" width="90"></e-column>
          <e-column headerText="Remarks" textAlign="center" format="C2" width="30"></e-column>
          <e-column headerText="Actions" textAlign="Center" width="20">
            <ng-template #template let-data>
              <ejs-radiobutton label="yes" name="data.value"></ejs-radiobutton>
              <ejs-radiobutton label="no" name="data.value"></ejs-radiobutton>
              <mat-icon>delete_outline</mat-icon>
            </ng-template>
          </e-column>
        </e-columns>
      </ejs-grid>
    </div>

    <div class="card-input">
      <div class="row my-3 mt-3">
        <div class="col-6">
          <div class="form-group">
            <div>
              <div class="dropdown-sub-parameter">
                <ejs-dropdownlist
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  id="ddlelement"
                  [dataSource]="data"
                  placeholder="Sub Parameter"
                ></ejs-dropdownlist>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <div class="remaks-textbox">
              <ejs-textbox [multiline]="true" placeholder="Remaks" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
            </div>
          </div>
        </div>
      </div>
      <div class="row my-3">
        <div class="col-6">
          <div class="form-group">
            <div>
              <ejs-textbox placeholder="Parameters" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end mt-5 px-2">
      <button class="btn-add" ejs-button>SAVE</button>
    </div>

    <div class="card-input mt-5 mb-3">
      <div class="row my-3">
        <div class="col-6">
          <div class="form-group">
            <div>
              <!-- <ejs-textbox placeholder="Identity Type " cssClass="e-outline " floatLabelType="Auto "></ejs-textbox> -->
              <ejs-dropdownlist
                cssClass="e-outline "
                floatLabelType="Auto "
                id="ddlelement "
                [dataSource]="data "
                placeholder="Tipe Konsumen "
              ></ejs-dropdownlist>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <div>
              <ejs-textbox placeholder="Criteria " cssClass="e-outline " floatLabelType="Auto "></ejs-textbox>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-input mt-3 mb-3">
      <div class="row my-3">
        <div class="col-6">
          <div class="form-group">
            <div>
              <!-- <ejs-textbox placeholder="Identity Type " cssClass="e-outline " floatLabelType="Auto "></ejs-textbox> -->
              <ejs-dropdownlist
                cssClass="e-outline "
                floatLabelType="Auto "
                id="ddlelement "
                [dataSource]="data "
                placeholder="Tipe Konsumen "
              ></ejs-dropdownlist>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <div>
              <ejs-textbox placeholder="Criteria " cssClass="e-outline " floatLabelType="Auto "></ejs-textbox>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-input mt-3 mb-5">
      <div class="row my-3">
        <div class="col-6">
          <div class="form-group">
            <div>
              <!-- <ejs-textbox placeholder="Identity Type " cssClass="e-outline " floatLabelType="Auto "></ejs-textbox> -->
              <ejs-dropdownlist
                cssClass="e-outline "
                floatLabelType="Auto "
                id="ddlelement "
                [dataSource]="data "
                placeholder="Tipe Konsumen "
              ></ejs-dropdownlist>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <div>
              <ejs-textbox placeholder="Criteria " cssClass="e-outline " floatLabelType="Auto "></ejs-textbox>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end px-2">
      <button class="btn-add" ejs-button>SAVE</button>
    </div>
  </div>
</div>
