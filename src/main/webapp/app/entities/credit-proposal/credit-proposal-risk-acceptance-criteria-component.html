<div class="card">
  <div class="card-border">
    <span class="title-header mb-5">General Risk Acceptance Criteria </span>

    <div class="grid-table mb-3">
      <ejs-grid [dataSource]="data">
        <e-columns>
          <e-column field="No" headerText="No" textAlign="left" width="10"></e-column>
          <e-column field="Parameter" headerText="Parameter" width="70"></e-column>
          <e-column headerText="Select" textAlign="Center" width="20">
            <div class="select">
              <ng-template #template let-data>
                <ejs-radiobutton label="yes" name="data.value"></ejs-radiobutton>
                <ejs-radiobutton label="no" name="data.value"></ejs-radiobutton>
              </ng-template>
            </div>
          </e-column>
        </e-columns>
      </ejs-grid>
    </div>

    <span class="title-header mt-5 mb-5"> Risk Acceptance Criteria </span>
    <div class="grid-table mb-5">
      <ejs-grid [dataSource]="data" height="272px">
        <e-columns>
          <e-column field="No" headerText="No" textAlign="left" width="15"></e-column>
          <e-column field="Sub Parameter" width="60"></e-column>
          <e-column field="Parameter" width="130"></e-column>
          <e-column headerText="Remarks" textAlign="center" format="C2" width="30"></e-column>
          <e-column headerText="Select" textAlign="Center" width="30">
            <ng-template #template let-data>
              <ejs-radiobutton label="yes" name="data.value"></ejs-radiobutton>
              <ejs-radiobutton label="no" name="data.value"></ejs-radiobutton>
            </ng-template>
          </e-column>

          <e-column headerText="Actions" textAlign="Center" width="20">
            <ng-template #template let-data>
              <mat-icon>delete_outline</mat-icon>
            </ng-template>
          </e-column>
        </e-columns>
      </ejs-grid>

      <div class="d-flex justify-content-end mt-3 mb-3 px-2">
        <div>
          <button class="e-btn btn-info" id="dlgbtn" #ButtonInstance (click)="btnAdd()">Add</button>
        </div>
        <div class="control-section">
          <ejs-dialog
            id="dialog"
            #ejDialog
            isModal="true"
            showCloseIcon="true"
            [closeOnEscape]="closeOnEscape"
            (overlayClick)="onOverlayClick()"
            [animationSettings]="animationSettings"
            [visible]="dialogVisible"
            [width]="width"
            [height]="height"
          >
            <ng-template #header> <span class="e-icons close-icon col-lg-2"></span> </ng-template>
            <ng-template #content>
              <div class="dialogContent">
                <span class="pop-up">
                  <div class="card-input">
                    <div class="row my-3 mt-3">
                      <div class="col">
                        <div class="form-group">
                          <div>
                            <div class="dropdown-sub-parameter">
                              <ejs-dropdownlist
                                cssClass="e-outline"
                                floatLabelType="Auto"
                                id="ddlelement"
                                [dataSource]="data"
                                placeholder="Sub Parameter"
                              ></ejs-dropdownlist>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="row my-3">
                      <div class="col">
                        <div class="form-group">
                          <div>
                            <ejs-textbox placeholder="Parameters" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="row my-3">
                      <div class="col">
                        <div class="form-group">
                          <div>
                            <ejs-dropdownlist
                              cssClass="e-outline "
                              floatLabelType="Auto "
                              id="ddlelement "
                              [dataSource]="data "
                              placeholder="Collaterall Status"
                            ></ejs-dropdownlist>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="row my-3">
                      <div class="col">
                        <div class="form-group">
                          <div>
                            <ejs-dropdownlist
                              cssClass="e-outline "
                              floatLabelType="Auto "
                              id="ddlelement "
                              [dataSource]="data "
                              placeholder="Collateral Insurance "
                            ></ejs-dropdownlist>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="row my-3">
                      <div class="col">
                        <div class="form-group">
                          <div>
                            <ejs-dropdownlist
                              cssClass="e-outline "
                              floatLabelType="Auto "
                              id="ddlelement "
                              [dataSource]="data "
                              placeholder="Collateral Coverage Based On LV"
                            ></ejs-dropdownlist>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="row my-3">
                      <div class="col">
                        <div class="form-group">
                          <div class="remaks-textbox">
                            <ejs-textbox [multiline]="true" placeholder="Remaks" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                          </div>
                        </div>
                        <div class="d-flex justify-content-end mt-2 mb-2">
                          <button class="btn-info" ejs-button>SAVE</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </span>
              </div>
            </ng-template>
          </ejs-dialog>
        </div>
      </div>
    </div>
