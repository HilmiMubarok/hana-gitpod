<mat-card class="mt-3">
  <mat-card-content>
    <div class="row">
      <div class="col-md-6">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Forward To</mat-label>
          <mat-select [(ngModel)]="applicationRoleId" (selectionChange)="onSelectForwardTo($event)">
            <mat-option *ngFor="let item of position" [value]="item.id">
              {{ item.employeeFirstName }} {{ item.employeeLastName }} - {{ item.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6" [hidden]="hide">
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Reject Reason</mat-label>
            <input matInput type="text" [(ngModel)]="creditProposal.attributes['rejectReason'].reject" />
          </mat-form-field>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
