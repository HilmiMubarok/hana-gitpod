<div class="e-card">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">GROUP & GUARANTOR ANALYSIS</div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
          <div class="e-card-content">
            <ejs-richtexteditor [(ngModel)]="this.creditProposalItem.attributes['guaranturAnalysis'].remarks" [toolbarSettings]="tools">
            </ejs-richtexteditor>
          </div>
        </section>
        <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
          <div class="fontsebled row">
            <div class="col-4">GROUP & GUARANTOR ANALYSIS</div>
            <div class="col-md-auto">:</div>
            <div class="col">
              {{ creditProposalItem.attributes['guaranturAnalysis'].remarks }}
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
