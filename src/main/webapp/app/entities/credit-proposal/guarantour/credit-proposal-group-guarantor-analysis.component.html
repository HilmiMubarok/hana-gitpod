<div class="e-card">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">GROUP & GUARANTOR ANALYSIS</div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <div class="e-card-content">
          <ejs-documenteditorcontainer
            #document_editor_container
            [enableToolbar]="true"
            [enableLocalPaste]="false"
            height="100vh"
            style="display: block"
            [spellcheck]="false"
            [enableSpellCheck]="false"
            (keyDown)="onKeyDown($event)"
            (created)="onCreate()"
          >
          </ejs-documenteditorcontainer>
        </div>
      </div>
    </div>
  </div>
</div>
