<div class="e-sample-resize-container e-card-resize-container mt-5">
  <div class="row">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">REMARKS</div>
            <div class="e-card-sub-title"></div>
            <section *jhiMatrixDir="creditProposal.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: 'input'">
              <ejs-documenteditorcontainer
                #document_editor_container
                [headers]="customHeadersJWT"
                [enableToolbar]="true"
                [enableLocalPaste]="false"
                height="100vh"
                style="display: block"
                [spellcheck]="false"
                [enableSpellCheck]="false"
                (keyDown)="onKeyDown($event)"
                (created)="onCreate()"
              >
              </ejs-documenteditorcontainer>
            </section>

            <section *jhiMatrixDir="creditProposal.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: ''">
              <ejs-documenteditorcontainer
                #document_editor_container
                [headers]="customHeadersJWT"
                [enableToolbar]="false"
                [enableLocalPaste]="false"
                height="100vh"
                style="display: block"
                (documentChange)="onDocumentChange()"
                [enableEditor]="false"
                [isReadOnly]="true"
              >
              </ejs-documenteditorcontainer>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
