<!-- abed -->
<div class="row">
  <div *ngIf="creditProposal.attributes['proposalType'] === 'Total Exposure > IDR 15 Bn'">
    <ejs-menu
      [enableScrolling]="true"
      cssClass="e-rounded-menu e-custom-scroll"
      [items]="menuItems"
      (select)="selectMenuItem($event)"
    ></ejs-menu>
    <div [hidden]="selectedMenu === 'CHECKLIST'">
      <jhi-above-grid [creditProposal]="creditProposal"></jhi-above-grid>
    </div>
  </div>
  <div *ngIf="creditProposal.attributes['proposalType'] === 'Total Exposure > IDR 15 Bn'">
    <div *ngIf="selectedMenu === 'CHECKLIST'">
      <div class="card-content">
        <jhi-credit-proposal-collateral-info-checklist [creditProposal]="creditProposal"> </jhi-credit-proposal-collateral-info-checklist>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="creditProposal.attributes['proposalType'] === 'Total Exposure <= IDR 15 Bn' || creditProposal.attributes['proposalType'] === ''"
>
  <jhi-bellow-grid [creditProposal]="creditProposal"></jhi-bellow-grid>
</div>

<!-- || 'Total Exposure <= IDR 15 Bn' -->
<div *ngIf="creditProposal.attributes['proposalType'] === 'Total Exposure Back to Back'">
  <jhi-credit-proposal-collateral-info-btb [creditProposal]="creditProposal"></jhi-credit-proposal-collateral-info-btb>
</div>
