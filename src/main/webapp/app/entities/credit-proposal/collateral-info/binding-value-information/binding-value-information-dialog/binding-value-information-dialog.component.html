<h2 mat-dialog-title class="header-title">Collateral Detail</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-content>
      <div class="row">
        <div class="col-6">
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Collateral Type</mat-label>
                <input matInput type="text" [(ngModel)]="dataCollateral.collateralTypeId" disabled />
              </mat-form-field>
            </div>
          </section>
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Guarantee Binding</mat-label>
                <input matInput type="text" [(ngModel)]="dataCollateral.attributes['guaranteeBinding']" disabled />
              </mat-form-field>
            </div>
          </section>
        </div>
        <div class="col-6">
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Address</mat-label>
                <input matInput type="text" [(ngModel)]="dataCollateral.collateralAddress.address1" disabled />
              </mat-form-field>
            </div>
          </section>
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Binding Type</mat-label>
                <input matInput type="text" [value]="collBindingType" disabled />
              </mat-form-field>
            </div>
          </section>
        </div>
      </div>

      <!-- <div *ngIf="dataCollateral.collateralTypeId === 'REALESTATE'">
        <jhi-binding-value-real-estate-grid [creditProposal]="creditProposal" [collateral]="dataCollateral"></jhi-binding-value-real-estate-grid>
      </div>

      <div *ngIf="dataCollateral.collateralTypeId === 'MACHINE'">
        <jhi-binding-value-machine-grid [creditProposal]="creditProposal" [collateral]="dataCollateral"></jhi-binding-value-machine-grid>
      </div>

      <div *ngIf="dataCollateral.collateralTypeId === 'DEPOSIT'">
        <jhi-binding-value-deposito-grid [creditProposal]="creditProposal" [collateral]="dataCollateral"></jhi-binding-value-deposito-grid>
      </div> -->

      <div>
        <jhi-binding-value-general-grid [creditProposal]="creditProposal" [collateral]="dataCollateral"></jhi-binding-value-general-grid>
      </div>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center" class="align-center">
  <section>
    <button mat-raised-button class="confirm-button-no" (click)="closeDialog()">Close</button>
  </section>
  <!-- <section *jhiMatrixDir="creditProposal.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: ''">
      <button mat-raised-button mat-dialog-close class="confirm-button-no">Cancel</button>
    </section> -->
</mat-dialog-actions>
