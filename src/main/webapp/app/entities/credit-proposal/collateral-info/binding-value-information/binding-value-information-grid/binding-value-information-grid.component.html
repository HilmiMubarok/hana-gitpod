<div class="table-responsive-material">
  <table mat-table [dataSource]="dataItem" class="w-100">
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef class="grid-index-right rounding-table-left">No</th>
      <td mat-cell *matCellDef="let i = index" class="grid-index-right">{{ i + 1 }}</td>
    </ng-container>
    <ng-container matColumnDef="collateralType">
      <th mat-header-cell *matHeaderCellDef class="rounding-table-">Collateral Type</th>
      <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.collateralTypeId }}</td>
    </ng-container>
    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef class="rounding-table-">Address</th>
      <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.collateralAddress.address1 }}</td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef class="grid-index-left rounding-table-right">Action</th>
      <td mat-cell *matCellDef="let element" class="grid-index-left">
        <div *ngIf="statusDisabledOffering">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
        </div>
        <div *ngIf="!statusDisabledOffering">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>remove_red_eye</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
    </tr>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator #paginator [pageSizeOptions]="[5, 12, 18]" showFirstLastButtons></mat-paginator>
</div>
