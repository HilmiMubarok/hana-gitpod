  <ejs-breadcrumb enableNavigation="{true}" cssClass="'e-custom-breadcrumb">
    <e-breadcrumb-items>
      <e-breadcrumb-item text="Home" url="./credit-proposal"></e-breadcrumb-item>
      <e-breadcrumb-item text="Debtor Data"></e-breadcrumb-item>
    </e-breadcrumb-items>
  </ejs-breadcrumb>
  <mat-card-header>
    <mat-card-title>Credit Proposal</mat-card-title>
    <mat-card-subtitle>This is Credit Proposal page</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <ejs-grid
      #grid
      [dataSource]="items | async"
      [allowPaging]="true"
      [pageSettings]="pageSettings"
      (dataStateChange)="dataStateChange($event)"
    >
      <e-columns>
        <e-column field="indexNum" headerText="No" textAlign="center"></e-column>
        <e-column field="applicationNumber" headerText="Application Number" textAlign="center"></e-column>
        <e-column field="cif.number" headerText="CIF Number" textAlign="center"></e-column>
        <e-column field="createdBy" headerText="Created By" textAlign="center"></e-column>
        <e-column headerText="Created Date" textAlign="center">
          <ng-template #template let-data>
            {{ data.createdDate | formatMediumDate }}
          </ng-template>
        </e-column>
        <e-column headerText="Action" width="150" textAlign="Center">
          <ng-template #template let-data>
            <div>
              <a [routerLink]="['/credit-proposal', data.id, 'edit']">
                <mat-icon>edit</mat-icon>
              </a>
            </div>
          </ng-template>
        </e-column>
      </e-columns>
    </ejs-grid>
  </mat-card-content>
  <mat-card-actions align="center" class="my-3">
    <button mat-raised-button color="primary" class="btn-lg text-uppercase" (click)="openPromptFindCIF()">
      <fa-icon icon="search"></fa-icon> Find CIF
    </button>
  </mat-card-actions>
</mat-card>

<!--PROMPT DIALOG-->
<ejs-dialog
  #findCifDialog
  isModal="true"
  [visible]="visiblePrompt"
  [buttons]="buttonFindCifDialog"
  header="Find CIF"
  [animationSettings]="animationSettings"
  width="400px"
>
  <!-- Prompt Dialog content  -->
  <ng-template #content>
    <div class="py-2 pt-2 text-center">
      <ejs-textbox [(ngModel)]="cifNumber" name="cifNumber" placeholder="CIF" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
      <button mat-raised-button color="primary" class="mt-3 btn-lg" (click)="findCif()">Submit</button>
    </div>
  </ng-template>
</ejs-dialog>
