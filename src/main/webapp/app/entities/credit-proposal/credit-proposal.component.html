<div class="page-content">
  <ejs-grid
    #grid
    [dataSource]="itemsA | async"
    [allowPaging]="true"
    [pageSettings]="pageSettings"
    (dataStateChange)="dataStateChange($event)"
  >
    <e-columns>
      <e-column headerText="No" width="120" textAlign="Right">
        <ng-template #template let-data let-i="index">
          {{ i }}
        </ng-template>
      </e-column>
      <e-column field="applicationNumber" headerText="Application Number" textAlign="center"></e-column>
      <e-column field="createdBy" headerText="Created By" textAlign="center"></e-column>
      <e-column headerText="Created Date" textAlign="center">
        <ng-template #template let-data>
          {{ data.createdDate | formatMediumDate }}
        </ng-template>
      </e-column>
      <e-column headerText="Action" width="150" textAlign="Center">
        <ng-template #template let-data>
          <div>
            <a [routerLink]="['/credit-proposal', data.id, 'edit']"><mat-icon>edit</mat-icon></a>
          </div>
        </ng-template>
      </e-column>
    </e-columns>
  </ejs-grid>
  <!--<ejs-grid [dataSource]='data | async' allowPaging= 'true' [pageSettings]='pageOptions' allowSorting= 'true' allowGrouping= 'true' (dataStateChange)= 'dataStateChange($event)'>
	<e-columns>
		<e-column field= "OrderID" headerText="Order ID" width="130" ></e-column>
		<e-column field= "CustomerID" headerText="Customer Name" width="150"></e-column>
		<e-column field= "ShipName" headerText="Ship Name" width="200"></e-column>
		<e-column field= "ShipCity" headerText="Ship City" width="150"></e-column>
	</e-columns>
  </ejs-grid>-->
  <div class="mt-3" style="text-align: right">
    <button ejs-button [isPrimary]="true"><a [routerLink]="['./new']">Add</a></button>
  </div>
</div>
