<mat-card>
  <mat-card-header>
    <mat-card-title>Initial Debtor Data</mat-card-title>
    <mat-card-subtitle>This is Initial Debtor Data page</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <ejs-grid
      #grid
      [dataSource]="items | async"
      [allowPaging]="true"
      [pageSettings]="pageSettings"
      (dataStateChange)="dataStateChange($event)"
    >
      <e-columns>
        <e-column field="indexNum" headerText="No" textAlign="center"></e-column>
        <e-column field="applicationNumber" headerText="Application Number" textAlign="center"></e-column>
        <e-column field="createdBy" headerText="Created By" textAlign="center"></e-column>
        <e-column headerText="Created Date" textAlign="center">
          <ng-template #template let-data>
            {{ data.createdDate | formatMediumDate }}
          </ng-template>
        </e-column>
        <e-column headerText="Action" width="150" textAlign="Center">
          <ng-template #template let-data>
            <div>
              <a [routerLink]="['/credit-proposal', data.id, 'edit']">
                <mat-icon>edit</mat-icon>
              </a>
            </div>
          </ng-template>
        </e-column>
      </e-columns>
    </ejs-grid>
  </mat-card-content>
  <mat-card-actions align="end">
    <a mat-raised-button color="primary" [routerLink]="['./new']">Add New</a>
  </mat-card-actions>
</mat-card>
