<section *ngIf="isViewLoan === false">
  <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Booking Branch</mat-label>
        <mat-select [value]="creditProposal.debtorData.bookingBranch" (selectionChange)="select($event)" disabled>
          <mat-option value="">Please Select</mat-option>
          <mat-option *ngFor="let item of branchs" [value]="item.id">
            {{ item.organizationName }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </section>
  <div *ngIf="menu !== 'confirmation'">
    <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
      <div class="fontsebled row">
        <div class="col-2">Booking Branchs</div>
        <div class="col-md-auto">:</div>
        <div class="col-8">
          {{ organizationNameCp }}
        </div>
      </div>
    </section>
  </div>
  <div *ngIf="menu === 'confirmation'">
    <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
      <div class="fontsebled row">
        <div class="col-4">Booking Branchs</div>
        <div class="col-md-auto">:</div>
        <div class="col col-lg-4">
          {{ organizationNameCp }}
        </div>
      </div>
    </section>
  </div>
</section>

<section *ngIf="isViewLoan === true">
  <ejs-textbox
    [(ngModel)]="creditProposal.internalName"
    placeholder="Booking Branchs"
    cssClass="e-outline"
    floatLabelType="Auto"
    disabled
  ></ejs-textbox>
</section>
