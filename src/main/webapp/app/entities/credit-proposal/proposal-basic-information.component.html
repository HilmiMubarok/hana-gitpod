<div class="e-card">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <ejs-breadcrumb cssClass="margin: 1rem;">
        <e-breadcrumb-items>
          <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
          <e-breadcrumb-item text="Credit Proposal" url="/credit-proposal"></e-breadcrumb-item>
          <e-breadcrumb-item text="New" url=""></e-breadcrumb-item>
        </e-breadcrumb-items>
      </ejs-breadcrumb>
      <div class="header-container">
        <div class="header-content">
          <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
          <span class="back-prefix" (click)="previousState()">Back | </span>
        </div>
        <p class="e-card-sub-title">Credit Proposal</p>
      </div>
    </div>
  </div>
  <div class="e-card-content">
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <p class="e-card-header-title">CREDIT PROPOSAL</p>
          </div>
        </div>
        <div class="e-card-content">
          <div class="row">
            <div class="col-md-6" style="padding: 10px">
              <ejs-combobox
                cssClass="e-outline"
                [(ngModel)]="proposalTypeValue"
                [dataSource]="proposalTypeList"
                placeholder="Proposal Type"
              ></ejs-combobox>
            </div>
            <div class="col-md-6 row">
              <div class="col-md-10" style="padding: 10px">
                <ejs-textbox placeholder="CIF" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
              </div>
              <div class="col-md-2" style="padding: 10px">
                <button class="button-info">Search</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">{{ proposalTypeValue }}</div>
          </div>
        </div>
        <div class="e-card-content">
          <ejs-menu
            [enableScrolling]="true"
            cssClass="e-rounded-menu e-custom-scroll"
            [items]="menuItems"
            [fields]="menuFields"
            (select)="selectMenuItem($event)"
          ></ejs-menu>
          <!--<div [hidden]="selectedMenu !== 'BASIC INFORMATION'">
            <jhi-credit-proposal-basic-information></jhi-credit-proposal-basic-information>
          </div>
          <div [hidden]="selectedMenu !== 'BUSINES ACTIVITY'">
            <jhi-credit-proposal-busines-activity> </jhi-credit-proposal-busines-activity>
          </div>-->
          <div *ngIf="selectedMenu === 'LOAN FACILITY DETAIL'" class="e-sample-resize-container e-card-resize-container">
            <jhi-credit-proposal-tab-loan-facility-detail
              [creditProposal]="creditProposal"
              (outCreditProposal)="onGetCreditProposal($event)"
            ></jhi-credit-proposal-tab-loan-facility-detail>
          </div>
          <div [hidden]="selectedMenu !== 'SLIK SUMMARY'">
            <jhi-credit-proposal-slik-summary-list></jhi-credit-proposal-slik-summary-list>
          </div>
          <!--<div [hidden]="selectedMenu !== 'ACCEPTENCE CRITERIA'">
            <jhi-credit-proposal-risk-acceptance-criteria></jhi-credit-proposal-risk-acceptance-criteria>
          </div>
          <div [hidden]="selectedMenu !== 'MANAGEMENT INFO'">
            <jhi-credit-proposal-management-info></jhi-credit-proposal-management-info>
          </div>
          
          <div [hidden]="selectedMenu !== 'CORRESPONDENCE'">
            <jhi-credit-proposal-correspondence></jhi-credit-proposal-correspondence>
          </div>
          <div [hidden]="selectedMenu !== 'TAB EXPOSURE'">
            <jhi-credit-proposal-tab-exposure></jhi-credit-proposal-tab-exposure>
          </div>-->
          <!--<div [hidden]="selectedMenu !== 'MANAGEMENT INFO'">
			<jhi-credit-proposal-management-info></jhi-credit-proposal-management-info>
		  </div>
		  <div [hidden]="selectedMenu !== 'BANK ACCOUNT ANALYSIS'">
			<jhi-credit-proposal-bank-account-analysis></jhi-credit-proposal-bank-account-analysis>
		  </div>
		  <div [hidden]="selectedMenu !== 'TAB REPAYMENT CAPABILITY'">
			<jhi-credit-proposal-tab-repayment-capability></jhi-credit-proposal-tab-repayment-capability>
		  </div>-->
        </div>
        <div style="display: flex; justify-content: center">
          <button class="button-info" (click)="onSave()">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>
