<div class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <div class="card-layout py-2">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">PROFORMA LAPORAN KEUANGAN</div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>

        <ejs-spreadsheet
          spreadsheet
          [showRibbon]="true"
          [allowResizing]="true"
          [showFormulaBar]="true"
          [allowOpen]="true"
          [allowSave]="true"
          [scrollSettings]="{ isFinite: true }"
          (created)="created()"
          [allowEditing]="false"
          [selectionSettings]="{ mode: 'None' }"
        >
          <e-sheets>
            <e-sheet name="Registration Form" [rowCount]="10" [colCount]="10" [showGridLines]="true">
              <e-rows>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell
                      [index]="0"
                      [rowSpan]="2"
                      value="Deskripsi"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                    <e-cell
                      [index]="1"
                      [colSpan]="2"
                      value="2020 (Performa)"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                    <e-cell
                      [index]="3"
                      [colSpan]="2"
                      value="2021 Performa"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell [index]="1" value="Amonnt" [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"></e-cell>
                    <e-cell [index]="2" value="Margin" [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"></e-cell>
                    <e-cell [index]="3" value="Amonnt" [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"></e-cell>
                    <e-cell [index]="4" value="Margin" [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell
                      [index]="0"
                      value="Total Sales"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell [index]="0" value="COGS" [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell
                      [index]="0"
                      value="Gross profit"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell
                      [index]="0"
                      value="SGA (Excl. Bank Liability)"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell [index]="0" value="EBIT" [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell
                      [index]="0"
                      value="Total Liabilities to Bank"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell [index]="0" value="EBT" [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"></e-cell>
                  </e-cells>
                </e-row>
              </e-rows>
              <e-columns>
                <e-column [index]="0" [width]="350"></e-column>
                <e-column [width]="90"></e-column>
                <e-column [width]="90"></e-column>
                <e-column [width]="90"></e-column>
                <e-column [width]="90"></e-column>
              </e-columns>
              <e-ranges>
                <e-range address="B3">
                  <ng-template>
                    <ejs-textbox placeholder="Name"></ejs-textbox>
                  </ng-template>
                </e-range>
              </e-ranges>
            </e-sheet>
          </e-sheets>
        </ejs-spreadsheet>
      </div>
    </div>
  </div>

  <!-- <div class="e-sample-resize-container e-card-resize-container"> -->
  <div class="row">

                <e-row [height]="35">
                  <e-cells>
                    <e-cell
                      [index]="0"
                      value="Account Payable"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell
                      [index]="0"
                      value="Accrued Expense"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell
                      [index]="0"
                      value="Depreciation"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell [index]="0" value="WC Needs" [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"></e-cell>
                  </e-cells>
                </e-row>
                <e-row [height]="35">
                  <e-cells>
                    <e-cell
                      [index]="0"
                      value="Plafond of WC"
                      [style]="{ fontSize: '12pt', fontWeight: 'bold', textAlign: 'center' }"
                    ></e-cell>
                  </e-cells>
                </e-row>
              </e-rows>
            </e-sheet>
          </e-sheets>
        </ejs-spreadsheet>
      </div>
    </div>
  </div>
  <!-- </div> -->
</div>
