<div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
        <ejs-menu [enableScrolling]="true" cssClass="e-rounded-menu e-custom-scroll" [items]="menuItems" (select)="selectMenuItem($event)"></ejs-menu>
        <div *ngIf="selectedMenu === 'TOTAL EXPOSURE'">
            <div class="card-layout row mb-3">
                <div class="e-card">
                    <div class="e-card-header">
                        <div class="e-card-header-caption">
                            <div class="e-card-header-title">EXPOSURE DEBTOR</div>
                            <div class="e-card-sub-title"></div>
                        </div>
                    </div>

                    <div class="e-card-content">
                        <ejs-grid allowTextWrap="true" #grid [dataSource]="_creditProposal.products" [allowPaging]="true" [pageSettings]="" gridLines="both">
                            <e-columns>
                                <e-column field="indexNum" headerText="No" textAlign="center"></e-column>
                                <e-column field="applicationNumber" headerText="Faciliti Detail" headerTextAlign="center" width="140" textAlign="left"></e-column>
                                <e-column field="attributes.availableLimit" headerText="Available Limit " headerTextAlign="center" width="140" textAlign="right"></e-column>

                                <e-column field="attributes.initialLimit" headerText="Initial Limit" headerTextAlign="center" width="140" textAlign="right"></e-column>

                                <e-column field="attributes.changes" headerText="Change" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="attributes.outstanding" headerText="O/S" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="credit" headerText="Credit Limit" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="attributes.rate" headerText="Interest Rate (%)" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="attributes.provitionFee" headerText="Provition (%)" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="attributes.adminFee" headerText="Admin Fee" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="frist" headerText="First Disburse" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="attributes.maturity" headerText="Maturity" headerTextAlign="center" width="140" textAlign="left"></e-column>
                            </e-columns>
                        </ejs-grid>
                        <div class="e-card-actions"></div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox field="initialLimit" placeholder="Sub Total Initial LImit" cssClass="e-outline" floatLabelType="Auto" [value]="init" readonly="true"></ejs-textbox>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="sub Total Change" cssClass="e-outline" floatLabelType="Auto" [value]="change" readonly="true"></ejs-textbox>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="SubTotal O/S" cssClass="e-outline" floatLabelType="Auto" [value]="os" readonly="true"></ejs-textbox>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="sub Total Credit Limit" cssClass="e-outline" floatLabelType="Auto" [value]="totalcredit" readonly="true"></ejs-textbox>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Sub Total Available Limit" cssClass="e-outline" floatLabelType="Auto" [value]="available" readonly="true"></ejs-textbox>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-layout row mb-3">
                <div class="e-card">
                    <div class="e-card-header">
                        <div class="e-card-header-caption">
                            <div class="e-card-header-title">EXPOSURE GROUP</div>
                            <div class="e-card-sub-title"></div>
                        </div>
                    </div>
                    <div class="e-card-content">
                        <ejs-grid allowTextWrap="true" #grid [dataSource]="" [allowPaging]="true" [pageSettings]="" gridLines="both">
                            <e-columns>
                                <e-column field="indexNum" headerText="No" textAlign="center"></e-column>
                                <e-column field="namegroup" headerText="Group name" headerTextAlign="center" width="140" textAlign="left"></e-column>
                                <e-column field="applicationNumber" headerText="Faciliti Detail" headerTextAlign="center" width="140" textAlign="left"></e-column>
                                <e-column field="cifnumber" headerText="Avilable Limit " headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="InitialLimit2" headerText="Initial Limit" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="Change" headerText="Change" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="OS" headerText="O/S" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="credit" headerText="Credit Limit" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="interet" headerText="Interest Rate (%)" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="Providion" headerText="Providion (%)" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="admin" headerText="Admin Fee" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="frist" headerText="Frist Disburse" headerTextAlign="center" width="140" textAlign="right"></e-column>
                                <e-column field="Maturity" headerText="Maturity" headerTextAlign="center" width="140" textAlign="left"></e-column>
                            </e-columns>
                        </ejs-grid>
                        <div class="e-card-actions"></div>

                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Sub Total Initial LImit" cssClass="e-outline" floatLabelType="Auto" [value]=""></ejs-textbox>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="sub Total Change" cssClass="e-outline" floatLabelType="Auto" [value]=""></ejs-textbox>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="SubTotal O/S" cssClass="e-outline" floatLabelType="Auto" [value]=""></ejs-textbox>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="sub Total Credit Limit" cssClass="e-outline" floatLabelType="Auto" [value]=""></ejs-textbox>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Sub Total Avilable Limit" cssClass="e-outline" floatLabelType="Auto" [value]=""></ejs-textbox>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-layout row mb-5">
                <div class="e-card">
                    <div class="e-card-header">
                        <div class="e-card-header-caption">
                            <div class="e-card-header-title">TOTAL EXPOSURE</div>
                            <div class="e-card-sub-title"></div>
                        </div>
                    </div>
                    <div class="e-card-content">
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Total Debtitur Cash Loan" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Total Exposure Initial Limit" cssClass="e-outline" floatLabelType="Auto" [value]="totallimt"></ejs-textbox>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Total Debitur Non cash Loan" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="sub Total exposure Change" cssClass="e-outline" floatLabelType="Auto" [value]="totalchange"></ejs-textbox>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Total Group Cash Loan" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                                </div>
                            </div>
                            <div class="col -6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Total exposure O/S" cssClass="e-outline" floatLabelType="Auto" [value]="totalos"></ejs-textbox>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Total Group cash Loan" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Total Exposure Credit Limit" cssClass="e-outline" floatLabelType="Auto" [value]="totalcredit"></ejs-textbox>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Grand Total Debtor" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Grand Total Group" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div *ngIf="selectedMenu === 'INDUSTRY LIMIT EXPOSURE'">
            <div class="card-layout row mb-5">
                <div class="e-card">
                    <div class="e-card-header">
                        <div class="e-card-header-caption">
                            <div class="e-card-header-title">INDUSTRY LIMIT EXPOSURE</div>
                            <div class="e-card-sub-title"></div>
                        </div>
                    </div>
                    <div class="e-card-content" disabled>
                        <div class="row">
                            <div class="col-6">
                                <div class="" disabled>
                                    <ejs-datepicker cssClass="e-outline" placeholder="Date As Of" floatLabelType="auto" disabled></ejs-datepicker>
                                </div>
                                <div class="form-group">
                                    <ejs-textbox placeholder="Industry Limit Exposure" cssClass="e-outline" floatLabelType="Auto" disabled> </ejs-textbox>
                                </div>
                                <div class="form-group">
                                    <ejs-textbox placeholder="Limit in % from total O/S loan" cssClass="e-outline" floatLabelType="Auto" disabled>
                                    </ejs-textbox>
                                </div>
                                <div class="form-group">
                                    <ejs-textbox placeholder="Limit in IDR MIO" cssClass="e-outline" floatLabelType="Auto" [value]="totallimt" disabled></ejs-textbox>
                                </div>
                                <div class="form-group">
                                    <ejs-textbox placeholder="Remaining Balance" cssClass="e-outline" floatLabelType="Auto" disabled></ejs-textbox>
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Proposed Amount" cssClass="e-outline" floatLabelType="Auto" [value]="totalchange" disabled></ejs-textbox>
                                </div>
                                <div class="form-group">
                                    <ejs-textbox placeholder="Remaining Balance after this Proposal" cssClass="e-outline" floatLabelType="Auto" disabled></ejs-textbox>
                                </div>
                                <div class="form-group">
                                    <ejs-textbox placeholder="Status" cssClass="e-outline" floatLabelType="Auto" [value]="totalos" disabled></ejs-textbox>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div *ngIf="selectedMenu === 'LEGAL LENDING LIMIT'">
            <div class="card-layout row mb-5">
                <div class="e-card">
                    <div class="e-card-header">
                        <div class="e-card-header-caption">
                            <div class="e-card-header-title">LEGAL LENDING LIMIT</div>
                            <div class="e-card-sub-title"></div>
                        </div>
                    </div>
                    <div class="e-card-content">
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <!-- <ejs-textbox dataSource="data" cssClass="e-outline" floatLabelType="Auto" disabled> </ejs-textbox> -->
                                    <ejs-combobox placeholder="Legal Lending Limit" id="comboelement" #samples [dataSource]="data" [autofill]="true" cssClass="e-outline" [placeholder]="text"></ejs-combobox>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <!-- <ejs-textbox placeholder="Base Lending Rate (IDR)" cssClass="e-outline" floatLabelType="Auto" disabled></ejs-textbox> -->
                                </div>
                            </div>

                            <div class="col-6">
                                <div class="form-group">
                                    <ejs-textbox placeholder="Total Exposure (Debtor & Group)" cssClass="e-outline" floatLabelType="Auto" [value]="totallimt" disabled></ejs-textbox>
                                </div>
                                <div class="form-group">
                                    <ejs-textbox placeholder="Buffer" cssClass="e-outline" floatLabelType="Auto" disabled></ejs-textbox>
                                </div>
                                <div class="form-group">
                                    <ejs-textbox placeholder="Status" cssClass="e-outline" floatLabelType="Auto" [value]="totalchange" disabled></ejs-textbox>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="col -6">
                                    <div class="form-group">
                                        <!-- <ejs-textbox
                      placeholder="Base Lending Rate USD"
                      cssClass="e-outline"
                      floatLabelType="Auto"
                      [value]="totalos"
                      disabled
                    ></ejs-textbox> -->
                                    </div>
                                    <div class="form-group">
                                        <!-- <ejs-textbox
                      placeholder="Exchange Rate (USD to IDR)"
                      cssClass="e-outline"
                      floatLabelType="Auto"
                      [value]="totalos"
                      disabled
                    ></ejs-textbox> -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
