<div class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <div class="card-layout row mb-3">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">EXPOSURE DEBTOR</div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <div class="e-card-content">
          <ejs-grid
            allowTextWrap="true"
            #grid
            [dataSource]="_creditProposal.products"
            [allowPaging]="true"
            [pageSettings]=""
            gridLines="both"
          >
            <e-columns>
              <e-column field="indexNum" headerText="No" textAlign="center"></e-column>
              <e-column
                field="applicationNumber"
                headerText="Faciliti Detail"
                headerTextAlign="center"
                width="140"
                textAlign="left"
              ></e-column>
              <e-column
                field="attributes.availableLimit"
                headerText="Available Limit "
                headerTextAlign="center"
                width="140"
                textAlign="right"
              ></e-column>

              <e-column
                field="attributes.initialLimit"
                headerText="Initial Limit"
                headerTextAlign="center"
                width="140"
                textAlign="right"
              ></e-column>

              <e-column field="attributes.changes" headerText="Change" headerTextAlign="center" width="140" textAlign="right"></e-column>
              <e-column field="attributes.outstanding" headerText="O/S" headerTextAlign="center" width="140" textAlign="right"></e-column>
              <e-column field="credit" headerText="Credit Limit" headerTextAlign="center" width="140" textAlign="right"> </e-column>
              <e-column
                field="attributes.rate"
                headerText="Interest Rate (%)"
                headerTextAlign="center"
                width="140"
                textAlign="right"
              ></e-column>
              <e-column
                field="attributes.provitionFee"
                headerText="Provition (%)"
                headerTextAlign="center"
                width="140"
                textAlign="right"
              ></e-column>
              <e-column
                field="attributes.adminFee"
                headerText="Admin Fee"
                headerTextAlign="center"
                width="140"
                textAlign="right"
              ></e-column>
              <e-column field="frist" headerText="First Disburse" headerTextAlign="center" width="140" textAlign="right"></e-column>
              <e-column field="attributes.maturity" headerText="Maturity" headerTextAlign="center" width="140" textAlign="left"></e-column>
            </e-columns>
          </ejs-grid>
          <div class="e-card-actions"></div>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  field="initialLimit"
                  placeholder="Sub Total Initial LImit"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="init"
                  readonly="true"
                ></ejs-numerictextbox>
              </div>
            </div>
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="sub Total Change"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="change"
                  readonly="true"
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="SubTotal O/S"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="os"
                  readonly="true"
                ></ejs-numerictextbox>
              </div>
            </div>
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="sub Total Credit Limit"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="totalcredit"
                  readonly="true"
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="Sub Total Available Limit"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="available"
                  readonly="true"
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-layout row mb-3">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">EXPOSURE GROUP</div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <div class="e-card-content">
          <ejs-grid allowTextWrap="true" #grid [dataSource]="" [allowPaging]="true" [pageSettings]="" gridLines="both">
            <e-columns>
              <e-column field="indexNum" headerText="No" textAlign="center"></e-column>
              <e-column field="namegroup" headerText="Group name" headerTextAlign="center" width="140" textAlign="left"> </e-column>
              <e-column
                field="applicationNumber"
                headerText="Faciliti Detail"
                headerTextAlign="center"
                width="140"
                textAlign="left"
              ></e-column>
              <e-column field="cifnumber" headerText="Avilable Limit " headerTextAlign="center" width="140" textAlign="right"></e-column>
              <e-column field="InitialLimit2" headerText="Initial Limit" headerTextAlign="center" width="140" textAlign="right"></e-column>
              <e-column field="Change" headerText="Change" headerTextAlign="center" width="140" textAlign="right"> </e-column>
              <e-column field="OS" headerText="O/S" headerTextAlign="center" width="140" textAlign="right"></e-column>
              <e-column field="credit" headerText="Credit Limit" headerTextAlign="center" width="140" textAlign="right"> </e-column>
              <e-column field="interet" headerText="Interest Rate (%)" headerTextAlign="center" width="140" textAlign="right"></e-column>
              <e-column field="Providion" headerText="Providion (%)" headerTextAlign="center" width="140" textAlign="right"></e-column>
              <e-column field="admin" headerText="Admin Fee" headerTextAlign="center" width="140" textAlign="right"> </e-column>
              <e-column field="frist" headerText="Frist Disburse" headerTextAlign="center" width="140" textAlign="right"></e-column>
              <e-column field="Maturity" headerText="Maturity" headerTextAlign="center" width="140" textAlign="left"> </e-column>
            </e-columns>
          </ejs-grid>
          <div class="e-card-actions"></div>

          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="Sub Total Initial LImit"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="100000"
                ></ejs-numerictextbox>
              </div>
            </div>
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="sub Total Change"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="3000000"
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="SubTotal O/S"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]=""
                ></ejs-numerictextbox>
              </div>
            </div>
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="sub Total Credit Limit"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]=""
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="Sub Total Avilable Limit"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]=""
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-layout row mb-5">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">TOTAL EXPOSURE</div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <div class="e-card-content">
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox placeholder="Total Debtitur Cash Loan" cssClass="e-outline" floatLabelType="Auto" format="0," min="0">
                </ejs-numerictextbox>
              </div>
            </div>

            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="Total Exposure Initial Limit"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="totallimt"
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="Total Debitur Non cash Loan"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                >
                </ejs-numerictextbox>
              </div>
            </div>
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="sub Total exposure Change"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="totalchange"
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox placeholder="Total Group Cash Loan" cssClass="e-outline" floatLabelType="Auto" format="0," min="0">
                </ejs-numerictextbox>
              </div>
            </div>
            <div class="col -6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="Total exposure O/S"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="totalos"
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox placeholder="Total Group cash Loan" cssClass="e-outline" floatLabelType="Auto" format="0," min="0">
                </ejs-numerictextbox>
              </div>
            </div>
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="Total Exposure Credit Limit"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                  [value]="totalcredit"
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="Grand Total Debtor"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                ></ejs-numerictextbox>
              </div>
            </div>
            <div class="col-6">
              <div class="form-group">
                <ejs-numerictextbox
                  placeholder="Grand Total Group"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                  format="0,"
                  min="0"
                ></ejs-numerictextbox>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
