<div class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <ejs-menu
      [enableScrolling]="true"
      cssClass="e-rounded-menu e-custom-scroll"
      [items]="menuItems"
      (select)="selectMenuItem($event)"
    ></ejs-menu>
    <div *ngIf="selectedMenu === 'TOTAL EXPOSURE'">
      <div class="card-layout row mb-3">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">EXPOSURE DEPTOR</div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>

          <div class="e-card-content">
            <ejs-grid
              allowTextWrap="true"
              #grid
              [dataSource]="_creditProposal.products"
              [allowPaging]="true"
              [pageSettings]=""
              gridLines="both"
            >
              <e-columns>
                <e-column field="indexNum" headerText="No" textAlign="center"></e-column>
                <e-column
                  field="applicationNumber"
                  headerText="Faciliti Detail"
                  headerTextAlign="center"
                  width="140"
                  textAlign="left"
                ></e-column>
                <e-column
                  field="attributes.availableLimit"
                  headerText="Available Limit "
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                ></e-column>
                <e-column
                  field="attributes.initialLimit"
                  headerText="Initial Limit"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column
                  field="attributes.changes"
                  headerText="Change"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column
                  field="attributes.outstanding"
                  headerText="O/S"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column
                  field="credit"
                  headerText="Credit Limit"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column
                  field="attributes.rate"
                  headerText="Interest Rate (%)"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                ></e-column>
                <e-column
                  field="attributes.provitionFee"
                  headerText="Provition (%)"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                ></e-column>
                <e-column
                  field="attributes.adminFee"
                  headerText="Admin Fee"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column
                  field="frist"
                  headerText="First Disburse"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column
                  field="attributes.maturity"
                  headerText="Maturity"
                  headerTextAlign="center"
                  width="140"
                  textAlign="left"
                ></e-column>
              </e-columns>
            </ejs-grid>
            <div class="e-card-actions"></div>
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    field="initialLimit"
                    placeholder="Sub Total Initial LImit"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="init"
                    format="IDR 0,"
                    min="0"
                    readonly="true"
                  ></ejs-numerictextbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="sub Total Change"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="change"
                    format="IDR 0,"
                    min="0"
                    readonly="true"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="SubTotal O/S"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="os"
                    format="IDR 0,"
                    min="0"
                    readonly="true"
                  ></ejs-numerictextbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="sub Total Credit Limit"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="totalcredit"
                    format="IDR 0,"
                    min="0"
                    readonly="true"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Sub Total Available Limit"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="available"
                    format="IDR 0,"
                    min="0"
                    readonly="true"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card-layout row mb-3">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">EXPOSURE GROUP</div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <ejs-grid allowTextWrap="true" #grid [dataSource]="" [allowPaging]="true" [pageSettings]="" gridLines="both">
              <e-columns>
                <e-column field="indexNum" headerText="No" textAlign="center"></e-column>
                <e-column field="namegroup" headerText="Group name" headerTextAlign="center" width="140" textAlign="left"></e-column>
                <e-column
                  field="applicationNumber"
                  headerText="Faciliti Detail"
                  headerTextAlign="center"
                  width="140"
                  textAlign="left"
                ></e-column>
                <e-column field="cifnumber" headerText="Avilable Limit " headerTextAlign="center" width="140" textAlign="right"></e-column>
                <e-column
                  field="InitialLimit2"
                  headerText="Initial Limit"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column
                  field="Change"
                  headerText="Change"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                >
                </e-column>
                <e-column
                  field="OS"
                  headerText="O/S"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column
                  field="credit"
                  headerText="Credit Limit"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column field="interet" headerText="Interest Rate (%)" headerTextAlign="center" width="140" textAlign="right"></e-column>
                <e-column field="Providion" headerText="Providion (%)" headerTextAlign="center" width="140" textAlign="right"></e-column>
                <e-column
                  field="admin"
                  headerText="Admin Fee"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                >
                </e-column>
                <e-column
                  field="frist"
                  headerText="Frist Disburse"
                  headerTextAlign="center"
                  width="140"
                  textAlign="right"
                  [format]="numericFormatOptions"
                ></e-column>
                <e-column field="Maturity" headerText="Maturity" headerTextAlign="center" width="140" textAlign="left"> </e-column>
              </e-columns>
            </ejs-grid>
            <div class="e-card-actions"></div>

            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Sub Total Initial LImit"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]=""
                    format="IDR 0,"
                    min="0"
                  ></ejs-numerictextbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="sub Total Change"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]=""
                    format="IDR 0,"
                    min="0"
                  >
                  </ejs-numerictextbox>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="SubTotal O/S"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]=""
                    format="IDR 0,"
                    min="0"
                  >
                  </ejs-numerictextbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="sub Total Credit Limit"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]=""
                    format="IDR 0,"
                    min="0"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Sub Total Avilable Limit"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]=""
                    format="IDR 0,"
                    min="0"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card-layout row mb-5">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">TOTAL EXPOSURE</div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Total Debtitur Cash Loan"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    format="IDR 0,"
                    min="0"
                  >
                  </ejs-numerictextbox>
                </div>
              </div>

              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Total Exposure Initial Limit"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="totallimt"
                    format="IDR 0,"
                    min="0"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Total Debitur Non cash Loan"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    format="IDR 0,"
                    min="0"
                  >
                  </ejs-numerictextbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="sub Total exposure Change"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="totalchange"
                    format="IDR 0,"
                    min="0"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Total Group Cash Loan"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    format="IDR 0,"
                    min="0"
                  >
                  </ejs-numerictextbox>
                </div>
              </div>
              <div class="col -6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Total exposure O/S"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="totalos"
                    format="IDR 0,"
                    min="0"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Total Group cash Loan"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    format="IDR 0,"
                    min="0"
                  >
                  </ejs-numerictextbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Total Exposure Credit Limit"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="totalcredit"
                    format="IDR 0,"
                    min="0"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox placeholder="Grand Total Debtor" cssClass="e-outline" floatLabelType="Auto" format="IDR 0," min="0">
                  </ejs-numerictextbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-group">
                  <ejs-numerictextbox
                    placeholder="Grand Total Group"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    format="IDR 0,"
                    min="0"
                  ></ejs-numerictextbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="selectedMenu === 'INDUSTRY LIMIT EXPOSURE'">
      <div class="card-layout row mb-5">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">INDUSTRY LIMIT EXPOSURE</div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content" disabled>
            <div class="row">
              <div class="col-6">
                <div class="" disabled>
                  <ejs-datepicker cssClass="e-outline" placeholder="Date AS" floatLabelType="auto" disabled> </ejs-datepicker>
                </div>
                <div class="form-group">
                  <ejs-textbox placeholder="Limit in % from total O/S loan" cssClass="e-outline" floatLabelType="Auto" disabled>
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    placeholder="Limit in IDR MIO"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="totallimt"
                    disabled
                  ></ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox placeholder="Remaining Ballance" cssClass="e-outline" floatLabelType="Auto" disabled> </ejs-textbox>
                </div>
              </div>

              <div class="col-6">
                <div class="form-group">
                  <ejs-textbox
                    placeholder="Purpose ammount"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="totalchange"
                    disabled
                  ></ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    placeholder="Remaining Balance other tis proposal"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    disabled
                  ></ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox placeholder="Status" cssClass="e-outline" floatLabelType="Auto" [value]="totalos" disabled></ejs-textbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="selectedMenu === 'LEGAL LANDING LIMIT'">
      <div class="card-layout row mb-5">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">LEGAL LANDING LIMIT</div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <ejs-textbox placeholder="Legal Landing Limit (25%)" cssClass="e-outline" floatLabelType="Auto" disabled> </ejs-textbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-group">
                  <ejs-textbox placeholder="Base Landing Rate (IDR)" cssClass="e-outline" floatLabelType="Auto" disabled></ejs-textbox>
                </div>
              </div>

              <div class="col-6">
                <div class="form-group">
                  <ejs-textbox
                    placeholder="Total Exposure (Deptor & Group)"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [value]="totallimt"
                    disabled
                  ></ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox placeholder="Buffer" cssClass="e-outline" floatLabelType="Auto" disabled></ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox placeholder="Status" cssClass="e-outline" floatLabelType="Auto" [value]="totalchange" disabled></ejs-textbox>
                </div>
              </div>
              <div class="col-6">
                <div class="col -6">
                  <div class="form-group">
                    <ejs-textbox
                      placeholder="Exchange Rate (USD to IDR)"
                      cssClass="e-outline"
                      floatLabelType="Auto"
                      [value]="totalos"
                      disabled
                    ></ejs-textbox>
                  </div>
                  <div class="form-group">
                    <ejs-textbox
                      placeholder="Base Landing Rate USD"
                      cssClass="e-outline"
                      floatLabelType="Auto"
                      [value]="totalos"
                      disabled
                    ></ejs-textbox>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
