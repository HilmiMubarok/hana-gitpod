<div class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <div class="e-card">
      <div class="e-card-content">
        <ng-container [ngSwitch]="mode">
          <ng-container *ngSwitchCase="'view'">
            <div class="row">
              <div class="col-md-6">
                <!--LEFT SIDE -->
                <div class="form-group mb-5">
                  <p>Customer Type</p>
                  <ejs-radiobutton
                    required
                    disabled
                    [(ngModel)]="deptorData.partyTypeId"
                    [value]="'PERSON'"
                    name="payment"
                    label="Individu"
                    name="default"
                  ></ejs-radiobutton>
                  <ejs-radiobutton
                    required
                    disabled
                    [(ngModel)]="deptorData.partyTypeId"
                    [value]="'CORPORATE'"
                    name="payment"
                    label="Corporate"
                    name="default"
                  ></ejs-radiobutton>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    required
                    disabled
                    [value]="deptorData.cif.customerId"
                    name="CIF Number"
                    id="cifNumber"
                    placeholder="CIF Number"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>

                <div class="form-group">
                  <ejs-textbox
                    required
                    disabled
                    [value]="item.firstName"
                    name="completeName"
                    id="completeName"
                    placeholder="Complete Name"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="item.aliasName"
                    name="aliasName"
                    id="aliasName"
                    placeholder="Alias Name"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>

                <div class="form-group">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="item.personalIdNumber"
                    name="idCardNumber"
                    id="idCardNumber"
                    placeholder="ID Card Number"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-datepicker
                    required
                    disabled
                    [(ngModel)]="item.thruDate"
                    cssClass="e-outline"
                    placeholder="ID Expire Date"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-datepicker>
                </div>
                <div class="form-group">
                  <ejs-datepicker
                    required
                    disabled
                    cssClass="e-outline"
                    [(ngModel)]="item.dob"
                    placeholder="Date Of Birth"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-datepicker>
                </div>

                <div class="form-group">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="item.pob"
                    name="placeOfBirth"
                    id="placeOfBirth"
                    placeholder="Place of Birth"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="row">
                  <div class="col-5">
                    <div class="form-group">
                      <ejs-textbox required disabled [(ngModel)]="item.age" placeholder="Age" cssClass="e-outline" floatLabelType="Auto">
                      </ejs-textbox>
                    </div>
                  </div>
                  <div class="col-7">
                    <div class="form-group">
                      <ejs-textbox required disabled placeholder="Month" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>
                </div>

                <div class="form-group">
                  <ejs-dropdownlist
                    required
                    disabled
                    class="mb-2 mt-2"
                    [(ngModel)]="item.maritalStatus"
                    placeholder="Marital Status"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
              </div>
              <div class="col-6">
                <!-- RIGHT SIDE -->

                <div class="form-group">
                  <ejs-dropdownlist
                    required
                    disabled
                    class="mb-2 mt-2"
                    [(ngModel)]="item.gender"
                    name="gender"
                    [value]="item.id"
                    placeholder="Gender"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="item.mothersName"
                    placeholder="Mother Maiden Name"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="item.personalEmail"
                    name="email"
                    id="email"
                    placeholder="Email"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>

                <div class="form-group">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="item.taxIdNumber"
                    placeholder="NPWP"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <ejs-textbox
                        required
                        disabled
                        [(ngModel)]="item.cellPhone1"
                        placeholder="Handphone Number 1"
                        cssClass="e-outline"
                        floatLabelType="Auto"
                      >
                      </ejs-textbox>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <ejs-textbox
                        required
                        disabled
                        [(ngModel)]="item.cellPhone2"
                        placeholder="Handphone Number 2"
                        cssClass="e-outline"
                        floatLabelType="Auto"
                      >
                      </ejs-textbox>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <ejs-textbox
                        required
                        disabled
                        [(ngModel)]="item.cellPhone3"
                        placeholder="Handphone Number 3"
                        cssClass="e-outline"
                        floatLabelType="Auto"
                      >
                      </ejs-textbox>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-6">
                      <div class="form-group">
                        <ejs-textbox
                          required
                          disabled
                          [multiline]="true"
                          [value]="item.createdDate | formatMediumDate"
                          placeholder="Existing Customer Since"
                          cssClass="e-outline"
                          floatLabelType="Auto"
                        >
                        </ejs-textbox>
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="form-group">
                        <ejs-textbox
                          required
                          disabled
                          [multiline]="true"
                          [value]="item.createdDate | formatMediumDate"
                          placeholder="Existing Debtor Since"
                          cssClass="e-outline"
                          floatLabelType="Auto"
                        >
                        </ejs-textbox>
                      </div>
                    </div>
                  </div>
                  <div class="form-group">
                    <ejs-textbox
                      required
                      disabled
                      [(ngModel)]="item.abbreviation"
                      placeholder="Account Number (IDR)"
                      cssClass="e-outline"
                      floatLabelType="Auto"
                    >
                    </ejs-textbox>
                  </div>
                  <div class="form-group">
                    <ejs-textbox
                      required
                      disabled
                      [(ngModel)]="item.creditRating"
                      placeholder="Credit Scoring"
                      cssClass="e-outline"
                      floatLabelType="Auto"
                    >
                    </ejs-textbox>
                  </div>
                </div>
              </div>
            </div>
            <hr />
            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <p>Customer Status</p>
                  <ejs-radiobutton
                    [(ngModel)]="deptorData.attributes['basicInformation'].customerStatus"
                    [value]="'New'"
                    name="customer"
                    label="New"
                  ></ejs-radiobutton>
                  <ejs-radiobutton
                    [(ngModel)]="deptorData.attributes['basicInformation'].customerStatus"
                    [value]="'Existing'"
                    name="customer"
                    label="Exsiting"
                  ></ejs-radiobutton>
                </div>
                <div class="form-group">
                  <ejs-textbox [(ngModel)]="item.depositCapital" placeholder="Modal Disetor" cssClass="e-outline" floatLabelType="Auto">
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox [(ngModel)]="item.annualSales" placeholder="Penjualan Tahunan" cssClass="e-outline" floatLabelType="Auto">
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist
                    class="mb-2 mt-2"
                    [dataSource]="collectabilityStatusData"
                    [(ngModel)]="item.collectabilityStatus"
                    placeholder="Collectability Status"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group">
                  <ejs-dropdownlist
                    class="mb-2 mt-2"
                    [(ngModel)]="deptorData.attributes['basicInformation'].categoryDebitur"
                    [dataSource]="categoryDebitur"
                    placeholder="Category Debitur"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist
                    [dataSource]="ifcRiskCategoryData"
                    [(ngModel)]="item.ifcRiskCategory"
                    placeholder="IFC & Risk Category"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist
                    [dataSource]="umkm"
                    [(ngModel)]="deptorData.attributes['basicInformation'].umkm"
                    placeholder="Klasifikiasi UMKM"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-dropdownlist>
                </div>
              </div>
            </div>
          </ng-container>
        </ng-container>
      </div>
      <div class="e-card-actions"></div>
    </div>
  </div>
</div>
<!-- text -->
