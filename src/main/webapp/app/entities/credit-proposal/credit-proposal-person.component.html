<div class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <div class="e-card">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <div class="e-card-header-title"></div>
          <div class="e-card-sub-title"></div>
        </div>
      </div>
      <ng-container [ngSwitch]="mode">
        <ng-container *ngSwitchCase="'view'">
          <div class="e-card-content">
            <div class="form-space">
              <div class="row my-3">
                <div class="col-2">
                  <!-- <div class="form-space"> -->
                  <div color="#A3A3A3" class="e-headertext">Customer Type</div>
                </div>
                <div class="col-2">
                  <ejs-radiobutton
                    disabled
                    label="Individu"
                    [(ngModel)]="deptorData.partyTypeId"
                    [value]="'PERSON'"
                    checked="true"
                  ></ejs-radiobutton>
                  <!-- </div> -->
                </div>
                <div class="col-2">
                  <ejs-radiobutton disabled label="Corporate" [(ngModel)]="deptorData.partyTypeId" [value]="'CORPORATE'"> </ejs-radiobutton>
                  <!-- </div> -->
                </div>
                <div class="col-6">
                  <ejs-dropdownlist
                    disabled
                    class="mb-2 mt-2"
                    [(ngModel)]="item.gender"
                    name="gender"
                    [value]="item.id"
                    placeholder="Gender"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-dropdownlist>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    disabled
                    [value]="deptorData.cif.customerId"
                    name="CIF Number"
                    id="cifNumber"
                    placeholder="CIF Number"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.mothersName"
                    placeholder="Mother Maiden Name"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    disabled
                    [value]="item.firstName"
                    name="completeName"
                    id="completeName"
                    placeholder="Complete Name"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.personalEmail"
                    name="email"
                    id="email"
                    placeholder="Email"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.aliasName"
                    name="aliasName"
                    id="aliasName"
                    placeholder="Alias Name"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox disabled [(ngModel)]="item.taxIdNumber" placeholder="NPWP" cssClass="e-outline" floatLabelType="Auto">
                  </ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    [(ngModel)]="deptorData.debtorData.relationWithHana"
                    placeHolder="Relations with keb Hana Bank"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.cellPhone1"
                    placeholder="Handphone Number 1"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    [(ngModel)]="deptorData.attributes['basicInformation'].pic"
                    disabled
                    name="pic"
                    id="pic"
                    placeholder="PIC"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.cellPhone2"
                    placeholder="Handphone Number 2"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.personalIdNumber"
                    name="idCardNumber"
                    id="idCardNumber"
                    placeholder="ID Card Number"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.cellPhone3"
                    placeholder="Handphone Number 3"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-datepicker
                    disabled
                    [(ngModel)]="item.thruDate"
                    cssClass="e-outline"
                    placeholder="ID Expire Date"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-datepicker>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.pob"
                    name="placeOfBirth"
                    id="placeOfBirth"
                    placeholder="Place of Birth"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-datepicker
                    disabled
                    cssClass="e-outline"
                    [(ngModel)]="item.dob"
                    placeholder="Date Of Birth"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-datepicker>
                </div>
                <div class="col">
                  <div class="col-6">
                    <ejs-textbox
                      [(ngModel)]="deptorData.attributes['basicInformation'].fax"
                      disabled
                      placeholder="FAX"
                      cssClass="e-outline"
                      floatLabelType="Auto"
                    >
                    </ejs-textbox>
                  </div>
                </div>
              </div>
              <div class="row my-3">
                <div class="col-2">
                  <ejs-textbox disabled [(ngModel)]="item.age" placeholder="Age" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="col-4">
                  <ejs-textbox disabled placeholder="Month" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="col-3">
                  <ejs-textbox
                    disabled
                    [multiline]="true"
                    [value]="item.createdDate | formatMediumDate"
                    placeholder="Existing Customer Since"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col-3">
                  <ejs-textbox disabled placeholder="Year" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col-6">
                  <ejs-dropdownlist
                    disabled
                    class="mb-2 mt-2"
                    [(ngModel)]="item.maritalStatus"
                    placeholder="Marital Status"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
                <div class="col-3">
                  <ejs-textbox
                    disabled
                    [multiline]="true"
                    [value]="item.createdDate | formatMediumDate"
                    placeholder="Existing Debtor Since"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col-3">
                  <ejs-textbox disabled placeholder="Year" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col-6">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="deptorData.attributes['basicInformation'].lineOfBusiness"
                    placeholder="Line of Business"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="deptorData.attributes['basicInformation'].accountNummbUsd"
                    placeholder="Account Number (USD)"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="deptorData.attributes['basicInformation'].codeLbu"
                    placeholder="Kode LBU"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.abbreviation"
                    placeholder="Account Number (IDR)"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="deptorData.attributes['basicInformation'].lbuRemark"
                    placeholder="LBU Remark"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [multiline]="true"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="item.creditRating"
                    placeholder="Credit Scoring"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>

              <div class="row my-3">
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="deptorData.attributes['basicInformation'].sidCode"
                    placeholder="SID Code"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="col">
                  <ejs-textbox
                    disabled
                    [(ngModel)]="deptorData.attributes['basicInformation'].sid"
                    placeholder="SID"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
              </div>
              <hr />

              <div class="row my-3">
                <div class="col-2">
                  <!-- <div class="form-space"> -->
                  <div color="#A3A3A3" class="e-headertext">Customer Status</div>
                </div>
                <div class="col-2">
                  <ejs-radiobutton
                    [(ngModel)]="deptorData.attributes['basicInformation'].customerStatus"
                    [value]="'New'"
                    name="customer"
                    label="New"
                  ></ejs-radiobutton>
                  <!-- </div> -->
                </div>
                <div class="col-2">
                  <ejs-radiobutton
                    [(ngModel)]="deptorData.attributes['basicInformation'].customerStatus"
                    [value]="'Existing'"
                    name="customer"
                    label="Existing"
                  ></ejs-radiobutton>
                  <!-- </div> -->
                </div>
                <div class="col-6">
                  <ejs-dropdownlist
                    class="mb-2 mt-2"
                    [(ngModel)]="deptorData.attributes['basicInformation'].categoryDebitur"
                    [dataSource]="categoryDebitur"
                    placeholder="Category Debitur"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    disabled
                  ></ejs-dropdownlist>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-numerictextbox
                    [(ngModel)]="deptorData.attributes['basicInformation'].annualSales"
                    placeholder="Penjualan Tahunan"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    format="IDR 0,"
                    min="0"
                    disabled
                  >
                  </ejs-numerictextbox>
                </div>
                <div class="col">
                  <ejs-dropdownlist
                    [dataSource]="ifcRiskCategoryData"
                    [(ngModel)]="deptorData.attributes['basicInformation'].ifcRiskCategory"
                    placeholder="IFC & Risk Category"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    disabled
                  >
                  </ejs-dropdownlist>
                </div>
              </div>
              <div class="row my-3">
                <div class="col">
                  <ejs-dropdownlist
                    [dataSource]="collectabilityStatusData"
                    [(ngModel)]="deptorData.attributes['basicInformation'].collectabilityStatus"
                    placeholder="Collectability Status"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-dropdownlist>
                </div>
                <div class="col">
                  <ejs-dropdownlist
                    [dataSource]="umkm"
                    [(ngModel)]="deptorData.attributes['basicInformation'].umkm"
                    placeholder="Klasifikiasi UMKM"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    disabled
                  >
                  </ejs-dropdownlist>
                </div>
              </div>
              <div class="row my-3">
                <div class="col-6">
                  <ejs-dropdownlist
                    [dataSource]="report"
                    [(ngModel)]="deptorData.attributes['basicInformation'].report"
                    placeholder="Call Report Category"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-dropdownlist>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
      </ng-container>
    </div>
    <div class="e-card-actions"></div>
  </div>
</div>
