<h2 mat-dialog-title class="header-title"></h2>
<mat-dialog-content>
  <div class="form-group">
    <div class="col">
      <div class="mb-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Covenant</mat-label>
          <input matInput type="text" [(ngModel)]="otherCovenant.covenant" [disabled]="view" />
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="form-group">
    <div class="col">
      <div class="mb-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Status</mat-label>
          <input matInput type="text" [(ngModel)]="otherCovenant.status" [disabled]="view" />
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="form-group">
    <div class="col">
      <div class="mb-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Deviation</mat-label>
          <input matInput type="text" [(ngModel)]="otherCovenant.deviation" [disabled]="view" />
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="form-group">
    <div class="col">
      <div class="mb-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Justification</mat-label>
          <input matInput type="text" [(ngModel)]="otherCovenant.justification" [disabled]="view" />
        </mat-form-field>
      </div>
    </div>
  </div>
  <mat-dialog-actions align="center">
    <button mat-button *ngIf="!view" (click)="save()">Save</button>
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
</mat-dialog-content>
