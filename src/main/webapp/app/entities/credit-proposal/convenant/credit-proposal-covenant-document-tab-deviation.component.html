<div class="e-sample-resize-container e-card-resize-container mb-5">
  <div class="row">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">Deviation</div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <ejs-grid [dataSource]="standardDataGrid" allowTextWrap="true">
          <e-columns>
            <e-column field="covenant" headerText="Normal Condition" width="200" textAlign="left" headerTextAlign="center"></e-column>
            <e-column field="deviation" headerText="Deviation" width="100" textAlign="center">
              <ng-template #template let-data>
                <ejs-textbox (keyup)="onKeyUpEvent()" [(ngModel)]="data.deviation" cssClass="e-outline"> </ejs-textbox>
              </ng-template>
            </e-column>
            <e-column field="justification" headerText="Justification" width="100" textAlign="center">
              <ng-template #template let-data>
                <ejs-textbox (keyup)="onKeyUpEvent()" [(ngModel)]="data.justification" cssClass="e-outline"> </ejs-textbox>
              </ng-template>
            </e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
  </div>
</div>

<div class="e-sample-resize-container e-card-resize-container mb-5">
  <div class="row">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">Other Deviation</div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <ejs-grid allowPaging="true" [dataSource]="dataGridOtherDeviation">
          <e-columns>
            <e-column field="id" headerText="No" width="50" textAlign="center"></e-column>
            <e-column field="otherCondition" headerText="Normal Condition" width="200" textAlign="center"></e-column>
            <e-column field="otherDeviation" headerText="Deviation" width="100" textAlign="center"></e-column>
            <e-column field="otherJustification" headerText="Justification" width="100" textAlign="center"></e-column>
            <e-column headerText="Action" width="100" headerTextAlign="center" textAlign="center">
              <ng-template #template let-data>
                <div class="d-flex justify-content-around">
                  <button (click)="deleteData(data.id)" class="e-icons e-delete"></button>
                </div>
              </ng-template>
            </e-column>
          </e-columns>
        </ejs-grid>
        <div class="d-flex justify-content-end">
          <button ejs-button content="ADD" (click)="onDetail()" class="btn-info" style="margin: 10px"></button>
        </div>
      </div>
    </div>
    <ejs-dialog
      id="dialog"
      #ejDialog
      isModal="true"
      (overlayClick)="onOverlayAddClick()"
      [animationSettings]="animationSettings"
      [visible]="dialogAddVisible"
      [width]="width"
      [height]="height"
    >
      <ng-template #header> </ng-template>
      <ng-template #content>
        <div class="e-sample-resize-container e-card-resize-container">
          <div class="row card-layout">
            <div class="e-card">
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title"></div>
                  <div class="e-card-sub-title"></div>
                  <div class="col-12" style="margin-top: 20px">
                    <div class="form-space">
                      <ejs-textbox cssClass="e-outline" placeholder="Normal Condition" [(ngModel)]="otherCondition" floatLabelType="auto">
                      </ejs-textbox>
                    </div>
                  </div>

                  <div class="col-12" style="margin-top: 20px">
                    <div class="form-space">
                      <ejs-textbox cssClass="e-outline" placeholder="Deviation" [(ngModel)]="otherDeviation" floatLabelType="auto">
                      </ejs-textbox>
                    </div>
                  </div>

                  <div class="col-12" style="margin-top: 20px">
                    <div class="form-space">
                      <ejs-textbox cssClass="e-outline" placeholder="Justification" [(ngModel)]="otherJustification" floatLabelType="auto">
                      </ejs-textbox>
                    </div>
                  </div>
                  <div class="d-flex justify-content-end">
                    <button ejs-button content="Save" (click)="getDataOtherDeviation()" class="btn-info" style="margin: 10px"></button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-template>
    </ejs-dialog>
  </div>
</div>
