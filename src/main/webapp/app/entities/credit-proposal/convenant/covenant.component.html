<ejs-grid [dataSource]="dataGrid" allowTextWrap="true" *ngIf="!loading && isViewMode && proposalType !== 'Total Exposure Back to Back'">
  <e-columns>
    <e-column headerText="Covenant" width="200" textAlign="justify" headerTextAlign="center" class="rounding-table-left">
      <ng-template #template let-data>
        <div [innerHTML]="addBRBeforeDash(data.covenant)"></div>
      </ng-template>
    </e-column>
    <e-column headerText="Status" width="150" textAlign="center">
      <ng-template #template let-data>
        <ejs-dropdownlist
          (change)="onKeyUpEvent('status', $event, data)"
          [(ngModel)]="statusValue[data.id]"
          [dataSource]="status"
          placeholder="Select a Status"
          cssClass="e-outline"
          disabled
        >
        </ejs-dropdownlist>
      </ng-template>
    </e-column>
    <e-column field="deviation" headerText="Deviation" width="200" textAlign="justify" headerTextAlign="center">
      <ng-template #template let-data>
        <ejs-textbox
          class="txtHeight"
          [multiline]="true"
          (keyup)="onKeyUpEvent('deviation', $event, data)"
          [(ngModel)]="deviation[data.id]"
          cssClass="e-outline"
          floatLabelType="Always"
          disabled
        >
        </ejs-textbox>
      </ng-template>
    </e-column>
    <e-column
      field="justification"
      headerText="Justification"
      width="200"
      textAlign="justify"
      headerTextAlign="center"
      class="rounding-table-right"
    >
      <ng-template #template let-data>
        <ejs-textbox
          class="txtHeight"
          [multiline]="true"
          (keyup)="onKeyUpEvent('justification', $event, data)"
          [(ngModel)]="justification[data.id]"
          [disabled]="statusValue[data.id] == 'Applied'"
          cssClass="e-outline"
          floatLabelType="Always"
          disabled
        >
        </ejs-textbox>
      </ng-template>
    </e-column>
  </e-columns>
</ejs-grid>
