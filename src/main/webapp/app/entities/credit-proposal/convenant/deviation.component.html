<div
  class="e-sample-resize-container e-card-resize-container mb-5"
  *ngIf="proposalType !== 'Total Exposure Back to Back'; else deviationBTB"
>
  <div class="row">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">Deviation</div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <ejs-grid [dataSource]="dataGrid" allowTextWrap="true">
          <e-columns>
            <e-column headerText="Covenant" width="200" textAlign="justify" headerTextAlign="center">
              <ng-template #template let-data>
                <div [innerHTML]="addBRBeforeDash(data.covenant)"></div>
              </ng-template>
            </e-column>
            <e-column headerText="Status" width="150" textAlign="center">
              <ng-template #template let-data>
                <ejs-dropdownlist
                  (change)="onKeyUpEvent('status', $event, data)"
                  [(ngModel)]="statusValue[data.id]"
                  [dataSource]="status"
                  placeholder="Select a Status"
                  cssClass="e-outline"
                  [disabled]="statusValue"
                >
                </ejs-dropdownlist>
              </ng-template>
            </e-column>
            <e-column field="deviation" headerText="Deviation" width="200" textAlign="justify" headerTextAlign="center">
              <ng-template #template let-data>
                <ejs-textbox
                  class="txtHeight"
                  [multiline]="true"
                  (keyup)="onKeyUpEvent('deviation', $event, data)"
                  [(ngModel)]="deviation[data.id]"
                  [disabled]="statusValue[data.id] == 'Applied'"
                  cssClass="e-outline"
                  [disabled]="statusValue"
                >
                </ejs-textbox>
              </ng-template>
            </e-column>
            <e-column field="justification" headerText="Justification" width="200" textAlign="justify" headerTextAlign="center">
              <ng-template #template let-data>
                <ejs-textbox
                  class="txtHeight"
                  [multiline]="true"
                  (keyup)="onKeyUpEvent('justification', $event, data)"
                  [(ngModel)]="justification[data.id]"
                  [disabled]="statusValue[data.id] == 'Applied'"
                  cssClass="e-outline"
                  [disabled]="statusValue"
                >
                </ejs-textbox>
              </ng-template>
            </e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
  </div>
</div>

<ng-template #deviationBTB>
  <!-- GENERAL -->
  <div style="margin: 1rem">
    <div class="e-card-sub-title">
      <h5 class="header-title">General Times Condition</h5>
    </div>
    <ejs-grid [dataSource]="dataGridGeneral" allowTextWrap="true">
      <e-columns>
        <e-column headerText="Covenant" width="200" textAlign="center" headerTextAlign="center">
          <ng-template #template let-data>
            <div [innerHTML]="addBRBeforeDash(data.covenant)"></div>
          </ng-template>
        </e-column>
        <e-column headerText="Status" width="150" textAlign="center">
          <ng-template #template let-data>
            <ejs-dropdownlist
              (change)="onKeyUpEventGeneral('status', $event, data)"
              [(ngModel)]="statusValueGeneral[data.id]"
              [dataSource]="status"
              placeholder="Select a Status"
              cssClass="e-outline"
              [disabled]="statusValue"
            >
            </ejs-dropdownlist>
          </ng-template>
        </e-column>
        <e-column field="deviation" headerText="Deviation" width="200" textAlign="center" headerTextAlign="center">
          <ng-template #template let-data>
            <ejs-textbox
              [multiline]="true"
              (keyup)="onKeyUpEventGeneral('deviation', $event, data)"
              [(ngModel)]="deviationGeneral[data.id]"
              [disabled]="statusValueGeneral[data.id] == 'Applied'"
              cssClass="e-outline"
              [disabled]="statusValue"
            >
            </ejs-textbox>
          </ng-template>
        </e-column>
        <e-column field="justification" headerText="Justification" width="130" textAlign="center">
          <ng-template #template let-data>
            <ejs-textbox
              [multiline]="true"
              (keyup)="onKeyUpEventGeneral('justification', $event, data)"
              [(ngModel)]="justificationGeneral[data.id]"
              [disabled]="statusValueGeneral[data.id] == 'Applied'"
              cssClass="e-outline"
              [disabled]="statusValue"
            >
            </ejs-textbox>
          </ng-template>
        </e-column>
      </e-columns>
    </ejs-grid>
  </div>

  <!-- DEPOSIT -->
  <div style="margin: 1rem">
    <div class="e-card-sub-title">
      <h5 class="header-title">Terms and condition for time deposit collateral</h5>
    </div>
    <ejs-grid [dataSource]="dataGridDeposit" allowTextWrap="true">
      <e-columns>
        <e-column headerText="Covenant" width="200" textAlign="center" headerTextAlign="center">
          <ng-template #template let-data>
            <div [innerHTML]="addBRBeforeDash(data.covenant)"></div>
          </ng-template>
        </e-column>
        <e-column headerText="Status" width="150" textAlign="center">
          <ng-template #template let-data>
            <ejs-dropdownlist
              (change)="onKeyUpEventDeposit('status', $event, data)"
              [(ngModel)]="statusValueDeposit[data.id]"
              [dataSource]="status"
              placeholder="Select a Status"
              cssClass="e-outline"
              [disabled]="statusValue"
            >
            </ejs-dropdownlist>
          </ng-template>
        </e-column>
        <e-column field="deviation" headerText="Deviation" width="200" textAlign="center" headerTextAlign="center">
          <ng-template #template let-data>
            <ejs-textbox
              [multiline]="true"
              (keyup)="onKeyUpEventDeposit('deviation', $event, data)"
              [(ngModel)]="deviationDeposit[data.id]"
              [disabled]="statusValueDeposit[data.id] == 'Applied'"
              cssClass="e-outline"
              [disabled]="statusValue"
            >
            </ejs-textbox>
          </ng-template>
        </e-column>
        <e-column field="justification" headerText="Justification" width="130" textAlign="center">
          <ng-template #template let-data>
            <ejs-textbox
              [multiline]="true"
              (keyup)="onKeyUpEventDeposit('justification', $event, data)"
              [(ngModel)]="justificationDeposit[data.id]"
              [disabled]="statusValueDeposit[data.id] == 'Applied'"
              cssClass="e-outline"
              [disabled]="statusValue"
            >
            </ejs-textbox>
          </ng-template>
        </e-column>
      </e-columns>
    </ejs-grid>
  </div>
</ng-template>
