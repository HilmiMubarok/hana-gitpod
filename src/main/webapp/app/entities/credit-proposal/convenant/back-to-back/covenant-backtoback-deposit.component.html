<div>
  <div class="e-card-sub-title">
    <h5 class="header-title">Terms and condition for time deposit collateral</h5>
  </div>
  <ejs-grid [dataSource]="standardDataGridBackToBackDeposit" allowTextWrap="true">
    <e-columns>
      <e-column headerText="Covenant" width="200" textAlign="left" headerTextAlign="center">
        <ng-template #template let-data>
          <div [innerHTML]="addBRBeforeDash(data.covenant)"></div>
        </ng-template>
      </e-column>
      <e-column headerText="Status" width="150" textAlign="center">
        <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: 'input'">
          <ng-template #template let-data>
            <ejs-dropdownlist
              (change)="onKeyUpEvent('status', $event, data)"
              [(ngModel)]="statusValue[data.id]"
              [dataSource]="status"
              placeholder="Select a Status"
              cssClass="e-outline"
            >
            </ejs-dropdownlist>
          </ng-template>
        </section>
        <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: ''">
          <ng-template #template let-data>
            <ejs-dropdownlist
              (change)="onKeyUpEvent('status', $event, data)"
              [(ngModel)]="statusValue[data.id]"
              [dataSource]="status"
              placeholder="Select a Status"
              cssClass="e-outline"
              disabled
            >
            </ejs-dropdownlist>
          </ng-template>
        </section>
      </e-column>
      <e-column field="deviation" headerText="Deviation" width="200" textAlign="left" headerTextAlign="center">
        <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: 'input'">
          <ng-template #template let-data>
            <ejs-textbox
              [multiline]="true"
              (keyup)="onKeyUpEvent('deviation', $event, data)"
              [(ngModel)]="deviation[data.id]"
              [disabled]="statusValue[data.id] == 'Applied'"
              cssClass="e-outline"
            >
            </ejs-textbox>
          </ng-template>
        </section>
        <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: ''">
          <ng-template #template let-data>
            <ejs-textbox
              [multiline]="true"
              (keyup)="onKeyUpEvent('deviation', $event, data)"
              [(ngModel)]="deviation[data.id]"
              [disabled]="statusValue[data.id] == 'Applied'"
              cssClass="e-outline"
              disabled
            >
            </ejs-textbox>
          </ng-template>
        </section>
      </e-column>
      <e-column field="justification" headerText="Justification" width="130" textAlign="center">
        <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: 'input'">
          <ng-template #template let-data>
            <ejs-textbox
              [multiline]="true"
              (keyup)="onKeyUpEvent('justification', $event, data)"
              [(ngModel)]="justification[data.id]"
              [disabled]="statusValue[data.id] == 'Applied'"
              cssClass="e-outline"
            >
            </ejs-textbox>
          </ng-template>
        </section>
        <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: ''">
          <ng-template #template let-data>
            <ejs-textbox
              [multiline]="true"
              (keyup)="onKeyUpEvent('justification', $event, data)"
              [(ngModel)]="justification[data.id]"
              [disabled]="statusValue[data.id] == 'Applied'"
              cssClass="e-outline"
              disabled
            >
            </ejs-textbox>
          </ng-template>
        </section>
      </e-column>
    </e-columns>
  </ejs-grid>
</div>
