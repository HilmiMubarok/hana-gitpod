<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.creditProposal.home.viewLabel">Credit Proposals</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.creditProposal.detail.title">Credit Proposal</span> {{ creditProposal.id }} </p-header>
    <jhi-credit-proposal-view [item]="creditProposal" mode="item"> </jhi-credit-proposal-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/credit-proposal', creditProposal.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
