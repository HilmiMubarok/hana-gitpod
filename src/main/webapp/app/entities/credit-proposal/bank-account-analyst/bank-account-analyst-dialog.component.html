<h2 mat-dialog-title>ADD BANK ACCOUNT ANALYST</h2>
<mat-dialog-content>
  <div class="row">
    <!-- LEFT SIDE -->
    <div class="col-6">
      <div class="form-group">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Bank</mat-label>
          <mat-select [(ngModel)]="bankAccAnalyst.bank" name="selBank">
            <mat-option value="">Please Select</mat-option>
            <mat-option *ngFor="let item of banks" [value]="item">
              {{ item }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Account No</mat-label>
          <input matInput type="text" [(ngModel)]="bankAccAnalyst.accNo" />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Account Name</mat-label>
          <input matInput type="text" [(ngModel)]="bankAccAnalyst.accName" />
        </mat-form-field>
      </div>
    </div>
    <!-- RIGHT SIDE -->
    <div class="col-6">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Loan Limit (if any)</mat-label>
          <input matInput type="text" [(ngModel)]="bankAccAnalyst.limit" />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>CCY</mat-label>
          <input matInput type="text" maxlength="3" [(ngModel)]="bankAccAnalyst.ccy" />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Eq to IDR</mat-label>
          <input matInput type="number" [(ngModel)]="bankAccAnalyst.convert" />
        </mat-form-field>
      </div>
    </div>
  </div>

  <div class="row mt-5">
    <div class="row-12">
      <div class="table-responsive">
        <table mat-table [dataSource]="bankAccAnalyst.detail" class="w-100">
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Month - Year</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="text" [(ngModel)]="bankAccAnalyst.detail[i]['date']" />
              </mat-form-field>
            </td>
            <td mat-footer-cell *matFooterCellDef>Total</td>
          </ng-container>
          <ng-container matColumnDef="debit">
            <th mat-header-cell *matHeaderCellDef>Debit</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [(ngModel)]="bankAccAnalyst.detail[i]['debit']" />
              </mat-form-field>
            </td>
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getTotalDebit()" disabled />
              </mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="fqDebit">
            <th mat-header-cell *matHeaderCellDef>Fq. Db</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [(ngModel)]="bankAccAnalyst.detail[i]['fqDebit']" />
              </mat-form-field>
            </td>
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getTotalFqDebit()" disabled />
              </mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="credit">
            <th mat-header-cell *matHeaderCellDef>Credit</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [(ngModel)]="bankAccAnalyst.detail[i]['credit']" />
              </mat-form-field>
            </td>
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getTotalCredit()" disabled />
              </mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="fqCredit">
            <th mat-header-cell *matHeaderCellDef>Fq. Cr</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [(ngModel)]="bankAccAnalyst.detail[i]['fqCredit']" />
              </mat-form-field>
            </td>
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getTotalFqCredit()" disabled />
              </mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="lowest">
            <th mat-header-cell *matHeaderCellDef>Lowest</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [(ngModel)]="bankAccAnalyst.detail[i]['lowest']" />
              </mat-form-field>
            </td>
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getTotalLowest()" disabled />
              </mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="highest">
            <th mat-header-cell *matHeaderCellDef>Highest</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [(ngModel)]="bankAccAnalyst.detail[i]['highest']" />
              </mat-form-field>
            </td>
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getTotalHighest()" disabled />
              </mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="balance">
            <th mat-header-cell *matHeaderCellDef>Average Balance (Debit / Credit)</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [(ngModel)]="bankAccAnalyst.detail[i]['balance']" />
              </mat-form-field>
            </td>
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getTotalBalance()" disabled />
              </mat-form-field>
            </td>
          </ng-container>
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <button *ngIf="i > 0" mat-icon-button (click)="onRemove(i)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>

          <!-- AVERAGE FOOTER -->
          <ng-container matColumnDef="averageTitle">
            <td mat-footer-cell *matFooterCellDef>Average</td>
          </ng-container>

          <ng-container matColumnDef="averageDebit">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getAverageDebit()" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageFqDebit">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getAverageFqDebit()" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageCredit">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getAverageCredit()" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageFqCredit">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getAverageFqCredit()" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageLowest">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getAverageLowest()" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageHighest">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getAverageHighest()" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageBalance">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" [value]="getAverageBalance()" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageAction">
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>
          <!-- /AVERAGE FOOTER -->

          <!-- AVERAGE OTHER FOOTER -->
          <ng-container matColumnDef="averageOtherTitle">
            <td mat-footer-cell *matFooterCellDef>Average (Other CCY)</td>
          </ng-container>

          <ng-container matColumnDef="averageOtherDebit">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" value="0" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageOtherFqDebit">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" value="0" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageOtherCredit">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" value="0" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageOtherFqCredit">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" value="0" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageOtherLowest">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" value="0" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageOtherHighest">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" value="0" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageOtherBalance">
            <td mat-footer-cell *matFooterCellDef>
              <mat-form-field class="w-100" appearance="outline">
                <input matInput type="number" value="0" disabled />
              </mat-form-field>
            </td>
          </ng-container>

          <ng-container matColumnDef="averageOtherAction">
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>
          <!-- /AVERAGE OTHER FOOTER -->

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
          </tr>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
          <tr
            mat-footer-row
            *matFooterRowDef="[
              'averageTitle',
              'averageDebit',
              'averageFqDebit',
              'averageCredit',
              'averageFqCredit',
              'averageLowest',
              'averageHighest',
              'averageBalance',
              'averageAction'
            ]"
          ></tr>
          <tr
            mat-footer-row
            *matFooterRowDef="[
              'averageOtherTitle',
              'averageOtherDebit',
              'averageOtherFqDebit',
              'averageOtherCredit',
              'averageOtherFqCredit',
              'averageOtherLowest',
              'averageOtherHighest',
              'averageOtherBalance',
              'averageOtherAction'
            ]"
          ></tr>
        </table>
        <div class="mt-3 text-center">
          <button mat-raised-button color="primary" (click)="addRow()">ADD ROW</button>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button (click)="save()" *ngIf="!view">Save</button>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
