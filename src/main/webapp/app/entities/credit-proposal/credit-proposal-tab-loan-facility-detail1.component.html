<mat-card>
  <mat-card-header>
    <mat-card-title>Detail Fasilitas</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <ejs-grid #grid [dataSource]="data" [allowPaging]="true" [pageSettings]="pageSettings">
      <e-columns>
        <e-column field="indexNum" headerText="No" headerTextAlign="center" width="90" textAlign="center"></e-column>
        <e-column field="applicationType" headerText="Application Type" headerTextAlign="center" width="140"
          textAlign="left"></e-column>
        <e-column field="facilityType" headerText="Facility Type" headerTextAlign="center" width="120" textAlign="left">
        </e-column>
        <e-column field="subLimit" headerText="Sublimit" headerTextAlign="center" width="120" textAlign="right">
        </e-column>
        <e-column field="ccy" headerText="CCY" headerTextAlign="center" width="90" textAlign="left"></e-column>
        <e-column field="initialLimit" headerText="Initial Limit" headerTextAlign="center" width="120"
          textAlign="right"></e-column>
        <e-column field="oS" headerText="O/S" width="90" headerTextAlign="center" textAlign="right"></e-column>
        <e-column field="changes" headerText="Changes" width="140" headerTextAlign="center" textAlign="right">
        </e-column>
        <e-column field="creditLimit" headerText="Credit Limit" width="140" headerTextAlign="center" textAlign="right">
        </e-column>
        <e-column field="interestRate" headerText="Interest Rate" width="200" headerTextAlign="center" textAlign="left">
        </e-column>
        <e-column field="provision" headerText="Provision" width="100" headerTextAlign="center" textAlign="right">
        </e-column>
        <e-column field="tenor" headerText="Tenor(month)" width="120" headerTextAlign="center" textAlign="right">
        </e-column>
        <e-column field="availableLimit" headerText="Available Limit" width="140" headerTextAlign="center"
          textAlign="right"></e-column>
        <e-column field="date" headerText="Maturity Date" width="140" headerTextAlign="center" textAlign="right">
          <!-- <ng-template #template let-data>
            {{ data.createdDate | formatMediumDate }}
          </ng-template> -->
        </e-column>
        <e-column headerText="Action" width="100" headerTextAlign="center" textAlign="center">
          <ng-template #template let-data>
            <button pButton type="button" class="flat-button">
              <fa-icon icon="eye"></fa-icon>
            </button>
            <button pButton type="button" class="flat-button">
              <fa-icon icon="trash-alt"></fa-icon>
            </button>
          </ng-template>
        </e-column>
      </e-columns>
      <e-aggregates>
        <e-aggregate>
          <e-columns>
            <e-column field="initialLimit" type="sum">
              <ng-template #FooterTemplate let-data>{{data.sum}}</ng-template>
            </e-column>
            <e-column field="changes" type="sum">
              <ng-template #FooterTemplate let-data>{{data.sum}}</ng-template>
            </e-column>
            <e-column field="creditLimit" type="sum">
              <ng-template #FooterTemplate let-data>{{data.sum}}</ng-template>
            </e-column>
            <e-column field="oS" type="sum">
              <ng-template #FooterTemplate let-data>{{data.sum}}</ng-template>
            </e-column>
            <e-column field="availableLimit" type="sum">
              <ng-template #FooterTemplate let-data>{{data.sum}}</ng-template>
            </e-column>
          </e-columns>
        </e-aggregate>
      </e-aggregates>
    </ejs-grid>
  </mat-card-content>
</mat-card>
<ejs-richtexteditor id='rteTool' [toolbarSettings]='tools'></ejs-richtexteditor>
