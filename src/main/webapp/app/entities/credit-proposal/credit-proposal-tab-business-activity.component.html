<div class="e-card">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Business Activity</div>
      <div class="e-card-sub-title"></div>
    </div>
  </div>
  <div class="e-card-content">
    <div class="form-space">
      <div class="row my-3">
        <div class="col">
          <!-- <div class="form-space"> -->
          <ejs-textbox placeholder="Visit By" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
        </div>
        <div class="col">
          <ejs-textbox placeholder="Visit With" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          <!-- </div> -->
        </div>
      </div>

      <div class="row my-3">
        <div class="col">
          <!-- <div class="form-space"> -->
          <ejs-textbox placeholder="Visit Date" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
        </div>
        <div class="col">
          <ejs-textbox placeholder="Posisition in Company" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          <!-- </div> -->
        </div>
      </div>

      <div class="row my-3">
        <div class="col-6">
          <!-- <div class="form-space"> -->
          <ejs-textbox placeholder="Venue" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          <!-- </div> -->
        </div>
      </div>
    </div>
    <ejs-richtexteditor [toolbarSettings]="tools"></ejs-richtexteditor>
  </div>
</div>
