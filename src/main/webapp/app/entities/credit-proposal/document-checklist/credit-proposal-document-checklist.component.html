<mat-card>
  <mat-card-header>
    <mat-card-subtitle>Document Checklist</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table *ngIf="folders" [dataSource]="folders" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef width="5%">No</th>
        <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="documentType">
        <th mat-header-cell *matHeaderCellDef>Category Type</th>
        <td mat-cell *matCellDef="let element">{{ element.documentType }}</td>
      </ng-container>
      <ng-container matColumnDef="document">
        <th mat-header-cell *matHeaderCellDef>Document</th>
        <td mat-cell *matCellDef="let element">{{ element.document }}</td>
      </ng-container>
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let element">{{ element.category }}</td>
      </ng-container>
      <ng-container matColumnDef="dueDate">
        <th mat-header-cell *matHeaderCellDef>Due Date</th>
        <td mat-cell *matCellDef="let element">{{ element.dueDate | formatMediumDate }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef width="20%">Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>
      <ng-container matColumnDef="remarks">
        <th mat-header-cell *matHeaderCellDef width="20%">Remarks</th>
        <td mat-cell *matCellDef="let element">{{ element.remarks }}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef width="10%">Action</th>
        <td mat-cell *matCellDef="let element">
          <button *ngIf="isViewMode === false" mat-icon-button (click)="openDialog(element, 'view')">
            <mat-icon>remove_red_eye</mat-icon>
          </button>
          <button *ngIf="isViewMode === false" mat-icon-button (click)="openDialog(element, 'edit')">
            <mat-icon>create</mat-icon>
          </button>
          <button *ngIf="isViewMode === false" mat-icon-button (click)="deleteFile(element)">
            <mat-icon>delete_forever</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td
          class="mat-cell"
          [attr.colspan]="['no', 'documentType', 'document', 'category', 'dueDate', 'status', 'remarks', 'action'].length"
        >
          No records found.
        </td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="['no', 'documentType', 'document', 'category', 'dueDate', 'status', 'remarks', 'action']"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: ['no', 'documentType', 'document', 'category', 'dueDate', 'status', 'remarks', 'action']"
      ></tr>
    </table>
  </mat-card-content>

  <mat-card-actions *ngIf="creditProposal.statusId === 'DRAFT'" align="right">
    <button mat-raised-button color="primary" (click)="openDialog(null, 'add')">ADD DOCUMENT</button>
  </mat-card-actions>
</mat-card>
