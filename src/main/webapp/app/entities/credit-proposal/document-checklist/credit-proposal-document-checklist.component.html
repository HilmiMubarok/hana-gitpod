<div *ngFor="let item of dataArray">
  <mat-card *ngIf="item.statusId === 'ACTIVE'" style="margin-top: 12px">
    <mat-card-header>
      <mat-card-subtitle>{{ item.description }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="item.level" class="w-100">
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef width="5%" class="rounding-table-left">No</th>
          <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
        </ng-container>
        <ng-container matColumnDef="document">
          <th mat-header-cell *matHeaderCellDef width="40%">Document Name</th>
          <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        </ng-container>
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let element">{{ element.category }}</td>
        </ng-container>
        <ng-container matColumnDef="dueDate">
          <th mat-header-cell *matHeaderCellDef>Due Date</th>
          <td mat-cell *matCellDef="let element">{{ element.dueDate | date: 'YYYY-MM-dd' }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let element">{{ element.status }}</td>
        </ng-container>

        <ng-container matColumnDef="remarks">
          <th mat-header-cell *matHeaderCellDef>Remarks</th>
          <td mat-cell *matCellDef="let element">{{ element.remarks }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef width="10%" class="rounding-table-right">Action</th>
          <td mat-cell *matCellDef="let element">
            <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
              <button *ngIf="item.parentId !== 'DOC_IDD'" mat-icon-button (click)="openDialog(element, 'add', item.description)">
                <mat-icon>create</mat-icon>
              </button>

              <button mat-icon-button (click)="openDialog(element, 'view', item.description)">
                <mat-icon>remove_red_eye</mat-icon>
              </button>
            </section>
            <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
              <button mat-icon-button (click)="openDialog(element, 'view', item.description)">
                <mat-icon>remove_red_eye</mat-icon>
              </button>
            </section>
          </td>
        </ng-container>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="['no', 'document', 'category', 'remarks', 'dueDate', 'status', 'action'].length">
            No records found.
          </td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="['no', 'document', 'category', 'remarks', 'dueDate', 'status', 'action']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['no', 'document', 'category', 'remarks', 'dueDate', 'status', 'action']"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
