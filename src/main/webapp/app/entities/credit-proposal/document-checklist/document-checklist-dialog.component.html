<div class="style-close">
  <button class="button-close" mat-button mat-dialog-close>X</button>
</div>
<h2 mat-dialog-title>ADD / EDIT DOCUMENT CHECKLIST</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-6">
      <ngx-dropzone
        accept="image/jpeg,image/jpg,image/png,image/gif"
        multiple="false"
        [hidden]="view"
        (change)="onSelect($event)"
        *ngIf="file == null"
      >
        <ngx-dropzone-label>Drop file here or choose your file</ngx-dropzone-label>
      </ngx-dropzone>
      <ngx-dropzone-image-preview
        class="mt-3"
        ngProjectAs="ngx-dropzone-preview"
        *ngIf="file"
        [file]="file"
        [hidden]="view"
        [removable]="true"
        (removed)="onRemove(file)"
      >
      </ngx-dropzone-image-preview>
      <img [src]="file.url" *ngIf="view" alt="image" width="400" />
    </div>
    <div class="col-6">
      <div class="row">
        <div class="col-12">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Category type</mat-label>
              <mat-select [disabled]="view" [(ngModel)]="documentChecklist.documentType" name="documentType">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option
                  *ngFor="let item of ['Debtors Identity', 'Collateral', 'Credit Approval', 'Credit Aggrement', 'Other']"
                  [value]="item"
                >
                  {{ item }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Document Name</mat-label>
              <input matInput type="text" [(ngModel)]="documentChecklist.document" [disabled]="view" />
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Status</mat-label>
              <mat-select [disabled]="view" [(ngModel)]="documentChecklist.status" name="status">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option *ngFor="let item of ['Available', 'TBO', 'Waived']" [value]="item">
                  {{ item }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Date</mat-label>
              <input [matDatepicker]="date" matInput type="text" [(ngModel)]="documentChecklist.dueDate" [disabled]="view" />
              <mat-datepicker-toggle matSuffix [for]="date"></mat-datepicker-toggle>
              <mat-datepicker #date disabled="false"></mat-datepicker>
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Category</mat-label>
              <mat-select [disabled]="view" [(ngModel)]="documentChecklist.category" name="category">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option *ngFor="let item of ['A', 'B', 'C']" [value]="item">
                  {{ item }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Remarks</mat-label>
              <input matInput type="text" [(ngModel)]="documentChecklist.remarks" [disabled]="view" />
            </mat-form-field>
          </div>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button *ngIf="!view" (click)="save()">Save</button>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
