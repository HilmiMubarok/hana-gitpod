<div class="row justify-content-between">
  <div class="col-6">
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['nomorUrutFasilitas']"
        cssClass="e-outline"
        placeholder="Index Facility"
        floatLabelType="auto"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-combobox
        [(ngModel)]="applicationProduct.attributes['applicationType']"
        [dataSource]="listOfValue.applicationTypeList"
        cssClass="e-outline"
        placeholder="Application Type"
        floatLabelType="auto"
      ></ejs-combobox>
    </div>
    <div class="mb-2">
      <ejs-combobox
        [(ngModel)]="applicationProduct.attributes['facilityType']"
        [dataSource]="listOfValue.facilityTypeList"
        cssClass="e-outline"
        placeholder="Facility Type"
        floatLabelType="auto"
        (change)="berubah($event)"
      ></ejs-combobox>
    </div>
    <div class="mb-2">
      <div class="row">
        <div class="col-8">
          <ejs-textbox
            [(ngModel)]="applicationProduct.attributes['maturity']"
            cssClass="e-outline"
            placeholder="Maturity"
            floatLabelType="auto"
          ></ejs-textbox>
        </div>
        <div class="col-4">
          <ejs-combobox
            [(ngModel)]="applicationProduct.attributes['maturityPeriodType']"
            [dataSource]="listOfValue.periodTypeList"
            cssClass="e-outline"
            placeholder="Period Type"
            floatLabelType="auto"
          ></ejs-combobox>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <ejs-datepicker
        [(ngModel)]="applicationProduct.attributes['maturityDate']"
        cssClass="e-outline"
        placeholder="Maturity Date"
        floatLabelType="auto"
      ></ejs-datepicker>
    </div>
    <div class="mb-2">
      <div class="row">
        <div class="col-4" style="padding: 1rem">
          <ejs-checkbox [(ngModel)]="applicationProduct.attributes['subLimit']" label="Sub-Limit"></ejs-checkbox>
        </div>
        <div class="col-8">
          <ejs-combobox
            [(ngModel)]="applicationProduct.attributes['sublimitFromExistingFacility']"
            [dataSource]="listOfValue.sublimitFromExistingFacilityList"
            cssClass="e-outline"
            placeholder="Sublimit From Exiting Facility"
            floatLabelType="auto"
          ></ejs-combobox>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <div class="row mb-2">
        <label>Comitted Line:</label>
      </div>
      <div class="row">
        <div class="col-4">
          <ejs-radiobutton
            value="commited"
            [(ngModel)]="applicationProduct.attributes['commitedLine']"
            name="commitedLine"
            label="Comitted"
          ></ejs-radiobutton>
        </div>
        <div class="col-4">
          <ejs-radiobutton
            value="un-commited"
            [(ngModel)]="applicationProduct.attributes['commitedLine']"
            name="commitedLine"
            label="Un-Comitted Line"
          ></ejs-radiobutton>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <ejs-combobox
        [(ngModel)]="applicationProduct.attributes['currency']"
        [dataSource]="listOfValue.currencyList"
        cssClass="e-outline"
        placeholder="Currency"
        floatLabelType="auto"
      ></ejs-combobox>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['kurs']"
        cssClass="e-outline"
        placeholder="Kurs"
        floatLabelType="auto"
        readOnly="true"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['initialLimit']"
        cssClass="e-outline"
        placeholder="Initial Limit"
        floatLabelType="auto"
        readOnly="true"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['outstanding']"
        cssClass="e-outline"
        placeholder="Outstanding"
        floatLabelType="auto"
        readOnly="true"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-datepicker
        [(ngModel)]="applicationProduct.attributes['dateOS']"
        cssClass="e-outline"
        placeholder="Date of O/S"
        floatLabelType="auto"
        readOnly="true"
      ></ejs-datepicker>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['changes']"
        cssClass="e-outline"
        placeholder="Changes"
        floatLabelType="auto"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['totalPlafond']"
        cssClass="e-outline"
        placeholder="Total Plafond"
        floatLabelType="auto"
        readOnly="true"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-checkbox [(ngModel)]="applicationProduct.attributes['restructuredStatus']" label="Restruct Status"> </ejs-checkbox>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['memoNo']"
        cssClass="e-outline"
        placeholder="Memo No"
        floatLabelType="auto"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-datepicker
        [(ngModel)]="applicationProduct.attributes['memoDate']"
        cssClass="e-outline"
        placeholder="Memo Date"
        floatLabelType="auto"
      ></ejs-datepicker>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['keterangan']"
        cssClass="e-outline"
        placeholder="Descryption"
        floatLabelType="auto"
      ></ejs-textbox>
    </div>
  </div>
  <div class="col-6">
    <div class="mb-2">
      <ejs-combobox
        [(ngModel)]="applicationProduct.attributes['interestRateType']"
        [dataSource]="listOfValue.interestRateTypeList"
        cssClass="e-outline"
        placeholder="Interest Rate Type"
        floatLabelType="auto"
        [disabled]="status"
      ></ejs-combobox>
    </div>
    <div class="mb-2">
      <div class="row">
        <div class="col-8">
          <ejs-combobox
            [(ngModel)]="applicationProduct.attributes['']"
            [dataSource]=""
            cssClass="e-outline"
            placeholder="Interest Rate Period"
            floatLabelType="auto"
            [disabled]="status"
          ></ejs-combobox>
        </div>
        <div class="col-4">
          <ejs-combobox
            [(ngModel)]="applicationProduct.attributes['interestRatePeriodType']"
            [dataSource]="listOfValue.periodTypeList"
            cssClass="e-outline"
            placeholder="Period Type"
            floatLabelType="auto"
            [disabled]="status"
          ></ejs-combobox>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['indexRate']"
        cssClass="e-outline"
        placeholder="Index Rate"
        floatLabelType="auto"
        [disabled]="status"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['spreadOfMargin']"
        cssClass="e-outline"
        placeholder="Spread Of Margin"
        floatLabelType="auto"
        [disabled]="status"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['totalRate']"
        cssClass="e-outline"
        placeholder="Total Rate"
        floatLabelType="auto"
        [disabled]="status"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <div class="row">
        <div class="col-8">
          <ejs-textbox
            [(ngModel)]="applicationProduct.attributes['provitionFee']"
            cssClass="e-outline"
            placeholder="Provition Fee"
            floatLabelType="auto"
            [disabled]="status"
          ></ejs-textbox>
        </div>
        <div class="col-4">
          <ejs-combobox
            [(ngModel)]="applicationProduct.attributes['provitionFeeRateAmountType']"
            [dataSource]="listOfValue.rateAmountTypeList"
            cssClass="e-outline"
            placeholder="Rate / Amount Type"
            floatLabelType="auto"
            [disabled]="status"
          ></ejs-combobox>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <div class="row">
        <div class="col-8">
          <ejs-textbox
            [(ngModel)]="applicationProduct.attributes['adminFee']"
            cssClass="e-outline"
            placeholder="Admin Fee"
            floatLabelType="auto"
            [disabled]="status"
          ></ejs-textbox>
        </div>
        <div class="col-4">
          <ejs-combobox
            [(ngModel)]="applicationProduct.attributes['adminFeeRateAmountType']"
            [dataSource]="listOfValue.rateAmountTypeList"
            cssClass="e-outline"
            placeholder="Rate / Amount Type"
            floatLabelType="auto"
            [disabled]="status"
          ></ejs-combobox>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <div class="row">
        <div class="col-8">
          <ejs-textbox
            [(ngModel)]="applicationProduct.attributes['gracePeriod']"
            cssClass="e-outline"
            placeholder="Grace Period"
            floatLabelType="auto"
          ></ejs-textbox>
        </div>
        <div class="col-4">
          <ejs-combobox
            [(ngModel)]="applicationProduct.attributes['gracePeriodType']"
            [dataSource]="listOfValue.gracePeriodTypeList"
            cssClass="e-outline"
            placeholder="Period Type"
            floatLabelType="auto"
          ></ejs-combobox>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['availableLimit']"
        cssClass="e-outline"
        placeholder="Available Limit"
        floatLabelType="auto"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <div class="row">
        <div class="col-8">
          <ejs-textbox
            [(ngModel)]="applicationProduct.attributes['availablePeriod']"
            cssClass="e-outline"
            placeholder="Available Period"
            floatLabelType="auto"
          ></ejs-textbox>
        </div>
        <div class="col-4">
          <ejs-combobox
            [(ngModel)]="applicationProduct.attributes['availablePeriodType']"
            [dataSource]="listOfValue.periodTypeList"
            cssClass="e-outline"
            placeholder="Period Type"
            floatLabelType="auto"
          ></ejs-combobox>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['instalmentEstimation']"
        cssClass="e-outline"
        placeholder="Installment Estimation"
        floatLabelType="auto"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <div class="row">
        <div class="col-8">
          <ejs-textbox
            [(ngModel)]="applicationProduct.attributes['principalFrequency']"
            cssClass="e-outline"
            placeholder="Principal Frequency"
            floatLabelType="auto"
          ></ejs-textbox>
        </div>
        <div class="col-4">
          <ejs-combobox
            [(ngModel)]="applicationProduct.attributes['principalFrequencyPeriodType']"
            [dataSource]="listOfValue.periodTypeList"
            cssClass="e-outline"
            placeholder="Period Type"
            floatLabelType="auto"
          ></ejs-combobox>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <ejs-textbox
        [(ngModel)]="applicationProduct.attributes['loanPurpose']"
        multiline="true"
        cssClass="e-outline"
        placeholder="Loan Purpose"
        floatLabelType="auto"
      ></ejs-textbox>
    </div>
    <div class="mb-2">
      <ejs-combobox cssClass="e-outline" placeholder="NPL Due" floatLabelType="auto"></ejs-combobox>
    </div>
    <div class="mb-2">
      <ejs-combobox cssClass="e-outline" placeholder="Restructe Methods" floatLabelType="auto"></ejs-combobox>
    </div>
  </div>
  <div>
    <ejs-textbox [multiline]="true" cssClass="e-outline" [(ngModel)]="applicationProduct.attributes['remark']"></ejs-textbox>
  </div>
</div>
<div [hidden]="stateOfAction !== 'add'" class="row">
  <div class="d-flex justify-content-end mt-2">
    <button class="button-info" (click)="onAdd()">Add</button>
  </div>
</div>
