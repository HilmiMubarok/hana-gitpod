<div class="e-card">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Facility Details</div>
    </div>
  </div>
  <div class="e-card-content">
    <div class="row mb-3 mt-3">
      <jhi-credit-proposal-tab-loan-facility-detail-grid
        [creditProposal]="creditProposal"
      ></jhi-credit-proposal-tab-loan-facility-detail-grid>
    </div>
    <div class="row mb-3 mt-3">
      <div class="col-6">
        <div class="mb-2">
          <ejs-numerictextbox
            [value]="fungsiSuminit()"
            placeholder="Total Initial Limit"
            cssClass="e-outline"
            floatLabelType="Always"
            format="IDR 0,"
            min="0"
            readonly="true"
          ></ejs-numerictextbox>
        </div>
        <div class="mb-2">
          <ejs-numerictextbox
            [value]="fungsiSumchange()"
            placeholder="Total Changes"
            cssClass="e-outline"
            floatLabelType="Always"
            format="IDR 0,"
            min="0"
            readonly="true"
          ></ejs-numerictextbox>
        </div>
      </div>
      <div class="col-6">
        <div class="mb-2">
          <ejs-numerictextbox
            [value]="fungsiSumOS()"
            placeholder="Total O/S"
            cssClass="e-outline"
            floatLabelType="Always"
            format="IDR 0,"
            min="0"
            readonly="true"
          ></ejs-numerictextbox>
        </div>
        <div class="mb-2">
          <ejs-numerictextbox
            [value]="fungsiSumcredit()"
            placeholder="Total Plafond"
            cssClass="e-outline"
            floatLabelType="Always"
            format="IDR 0,"
            min="0"
            readonly="true"
          ></ejs-numerictextbox>
        </div>
      </div>
    </div>

    <div class="row mb-3 mt-3">
      <div class="col-6">
        <div class="mb-2">
          <ejs-numerictextbox
            [(ngModel)]="_creditProposal.attributes['facilityDetail'].custodianFee"
            cssClass="e-outline"
            placeholder="Custody Fee"
            floatLabelType="auto"
            floatLabelType="Always"
            format="IDR 0,"
            min="0"
          ></ejs-numerictextbox>
        </div>
      </div>
      <div class="col-6">
        <button (click)="print()">Print</button>
      </div>
    </div>
    <ejs-richtexteditor [toolbarSettings]="tools" [(ngModel)]="_creditProposal.attributes['facilityDetail'].remarks"> </ejs-richtexteditor>
  </div>
</div>
