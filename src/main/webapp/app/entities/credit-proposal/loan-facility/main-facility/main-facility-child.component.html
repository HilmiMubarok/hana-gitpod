<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="facilityCategory">
    <th mat-header-cell *matHeaderCellDef>Facility Category</th>
    <td mat-cell *matCellDef="let element">{{ element.categoryId }}</td>
  </ng-container>
  <ng-container matColumnDef="mainPlafond">
    <th mat-header-cell *matHeaderCellDef>Main Plafond</th>
    <td mat-cell *matCellDef="let element">{{ element.mainPlafond }}</td>
  </ng-container>
  <ng-container matColumnDef="outstanding">
    <th mat-header-cell *matHeaderCellDef>Outstanding</th>
    <td mat-cell *matCellDef="let element">{{ element.outstanding }}</td>
  </ng-container>
  <ng-container matColumnDef="changes">
    <th mat-header-cell *matHeaderCellDef>Changes</th>
    <td mat-cell *matCellDef="let element">{{ element.changes }}</td>
  </ng-container>
  <ng-container matColumnDef="totalPlafond">
    <th mat-header-cell *matHeaderCellDef>Total Plafond</th>
    <td mat-cell *matCellDef="let element">{{ element.totalPlafond }}</td>
  </ng-container>
  <!-- <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element" class="text-center">
        <button mat-icon-button (click)="openDialog(element); openDialogGroup(element)" id="buttonHide" *ngIf="dialogType === 'debitur'">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container> -->

  <!-- The table will render two header rows, one data row per data object, and two footer rows. -->
  <!-- <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr> -->

  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
  </tr>
  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
</table>
