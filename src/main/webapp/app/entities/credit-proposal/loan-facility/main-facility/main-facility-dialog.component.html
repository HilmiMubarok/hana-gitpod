<div class="style-close">
  <button class="button-close" mat-button mat-dialog-close>X</button>
</div>
<h2 mat-dialog-title class="header-title">Main Facility</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-content>
      <div class="row">
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Approval No</mat-label>
              <input matInput type="text" [(ngModel)]="mainFacility.approvalNumber" disabled />
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Ccy</mat-label>
              <input
                type="text"
                matInput
                [formControl]="myControlCurrency"
                [matAutocomplete]="auto"
                [(ngModel)]="mainCcy"
                (ngModelChange)="getMainCcy()"
              />
              <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFnCurrency">
                <mat-option *ngFor="let option of filteredOptionsCurrency | async" [value]="option">
                  {{ option.abbreviation }} - {{ option.description }}
                </mat-option>
              </mat-autocomplete>
              <!-- <mat-select [(ngModel)]="collateralProperty.attributes.amountCcy" [disabled]="dataSource()">
                              <mat-option value="">Please Select</mat-option>
                              <mat-option *ngFor="let item of currencies" [value]="item.id"> {{ item.abbreviation }} - {{ item.description }} </mat-option>
                            </mat-select> -->
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>?</mat-label>
              <input matInput type="text" disabled />
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Initial Limit</mat-label>
              <input matInput type="text" disabled />
            </mat-form-field>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Current maturity Date</mat-label>
              <input [matDatepicker]="currentMaturityDate" matInput type="text" [(ngModel)]="mainFacility.maturityDate" disabled />
              <mat-datepicker-toggle matSuffix [for]="currentMaturityDate" disabled> </mat-datepicker-toggle>
              <mat-datepicker #currentMaturityDate></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Proposed maturity Date</mat-label>
              <input [matDatepicker]="proposedMaturityDate" matInput type="text" [(ngModel)]="mainFacility.newMaturityDate" />
              <mat-datepicker-toggle matSuffix [for]="proposedMaturityDate"> </mat-datepicker-toggle>
              <mat-datepicker #proposedMaturityDate></mat-datepicker>
              <mat-hint align="end">*) Disabled, Data From HOBIS</mat-hint>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Changes</mat-label>
              <input matInput type="text" [(ngModel)]="mainFacility.changes" disabled />
            </mat-form-field>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Total Plafond</mat-label>
                <input matInput type="text" [(ngModel)]="mainFacility.totalPlafond" disabled />
              </mat-form-field>
            </div>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <div class="mt-3 text-center">
    <button mat-raised-button color="primary" (click)="save()">Save</button>
  </div>
  <div class="mt-3 text-center py-3">
    <button mat-raised-button mat-dialog-close color="warn" (click)="cancel()">Cancel</button>
  </div>
</mat-dialog-actions>
