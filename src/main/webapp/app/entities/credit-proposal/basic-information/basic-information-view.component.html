<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">RM Info</div>
    </div>
  </div>
  <div class="e-card-content">
	<jhi-credit-proposal-personal-info [creditProposal]="creditProposal"></jhi-credit-proposal-personal-info>
  </div>
</div>

<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Personal Info</div>
    </div>
  </div>
  <div class="e-card-content">
    
  </div>
</div>

<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Customer Info</div>
    </div>
  </div>
  <div class="e-card-content">
    <jhi-person-view *ngIf="creditProposal.partyTypeId === 'PERSON'" [item]="creditProposal.prospectPerson" mode="view"></jhi-person-view>
    <jhi-party-group-view
      *ngIf="creditProposal.partyTypeId !== 'PERSON'"
      [item]="creditProposal.prospectOrganization"
      mode="view"
    ></jhi-party-group-view>
  </div>
</div>

<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Account Status</div>
    </div>
  </div>
  <div class="e-card-content">
    <div class="row">
      <div class="col-md-4">
        <ejs-checkbox [(ngModel)]="creditProposal.attributes['basicInformation'].accountStatus.watchList" label="Watch List"></ejs-checkbox>
      </div>
      <div class="col-md-4">
        <ejs-checkbox
          [(ngModel)]="creditProposal.attributes['basicInformation'].accountStatus.restructured"
          label="Restructured"
        ></ejs-checkbox>
      </div>
      <div class="col-md-4">
        <ejs-checkbox
          [(ngModel)]="creditProposal.attributes['basicInformation'].accountStatus.relatedParty"
          label="Related Party"
        ></ejs-checkbox>
      </div>
    </div>
  </div>
</div>

<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Watchlist Debtors</div>
    </div>
  </div>
  <div class="e-card-content">
    <div class="row">
      <div class="col-md-6">
        <h6>Is Debtor Listed on Watchlist or Resturing ?</h6>
        <textarea
          [(ngModel)]="creditProposal.attributes['basicInformation'].watchlistDebtors.isDebtor"
          cssClass="e-outline"
          class="text-area-input"
          id="multiline-always"
          name="typeAlways"
        ></textarea>
      </div>
      <div class="col-md-6">
        <h6>Is Debtor Listed on Watchlist or Resturing ?</h6>
        <textarea
          [(ngModel)]="creditProposal.attributes['basicInformation'].watchlistDebtors.Classification"
          cssClass="e-outline"
          class="text-area-input"
          id="multiline-always"
          name="typeAlways"
        ></textarea>
      </div>
    </div>
  </div>
</div>

<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Group Usaha</div>
      <div class="e-card-content">
        <ejs-grid [dataSource]="gridCreditProposal" [allowPaging]="true">
          <e-columns>
            <e-column field="" headerText="Cif" width="120"></e-column>
            <e-column field="prospectPerson.name" headerText="Company Name" format="C2" width="90"></e-column>
            <e-column field="addressPrimary" headerText="Location" width="120"></e-column>
            <e-column field="prospectPerson.taxIdNumber" headerText="NPWP" format="yMd" width="120"></e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
  </div>
</div>

<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Remark</div>
      <div class="e-card-content">
        <ejs-richtexteditor [(ngModel)]="creditProposal.attributes['basicInformation'].remark" id="rteTool"> </ejs-richtexteditor>
      </div>
    </div>
  </div>
</div>
