<mat-card>
  <mat-card-header>
    <mat-card-title>Initial Debtor Data</mat-card-title>
    <mat-card-subtitle>This is Initial Debtor Data page</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <ejs-menu [items]="menuItems" (select)="selectMenuItem($event)"></ejs-menu>
    <div style="margin-top: 20px" *ngIf="!changeForm">
      <div class="" [hidden]="selectedMenuId !== 'credit-rating'">
        <jhi-credit-rating-view mode="edit" [item]="creditProposal.creditRatings[0]"></jhi-credit-rating-view>
      </div>
      <div class="" [hidden]="selectedMenuId !== 'customer-info'">
        <div>
          <h5>Your customer type:</h5>
          <mat-button-toggle-group [disabled]="creditProposal.id" [(ngModel)]="selectedPartyType" aria-label="Font Style">
            <mat-button-toggle (change)="selectPartyType('individual')" value="individual">Individual</mat-button-toggle>
            <mat-button-toggle (change)="selectPartyType('corporate')" value="corporate">Corporate</mat-button-toggle>
          </mat-button-toggle-group>
        </div>
        <div class="m-5"></div>
        <div *ngIf="selectedPartyType === 'individual'">
          <jhi-cif-view-custom
            [selectedPartyType]="selectedPartyType"
            [prospectPerson]="creditProposal.prospectPerson"
            [spouse]="creditProposal.spouse"
            [primaryAddress]="creditProposal.addresses[0].address"
          ></jhi-cif-view-custom>
        </div>
        <div *ngIf="selectedPartyType === 'corporate'">
          <jhi-cif-view-custom
            [selectedPartyType]="selectedPartyType"
            [prospectOrganization]="creditProposal.prospectOrganization"
            [primaryAddress]="creditProposal.addresses[0].address"
          ></jhi-cif-view-custom>
        </div>
      </div>
    </div>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-raised-button color="primary" (click)="save()">Save</button>
  </mat-card-actions>
</mat-card>
