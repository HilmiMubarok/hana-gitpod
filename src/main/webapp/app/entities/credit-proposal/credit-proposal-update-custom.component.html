<mat-card>
  <ejs-breadcrumb enableNavigation="{true}" cssClass="'e-custom-breadcrumb">
    <e-breadcrumb-items>
      <e-breadcrumb-item text="Home" url="./credit-proposal"></e-breadcrumb-item>
      <e-breadcrumb-item text="Debtor Data" url="./credit-proposal"></e-breadcrumb-item>
      <e-breadcrumb-item [text]="selectedMenuText" class="fa fa-text-width" aria-hidden="true"></e-breadcrumb-item>
    </e-breadcrumb-items>
    <!-- <ng-template #separatorTemplate>
      <div class="e-custom-separator"></div>
  </ng-template> -->
  </ejs-breadcrumb>

  <mat-card-header>
    <mat-card-title>Initial Debtor Data</mat-card-title>
    <mat-card-subtitle>This is Initial Debtor Data page</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <ejs-menu [items]="menuItems" (select)="selectMenuItem($event)"></ejs-menu>
    <div style="margin-top: 20px" *ngIf="!changeForm">
      <div class="" [hidden]="selectedMenuId !== 'collateral-info'">
        <jhi-collateral-view mode="edit" [item]="collateral"></jhi-collateral-view>
      </div>
      <div class="" [hidden]="selectedMenuId !== 'credit-rating'">
        <jhi-credit-rating-view mode="edit" [item]="creditProposal.creditRatings[0]"></jhi-credit-rating-view>
      </div>
      <div class="" [hidden]="selectedMenuId !== 'customer-info'">
        <div class="grid-column">
          <div class="subnav-container-left">
            <div>
              <h5>Your customer type:</h5>
              <mat-button-toggle-group
                *ngIf="selectedPartyType"
                name="toggleGroup"
                [disabled]="creditProposal.id"
                [(ngModel)]="selectedPartyType"
                aria-label="Font Style"
              >
                <mat-button-toggle (change)="selectPartyType('individual')" value="individual">Individual </mat-button-toggle>
                <mat-button-toggle (change)="selectPartyType('corporate')" value="corporate">Corporate </mat-button-toggle>
              </mat-button-toggle-group>
            </div>
            <div class="m-5"></div>
            <div *ngIf="selectedPartyType === 'individual'">
              <jhi-cif-view-custom
                [selectedPartyType]="selectedPartyType"
                [prospectPerson]="creditProposal.prospectPerson"
                [spouse]="creditProposal.spouse"
                [primaryAddress]="creditProposal.addresses[0].address"
              ></jhi-cif-view-custom>
            </div>
            <div *ngIf="selectedPartyType === 'corporate'">
              <jhi-cif-view-custom
                [selectedPartyType]="selectedPartyType"
                [prospectOrganization]="creditProposal.prospectOrganization"
                [primaryAddress]="creditProposal.addresses[0].address"
              ></jhi-cif-view-custom>
            </div>
          </div>
          <div class="subnav-container-right d-none d-sm-block">
            <jhi-credit-proposal-anchor [partyType]="selectedPartyType"></jhi-credit-proposal-anchor>
          </div>
        </div>
      </div>
    </div>
  </mat-card-content>
  <mat-card-actions align="center" class="my-3">
    <a mat-raised-button (click)="previousState()" class="me-3 btn-lg text-uppercase"> back</a>
    <button
      mat-raised-button
      color="primary"
      class="btn-lg text-uppercase"
      (click)="process(task)"
      *ngFor="let task of creditProposal.tasks; let i = index"
    >
      {{ task.name }}
    </button>
    <button mat-raised-button color="primary" class="btn-lg text-uppercase" (click)="save()">Submit</button>
  </mat-card-actions>
</mat-card>
