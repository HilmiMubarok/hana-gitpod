<div class="card-layout">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <div class="e-card-header-title">GENERAL RAC</div>
        <div class="e-card-sub-title fw-bold"></div>
        <ejs-grid [dataSource]="dataGridOne">
          <e-columns>
            <e-column field="No" headerText="No" textAlign="center" width="9"></e-column>
            <e-column field="documentType" headerText="Document Type" textAlign="left" headerTextAlign="left" width="70" height="75">
            </e-column>

            <e-column textAlign="Center" width="10" height="75">
              <div class="select">
                <ng-template #template let-data>
                  <div class="d-flex justify-content-around">
                    <div class="mx-2">
                      <ejs-radiobutton
                        label="Yes"
                        Value="Yes"
                        (change)="onSelect('Yes', data)"
                        [checked]="data.Value === 'Yes'"
                        name="{{ data.No * 111 }}"
                      ></ejs-radiobutton>
                    </div>
                  </div>
                </ng-template>
              </div>
            </e-column>
            <e-column textAlign="Center" width="10" height="75">
              <div class="select">
                <ng-template #template let-data>

                        [checked]="data.Value === 'No'"
                        name="{{ data.No *111 }}"
                      ></ejs-radiobutton>
                    </div>
                  </div>
                </ng-template>
              </div>
            </e-column>

            <e-column field="N/A" headerText="Remaks" textAlign="left" headerTextAlign="left" width="10" height="75"> </e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
