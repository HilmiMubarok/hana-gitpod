<div class="card-layout">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <div class="e-card-header-title">GENERAL RAC</div>
        <div class="e-card-sub-title fw-bold"></div>

        <ejs-grid [dataSource]="dataGridOne" allowTextWrap="true">
          <e-columns>
            <e-column field="No" headerText="No" textAlign="center" width="50"></e-column>
            <e-column field="documentType" headerText="Parameter" textAlign="left" headerTextAlign="left" width="275"> </e-column>

            <e-column headerText="Select" textAlign="left" headerTextAlign="center" width="200">
              <div class="select">
                <ng-template #template let-data>
                  <div class="d-flex justify-content-around">
                    <div class="mx">
                      <!-- [checked]="selectedRadioButtonvalue === 'Yes'"  -->
                      <!-- (change)="onSelect('Yes',data)"
                                   (change)="onKeyUpEvent('Yes', $event, data)" -->

                      <ejs-radiobutton
                        label="Yes"
                        value="Yes"
                        (change)="OnSelect('Yes', data)"
                        [checked]="data.value === 'Yes'"
                        name="{{ data.No }}"
                      ></ejs-radiobutton>
                      <!-- <ejs-radiobutton label="Yes" name="{{ data.value }}"></ejs-radiobutton> -->
                    </div>
                    <!-- (change)="onSelect('No',data)" -->
                    <div class="mx">
                      <ejs-radiobutton
                        label="No"
                        value="No"
                        (change)="OnSelect('No', data)"
                        [checked]="data.value === 'No'"
                        name="{{ data.No }}"
                      ></ejs-radiobutton>
                      <!-- <ejs-radiobutton label="No" name="{{ odataAttrPass.value }}"></ejs-radiobutton> -->
                    </div>
                    <div class="mx">
                      <!-- <ejs-radiobutton label="No" name="{{ odataAttrPass.value }}"></ejs-radiobutton> -->
                    </div>
                  </div>
                </ng-template>
              </div>
            </e-column>
            <e-column headerText="Remaks" textAlign="center" headerTextAlign="center" width="200">
              <ng-template #template let-data>
                <ejs-textbox
                  [multiline]="true"
                  (keyup)="onKeyUpEvent()"
                  [(ngModel)]="remarks[data.No - 1]"
                  cssClass="e-outline"
                  width="300"
                >
                </ejs-textbox>
                <!-- (keyup)="onKeyUpEvent()" [(ngModel)]="remarks[data.No - 1]" -->
              </ng-template>
            </e-column>
          </e-columns>
        </ejs-grid>
      </div>
    </div>
