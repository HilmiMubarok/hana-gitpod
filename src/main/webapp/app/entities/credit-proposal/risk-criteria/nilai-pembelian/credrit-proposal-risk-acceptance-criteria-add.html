<div class="style-close">
  <button class="button-close" mat-button mat-dialog-close>X</button>
</div>
<h2 mat-dialog-title class="header-title"></h2>
<mat-dialog-content>
  <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
    <div class="form-group">
      <div class="col">
        <div class="mb-2">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Nilai Pembelian</mat-label>

            <input
              matInput
              type="text"
              [(ngModel)]="nilaiRac.nilaiPembelian"
              [disabled]="view"
              currencyMask
              [options]="{ prefix: ' ', thousands: ',', decimal: '.', precision: 0 }"
            />
          </mat-form-field>
        </div>
      </div>
    </div>
  </section>
  <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
    <div class="fontsebled row">
      <div class="col-3">Nilai Pembelian</div>
      <div class="col-md-auto">:</div>
      <div class="col col-lg-2">{{ nilaiRac.nilaiPembelian [disabled]="view" }}</div>
    </div>
  </section>

  <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
    <div class="form-group">
      <div class="col">
        <div class="mb-2">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Jenis Jaminan</mat-label>
            <input matInput type="text" [(ngModel)]="nilaiRac.jenisJaminan" [disabled]="view" />
          </mat-form-field>
        </div>
      </div>
    </div>
  </section>
  <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
    <div class="fontsebled row">
      <div class="col-3">Jenis Jaminan</div>
      <div class="col-md-auto">:</div>
      <div class="col col-lg-2">{{ nilaiRac.jenisJaminan [disabled]="view" }}</div>
    </div>
  </section>

  <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
    <div class="form-group">
      <div class="col">
        <div class="mb-2">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Keterangan Jaminan</mat-label>
            <input matInput type="text" [(ngModel)]="nilaiRac.keteranganJaminan" [disabled]="view" />
          </mat-form-field>
        </div>
      </div>
    </div>
  </section>
  <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
    <div class="fontsebled row">
      <div class="col-3">Keterangan Jaminan</div>
      <div class="col-md-auto">:</div>
      <div class="col col-lg-2">{{ nilaiRac.keteranganJaminan [disabled]="view" }}</div>
    </div>
  </section>
  <mat-dialog-actions align="center">
    <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
      <button mat-button *ngIf="!view" (click)="save()">Save</button>
    </section>
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
  <mat-dialog-actions align="center">
    <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
      <button mat-button *ngIf="!view" (click)="save()" hidden>Save</button>
    </section>
  </mat-dialog-actions>
</mat-dialog-content>
