<div class="card">
  <ejs-breadcrumb [enableNavigation]="false">
    <e-breadcrumb-items>
      <e-breadcrumb-item text="Credit Proposal" url="#"> </e-breadcrumb-item>
      <e-breadcrumb-item text="Proposal" url="#"></e-breadcrumb-item>
      <e-breadcrumb-item text="Credit Proposal" url="#"></e-breadcrumb-item>
    </e-breadcrumb-items>
  </ejs-breadcrumb>

  <div style="margin-top: 20px; display: flex; margin-left: 10px" class="e-card-header">
    <div style="display: flex">
      <img width="34px" height="34px" src="../../../content/images/back-icon.svg" />
      <p style="margin-top: 2px" class="back">Back |</p>
    </div>
    <p class="e-card-sub-title">Credit Proposal</p>
  </div>

  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="search-border">
          <div class="row">
            <div class="col-sm-3">
              <ejs-combobox cssClass="e-outline" placeholder="Credit Proposal" floatLabelType="auto" style="background: white">
              </ejs-combobox>
            </div>
            <div class="col-sm-6"></div>
            <div class="col-sm-3">
              <ejs-textbox cssClass="e-outline" placeholder="Search" floatLabelType="auto" style="background: white"> </ejs-textbox>
              <fa-icon class="span-icon" [icon]="faSearch"></fa-icon>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="mb-5">
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="row">
        <div class="row card-layout">
          <div class="e-card">
            <div class="e-card-header">
              <div class="e-card-header-caption">
                <!-- <div class="e-card-header-title">Personal Info</div> -->
                <!-- <div class="e-card-sub-title"></div> -->
              </div>
            </div>
            <div class="e-card-content">
              <ejs-grid #grid [dataSource]="data" [allowPaging]="true" [pageSettings]="pageSettings">
                <e-columns>
                  <e-column field="id" headerText="No" textAlign="center" width="150"></e-column>
                  <e-column field="applicationNumber" headerText="Credit Proposal Number" textAlign="center" width="200"> </e-column>
                  <e-column field="createdDate" headerText="Proposal Date" textAlign="center" width="150"></e-column>
                  <e-column field="createdBy" headerText="Debtor Name" textAlign="center" width="150"></e-column>
                  <e-column field="statusCode" headerText="Customer status/Proposal Type" textAlign="center" width="250"> </e-column>
                  <e-column field="internalName" headerText="Address Of Domicille" textAlign="center" width="250"></e-column>
                  <e-column field="nik" headerText="NIK/Akte" textAlign="center" width="150"></e-column>
                  <e-column field="maturityDate" headerText="Maturity Date" textAlign="center" width="150"></e-column>
                  <e-column field="status" headerText="Status" textAlign="center" width="150"></e-column>
                  <e-column headerText="Action" width="150" textAlign="Center">
                    <ng-template #template let-data>
                      <div>
                        <a [routerLink]="'/credit-proposal/basic-information-1/18'">
                          <fa-icon icon="eye"></fa-icon>
                        </a>
                      </div>
                    </ng-template>
                  </e-column>
                </e-columns>
              </ejs-grid>
              <div class="d-flex justify-content-end mt-3">
                <button ejs-button class="btn-info" (click)="($event)">ADD CREDIT PROPOSAL</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
