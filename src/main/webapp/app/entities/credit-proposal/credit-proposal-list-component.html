<mat-card>
  <mat-card-content>
    <ejs-grid #grid [dataSource]="data" [allowPaging]="true" [pageSettings]="pageSettings">
      <e-columns>
        <e-column field="id" headerText="No" textAlign="center" width="150"></e-column>
        <e-column field="applicationNumber" headerText="Credit Proposal Number" textAlign="center" width="200"></e-column>
        <e-column field="createdDate" headerText="Proposal Date" textAlign="center" width="150"></e-column>
        <e-column field="createdBy" headerText="Debtor Name" textAlign="center" width="150"></e-column>
        <e-column field="statusCode" headerText="Customer status/Proposal Type" textAlign="center" width="250"></e-column>
        <e-column field="internalName" headerText="Address Of Domicille" textAlign="center" width="250"></e-column>
        <e-column field="nik" headerText="NIK/Akte" textAlign="center" width="150"></e-column>
        <e-column field="maturityDate" headerText="Maturity Date" textAlign="center" width="150"></e-column>
        <e-column field="status" headerText="Status" textAlign="center" width="150"></e-column>
        <e-column headerText="Action" width="150" textAlign="Center">
          <ng-template #template let-data>
            <div>
              <a [routerLink]="['/credit-proposal/basic-information-1']">
                <fa-icon icon="eye"></fa-icon>
              </a>
            </div>
          </ng-template>
        </e-column>
      </e-columns>
    </ejs-grid>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-raised-button color="primary">ADD CREDIT PROPOSAL</button>
  </mat-card-actions>
</mat-card>
