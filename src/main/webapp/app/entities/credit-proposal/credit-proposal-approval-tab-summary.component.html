<!-- Application info -->
<div class="card">
  <mat-accordion class="example-headers-align" multi>
    <mat-expansion-panel expanded="true">
      <mat-expansion-panel-header>
        <div>Application Info</div>
      </mat-expansion-panel-header>
      <div class="mx-3">
        <div class="row">
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Credit Proposal Number" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Regional" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Credit Proposal Date" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Bussiness / Segment" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="RM Name" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Booking Branch" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="RM Branch" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Referal" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Debtor Name" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Phone Number" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Mobile Phone" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="NPWP Number" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Adress" floatLabelType="auto" multiline="true"> </ejs-textbox>
            </div>
          </div>
          <div class="col-6">
            <div class="form">
              <ejs-textbox cssClass="e-outline" placeholder="Total Grup Exposure" floatLabelType="auto"> </ejs-textbox>
            </div>
          </div>
        </div>
      </div>
    </mat-expansion-panel>

    <mat-accordion class="example-headers-align" multi>
      <mat-expansion-panel expanded="true">
        <mat-expansion-panel-header>
          <div>Opinion History</div>
        </mat-expansion-panel-header>
        <div class="max-3">
          <ejs-grid allowPaging="true" [dataSource]="opinionHistory">
            <e-columns>
              <e-column field="no" headerText="No" width="50" textAlign="center"></e-column>
              <e-column field="riviewer" headerText="Reviewer Name" width="200" textAlign="center"></e-column>
              <e-column field="position" headerText="Position" width="100" textAlign="center"></e-column>
              <e-column field="date" headerText="Date" width="100" textAlign="center"></e-column>
              <e-column field="opini" headerText="Opini" width="100" textAlign="center"></e-column>
              <e-column headerText="Action" width="100" headerTextAlign="center" textAlign="center">
                <ng-template #template let-data>
                  <button pButton type="button" class="flat-button">
                    <fa-icon icon="eye"></fa-icon>
                  </button>
                </ng-template>
              </e-column>
            </e-columns>
          </ejs-grid>
          <ejs-richtexteditor id="rteTool" [toolbarSettings]="tools" class="form" height="500px">
            <!-- [fileManagerSettings]='filemanager'> -->
          </ejs-richtexteditor>
        </div>
      </mat-expansion-panel>
      <div class="row">
        <div class="col-6">
          <div class="form">
            <ejs-combobox cssClass="e-outline" placeholder="Forward To" floatLabelType="auto"> </ejs-combobox>
          </div>
        </div>
        <div class="col-6"></div>
        <div class="col-6">
          <div class="form">
            <ejs-combobox cssClass="e-outline" placeholder="Reject Reason" floatLabelType="auto"> </ejs-combobox>
          </div>
        </div>
      </div>
      <div class="display-button">
        <button ejs-button cssClass="e-succes" content="Reject" class="button-back-apr"></button>
        <button ejs-button cssClass="e-succes" content="Return to RM" class="button-save-apr"></button>
        <button ejs-button cssClass="e-succes" content="Approved" class="button-save-apr"></button>
        <button ejs-button cssClass="e-succes" content="Save" class="button-save-apr"></button>
        <button ejs-button cssClass="e-succes" content="Back" class="button-back-apr"></button>
      </div>
