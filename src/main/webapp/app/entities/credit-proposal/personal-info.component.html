<div class="e-card-content">
  <div class="row">
    <div class="col-md-6">
      <div class="form-group">
        <ejs-textbox
          [(ngModel)]="creditProposalItem['applicationNumber']"
          placeholder="Credit Proposal No"
          cssClass="e-outline"
          floatLabelType="Always"
        ></ejs-textbox>
      </div>
      <div class="form-group">
        <ejs-textbox
          [(ngModel)]="creditProposalItem.createdDate"
          placeholder="Proposal Date"
          cssClass="e-outline"
          floatLabelType="Always"
        ></ejs-textbox>
      </div>
      <div class="form-group">
        <ejs-textbox
          [(ngModel)]="creditProposalItem.rm['partyName']"
          placeholder="RM Name"
          cssClass="e-outline"
          floatLabelType="Always"
        ></ejs-textbox>
      </div>
      <div class="form-group">
        <ejs-textbox placeholder="RM Branch" cssClass="e-outline" floatLabelType="Always"></ejs-textbox>
      </div>
      <div class="form-group">
        <ejs-textbox placeholder="Regional" cssClass="e-outline" floatLabelType="Always"></ejs-textbox>
      </div>
    </div>

    <div class="col-md-6">
      <div class="form-group">
        <ejs-textbox placeholder="Segment" cssClass="e-outline" floatLabelType="Always"></ejs-textbox>
      </div>
      <div class="form-group">
        <ejs-textbox
          [(ngModel)]="creditProposalItem.cif['bookingBranch']"
          placeholder="Booking Branch"
          cssClass="e-outline"
          floatLabelType="Always"
        ></ejs-textbox>
      </div>
      <div class="form-group">
        <ejs-textbox placeholder="Referral" cssClass="e-outline" floatLabelType="Always"></ejs-textbox>
      </div>
    </div>
  </div>
</div>
