<div class="e-sample-resize-container e-card-resize-container" style="margin-left: 0 !important">
  <div class="row g-0">
    <div class="row card-layout g-0">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">Management Information</div>
          </div>
        </div>
        <div class="e-card-content">
          <div class="row my-6">
            <div class="col">
              <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
                <ejs-textbox
                  placeholder="Based on Notarial Deed No"
                  [(ngModel)]="deeedNumber"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                  disabled
                >
                </ejs-textbox>
              </section>
              <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
                <div class="fontsebled row py-3">
                  <div class="col-4">Based on Notarial Deed No</div>
                  <div class="col-md-auto">:</div>
                  <div class="col col-lg-2">
                    {{ deeedNumber }}
                  </div>
                </div>
              </section>
            </div>
            <div class="col">
              <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
                <ejs-datepicker placeholder="Date" floatLabelType="Auto" cssClass="e-outline" [(ngModel)]="deedDate" disabled>
                </ejs-datepicker>
              </section>
              <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
                <div class="fontsebled row py-3">
                  <div class="col-1">Date</div>
                  <div class="col-md-auto">:</div>
                  <div class="col col-lg-2">
                    {{ deedDate | formatMediumDate }}
                  </div>
                </div>
              </section>
            </div>
          </div>
          <div class="row col-md-6">
            <div class="col">
              <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
                <ejs-textbox
                  placeholder="Business Group Name"
                  [(ngModel)]="businessGroupName"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                  disabled
                >
                </ejs-textbox>
              </section>
              <section *jhiMatrixDir="item.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
                <div class="fontsebled row py-3">
                  <div class="col-4">Business Group Name</div>
                  <div class="col-md-auto">:</div>
                  <div class="col col-lg-2">
                    {{ businessGroupName }}
                  </div>
                </div>
              </section>
            </div>
          </div>
          <div class="row my-3">
            <jhi-organization-management-list [cif]="item.customerNumber" managementType="MANAGEMENT_DATA" [type]="'approval'">
            </jhi-organization-management-list>
            <div class="my-5"></div>
            <jhi-organization-management-list [cif]="item.customerNumber" managementType="SHAREHOLDER" [type]="'approval'" [source]="'cp'">

            <div class="my-5"></div>
            <jhi-organization-management-list [cif]="item.customerNumber" managementType="CONTROL_PERSON" [type]="'approval'">
            </jhi-organization-management-list>
          </div>

          <div

              creditProposalItem.attributes['proposalType'] === 'Total Exposure <= IDR 15 Bio' ||
              creditProposalItem.attributes['proposalType'] === 'Total Exposure Back to Back'

              <div class="row card-layout">
                <div class="e-card-header">
                  <div class="e-card-header-caption">
                    <div class="e-card-header-title">Management Info Remark</div>
                  </div>
                </div>
                <div class="e-card-content">

                    <ejs-documenteditorcontainer
                      #document_editor_container
                      [headers]="customHeadersJWT"

                      [enableLocalPaste]="false"
                      height="100vh"
                      style="display: block"
                      [spellcheck]="false"
                      [enableSpellCheck]="false"
                      (keyDown)="onKeyDown($event)"

                    >
                    </ejs-documenteditorcontainer>
                  </section>

                              </div>

                          </ng-template>
                        </div>
                      </e-column>
                    </e-columns>
