<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Personal Info</div>
            </div>
          </div>
          <jhi-credit-proposal-personal-info [creditProposalItem]="creditProposalItem"></jhi-credit-proposal-personal-info>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Customer Info</div>
            </div>
          </div>
          <div class="e-card-content">
            <div class="form-group">
              <div *ngIf="creditProposalItem.partyTypeId === 'PERSON'">
                <jhi-person-view [item]="creditProposalItem.prospectPerson" [mode]="'view'"></jhi-person-view>
              </div>
              <ng-template #elseBlock>
                <jhi-party-group-view [item]="creditProposalItem.prospectOrganization" [mode]="'view'"></jhi-party-group-view>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Account Status</div>
            </div>
          </div>
          <div class="e-card-content">
            <div class="row">
              <div class="col-md-4">
                <ejs-checkbox
                  [(ngModel)]="creditProposalItem.attributes['basicInformation'].accountStatus.watchList"
                  label="Watch List"
                ></ejs-checkbox>
              </div>
              <div class="col-md-4">
                <ejs-checkbox
                  [(ngModel)]="creditProposalItem.attributes['basicInformation'].accountStatus.restructured"
                  label="Restructured"
                ></ejs-checkbox>
              </div>
              <div class="col-md-4">
                <ejs-checkbox
                  [(ngModel)]="creditProposalItem.attributes['basicInformation'].accountStatus.relatedParty"
                  label="Related Party"
                ></ejs-checkbox>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Watchlist Debtors</div>
            </div>
          </div>
          <div class="row e-card-content">
            <div class="col-md-6">
              <h6>Is Debtor Listed on Watchlist or Resturing ?</h6>
              <textarea
                [(ngModel)]="creditProposalItem.attributes['basicInformation'].watchlistDebtors.isDebtorListedonWatchlistorResturing"
                cssClass="e-outline"
                class="text-area-input"
                id="multiline-always"
                name="typeAlways"
              ></textarea>
            </div>
            <div class="col-md-6">
              <h6>Is Debtor Listed on Watchlist or Resturing ?</h6>
              <textarea
                [(ngModel)]="
                  creditProposalItem.attributes['basicInformation'].watchlistDebtors
                    .areTheClassificationBasedOnInternationalFinanceCorporationEnvironmentalAndSocialNotClassifiedAsHighRiskCategory
                "
                cssClass="e-outline"
                class="text-area-input"
                id="multiline-always"
                name="typeAlways"
              ></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Group Usaha</div>
              <div class="e-card-content">
                <ejs-grid [dataSource]="gridCreditProposal" [allowPaging]="true">
                  <e-columns>
                    <e-column field="" headerText="Cif" width="120"></e-column>
                    <e-column field="prospectPerson.name" headerText="Company Name" format="C2" width="90"></e-column>
                    <e-column field="addressPrimary" headerText="Location" width="120"></e-column>
                    <e-column field="prospectPerson.taxIdNumber" headerText="NPWP" format="yMd" width="120"></e-column>
                  </e-columns>
                </ejs-grid>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Remark</div>
              <div class="e-card-content">
                <ejs-richtexteditor
                  [(ngModel)]="creditProposalItem.attributes['basicInformation'].remark"
                  id="rteTool"
                  [toolbarSettings]="tools"
                >
                </ejs-richtexteditor>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
