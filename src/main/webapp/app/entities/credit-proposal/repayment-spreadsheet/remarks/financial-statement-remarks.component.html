<div class="e-sample-resize-container e-card-resize-container mt-5">
  <div class="row">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">Financial Analysis</div>
            <div class="e-card-sub-title"></div>
            <div style="margin: 1rem">
              <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
                <ejs-documenteditorcontainer
                  #document_editor_container
                  [headers]="customHeadersJWT"
                  [enableToolbar]="true"
                  [enableLocalPaste]="false"
                  height="100vh"
                  style="display: block"
                  [spellcheck]="false"
                  [enableSpellCheck]="false"
                  (keyDown)="onKeyDown($event)"
                  (created)="onCreate()"
                >
                </ejs-documenteditorcontainer>
              </section>
              <section *jhiMatrixDir="creditProposalItem.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
                <ejs-documenteditorcontainer
                  #document_editor_container
                  [headers]="customHeadersJWT"
                  [enableToolbar]="false"
                  [enableLocalPaste]="false"
                  height="100vh"
                  style="display: block"
                  (documentChange)="onDocumentChange()"
                  [enableEditor]="false"
                  [isReadOnly]="true"
                >
                </ejs-documenteditorcontainer>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
