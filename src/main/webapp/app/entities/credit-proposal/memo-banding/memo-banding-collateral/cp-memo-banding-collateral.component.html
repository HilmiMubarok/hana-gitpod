<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Debtor Collateral</div>
    </div>
  </div>
  <div class="e-card-content">
    <jhi-memo-banding-collateral-above-before [creditProposal]="creditProposal"></jhi-memo-banding-collateral-above-before>

    <jhi-cp-memo-banding-collateral-above
      [creditProposal]="creditProposal"
      *ngIf="proposalType === 'Total Exposure > IDR 15 Bio'"
      [collateralProperties]="dataProperty"
    ></jhi-cp-memo-banding-collateral-above>
    <jhi-cp-memo-banding-collateral-above
      [creditProposal]="creditProposal"
      *ngIf="proposalType === 'Total Exposure <= IDR 15 Bio'"
      [collateralProperties]="collateralProperties"
    ></jhi-cp-memo-banding-collateral-above>
    <jhi-cp-memo-banding-collateral-backtoback
      [creditProposal]="creditProposal"
      *ngIf="proposalType === 'Total Exposure Back to Back'"
      [collateralProperties]="collateralProperties"
    ></jhi-cp-memo-banding-collateral-backtoback>
  </div>
</div>
