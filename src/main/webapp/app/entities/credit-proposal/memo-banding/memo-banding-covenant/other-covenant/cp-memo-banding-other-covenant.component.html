<table mat-table id="tblOtherCovenant" [dataSource]="dataSource" class="w-100">
  <ng-container matColumnDef="no">
    <th mat-header-cell *matHeaderCellDef class="grid-index-right rounding-table-left">No</th>
    <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
  </ng-container>
  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef class="grid-index-left">Category</th>
    <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.categoryName }}</td>
  </ng-container>
  <ng-container matColumnDef="sub_category">
    <th mat-header-cell *matHeaderCellDef class="grid-index-left">Sub category</th>
    <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.sub_category }}</td>
  </ng-container>
  <ng-container matColumnDef="covenant">
    <th mat-header-cell *matHeaderCellDef class="grid-index-left">Covenant</th>
    <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.covenant }}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef class="grid-index-left">Status</th>
    <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.status }}</td>
  </ng-container>
  <ng-container matColumnDef="deviation">
    <th mat-header-cell *matHeaderCellDef class="grid-index-left">Deviation</th>
    <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.deviation }}</td>
  </ng-container>
  <ng-container matColumnDef="justification">
    <th mat-header-cell *matHeaderCellDef class="grid-index-left">Justification</th>
    <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.justification }}</td>
  </ng-container>
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef class="grid-index-left rounding-table-right">Status</th>
    <td mat-cell *matCellDef="let element">{{ element.appealStatus }}</td>
  </ng-container>
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
  </tr>
  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
</table>
