<div class="style-close">
  <button class="button-close" mat-button mat-dialog-close>X</button>
</div>
<div class="e-card">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Detail Facility Take Over</div>
    </div>
  </div>
  <div class="e-card-content">
    <div class="row">
      <div class="col-6">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Facility Type</mat-label>
          <input matInput type="text" [(ngModel)]="facilityTakeOver.facilityTypeBank" [disabled]="view" />
        </mat-form-field>
        <div class="row">
          <div class="col-6">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Tenor</mat-label>
              <input matInput type="number" [(ngModel)]="facilityTakeOver.maturityBank" [disabled]="view" />
            </mat-form-field>
          </div>
          <div class="col-4">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Period Type</mat-label>
              <mat-select [(ngModel)]="facilityTakeOver.maturityPeriodType" [disabled]="view">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option *ngFor="let item of periodTypeList" [value]="item">
                  {{ item }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="row">
          <div class="col-8">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>changes</mat-label>
              <input
                currencyMask
                matInput
                type="text"
                [(ngModel)]="facilityTakeOver.changes"
                [disabled]="view"
                [options]="{ prefix: '', thousands: ',', decimal: '.', precision: 0 }"
              />
            </mat-form-field>
          </div>
          <div class="col-4">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Currency</mat-label>
              <mat-select [(ngModel)]="facilityTakeOver.currency" [disabled]="view">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option *ngFor="let item of currencyList" [value]="item">
                  {{ item }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-8">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Outstanding</mat-label>
              <input
                currencyMask
                matInput
                type="text"
                [(ngModel)]="facilityTakeOver.outstandingBank"
                [disabled]="view"
                [options]="{ prefix: '', thousands: ',', decimal: '.', precision: 0 }"
              />
            </mat-form-field>
          </div>
          <div class="col-4">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Currency</mat-label>
              <mat-select [(ngModel)]="facilityTakeOver.currency2" [disabled]="view">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option *ngFor="let item of currencyList" [value]="item">
                  {{ item }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
      <mat-dialog-actions align="center ">
        <button mat-button mat-dialog-close>Cancel</button>
        <button mat-button *ngIf="view !== true" (click)="Onsave()">Save</button>
      </mat-dialog-actions>
    </div>
  </div>
</div>
