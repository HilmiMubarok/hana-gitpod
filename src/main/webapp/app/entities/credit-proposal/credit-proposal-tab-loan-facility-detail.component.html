<div class="e-card">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Detail Fasilitas</div>
    </div>
  </div>
  <div class="e-card-content">
    <div class="row mb-3 mt-3">
      <jhi-credit-proposal-tab-loan-facility-detail-grid
        [creditProposal]="creditProposal"
        (outCreditProposal)="onGetCreditProposal($event)"
      ></jhi-credit-proposal-tab-loan-facility-detail-grid>
    </div>
    <div class="row mb-3 mt-3">
      <div class="col-6">
        <div class="mb-2">
          <ejs-numerictextbox
            [value]="fungsiSuminit()"
            placeholder="Total Initial Limit"
            cssClass="e-outline"
            floatLabelType="Always"
            format="0,"
            min="0"
            readonly="true"
          ></ejs-numerictextbox>
        </div>
        <div class="mb-2">
          <ejs-numerictextbox
            [value]="fungsiSumchange()"
            placeholder="Total Changes"
            cssClass="e-outline"
            floatLabelType="Always"
            format="0,"
            min="0"
            readonly="true"
          ></ejs-numerictextbox>
        </div>
        <!-- <div class="mb-2">
          <ejs-textbox [value]="fungsiSumavailable()" placeholder="Total Available Limit" cssClass="e-outline" floatLabelType="Always" readonly="true"></ejs-textbox>
        </div> -->
      </div>
      <div class="col-6">
        <div class="mb-2">
          <ejs-numerictextbox
            [value]="fungsiSumOS()"
            placeholder="Total O/S"
            cssClass="e-outline"
            floatLabelType="Always"
            format="0,"
            min="0"
            readonly="true"
          ></ejs-numerictextbox>
        </div>
        <div class="mb-2">
          <ejs-numerictextbox
            [value]="fungsiSumcredit()"
            placeholder="Total Credit Limit"
            cssClass="e-outline"
            floatLabelType="Always"
            format="0,"
            min="0"
            readonly="true"
          ></ejs-numerictextbox>
        </div>
        <!-- <div class="mb-2">
          <button (click)="print()">print</button>
        </div> -->
      </div>
    </div>
    <div class="row mb-3 mt-3"></div>
    <ejs-richtexteditor [toolbarSettings]="tools" [(ngModel)]="_creditProposal.attributes['facilityDetail'].remarks"></ejs-richtexteditor>
  </div>
</div>
