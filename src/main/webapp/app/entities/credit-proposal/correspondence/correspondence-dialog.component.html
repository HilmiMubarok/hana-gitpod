<h2 mat-dialog-title>ADD / EDIT CORRESPONDENCE</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-6">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput type="text" [(ngModel)]="correspondence.name" [disabled]="view" />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Position</mat-label>
          <mat-select [(ngModel)]="correspondence.position" name="position" [disabled]="view">
            <mat-option value="">- Please Select -</mat-option>
            <mat-option *ngFor="let item of _position" [value]="item">
              {{ item }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div class="col-6">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Date</mat-label>
          <input [matDatepicker]="date" matInput type="text" [(ngModel)]="correspondence.date" disabled />
          <mat-datepicker-toggle matSuffix [for]="date" [disabled]="view"></mat-datepicker-toggle>
          <mat-datepicker #date disabled="false"></mat-datepicker>
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="row mt-5">
    <div class="col-12">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Notes</mat-label>
          <textarea matInput [(ngModel)]="correspondence.notes" [disabled]="view"></textarea>
        </mat-form-field>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button *ngIf="!view" (click)="save()">Save</button>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
