<div class="e-card">
  <div class="mx-3 py-3">
    <div class="row justify-content-between mb-5">
      <!-- percard -->
      <div class="e-sample-resize-container e-card-resize-container mb-5">
        <div class="row">
          <div class="card-layout mb-3">
            <div class="e-card mb-3 mt-3">
              <!-- tetle -->
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title mb-3 mt-3">CUSTOMER PROFITABILITY</div>
                  <div class="e-card-sub-title"></div>
                </div>
              </div>
              <!--dalam card-->
              <mat-card-content>
                <div class="row">
                  <div class="col 12 table-responsive">
                    <table class="w-100" id="tblPorforma" cellpadding="10">
                      <thead>
                        <tr>
                          <th colspan="1" align="center" style="vertical-align: middle; text-align: center">Revenue</th>
                          <th colspan="1" align="center" style="vertical-align: middle; text-align: center">Current Year</th>
                          <th colspan="1" align="center" style="vertical-align: middle; text-align: center">
                            Avarage Loan Ballance 1 Year
                          </th>
                        </tr>
                      </thead>
                      <tbody></tbody>
                      <tr>
                        <td style="vertical-align: middle; text-align: center">Interest Income From Loan</td>
                        <td style="vertical-align: middle; text-align: center">
                          <input type="text" value="" />
                        </td>
                        <td rowspan="2" style="vertical-align: middle; text-align: center">
                          <input type="text" value="" />
                        </td>
                      </tr>
                      <tr>
                        <td style="vertical-align: middle; text-align: center">Interest Income From Deposit</td>
                        <td style="vertical-align: middle; text-align: center">
                          <input type="text" value="" />
                        </td>
                      </tr>
                      <tr>
                        <td style="vertical-align: middle; text-align: center">Other Income</td>
                        <td style="vertical-align: middle; text-align: center">
                          <input type="text" value="" />
                        </td>
                        <td style="vertical-align: middle; text-align: center">
                          <input type="textBox" value="" />
                        </td>
                      </tr>
                      <tr>
                        <td style="vertical-align: middle; text-align: center">Provison & Admin Fee</td>
                        <td style="vertical-align: middle; text-align: center">
                          <input type="text" value="" />
                        </td>
                        <td rowspan="2" style="vertical-align: middle; text-align: center">
                          <input type="text" value="" />
                        </td>
                      </tr>
                      <tr>
                        <td style="vertical-align: middle; text-align: center">Profit 1 Year</td>
                        <td style="vertical-align: middle; text-align: center">
                          <input type="text" value="" />
                        </td>
                      </tr>
                    </table>
                  </div>
                </div>
              </mat-card-content>
            </div>
          </div>
        </div>
      </div>

      <!-- select ye no -->
      <div class="e-sample-resize-container e-card-resize-container mb-5">
        <div class="row">
          <div class="card-layout mb-3">
            <div class="e-card mb-3 mt-3">
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title mb-3 mt-3">CROSS SELLING FACTOR</div>
                  <div class="e-card-sub-title"></div>
                </div>
              </div>

              <div class="e-card-content mt-3">
                <div class="row">
                  <div class="col md-6 sm-12 d-flex justify-content-center">
                    <div class="grid-table mb-3 mt-3">
                      <ejs-grid [dataSource]="data">
                        <e-columns>
                          <e-column field="No" headerText="No" textAlign="left" width="10"></e-column>
                          <e-column
                            field="Parameter"
                            headerText="Parameter"
                            headerTextAlign="center"
                            textAlign="left"
                            width="30"
                          ></e-column>
                          <e-column headerText="Yes" textAlign="Center" width="10">
                            <div class="select">
                              <ng-template #template let-data>
                                <div class="d-flex justify-content-around">
                                  <div class="mx-2">
                                    <!-- [checked]="selectedRadioButtonValue === 'Yes'"  -->
                                    <ejs-radiobutton
                                      label="Yes"
                                      value="yes"
                                      (change)="onSelect('Yes', data)"
                                      [checked]="data.value === Yes"
                                      name="{{ data.No }}"
                                    ></ejs-radiobutton>
                                    <!-- <ejs-radiobutton label="Yes" name="{{ data.value }}"></ejs-radiobutton> -->
                                  </div>
                                </div>
                              </ng-template>
                            </div>
                          </e-column>
                          <e-column headerText="NO" textAlign="Center" width="10">
                            <div class="select">
                              <ng-template #template let-data>
                                <div class="d-flex justify-content-around">
                                  <div class="mx-2">
                                    <ejs-radiobutton
                                      label="No"
                                      value="no"
                                      (change)="onSelect('No', data)"
                                      [checked]="data.value === No"
                                      name="{{ data.No }}"
                                    ></ejs-radiobutton>
                                    <!-- <ejs-radiobutton label="No" name="{{ data.value }}"></ejs-radiobutton> -->
                                  </div>
                                </div>
                              </ng-template>
                            </div>
                          </e-column>
                          <e-column headerText="Remarks" textAlign="Center" width="50">
                            <ng-template #template let-data>
                              <ejs-textbox cssClass="e-outline" placeholder="" floatLabelType="auto"></ejs-textbox>
                            </ng-template>
                          </e-column>
                        </e-columns>
                      </ejs-grid>
                    </div>
                  </div>
                </div>
              </div>

              <div class="e-card-actions">
                <!-- <button class="btn-info mx-3" ejs-button (click)="save()">SAVE</button> -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="e-sample-resize-container e-card-resize-container">
        <div class="row">
          <div class="card-layout row">
            <div class="e-card">
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title">REMARKS</div>
                  <div class="e-card-sub-title"></div>
                </div>
              </div>
              <div class="e-card-content">
                <ejs-richtexteditor> </ejs-richtexteditor>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
