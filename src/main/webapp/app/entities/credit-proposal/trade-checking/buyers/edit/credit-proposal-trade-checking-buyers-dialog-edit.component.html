<h2 mat-dialog-title>EDIT BUYERS</h2>
<mat-dialog-content>
  <div class="row">
    <!-- LEFT SIDE -->
    <div class="col-6">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Buyers Name</mat-label>
          <input matInput type="text" [(ngModel)]="tradeCheckingBuyers.buyersName" />
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Relationship Since</mat-label>
          <input matInput type="text" [(ngModel)]="tradeCheckingBuyers.relationshipSince" />
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Contact</mat-label>
          <input matInput type="number" [(ngModel)]="tradeCheckingBuyers.contact" />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Reflection</mat-label>
          <input
            matInput
            type="text"
            [ngModel]="tradeCheckingBuyers.reflection | number: '1.0-0'"
            (ngModelChange)="tradeCheckingBuyers.reflection = numberInputChanged($event)"
          />
          <!-- <input matInput type="number" [(ngModel)]="tradeCheckingBuyers.reflection" /> -->
        </mat-form-field>
      </div>
    </div>

    <!-- RIGHT SIDE -->

    <div class="col-6">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Terms Of Payment</mat-label>
          <input
            matInput
            type="text"
            [ngModel]="tradeCheckingBuyers.termsOfPayment | number: '1.0-0'"
            (ngModelChange)="tradeCheckingBuyers.termsOfPayment = numberInputChanged($event)"
          />
          <!-- <input matInput type="text" [(ngModel)]="tradeCheckingBuyers.termsOfPayment" /> -->
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Purchase</mat-label>
          <input
            matInput
            type="text"
            [ngModel]="tradeCheckingBuyers.purchase | number: '1.0-0'"
            (ngModelChange)="tradeCheckingBuyers.purchase = numberInputChanged($event)"
          />
          <!-- <input matInput type="number" [(ngModel)]="tradeCheckingBuyers.purchase" /> -->
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Explanation</mat-label>
          <input matInput type="text" [(ngModel)]="tradeCheckingBuyers.explanation" />
        </mat-form-field>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button *ngIf="edit" (click)="save()">Save</button>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
