<h2 mat-dialog-title>ADD AND DETAIL BUYERS</h2>
<mat-dialog-content>
  <div class="row">
    <!-- LEFT SIDE -->
    <div class="col-6">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Buyers Name</mat-label>
          <input matInput type="text" [(ngModel)]="tradeCheckingBuyers.buyersName" [disabled]="view" />
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Relationship Since</mat-label>
          <input matInput type="text" [(ngModel)]="tradeCheckingBuyers.relationshipSince" [disabled]="view" />
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Contact Person & Telephone</mat-label>
          <input matInput type="number" [(ngModel)]="tradeCheckingBuyers.contact" [disabled]="view" />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>(%) Reflection In Bank Account</mat-label>
          <input matInput type="number" [(ngModel)]="tradeCheckingBuyers.reflection" [disabled]="view" />
        </mat-form-field>
      </div>
    </div>

    <!-- RIGHT SIDE -->

    <div class="col-6">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Terms Of Payment</mat-label>
          <input
            matInput
            type="text"
            [ngModel]="tradeCheckingBuyers.termsOfPayment | currency: 'IDR ':'symbol':'1.0-0'"
            (ngModelChange)="tradeCheckingBuyers.termsOfPayment = currencyInputChanged($event)"
            [disabled]="view"
          />
          <!-- <input matInput type="text" [(ngModel)]="tradeCheckingBuyers.termsOfPayment" [disabled]="view" /> -->
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Purchase %</mat-label>
          <input matInput type="number" [(ngModel)]="tradeCheckingBuyers.purchase" [disabled]="view" />
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Explanation</mat-label>
          <input matInput type="text" [(ngModel)]="tradeCheckingBuyers.explanation" [disabled]="view" />
        </mat-form-field>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button *ngIf="!view" (click)="save()">Save</button>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
