<div class="e-card">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <mat-card-subtitle class="mt-2">Remarks for Others</mat-card-subtitle>
    </div>
  </div>
  <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
    <ejs-documenteditorcontainer
      #document_editor_container
      [enableToolbar]="true"
      [enableLocalPaste]="false"
      height="100vh"
      style="display: block"
      [spellcheck]="false"
      [enableSpellCheck]="false"
      (keyDown)="onKeyDown($event)"
      (created)="onCreate()"
    >
    </ejs-documenteditorcontainer>
  </section>
  <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
    <ejs-documenteditorcontainer
      #document_editor_container
      [enableToolbar]="false"
      [enableLocalPaste]="false"
      height="100vh"
      style="display: block"
      [spellcheck]="false"
      [enableSpellCheck]="false"
      (keyDown)="onKeyDown($event)"
      (created)="onCreate()"
      (documentChange)="onDocumentChange()"
    >
    </ejs-documenteditorcontainer>
  </section>
  <div class="e-card-content">
    <!-- <ejs-richtexteditor [(ngModel)]="creditProposal.attributes['tradeCheckingRemarks'].remarks" [toolbarSettings]="tools">
      </ejs-richtexteditor> -->
    <!-- <button (click)="triggeredSave()">Test Click here</button> -->
  </div>

        <div class="fontsebled row">
            <div class="col-4">Remarks</div>
            <div class="col-md-auto">:</div>
            <div class="col">
                {{ '' }}
            </div>
        </div>
    </section> -->
</div>
