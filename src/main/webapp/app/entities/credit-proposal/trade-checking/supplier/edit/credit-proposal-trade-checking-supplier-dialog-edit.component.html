<h2 mat-dialog-title>EDIT SUPPLIERS</h2>
<mat-dialog-content>
  <div class="row">
    <!-- LEFT SIDE -->
    <div class="col-6">
      <div class="form-group">
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Suppliers Name</mat-label>
            <input matInput type="text" [(ngModel)]="tradeCheckingSupplier.suppliersName" />
          </mat-form-field>
        </section>
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Suppliers Name</mat-label>
            <input matInput type="text" [(ngModel)]="tradeCheckingSupplier.suppliersName" disabled />
          </mat-form-field>
        </section>
      </div>

      <div class="form-group">
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Relationship Since</mat-label>
            <input matInput type="text" [(ngModel)]="tradeCheckingSupplier.relationshipSince" />
          </mat-form-field>
        </section>
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Relationship Since</mat-label>
            <input matInput type="text" [(ngModel)]="tradeCheckingSupplier.relationshipSince" disabled />
          </mat-form-field>
        </section>
      </div>

      <div class="form-group">
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Contact</mat-label>
            <input matInput type="number" [(ngModel)]="tradeCheckingSupplier.contact" />
          </mat-form-field>
        </section>
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Contact</mat-label>
            <input matInput type="number" [(ngModel)]="tradeCheckingSupplier.contact" disabled />
          </mat-form-field>
        </section>
      </div>
      <div class="form-group">
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Reflection</mat-label>
            <input
              matInput
              type="text"
              [ngModel]="tradeCheckingSupplier.reflection | number: '1.0-0'"
              (ngModelChange)="tradeCheckingSupplier.reflection = numberInputChanged($event)"
            />
            <!-- <input matInput type="number" [(ngModel)]="tradeCheckingSupplier.reflection" /> -->
          </mat-form-field>
        </section>
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Reflection</mat-label>
            <input
              matInput
              type="text"
              [ngModel]="tradeCheckingSupplier.reflection | number: '1.0-0'"
              (ngModelChange)="tradeCheckingSupplier.reflection = numberInputChanged($event)"
              disabled
            />
            <!-- <input matInput type="number" [(ngModel)]="tradeCheckingSupplier.reflection" /> -->
          </mat-form-field>
        </section>
      </div>
    </div>

    <!-- RIGHT SIDE -->

    <div class="col-6">
      <div class="form-group">
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Terms Of Payment</mat-label>
            <input
              matInput
              type="text"
              [ngModel]="tradeCheckingSupplier.termsOfPayment | number: '1.0-0'"
              (ngModelChange)="tradeCheckingSupplier.termsOfPayment = numberInputChanged($event)"
            />
            <!-- <input matInput type="text" [(ngModel)]="tradeCheckingSupplier.termsOfPayment" /> -->
          </mat-form-field>
        </section>
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Terms Of Payment</mat-label>
            <input
              matInput
              type="text"
              [ngModel]="tradeCheckingSupplier.termsOfPayment | number: '1.0-0'"
              (ngModelChange)="tradeCheckingSupplier.termsOfPayment = numberInputChanged($event)"
              disabled
            />
            <!-- <input matInput type="text" [(ngModel)]="tradeCheckingSupplier.termsOfPayment" /> -->
          </mat-form-field>
        </section>
      </div>
      <div class="form-group">
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>purchase</mat-label>
            <input
              matInput
              type="text"
              [ngModel]="tradeCheckingSupplier.purchase | number: '1.0-0'"
              (ngModelChange)="tradeCheckingSupplier.purchase = numberInputChanged($event)"
            />
            <!-- <input matInput type="number" [(ngModel)]="tradeCheckingSupplier.purchase" /> -->
          </mat-form-field>
        </section>
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>purchase</mat-label>
            <input
              matInput
              type="text"
              [ngModel]="tradeCheckingSupplier.purchase | number: '1.0-0'"
              (ngModelChange)="tradeCheckingSupplier.purchase = numberInputChanged($event)"
              disabled
            />
            <!-- <input matInput type="number" [(ngModel)]="tradeCheckingSupplier.purchase" /> -->
          </mat-form-field>
        </section>
      </div>

      <div class="form-group">
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Explanation</mat-label>
            <input matInput type="text" [(ngModel)]="tradeCheckingSupplier.explanation" />
          </mat-form-field>
        </section>
        <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Explanation</mat-label>
            <input matInput type="text" [(ngModel)]="tradeCheckingSupplier.explanation" disabled />
          </mat-form-field>
        </section>
      </div>
    </div>
  </div>
</mat-dialog-content>
<section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
  <mat-dialog-actions align="center">
    <button mat-button *ngIf="edit" (click)="save()">Save</button>
    <button mat-button (click)="close()">Close</button>
  </mat-dialog-actions>
</section>
<section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
  <mat-dialog-actions align="center">
    <button mat-button (click)="close()">Close</button>
  </mat-dialog-actions>
</section>
