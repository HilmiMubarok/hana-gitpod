<div class="card-layout row mb-5">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <div class="e-card-header-title">INDUSTRY LIMIT EXPOSURE</div>
        <div class="e-card-sub-title"></div>
      </div>
    </div>
    <div class="e-card-content">
      <div class="row">
        <div class="col-6">
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
            <div class="form-group">
              <ejs-datepicker
                cssClass="e-outline"
                placeholder="Date As Of"
                floatLabelType="auto"
                [(ngModel)]="creditProposal.attributes['industryLimit'].date"
              >
              </ejs-datepicker>
            </div>
          </section>
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
            <p class="lable-form-title">Date As Of</p>
          </section>

          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
            <div class="form-group">
              <ejs-numerictextbox
                placeholder="Limit in % from total O/S loan"
                cssClass="e-outline"
                floatLabelType="Auto"
                [(ngModel)]="creditProposal.attributes['industryLimit'].limitInFromTotalOS"
                format="0,"
                min="0"
              >
              </ejs-numerictextbox>
            </div>
          </section>
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
            <p class="lable-form-title">Limit in % from total O/S loan</p>
          </section>

          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
            <div class="form-group">
              <ejs-numerictextbox
                placeholder="Limit in IDR MIO"
                cssClass="e-outline"
                floatLabelType="Auto"
                [(ngModel)]="creditProposal.attributes['industryLimit'].limitInIDR"
                format="IDR 0,"
                min="0"
              >
              </ejs-numerictextbox>
            </div>
          </section>
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
            <p class="lable-form-title">Limit in IDR MIO</p>
          </section>

          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
            <div class="form-group">
              <ejs-numerictextbox
                placeholder="Remaining Balance"
                cssClass="e-outline"
                floatLabelType="Auto"
                [(ngModel)]="creditProposal.attributes['industryLimit'].remainingBalance"
                format="0,"
                min="0"
              >
              </ejs-numerictextbox>
            </div>
          </section>
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
            <p class="lable-form-title">Remaining Balance</p>
          </section>
        </div>

        <div class="col-6">
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
            <div class="form-group">
              <ejs-numerictextbox
                placeholder="Industry Limit Exposure"
                cssClass="e-outline"
                floatLabelType="Auto"
                [(ngModel)]="creditProposal.attributes['industryLimit'].industryLimitExposures"
                format="0,"
                min="0"
              >
              </ejs-numerictextbox>
            </div>
          </section>
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
            <p class="lable-form-title">Industry</p>
          </section>
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
            <div class="form-group">
              <ejs-numerictextbox
                placeholder="Proposed Amount"
                cssClass="e-outline"
                floatLabelType="Auto"
                [(ngModel)]="creditProposal.attributes['industryLimit'].proposeAmount"
                format="0,"
                min="0"
              >
              </ejs-numerictextbox>
            </div>
          </section>
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
            <p class="lable-form-title">Proposed Amount</p>
          </section>

          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
            <div class="form-group">
              <ejs-numerictextbox
                placeholder="Remaining Balance after this Proposal"
                cssClass="e-outline"
                floatLabelType="Auto"
                [(ngModel)]="creditProposal.attributes['industryLimit'].remainingBalanceAfter"
                format="0,"
                min="0"
              ></ejs-numerictextbox>
            </div>
          </section>
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
            <p class="lable-form-title">Remaining Balance after this Proposal</p>
          </section>

          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
            <div class="form-group">
              <ejs-textbox
                placeholder="Status"
                cssClass="e-outline"
                floatLabelType="Auto"
                [(ngModel)]="creditProposal.attributes['industryLimit'].status"
              ></ejs-textbox>
            </div>
          </section>
          <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
            <p class="lable-form-title">Status</p>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
