<ejs-grid [dataSource]="dataSource" allowTextWrap="true">
  <e-columns>
    <e-column field="covenant" headerText="Covenant" width="200" textAlign="left" headerTextAlign="center"> </e-column>
    <e-column headerText="Status" width="150" textAlign="center">
      <ng-template #template let-data>
        <ejs-dropdownlist
          (change)="onKeyUpEvent('status', $event, data)"
          [(ngModel)]="statusValue[data.id]"
          [dataSource]="status"
          placeholder="Select a Status"
          cssClass="e-outline"
          [disabled]="statusValue"
          [readonly]="true"
          [value]="statusValue[data.id]"
        >
        </ejs-dropdownlist>
      </ng-template>
    </e-column>
    <e-column field="deviation" headerText="Deviation" width="200" textAlign="left" headerTextAlign="center">
      <ng-template #template let-data>
        <ejs-textbox
          [multiline]="true"
          (keyup)="onKeyUpEvent('deviation', $event, data)"
          [(ngModel)]="deviation[data.id]"
          [disabled]="statusValue[data.id] == 'Applied'"
          cssClass="e-outline"
          [disabled]="statusValue"
        >
        </ejs-textbox>
      </ng-template>
    </e-column>
  </e-columns>
</ejs-grid>
