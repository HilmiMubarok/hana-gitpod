<table mat-table id="tblOtherCovenant" *ngIf="creditProposalItem" [dataSource]="dataSource" class="w-100">
  <ng-container matColumnDef="no">
    <th mat-header-cell *matHeaderCellDef>No</th>
    <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
  </ng-container>
  <ng-container matColumnDef="covenant">
    <th mat-header-cell *matHeaderCellDef>Covenant</th>
    <td mat-cell *matCellDef="let element">{{ element.covenant }}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let element">{{ element.status }}</td>
  </ng-container>
  <ng-container matColumnDef="deviation">
    <th mat-header-cell *matHeaderCellDef>Deviation</th>
    <td mat-cell *matCellDef="let element">{{ element.deviation }}</td>
  </ng-container>
  <ng-container matColumnDef="justification">
    <th mat-header-cell *matHeaderCellDef>Justification</th>
    <td mat-cell *matCellDef="let element">{{ element.justification }}</td>
  </ng-container>
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
  </tr>
  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
</table>
