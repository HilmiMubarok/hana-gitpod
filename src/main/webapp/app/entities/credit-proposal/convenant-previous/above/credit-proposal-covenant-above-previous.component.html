<ejs-grid [dataSource]="standardDataGridAbove" allowTextWrap="true">
  <e-columns>
    <e-column field="covenant" headerText="Covenant" width="250" textAlign="left" headerTextAlign="center"> </e-column>
    <e-column headerText="Status" width="100" textAlign="center">
      <ng-template #template let-data>
        <ejs-dropdownlist
          (change)="onKeyUpEvent('status', $event, data)"
          [(ngModel)]="statusValue[data.id]"
          [dataSource]="status"
          placeholder="Select a Status"
          cssClass="e-outline"
          [readonly]="true"
          [value]="statusValue[data.id]"
        >
        </ejs-dropdownlist>
      </ng-template>
    </e-column>
