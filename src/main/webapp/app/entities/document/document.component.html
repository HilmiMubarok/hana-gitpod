<mat-card>
  <mat-card-header>
    <mat-card-subtitle>Documents</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="folders" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="docName">
        <th mat-header-cell *matHeaderCellDef>Document Name</th>
        <td mat-cell *matCellDef="let element">{{ element['folder'] }}</td>
      </ng-container>
      <ng-container matColumnDef="docDate">
        <th mat-header-cell *matHeaderCellDef>Document Issued Date</th>
        <td mat-cell *matCellDef="let element">{{ element['date'] | formatMediumDate }}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="view(element)">
            <mat-icon>remove_red_eye</mat-icon>
          </button>
          <button mat-icon-button (click)="delete(element)">
            <mat-icon [hidden]="gakbisa()">delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
  <mat-card-actions align="center">
    <button mat-raised-button color="primary" [hidden]="gakbisa()" (click)="openDialog()"><mat-icon>add</mat-icon> UPLOAD</button>
  </mat-card-actions>
</mat-card>
