<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-document-heading" data-cy="DocumentCreateUpdateHeading" jhiTranslate="losgwApp.document.home.createOrEditLabel">
        Create or edit a Document
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" [hidden]="editForm.get('id')!.value == null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.document.documentId" for="field_documentId">Document Id</label>
          <input
            type="text"
            class="form-control"
            name="documentId"
            id="field_documentId"
            data-cy="documentId"
            formControlName="documentId"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.document.documentTypeId" for="field_documentTypeId">Document Type Id</label>
          <input
            type="text"
            class="form-control"
            name="documentTypeId"
            id="field_documentTypeId"
            data-cy="documentTypeId"
            formControlName="documentTypeId"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.document.documentTypeDescription" for="field_documentTypeDescription"
            >Document Type Description</label
          >
          <input
            type="text"
            class="form-control"
            name="documentTypeDescription"
            id="field_documentTypeDescription"
            data-cy="documentTypeDescription"
            formControlName="documentTypeDescription"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.document.values" for="field_values">Values</label>
          <input type="text" class="form-control" name="values" id="field_values" data-cy="values" formControlName="values" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.document.comments" for="field_comments">Comments</label>
          <input type="text" class="form-control" name="comments" id="field_comments" data-cy="comments" formControlName="comments" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.document.valuesContentType" for="field_valuesContentType"
            >Values Content Type</label
          >
          <input
            type="text"
            class="form-control"
            name="valuesContentType"
            id="field_valuesContentType"
            data-cy="valuesContentType"
            formControlName="valuesContentType"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.document.description" for="field_description">Description</label>
          <input
            type="text"
            class="form-control"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
