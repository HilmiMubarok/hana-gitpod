<h2 mat-dialog-title>Upload Document</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-6">
      <ngx-dropzone accept="*" multiple="true" (change)="onSelect($event)">
        <ngx-dropzone-label>Drop file here or choose your file</ngx-dropzone-label>
      </ngx-dropzone>

      <div class="row">
        <ngx-dropzone-preview
          class="col-4"
          ngProjectAs="ngx-dropzone-preview"
          *ngFor="let f of files"
          [removable]="true"
          (removed)="onRemove(f)"
        >
          <ngx-dropzone-label>{{ f.name }} ({{ f.type }})</ngx-dropzone-label>
        </ngx-dropzone-preview>
      </div>
    </div>
    <div class="col-6">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Tanggal Dokumen</mat-label>
          <input [matDatepicker]="documentDate" matInput type="text" [(ngModel)]="document.documentDate" disabled />
          <mat-datepicker-toggle matSuffix [for]="documentDate"></mat-datepicker-toggle>
          <mat-datepicker #documentDate disabled="false"></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Dokumen Jaminan</mat-label>
          <mat-select [(ngModel)]="document.documentType">
            <mat-option *ngFor="let item of documentTypes | keyvalue" [value]="item.value">{{ item.value }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>No Dokumen</mat-label>
          <input matInput type="text" [(ngModel)]="document.documentNumber" />
        </mat-form-field>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button (click)="save()">Save</button>
</mat-dialog-actions>
