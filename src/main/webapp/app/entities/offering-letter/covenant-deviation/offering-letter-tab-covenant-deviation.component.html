<ejs-menu
  [enableScrolling]="true"
  cssClass="e-rounded-menu e-custom-scroll"
  [items]="menuItems"
  (select)="selectMenuItem($event)"
></ejs-menu>
<div *ngIf="selectedMenu === 'COVENANT'">
  <div class="e-sample-resize-container e-card-resize-container mb-5">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Standard Terms & Conditions</div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="card-content">
            <jhi-covenant
              [isViewMode]="isViewMode"
              [creditProposalItem]="creditProposalItem"
              [proposalType]="creditProposalItem.attributes['proposalType']"
            ></jhi-covenant>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="e-sample-resize-container e-card-resize-container mb-5">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Other Covenant</div>
              <div class="e-card-sub-title"></div>
              <div class="card-content">
                <jhi-other-covenant [creditProposalItem]="creditProposalItem"></jhi-other-covenant>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="selectedMenu === 'DEVIATION'">
  <jhi-deviation
    [isViewMode]="isViewMode"
    [creditProposalItem]="creditProposalItem"
    [proposalType]="creditProposalItem.attributes['proposalType']"
  >
  </jhi-deviation>
  <div class="e-sample-resize-container e-card-resize-container mb-5">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Other Deviation</div>
              <div class="e-card-sub-title"></div>
              <div class="card-content">
                <jhi-other-covenant [creditProposalItem]="creditProposalItem"></jhi-other-covenant>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="selectedMenu === 'DOCUMENT CHECKLIST'">
  <div>
    <jhi-credit-proposal-document-checklist [creditProposal]="creditProposal"></jhi-credit-proposal-document-checklist>
  </div>
</div>
