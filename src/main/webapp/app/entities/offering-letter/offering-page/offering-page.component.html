<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">OFFERING LETTER PREPARATION</div>
    </div>
  </div>
  <div class="row py-2">
    <div class="col-md-6">
      <div>
        <div class="form-group">
          <ejs-textbox
            [(ngModel)]="creditProposal.attributes['offeringLetterPreparation'].noLetter"
            placeholder="Offering Letter No."
            cssClass="e-outline"
            floatLabelType="Auto"
          ></ejs-textbox>
          <!-- <ejs-textbox placeholder="Offering Letter No." cssClass="e-outline" floatLabelType="Always" disabled> </ejs-textbox> -->
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div>
        <div class="form-group">
          <ejs-textbox placeholder="Debtor Name" [value]="creditProposal.cif.name" cssClass="e-outline" floatLabelType="Always" disabled>
          </ejs-textbox>
        </div>
      </div>
    </div>
  </div>
  <div class="row py-2">
    <div class="col-md-6">
      <div>
        <div class="form-group">
          <ejs-datepicker
            cssClass="e-outline"
            placeholder="Offering Letter Date"
            floatLabelType="auto"
            [(ngModel)]="creditProposal.attributes['offeringLetterPreparation'].dateOffering"
          >
          </ejs-datepicker>
          <!-- <ejs-textbox placeholder="Offering Letter Date" cssClass="e-outline" floatLabelType="Always" disabled> </ejs-textbox> -->
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div>
        <div class="form-group">
          <ejs-textbox
            placeholder="address"
            [(ngModel)]="creditProposal.addresses[0].address.address1"
            cssClass="e-outline"
            [multiline]="true"
            floatLabelType="Always"
            disabled
          >
          </ejs-textbox>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="e-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">SIGNER</div>
    </div>
  </div>

  <jhi-signer-page></jhi-signer-page>
</div>
