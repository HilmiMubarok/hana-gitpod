<div class="wrapper-card">
  <e-card>
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <div class="header-title">OFFERING LETTER PREPARATION</div>
      </div>
    </div>
    <div class="row py-2">
      <div class="col-md-6">
        <div>
          <div class="form-group">
            <ejs-textbox
              [(ngModel)]="creditProposal.oLFinalDocNo"
              placeholder="Offering Letter No."
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="true"
            >
            </ejs-textbox>
            <!-- <ejs-textbox placeholder="Offering Letter No." cssClass="e-outline" floatLabelType="Always" disabled> </ejs-textbox> -->
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div>
          <div class="form-group">
            <ejs-textbox placeholder="Debtor Name" [value]="creditProposal.cif.name" cssClass="e-outline" floatLabelType="Always" disabled>
            </ejs-textbox>
          </div>
        </div>
      </div>
    </div>
    <div class="row py-2">
      <div class="col-md-6">
        <div>
          <div class="form-group">
            <ejs-datepicker
              cssClass="e-outline"
              placeholder="Offering Letter Date"
              floatLabelType="auto"
              [(ngModel)]="creditProposal.attributes['offeringLetterPreparation'].dateOffering"
              [disabled]="field"
              [format]="'yyyy/MM/dd'"
            >
            </ejs-datepicker>
            <!-- <ejs-textbox placeholder="Offering Letter Date" cssClass="e-outline" floatLabelType="Always" disabled> </ejs-textbox> -->
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div>
          <div class="form-group">
            <ejs-textbox
              placeholder="address"
              [(ngModel)]="creditProposal.attributes['offeringLetterPreparation'].address"
              cssClass="e-outline"
              [multiline]="true"
              floatLabelType="Always"
              [disabled]="field"
            >
            </ejs-textbox>
          </div>
        </div>
      </div>
    </div>
  </e-card>
</div>

<div class="wrapper-card mb-5">
  <div class="e-card-header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">SIGNER</div>
    </div>
  </div>
  <e-card> <jhi-signer-page></jhi-signer-page></e-card>
</div>
