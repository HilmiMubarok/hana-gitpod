<div class="style-close">
  <button class="button-close" mat-button mat-dialog-close>X</button>
</div>
<h2 mat-dialog-title class="header-title">SIGNER</h2>
<mat-dialog-content>
  <div class="row justify-content-between">
    <div class="col-6">
      <div class="mb-2">
        <section>
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Debitor / Pt. Bank Keb Hana Indonesia</mat-label>
            <mat-select [(ngModel)]="offeringLetter.debitorType" (selectionChange)="onChangeValue($event.value)" [disabled]="field">
              <mat-option value="">- Please Select -</mat-option>
              <mat-option *ngFor="let item of listOfValue.signerList" [value]="item">
                {{ item }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </section>
      </div>

      <div class="mb-2">
        <section>
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Position</mat-label>
            <input matInput type="text" [(ngModel)]="offeringLetter.position" [disabled]="field" />
          </mat-form-field>
        </section>
      </div>
    </div>

    <!-- batas -->
    <div class="col-6">
      <div class="mb-2">
        <div class="row">
          <!-- with ngif -->
          <section [hidden]="isShow" id="name_employe">
            <!-- <div class="col-8"> -->
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Name</mat-label>
              <input
                matInput
                type="text"
                [(ngModel)]="offeringLetter.debitorNameGroup || offeringLetter.debitorNamePerson"
                [disabled]="field"
              />
            </mat-form-field>
          </section>
          <!-- if debtor -->
          <section [hidden]="!isShow" id="name_debitor">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Name</mat-label>
              <input matInput type="text" [(ngModel)]="offeringLetter.debitorNamePerson" [disabled]="field" />
            </mat-form-field>
          </section>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button (click)="save()" [hidden]="field">Save</button>
</mat-dialog-actions>
