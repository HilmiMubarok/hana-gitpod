<div class="style-close">
  <button class="button-close" mat-button mat-dialog-close>X</button>
</div>
<h2 mat-dialog-title class="header-title">SIGNER</h2>
<mat-dialog-content>
  <div class="row justify-content-between">
    <div class="col-6">
      <div class="mb-2">
        <section>
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Debitor / Pt.Bank Keb Hana Indonesia</mat-label>
            <mat-select name="facilityType">
              <mat-option *ngFor="let item of listOfValue.signerList" [value]="item">
                {{ item }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </section>
        <section>
          <p class="lable-form-title">Debitor / Pt.Bank Keb Hana Indonesia :</p>
        </section>
      </div>
      <div class="col-6">
        <div class="mb-2">
          <div class="row">
            <section>
              <div class="col-8">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Name</mat-label>
                  <mat-select>
                    <mat-option value="">- Please Select -</mat-option>
                    <mat-option *ngFor="let item of listOfValue.signerList" [value]="item">
                      {{ item }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </section>
            <section>
              <p class="lable-form-title">Name:</p>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button (click)="save()">Save</button>
</mat-dialog-actions>
