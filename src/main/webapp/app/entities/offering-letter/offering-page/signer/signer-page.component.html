<div class="table-responsive-material">
  <table mat-table *ngIf="!loading" class="w-100" appearance="outline">
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element"></td>
    </ng-container>
    <ng-container matColumnDef="debtor">
      <th mat-header-cell *matHeaderCellDef>Debitor / Pt. Bank Hana Keb Indonesia</th>
      <td mat-cell *matCellDef="let element"></td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button (click)="openDialog()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="onDelete()">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
    </tr>
    <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
  </table>
</div>
<mat-card id="material-loading-bar">
  <mat-progress-spinner *ngIf="loading" color="warn" mode="indeterminate"> </mat-progress-spinner>
</mat-card>
<div align="right" class="mt-5">
  <button mat-raised-button color="success" (click)="openDialog()">ADD</button>
</div>
