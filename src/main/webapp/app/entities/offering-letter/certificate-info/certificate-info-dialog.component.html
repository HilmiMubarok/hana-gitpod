<h2 mat-dialog-title class="header-title">Certificate Info</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-content>
      <div class="row">
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Bukti Kepemilikan</mat-label>
              <input matInput type="text" [(ngModel)]="certificateInfo.buktiKepemilikan" />
            </mat-form-field>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Jangka Waktu kepemilikan</mat-label>
                <input [matDatepicker]="waktuKepemilikan" matInput type="text" [(ngModel)]="certificateInfo.jangkaWaktuKepemilikan" />
                <mat-datepicker-toggle matSuffix [for]="waktuKepemilikan"> </mat-datepicker-toggle>
                <mat-datepicker #waktuKepemilikan></mat-datepicker>
              </mat-form-field>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Luas Tanah</mat-label>
              <input matInput type="text" [(ngModel)]="certificateInfo.luasTanah" disabled />
            </mat-form-field>
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Luas Bangunan</mat-label>
              <input matInput type="text" [(ngModel)]="certificateInfo.luasBangunan" disabled />
            </mat-form-field>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <div class="mt-3 text-center py-3">
    <button mat-raised-button class="confirm-button-no" style="margin-right: 7px" (click)="openCancelDialog()">Cancel</button>
  </div>
  <div class="mt-3 text-center">
    <button mat-raised-button class="confirm-button-yes" (click)="save()">Save</button>
  </div>
</mat-dialog-actions>
