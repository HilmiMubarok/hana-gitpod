<div>
  <!-- Loan Facility Detail -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>
  <div>
    <!-- <jhi-loan-facility-detail-previous [isOffering]="true" [creditProposal]="creditProposal"> </jhi-loan-facility-detail-previous> -->
    <!-- <jhi-loan-facility-detail-history
      *ngIf="creditProposal.attributes['previousHistory']"
      [isViewMode]="true"
      [takeOutCompare]="true"
      [creditProposal]="creditProposal"
    ></jhi-loan-facility-detail-history> -->
    <jhi-loan-facility-detail-history
      *ngIf="creditProposal.attributes['previousHistory']"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
    ></jhi-loan-facility-detail-history>
    <div class="e-card" *ngIf="!creditProposal.attributes['previousHistory']">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <div class="e-card-header-title">Facility Details</div>
        </div>
      </div>
      <div class="alert alert-warning m-3" role="alert">
        <span style="font-weight: bold">No previous data was found!</span>
      </div>
    </div>
  </div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL DAR</div>
  </div>
  <div>
    <jhi-credit-proposal-tab-loan-facility-detail [takeOutCompare]="true" [isViewMode]="true" [creditProposal]="creditProposal">
    </jhi-credit-proposal-tab-loan-facility-detail>
  </div>

  <!-- Collateral Info -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>
  <div>
    <jhi-collateral-info-history
      *ngIf="creditProposal.attributes['previousHistory']"
      [isCompareDar]="false"
      [source]="'summaryAll'"
      [parentSource]="'loan-analys'"
      [takeOutCompare]="true"
      [creditProposal]="creditProposal"
    ></jhi-collateral-info-history>
    <div class="e-card" *ngIf="!creditProposal.attributes['previousHistory']">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <div class="e-card-header-title">Collateral Info</div>
        </div>
      </div>
      <div class="alert alert-warning m-3" role="alert">
        <span style="font-weight: bold">No previous data was found!</span>
      </div>
    </div>
  </div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL DAR</div>
  </div>
  <div>
    <jhi-credit-proposal-collateral-info
      [takeOutCompare]="true"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
      [collateralProperties]="collateralProperties"
    >
    </jhi-credit-proposal-collateral-info>
  </div>

  <div class="e-card-actions"></div>

  <!-- Covenant -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>
  <div>
    <!-- <jhi-credit-proposal-tab-covenant-previous [isViewMode]="true" [setActiveMenu]="menuCovenant" [creditProposalItem]="creditProposal">
    </jhi-credit-proposal-tab-covenant-previous> -->
    <jhi-credit-proposal-tab-covenant-history
      *ngIf="creditProposal.attributes['previousHistory']"
      [source]="'summaryAll'"
      [parentSource]="'loan-analys'"
      [isCompareDar]="false"
      [isOnOffering]="true"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [setActiveMenu]="menuCovenant"
      [creditProposalItem]="creditProposal"
    >
    </jhi-credit-proposal-tab-covenant-history>

    <div class="e-card" *ngIf="!creditProposal.attributes['previousHistory']">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <div class="e-card-header-title">Standard Terms & Conditions</div>
        </div>
      </div>
      <div class="alert alert-warning m-3" role="alert">
        <span style="font-weight: bold">No previous data was found!</span>
      </div>
    </div>
  </div>
</div>
<div class="e-card-actions"></div>

<div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
  <div class="e-card-header-title">FINAL DAR</div>
</div>
<div>
  <jhi-credit-proposal-tab-covenant
    [isOnOffering]="true"
    [isViewMode]="true"
    [setActiveMenu]="menuCovenant"
    [creditProposalItem]="creditProposal"
  >
  </jhi-credit-proposal-tab-covenant>
</div>

<div class="e-card-actions"></div>

<!-- Deviation -->
<div class="e-card-content mt-3">
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>
  <div>
    <!-- <jhi-credit-proposal-tab-covenant-previous [isViewMode]="true" [setActiveMenu]="menuDeviation" [creditProposalItem]="creditProposal">
      </jhi-credit-proposal-tab-covenant-previous> -->
    <jhi-credit-proposal-tab-covenant-history
      *ngIf="creditProposal.attributes['previousHistory']"
      [source]="'summaryAll'"
      [parentSource]="'loan-analys'"
      [isOnOffering]="true"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [setActiveMenu]="menuDeviation"
      [creditProposalItem]="creditProposal"
    >
    </jhi-credit-proposal-tab-covenant-history>

    <div class="e-card" *ngIf="!creditProposal.attributes['previousHistory']">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <div class="e-card-header-title">Deviation</div>
        </div>
      </div>
      <div class="alert alert-warning m-3" role="alert">
        <span style="font-weight: bold">No previous data was found!</span>
      </div>
    </div>
  </div>
  <div class="e-card-actions"></div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL DAR</div>
  </div>
  <div>
    <jhi-credit-proposal-tab-covenant
      [isOnOffering]="true"
      [isViewMode]="true"
      [setActiveMenu]="menuDeviation"
      [creditProposalItem]="creditProposal"
    >
    </jhi-credit-proposal-tab-covenant>
  </div>

  <div class="e-card-actions"></div>
</div>
