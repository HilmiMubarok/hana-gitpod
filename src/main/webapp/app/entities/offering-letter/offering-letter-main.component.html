<mat-sidenav-container [hasBackdrop]="true">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Offering Letter" url="/offering-letter"></e-breadcrumb-item>
            <e-breadcrumb-item text="Edit" url=""></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Offering Letter</p>
        </div>
      </div>
    </div>

    <div class="e-card-content">
      <div *ngIf="selectedMenu === 'sub-menu'" class="e-sample-resize-container e-card-resize-container"></div>
    </div>
    <div class="e-card-actions mx-auto mb-5 mt-3">
      <button
        style="margin-right: 25px"
        mat-raised-button
        *ngFor="let task of tasks"
        (click)="processTask(task)"
        class="btn-lg text-uppercase"
      >
        {{ task.caption }}
      </button>
      <button mat-raised-button class="btn-lg text-uppercase" (click)="onSave()">Save</button>
    </div>
  </div>
  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav" mode="over">
    <div class="p-3" style="padding-top: 90px !important">
      <div style="font-size: 1.5rem; font-weight: 600">Select your destination:</div>

      <mat-list role="list">
        <div *ngFor="let item of subMenu">
          <mat-list-item role="listitem">
            <a
              *ngIf="!item.hasOwnProperty('child')"
              href="javascript:void(0)"
              class="text-capitalize"
              (click)="routeSubMenu(item); drawer.toggle()"
              >{{ item.text }}</a
            >
          </mat-list-item>
          <mat-list-item class="text-capitalize" style="margin-top: -45px" *ngIf="item.hasOwnProperty('child')">{{
            item.text
          }}</mat-list-item>
          <mat-list role="list" *ngIf="item.hasOwnProperty('child')" style="margin-left: 10px; margin-top: -10px">
            <mat-list-item role="listitem" *ngFor="let itemChild of item.child">
              <mat-icon matListIcon style="font-size: 10px; display: flex; align-items: center">panorama_fish_eye</mat-icon>
              <a href="javascript:void(0)" (click)="routeSubMenu(itemChild); drawer.toggle()" class="text-capitalize">{{
                itemChild.text
              }}</a>
            </mat-list-item>
          </mat-list>
        </div>
      </mat-list>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
<button
  matTooltip="Click this for show sub menu of Offering Letter"
  style="z-index: 1"
  class="btn-menu-floating"
  (click)="drawer.toggle()"
  mat-fab
  color="warn"
  matTooltipPosition="before"
>
  <mat-icon>more_vert</mat-icon>
</button>
