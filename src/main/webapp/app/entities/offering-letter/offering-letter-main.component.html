<mat-sidenav-container [hasBackdrop]="true">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="{{ title }}" url="{{ parentPath }}/{{ getText(value) }}"> </e-breadcrumb-item>
            <e-breadcrumb-item text="Edit" url="{{ parentPath }}/{{ getText(value) }}{{ creditProposal.id }}/{{ titleUrl }}">
            </e-breadcrumb-item>
            <e-breadcrumb-item
              text="{{ getTextMenu() }} {{ titleMenu }}"
              url="{{ parentPath }}/{{ getText(value) }}{{ creditProposal.id }}/{{ titleUrl }}/{{ selectedMenu }}"
            >
            </e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">{{ title }}</p>
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="e-card-content">
      <div *ngIf="selectedMenu === 'credit-proposal-summary'" class="e-sample-resize-container e-card-resize-container">
        <!-- Credit proposal -->
        <mat-card class="mb-3">
          <mat-card-content>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="creditProposal.applicationNumber"
                    placeholder="Proposal Number"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-textbox>
                </div>
                <div class="form-group mb-3">
                  <ejs-textbox
                    required
                    disabled
                    [value]="creditProposal.createdDate | formatMediumDate"
                    placeholder="Proposal Date"
                    cssClass="e-outline"
                    floatLabelType="Always"
                  ></ejs-textbox>
                </div>
                <div class="form-group mb-3">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="creditProposal.cif.customerId"
                    placeholder="CIF Number"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-textbox>
                </div>
                <div class="form-group mb-3">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="creditProposal.cif.name"
                    placeholder="Customer Name"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-textbox>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <mat-form-field>
                    <mat-label>Proposal Type</mat-label>
                    <mat-select name="proposalType" [(ngModel)]="creditProposal.attributes.proposalType" disabled>
                      <mat-option value="">- Please select proposal type -</mat-option>
                      <mat-option *ngFor="let item of proposType" [value]="item.code">
                        {{ item.value }}
                      </mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
                <div class="form-group mb-3">
                  <ejs-textbox
                    [(ngModel)]="creditProposal.attributes['basicInformation'].refferal"
                    placeholder="Referral"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    disabled
                  ></ejs-textbox>
                </div>
                <jhi-credit-proposal-booking-branch [creditProposal]="creditProposal" [isViewLoan]="true">
                </jhi-credit-proposal-booking-branch>
              </div>
            </div>
          </mat-card-content>
        </mat-card>

        <!-- RM -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-personal-info [creditProposal]="creditProposal"></jhi-credit-proposal-personal-info>
          </mat-card-content>
        </mat-card>

        <!-- cust info -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-person
              *ngIf="creditProposal.partyTypeId === 'PERSON'"
              [item]="creditProposal.prospectPerson"
              [deptorData]="creditProposal"
              [partyCif]="partyCif"
              mode="view"
            >
            </jhi-credit-proposal-person>
            <jhi-party-group-view
              [mode]="'view'"
              *ngIf="creditProposal.partyTypeId !== 'PERSON'"
              [item]="creditProposal"
            ></jhi-party-group-view>
          </mat-card-content>
        </mat-card>

        <!-- postal address -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-party-cif-customer-info-postal-address [disabled]="true" [partyPostalAddress]="postalAdresss">
            </jhi-party-cif-customer-info-postal-address>
          </mat-card-content>
        </mat-card>
        <!-- [isViewMode]="true" -->
        <!-- loan facility -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-loan-facility-detail [creditProposal]="creditProposal"> </jhi-credit-proposal-tab-loan-facility-detail>
          </mat-card-content>
        </mat-card>

        <!-- tab Exposure -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-exposure [creditProposal]="creditProposal"></jhi-credit-proposal-tab-exposure>
          </mat-card-content>
        </mat-card>

        <!-- collateral info -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-collateral-info
              #creditProposalCollateralInfoComponent
              [creditProposal]="creditProposal"
              [source]="'summaryAll'"
              [parentSource]="'loan-analys'"
              [isViewMode]="true"
            >
            </jhi-credit-proposal-collateral-info>
          </mat-card-content>
        </mat-card>

        <!-- document: summary gabung -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-summary
              [fileDar]="dataFileDar"
              [fileCompliance]="dataFileCompliance"
              [source]="'summaryAll'"
              [fileSPPK]="dataOfferingSPPK"
              [item]="creditProposal"
              [sourceComponent]="'loan'"
            >
            </jhi-credit-proposal-tab-summary>
            <jhi-approve-final [creditProposal]="creditProposal"></jhi-approve-final>
          </mat-card-content>
        </mat-card>

        <div *ngIf="url === 'distribution' && creditProposal.statusDescription === 'Ol Distribution'">
          <jhi-assign-to (assignTo)="onAssignTo($event)" [creditProposal]="creditProposal" [url]="url"> </jhi-assign-to>
        </div>
      </div>

      <!-- Offering Letter -->

      <div *ngIf="selectedMenu === 'offering-letter'" class="e-sample-resize-container e-card-resize-container">
        <jhi-offering-page [creditProposal]="creditProposal"></jhi-offering-page>
      </div>

      <!-- Basic Information -->
      <div *ngIf="selectedMenu === 'basic-information'" class="e-sample-resize-container e-card-resize-container">
        <div>
          <mat-card class="mb-3">
            <mat-card-content>
              <jhi-credit-proposal-basic-information [creditProposal]="creditProposal"> </jhi-credit-proposal-basic-information>
            </mat-card-content>
          </mat-card>
        </div>
      </div>

      <!-- Document Checklist -->
      <div *ngIf="selectedMenu === 'document-checklist'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-document-checklist [creditProposal]="creditProposal"> </jhi-credit-proposal-document-checklist>
      </div>

      <!-- Bussines Activity -->
      <div *ngIf="selectedMenu === 'business-activity'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-busines-activity [creditProposalItem]="creditProposal" [projectAnalysis]="subMenuItems">
        </jhi-credit-proposal-busines-activity>
      </div>

      <!-- Loan Facility -->
      <div *ngIf="selectedMenu === 'loan-facility-detail'" class="e-sample-resize-container e-card-resize-container">
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-loan-facility-detail [parentSource]="'loan-analys'" [creditProposal]="creditProposal">
            </jhi-credit-proposal-tab-loan-facility-detail>
          </mat-card-content>
        </mat-card>
      </div>
      <div *ngIf="selectedMenu === 'loan-facility'" class="e-sample-resize-container e-card-resize-container">
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-loan-facility-detail
              *ngIf="!isHistoryExist"
              [isViewMode]="true"
              [parentSource]="'loan-analys'"
              [creditProposal]="creditProposal"
            >
            </jhi-credit-proposal-tab-loan-facility-detail>
            <jhi-loan-facility-detail-history
              *ngIf="isHistoryExist"
              [parentSource]="'loan-analys'"
              [creditProposal]="creditProposal"
              [isViewMode]="true"
            ></jhi-loan-facility-detail-history>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Exposure -->
      <div *ngIf="selectedMenu === 'exposure'" class="e-sample-resize-container e-card-resize-container">
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-exposure [creditProposal]="creditProposal"></jhi-credit-proposal-tab-exposure>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Risk Acceptance Criteria -->
      <div *ngIf="selectedMenu === 'risk-acceptance-criteria'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-risk-acceptance-criteria [item]="creditProposal"> </jhi-credit-proposal-risk-acceptance-criteria>
      </div>

      <!-- Collateral Info -->
      <div *ngIf="selectedMenu === 'collateral-info'" class="e-sample-resize-container e-card-resize-container">
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-collateral-info
              #creditProposalCollateralInfoComponent
              [creditProposal]="creditProposal"
              [parentSource]="'loan-analys'"
              [isViewMode]="true"
            >
            </jhi-credit-proposal-collateral-info>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Management Information -->
      <div *ngIf="selectedMenu === 'management-information'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-management-info [creditProposalItem]="creditProposal"> </jhi-credit-proposal-management-info>
      </div>

      <!-- Financial Statement -->
      <div *ngIf="selectedMenu === 'financial-statement'" class="e-sample-resize-container e-card-resize-container">
        <jhi-repayment-spreadsheet
          [creditProposalItem]="creditProposal"
          *ngIf="creditProposal.attributes.proposalType === 'Total Exposure <= IDR 15 Bio'"
          [jhifilter]="creditProposal.attributes.proposalType"
          [saveWordMinio]="saveWord"
        ></jhi-repayment-spreadsheet>

        <jhi-repayment-spreadsheet
          [creditProposalItem]="creditProposal"
          *ngIf="
            creditProposal.attributes.proposalType === 'Total Exposure > IDR 15 Bio' ||
            creditProposal.attributes.proposalType === 'Total Exposure Back to Back'
          "
          [jhifilter]="creditProposal.attributes.proposalType"
          [saveWordMinio]="saveWord"
        >
        </jhi-repayment-spreadsheet>
      </div>

      <!-- Slik Checking -->
      <div *ngIf="selectedMenu === 'slik-checking'" class="e-sample-resize-container e-card-resize-container">
        <jhi-loan-analys-slik-main></jhi-loan-analys-slik-main>
      </div>

      <!-- Bank Account Analysis -->
      <div *ngIf="selectedMenu === 'bank-account-analyst'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-bank-account-analyst [creditProposal]="creditProposal"> </jhi-credit-proposal-bank-account-analyst>
      </div>

      <!-- Propose Pricing -->
      <div *ngIf="selectedMenu === 'propose-pricing'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-propose-pricing [creditProposal]="creditProposal"> </jhi-credit-proposal-propose-pricing>
      </div>

      <!-- Covenant & TBO And Deviation -->
      <div *ngIf="selectedMenu === 'convenant-tbo'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-tab-covenant [isViewMode]="true" *ngIf="!isHistoryExist" [creditProposalItem]="creditProposal">
        </jhi-credit-proposal-tab-covenant>
        <jhi-credit-proposal-tab-covenant-history [isViewMode]="true" *ngIf="isHistoryExist" [creditProposalItem]="creditProposal">
        </jhi-credit-proposal-tab-covenant-history>
        <!-- <jhi-offering-letter-tab-covenant-deviation [creditProposalItem]="creditProposal"> </jhi-offering-letter-tab-covenant-deviation> -->
      </div>

      <!-- Covenant Dan Document checklist -->
      <div *ngIf="selectedMenu === 'covenant-document-check'" class="e-sample-resize-container e-card-resize-container">
        <jhi-covenant-temp [isViewMode]="true" [creditProposalItem]="creditProposal"></jhi-covenant-temp>
        <!-- <jhi-offering-letter-tab-covenant [creditProposalItem]="creditProposal"> </jhi-offering-letter-tab-covenant> -->
      </div>

      <!-- Convenant on finalize (:enable:) -->
      <div *ngIf="selectedMenu === 'finalize-convenant'" class="e-sample-resize-container e-card-resize-container">
        <jhi-covenant-temp [creditProposalItem]="creditProposal"></jhi-covenant-temp>
      </div>

      <!-- Summary -->
      <div *ngIf="selectedMenu === 'summary'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-tab-summary [item]="creditProposal"></jhi-credit-proposal-tab-summary>
      </div>

      <!-- opinion -->
      <div *ngIf="selectedMenu === 'credit-opinion'" class="e-sample-resize-container e-card-resize-container">
        <jhi-loan-analys-opinion [creditProposalItem]="creditProposal"></jhi-loan-analys-opinion>
      </div>

      <!-- compare data -->
      <div *ngIf="selectedMenu === 'compare-approval-report'" class="e-sample-resize-container e-card-resize-container">
        <jhi-comprae-approval-report [creditProposal]="creditProposal"></jhi-comprae-approval-report>
      </div>

      <!-- complience rec -->
      <div *ngIf="selectedMenu === 'compliance-recomendation'" class="e-sample-resize-container e-card-resize-container">
        <jhi-loan-analys-compliance [creditProposal]="creditProposal"></jhi-loan-analys-compliance>
        <jhi-loan-analys-opinion-compliance-part [creditProposalItem]="creditProposal"></jhi-loan-analys-opinion-compliance-part>
      </div>
    </div>

    <div class="e-card-actions mx-auto mb-5 mt-3">
      <button
        style="margin-right: 25px"
        mat-raised-button
        *ngFor="let task of tasks"
        (click)="processTask(task)"
        class="btn-lg text-uppercase"
      >
        {{ task.caption }}
      </button>
      <button
        style="margin-right: 25px"
        mat-raised-button
        *ngIf="creditProposal.statusId === 'OL_FINALIZE' || creditProposal.statusId === 'OL_ASSIGNED'"
        (click)="generate()"
        class="btn-lg text-uppercase"
      >
        Generate SPPK
      </button>
      <button
        mat-raised-button
        class="btn-lg text-uppercase"
        *ngIf="creditProposal.statusId === 'OL_COMPLETE'"
        hidden
        (click)="onSave('default')"
      >
        Save
      </button>
      <button mat-raised-button class="btn-lg text-uppercase" *ngIf="creditProposal.statusId !== 'OL_COMPLETE'" (click)="onSave('default')">
        Save
      </button>
    </div>
  </div>
  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav" mode="over">
    <div class="p-3" style="padding-top: 90px !important">
      <div style="font-size: 1.5rem; font-weight: 600">Select your destination:</div>

      <mat-list role="list">
        <div *ngFor="let item of subMenu">
          <mat-list-item role="listitem">
            <a
              *ngIf="!item.hasOwnProperty('child')"
              href="javascript:void(0)"
              class="text-capitalize"
              (click)="routeSubMenu(item); drawer.toggle()"
              >{{ item.text }}</a
            >
          </mat-list-item>
          <mat-list-item class="text-capitalize" style="margin-top: -45px" *ngIf="item.hasOwnProperty('child')">{{
            item.text
          }}</mat-list-item>
          <mat-list role="list" *ngIf="item.hasOwnProperty('child')" style="margin-left: 10px; margin-top: -10px">
            <mat-list-item role="listitem" *ngFor="let itemChild of item.child">
              <mat-icon matListIcon style="font-size: 10px; display: flex; align-items: center">panorama_fish_eye </mat-icon>
              <a href="javascript:void(0)" (click)="routeSubMenu(itemChild); drawer.toggle()" class="text-capitalize">{{
                itemChild.text
              }}</a>
            </mat-list-item>
          </mat-list>
        </div>
      </mat-list>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
<button
  matTooltip="Click this for show sub menu of Offering Letter"
  style="z-index: 1"
  class="btn-menu-floating"
  (click)="drawer.toggle()"
  mat-fab
  color="warn"
  matTooltipPosition="before"
>
  <mat-icon>more_vert</mat-icon>
</button>
