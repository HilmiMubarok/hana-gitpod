<div class="row remove-row-scroll">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Lending Program Parameters" url="/lending-program-parameter"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Lending Program Parameters</p>
        </div>
      </div>
    </div>
    <div style="margin: 1rem">
      <mat-card>
        <table mat-table class="w-100" [dataSource]="items">
          <ng-container matColumnDef="no">
            <th mat-header-cell *matHeaderCellDef width="5%" class="rounding-table-left grid-index-right">No.</th>
            <td mat-cell *matCellDef="let i = index" class="grid-index-right">{{ i + 1 }}</td>
          </ng-container>

          <ng-container matColumnDef="lending-program">
            <th mat-header-cell *matHeaderCellDef class="grid-index-left">Lending Program</th>
            <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.description }}</td>
          </ng-container>

          <ng-container matColumnDef="start-date">
            <th mat-header-cell *matHeaderCellDef class="grid-index-right">Start Date</th>
            <td mat-cell *matCellDef="let element" class="grid-index-right">{{ element.fromDate | formatMediumDate }}</td>
          </ng-container>

          <ng-container matColumnDef="end-date">
            <th mat-header-cell *matHeaderCellDef class="grid-index-right">End Date</th>
            <td mat-cell *matCellDef="let element" class="grid-index-right">{{ element.thruDate | formatMediumDate }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef class="grid-index-left">Status</th>
            <td mat-cell *matCellDef="let element" class="grid-index-left">{{ element.statusDescription }}</td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="rounding-table-right grid-index-left">Action</th>
            <td mat-cell *matCellDef="let element" class="grid-index-left text-capitalize">
              <button mat-icon-button (click)="openDialog(element)">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
          </tr>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let element; columns: displayedColumns"></tr>
        </table>
        <mat-paginator
          showFirstLastButtons
          ngClass="transparant"
          [length]="paginatorLength"
          [pageSize]="paginatorPageSize"
          [pageSizeOptions]="paginatorPageSizeOption"
          (page)="loadDataLazy($event)"
        >
        </mat-paginator>
      </mat-card>
    </div>
    <div class="e-card-actions">
      <div class="d-flex justify-content-center mb-3 mt-3">
        <button mat-raised-button (click)="openDialog()" class="button-styling">ADD</button>
      </div>
    </div>
  </div>
</div>
