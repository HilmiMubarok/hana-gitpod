<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.lendingProgramParameter.home.createOrEditLabel">Lending Program Parameters</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{lendingProgramParameter.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.lendingProgramParameter.code" for="field_code">Code</label>
                <input type="text" class="form-control" name="code" id="field_code" [(ngModel)]="item.code" [disabled]="readOnly()" />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.lendingProgramParameter.description" for="field_description"
                  >Description</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="description"
                  id="field_description"
                  [(ngModel)]="item.description"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.lendingProgramParameter.statusCode" for="field_statusCode"
                  >Status Code</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="statusCode"
                  id="field_statusCode"
                  [(ngModel)]="item.statusCode"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.lendingProgramParameter.statusId" for="field_statusId"
                  >Status Id</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="statusId"
                  id="field_statusId"
                  [(ngModel)]="item.statusId"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.lendingProgramParameter.statusCode" for="field_statusCode"
                  >Status Code</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="statusCode"
                  id="field_statusCode"
                  [(ngModel)]="item.statusCode"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.lendingProgramParameter.createdBy" for="field_createdBy"
                  >Created By</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="createdBy"
                  id="field_createdBy"
                  [(ngModel)]="item.createdBy"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.lendingProgramParameter.createdDate" for="field_createdDate"
                  >Created Date</label
                >
                <div class="input-group">
                  <p-calendar
                    inputId="field_createdDate"
                    name="input_createdDate"
                    [(ngModel)]="item.createdDate"
                    dateFormat="dd-mm-yy"
                    [showTime]="false"
                    hourFormat="24"
                    [showSeconds]="true"
                    [showIcon]="true"
                    [hideOnDateTimeSelect]="true"
                    [disabled]="readOnly()"
                  ></p-calendar>
                </div>
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.lendingProgramParameter.lastModifiedBy" for="field_lastModifiedBy"
                  >Last Modified By</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="lastModifiedBy"
                  id="field_lastModifiedBy"
                  [(ngModel)]="item.lastModifiedBy"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label
                  class="form-control-label"
                  jhiTranslate="losgwApp.lendingProgramParameter.lastModifiedDate"
                  for="field_lastModifiedDate"
                  >Last Modified Date</label
                >
                <div class="input-group">
                  <p-calendar
                    inputId="field_lastModifiedDate"
                    name="input_lastModifiedDate"
                    [(ngModel)]="item.lastModifiedDate"
                    dateFormat="dd-mm-yy"
                    [showTime]="false"
                    hourFormat="24"
                    [showSeconds]="true"
                    [showIcon]="true"
                    [hideOnDateTimeSelect]="true"
                    [disabled]="readOnly()"
                  ></p-calendar>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
