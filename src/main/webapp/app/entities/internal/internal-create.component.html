<div class="row">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Branch" url="/branch"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Add New Branch</p>
        </div>
      </div>
    </div>
    <div class="e-card-content">
      <mat-card>
        <mat-card-header>
          <mat-card-subtitle class="fw-bold">Branch</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Branch Id </mat-label>
                  <input matInput type="text" [(ngModel)]="internal.id" />
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Branch Name </mat-label>
                  <input matInput type="text" [(ngModel)]="internal.name" />
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Branch Type </mat-label>
                  <mat-select [(ngModel)]="internal.internalTypeId">
                    <mat-option *ngFor="let item of branchtype" [value]="item.id">
                      {{ item.description }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>

            <div class="col-6">
              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>Description </mat-label>
                  <input matInput type="text" [(ngModel)]="internal.statusDescription" />
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field appearance="outline" class="w-100 pr-1">
                  <mat-label>Superior Branch Name </mat-label>
                  <!-- (focus) = "clickDropSupper()" -->
                  <mat-select [(ngModel)]="internal.parentId">
                    <!-- <input matInput type="text" [(ngModel)]="filter" placeholder="Search in here" (keyup)="filterListCareUnit($event,$event.target.value)" (focusout)="onFocusOutEvent($event)"> -->

                    <mat-option *ngFor="let item of superior" [value]="item.id">
                      {{ item.name }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="form-group">
                <mat-form-field class="w-100" appearance="outline">
                  <mat-label>No Telp </mat-label>
                  <input matInput type="text" [(ngModel)]="internal.attributes.officePhone" />
                </mat-form-field>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

      <br />
      <mat-card>
        <mat-card-header>
          <mat-card-subtitle class="fw-bold">Address Info</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <jhi-internal-address-view [internalData]="internal.postalAddress"></jhi-internal-address-view>
        </mat-card-content>
      </mat-card>
      <button style="float: right; margin-top: 15px" type="submit" (click)="submit()" mat-raised-button color="primary">Submit</button>
    </div>
  </div>
</div>
