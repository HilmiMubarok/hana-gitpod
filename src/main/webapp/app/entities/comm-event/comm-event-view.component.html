<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.commEvent.notes" for="field_notes">Notes</label>
        <input type="text" class="form-control" name="notes" id="field_notes" [(ngModel)]="item.notes" [disabled]="readOnly()" />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.commEvent.startDate" for="field_startDate">Start Date</label>
        <div class="input-group">
          <p-calendar
            inputId="field_startDate"
            name="input_startDate"
            [(ngModel)]="item.startDate"
            dateFormat="dd-mm-yy"
            [showTime]="false"
            hourFormat="24"
            [showSeconds]="true"
            [showIcon]="true"
            [hideOnDateTimeSelect]="true"
            [disabled]="readOnly()"
          >
          </p-calendar>
        </div>
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.commEvent.endDate" for="field_endDate">End Date</label>
        <div class="input-group">
          <p-calendar
            inputId="field_endDate"
            name="input_endDate"
            [(ngModel)]="item.endDate"
            dateFormat="dd-mm-yy"
            [showTime]="false"
            hourFormat="24"
            [showSeconds]="true"
            [showIcon]="true"
            [hideOnDateTimeSelect]="true"
            [disabled]="readOnly()"
          >
          </p-calendar>
        </div>
      </div>

      <div class="form-group">
        <label jhiTranslate="losgwApp.commEvent.commEventType" for="field_commEventType">Comm Event Type</label>
        <select
          class="form-control"
          id="field_commEventType"
          name="commEventType"
          [(ngModel)]="item.commEventTypeId"
          [disabled]="commEventTypeId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="commEventTypeOption.id" *ngFor="let commEventTypeOption of commeventtypes; trackBy: trackCommEventTypeById">
            {{ commEventTypeOption.description }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.commEvent.purposeType" for="field_purposeType">Purpose Type</label>
        <select
          class="form-control"
          id="field_purposeType"
          name="purposeType"
          [(ngModel)]="item.purposeTypeId"
          [disabled]="purposeTypeId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="purposeTypeOption.id" *ngFor="let purposeTypeOption of purposetypes; trackBy: trackPurposeTypeById">
            {{ purposeTypeOption.description }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.commEvent.statusItem" for="field_statusItem">Status Item</label>
        <select
          class="form-control"
          id="field_statusItem"
          name="statusItem"
          [(ngModel)]="item.statusItemId"
          [disabled]="statusItemId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="statusItemOption.id" *ngFor="let statusItemOption of statusitems; trackBy: trackStatusItemById">
            {{ statusItemOption.description }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.commEvent.party" for="field_party">Party</label>
        <select
          class="form-control"
          id="field_party"
          name="party"
          [(ngModel)]="item.partyId"
          [disabled]="partyId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">{{ partyOption.id }}</option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.commEvent.contactMech" for="field_contactMech">Contact Mech</label>
        <select
          class="form-control"
          id="field_contactMech"
          name="contactMech"
          [(ngModel)]="item.contactMechId"
          [disabled]="contactMechId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="contactMechOption.id" *ngFor="let contactMechOption of contactmeches; trackBy: trackContactMechById">
            {{ contactMechOption.id }}
          </option>
        </select>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
