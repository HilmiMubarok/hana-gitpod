<div>
  <mat-card style="margin-top: 12px">
    <mat-card-header>
      <mat-card-subtitle class="label-font-detail">History TBO</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="applicationDocument" class="w-100">
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef width="5%" class="grid-index-number rounding-table-left">No</th>
          <td mat-cell *matCellDef="let i = index" class="grid-index-label">{{ i + 1 }}</td>
        </ng-container>
        <ng-container matColumnDef="currentDate">
          <th mat-header-cell *matHeaderCellDef class="grid-index-string">Current Date</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label-string">
            {{ element.attributes.documentDate | date: 'YYYY-MM-dd' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="proposedDate">
          <th mat-header-cell *matHeaderCellDef class="grid-index-string">Proposed Date</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label-string">{{ element.attributes.proposedDate }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="grid-index-string">Status</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label-string">{{ element.statusAppDocId }}</td>
        </ng-container>

        <!-- <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef width="13%" class="grid-index-string-action rounding-table-right">Action</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button (click)="view(element)">
              <mat-icon>remove_red_eye</mat-icon>
            </button>
            <ng-container *ngIf="isElement">
              <button mat-icon-button (click)="update(element)">
                <mat-icon>create</mat-icon>
              </button>
              <button mat-icon-button (click)="delete(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </ng-container>
          </td>
        </ng-container> -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="['no', 'currentDate', 'proposedDate', 'status'].length">No records found.</td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="['no', 'currentDate', 'proposedDate', 'status']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['no', 'currentDate', 'proposedDate', 'status']"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
