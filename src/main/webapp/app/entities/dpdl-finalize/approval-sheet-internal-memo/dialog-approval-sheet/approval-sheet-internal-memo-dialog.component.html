<mat-card>
    <mat-card-header>
      <mat-card-title>Internal Memo</mat-card-title>
    </mat-card-header>
    <mat-card-content>
<div class="container">
    <div class="row">
      <div class="col-6">
        <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Name</mat-label>
              <input matInput type="text"  />
            </mat-form-field>
          </div>

          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Date</mat-label>
              <input [matDatepicker]="date" matInput type="text" />
              <mat-datepicker-toggle matSuffix [for]="date"></mat-datepicker-toggle>
              <mat-datepicker #date disabled="false"></mat-datepicker>
            </mat-form-field>
          </div>
        </div>
      <div class="col-6">
        <ngx-dropzone accept="*" multiple="true" >
          <ngx-dropzone-label>Drop file here or choose your file</ngx-dropzone-label>
        </ngx-dropzone>
      </div>
    
  </div>
  </div>
  </mat-card-content>
  </mat-card>


  <div class="mt-3" style="display: flex; justify-content: center; align-items: center; width: 100%;">
    <button (click)="closeDialog()" class="btn btn-danger">Close</button>
    <button style="margin-left: 12px;" (click)="closeDialog()" class="btn btn-primary">Save</button>
</div>
