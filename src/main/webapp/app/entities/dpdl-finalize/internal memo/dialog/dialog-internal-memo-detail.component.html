<h2 mat-dialog-title class="label-font-detail">Detail Document Upload DPDL</h2>
<mat-dialog-content align="center" class="align-center">
  <table class="table">
    <thead>
      <tr>
        <th>Document Name</th>
        <th>Date</th>
        <th>Remarks</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ changeCharacter(folder['files'][0]['tags']['documentName']) }}</td>
        <td>{{ folder['files'][0]['tags']['documentDate'] | formatMediumDate }}</td>
        <td>{{ changeCharacter(folder['files'][0]['tags']['remarks']) }}</td>
      </tr>
    </tbody>
  </table>
  <ul class="list-image">
    <li *ngFor="let item of folder['files']">
      <div style="background-color: #d9d9d9; height: auto; width: 300px; border-radius: 60px">
        <div
          style="width: 300px"
          *ngIf="
            item.key.split('.').indexOf('png') > -1 ||
            item.key.split('.').indexOf('jpg') > -1 ||
            item.key.split('.').indexOf('jpeg') > -1 ||
            item.key.split('.').indexOf('gif') > -1
          "
        >
          <img [src]="item.url" style="width: 300px; border-radius: 20px" />
          <div style="width: 300px; position: sticky; margin-top: -100px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>
        <div *ngIf="item.key.split('.').indexOf('csv') > -1" style="width: 300px">
          <img width="300px" src="../../../content/images/csv.png" />
          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="item.key.split('.').indexOf('mp3') > -1" style="width: 300px">
          <img width="300px" src="../../../content/images/mp3.png" />
          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="item.key.split('.').indexOf('svg') > -1" style="width: 300px">
          <img width="300px" src="../../../content/images/svg.jpg" />
          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="item.key.split('.').indexOf('rar') > -1" style="width: 300px">
          <img width="300px" src="../../../content/images/WinRAR-logo.jpg" />
          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="item.key.split('.').indexOf('zip') > -1" style="width: 300px">
          <img width="300px" src="../../../content/images/zip-image.jpg" />
          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="item.key.split('.').indexOf('tiff') > -1" style="width: 300px">
          <img width="300px" src="../../../content/images/tiff.png" />
          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="item.key.split('.').indexOf('xls') > -1 || item.key.split('.').indexOf('xlsx') > -1" style="width: 300px">
          <img width="300px" src="../../../content/images/excel.png" />
          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="item.key.split('.').indexOf('doc') > -1 || item.key.split('.').indexOf('docx') > -1">
          <img width="300px" src="../../../content/images/word.png" />
          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="item.key.split('.').indexOf('pdf') > -1">
          <img width="300px" src="../../../content/images/pdf.png" />

          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>

        <div *ngIf="item.key.split('.').indexOf('pptx') > -1">
          <img width="300px" src="../../../content/images/power-point.jpg" />

          <div style="width: 300px; position: sticky; margin-top: -150px; margin-bottom: 140px">
            <button mat-raised-button (click)="donwload(item.url, item)">
              <mat-icon>get_app</mat-icon>
            </button>
          </div>
        </div>
        <div style="width: 100%; margin-bottom: 20px; display: flex; justify-content: center; align-items: center">
          <p style="font-weight: 400; font-size: 15px; font-family: 'Times New Roman', Times, serif; width: 50%">
            {{ item.name }}
          </p>
        </div>
      </div>
    </li>
  </ul>
</mat-dialog-content>
<mat-dialog-actions align="center" class="align-center">
  <button mat-raised-button mat-dialog-close class="confirm-button-no">Cancel</button>
</mat-dialog-actions>
