<mat-sidenav-container [hasBackdrop]="true" (backdropClick)="triggerToggle()">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <!-- <e-breadcrumb-item text="{{ getText(parentPath) }}"> </e-breadcrumb-item> -->
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="openCancelDialog()" />
            <span class="back-prefix" (click)="openCancelDialog()">Back | </span>
          </div>
        </div>
      </div>
    </div>
    <p class="e-card-sub-title menu-title-class">{{ headerTitle }}</p>
    <!-- Memo Banding -->
    <div *ngIf="clickedMenu === 'memo-banding'">
      <jhi-credit-proposal-memo-banding
        #CPMemoBandingRemarkComponent
        [saveWordMinio]="saveWord"
        [creditProposal]="creditProposal"
        [isViewMode]="true"
      ></jhi-credit-proposal-memo-banding>
    </div>
    <!--Collateral Info-->
    <div *ngIf="clickedMenu === 'collateral-info'">
      <section class="wrapper-card">
        <e-card
          ><jhi-credit-proposal-collateral-info
            #creditProposalCollateralInfoComponent
            [creditProposal]="creditProposal"
            [collateralProperties]="collateralProperties"
            [collateralPropertyGroupData]="collateralPropertyGroupData"
            [parentSource]="'loan-analys'"
          >
          </jhi-credit-proposal-collateral-info
        ></e-card>
      </section>
    </div>
    <!-- compare data -->
    <div *ngIf="clickedMenu === 'compare-data'" class="e-sample-resize-container e-card-resize-container wrapper-card">
      <e-card>
        <jhi-agremeent-compare-revision-final [creditProposal]="creditProposal"> </jhi-agremeent-compare-revision-final>
      </e-card>
    </div>

    <!-- loan facility detail -->
    <div *ngIf="clickedMenu === 'loan-facility'">
      <jhi-credit-proposal-tab-loan-facility-detail [parentSource]="'credit-agreement'" [creditProposal]="creditProposal">
      </jhi-credit-proposal-tab-loan-facility-detail>
    </div>

    <!-- compliance recomendation -->
    <div *ngIf="clickedMenu === 'compliance-recommendation'" class="e-sample-resize-container e-card-resize-container wrapper-card">
      <e-card> <jhi-loan-analys-compliance [word]="saveDoc"></jhi-loan-analys-compliance></e-card>
      <div *ngIf="parentPath === 'cc-review' || parentPath === 'cc-inquiry'">
        <e-card>
          <jhi-loan-analys-opinion-compliance-part
            #loanAnalysOpinionCompliancePartComponent
            (uuidPath)="setUuidPathCompliance($event)"
            (positionLoginEmitCompliance)="setPositionLoginCompliance($event)"
            (typeOpinion)="setTypeOpinion($event)"
            [creditProposalItem]="creditProposal"
          >
          </jhi-loan-analys-opinion-compliance-part
        ></e-card>
      </div>
    </div>

    <!-- opinion -->
    <div *ngIf="clickedMenu === 'opinion'" class="e-sample-resize-container e-card-resize-container wrapper-card">
      <e-card>
        <jhi-loan-analys-opinion
          #loanAnalysOpinionComponent
          (uuidPath)="setUuidPath($event)"
          (positionLoginEmit)="setPositionLogin($event)"
          (newItemEvent)="setOpinionRecomendation($event)"
          (isAllowSave)="setIsAllowSave($event)"
          (opinionFileSfdt)="setOpinionFileSfdt($event)"
          (opinionFileWord)="setOpinionFileWord($event)"
          (conditionFileSfdt)="setConditionFileSfdt($event)"
          (conditionFileWord)="setConditionFileWord($event)"
          [creditProposalItem]="creditProposal"
          [notifyChild]="parentSubject"
        >
        </jhi-loan-analys-opinion>
      </e-card>
    </div>

    <!-- Approval Sheet Internal Memo -->
    <div *ngIf="clickedMenu === 'approval-sheet-internal-memo'">
      <jhi-approval-sheet-internal-memo> </jhi-approval-sheet-internal-memo>
    </div>
  </div>

  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav subroute-background" mode="over">
    <div class="header-sub-menu"><label style="margin-top: 1rem">Dpdl Finalize :</label></div>

    <mat-list role="list" class="list-styling">
      <div *ngFor="let item of subMenu">
        <mat-list-item role="listitem">
          <a
            *ngIf="!item.hasOwnProperty('child')"
            href="javascript:void(0)"
            class="text-capitalize"
            (click)="routeSubMenu(item); drawer.toggle(); triggerToggle()"
            >{{ item.text }}</a
          >
        </mat-list-item>
        <mat-list-item class="text-capitalize" style="margin-top: -45px" *ngIf="item.hasOwnProperty('child')">{{
          item.text
        }}</mat-list-item>
        <mat-list role="list" *ngIf="item.hasOwnProperty('child')" style="margin-left: 10px; margin-top: -10px">
          <mat-list-item role="listitem" *ngFor="let itemChild of item.child">
            <mat-icon matListIcon style="font-size: 10px; display: flex; align-items: center">panorama_fish_eye </mat-icon>
            <a href="javascript:void(0)" (click)="routeSubMenu(itemChild); drawer.toggle(); triggerToggle()" class="text-capitalize">{{
              itemChild.text
            }}</a>
          </mat-list-item>
        </mat-list>
      </div>
    </mat-list>
  </mat-sidenav>

  <button
    matTooltip="Click this for show sub menu of Credit Proposal"
    [ngClass]="{ 'sidebar-state-true': isOpen === true, 'sidebar-state-false': isOpen === false }"
    class="btn-menu-floating button-float-color btn-float-styling"
    (click)="drawer.toggle(); onClickRed(); triggerToggle()"
    matTooltipPosition="before"
  >
    <mat-icon class="settings-icon rotating">settings</mat-icon>
  </button>
</mat-sidenav-container>
