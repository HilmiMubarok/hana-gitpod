<div>
  <mat-card style="margin-top: 12px">
    <mat-card-header>
      <mat-card-subtitle class="label-font-detail">Document Legal</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="folders" class="w-100">
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef width="5%" class="grid-index-number rounding-table-left">No</th>
          <td mat-cell *matCellDef="let i = index" class="grid-index-label">{{ i + 1 }}</td>
        </ng-container>
        <ng-container matColumnDef="documentType">
          <th mat-header-cell *matHeaderCellDef>Document Type</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label">{{ element.documentType }}</td>
        </ng-container>
        <ng-container matColumnDef="documentName">
          <th mat-header-cell *matHeaderCellDef>Document Name</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label">{{ element.documentId }}</td>
        </ng-container>
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label">{{ element.category }}</td>
        </ng-container>
        <ng-container matColumnDef="remark">
          <th mat-header-cell *matHeaderCellDef>Remarks</th>
          <td mat-cell *matCellDef="let element">{{ element.attributes.remarks }}</td>
        </ng-container>
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Due Date</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label-string">
            {{ element.documentDate | date: 'YYYY-MM-dd' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="grid-index-left">Status</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label">{{ element.status }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef width="13%" class="grid-index-string-action rounding-table-right">Action</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button (click)="view(element)">
              <mat-icon>remove_red_eye</mat-icon>
            </button>
            <ng-container *ngIf="conditionReviewDpdlDocument()">
              <button mat-icon-button (click)="update(element)">
                <mat-icon>create</mat-icon>
              </button>
              <button mat-icon-button (click)="delete(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </ng-container>
          </td>
        </ng-container>
        <tr class="mat-row" *matNoDataRow>
          <td
            class="mat-cell"
            [attr.colspan]="['no', 'documentType', 'documentName', 'category', 'remark', 'date', 'status', 'action'].length"
          >
            No records found.
          </td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="['no', 'documentType', 'documentName', 'category', 'remark', 'date', 'status', 'action']"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: ['no', 'documentType', 'documentName', 'category', 'remark', 'date', 'status', 'action']"
        ></tr>
      </table>
    </mat-card-content>
    <mat-card-actions align="center" class="align-center" *ngIf="conditionReviewDpdlDocument()">
      <button mat-raised-button (click)="openDialog()" class="button-styling"><mat-icon>add</mat-icon> ADD NEW DOCUMENT</button>
    </mat-card-actions>
  </mat-card>
</div>
