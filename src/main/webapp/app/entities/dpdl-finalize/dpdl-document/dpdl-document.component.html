<mat-card style="margin-top: 12px">
  <mat-card-header>
    <mat-card-subtitle class="label-font-detail">DPDL Preparation</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="row">
      <div class="col-6">
        <div class="row">
          <div class="col-12">
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>DPDL Number</mat-label>
                <input matInput type="text" />
              </mat-form-field>
            </div>
          </div>
          <div class="col-12">
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>DPDL PIC</mat-label>
                <input matInput type="text" />
              </mat-form-field>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="row">
          <div class="col-12">
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>DPDL Generate Date</mat-label>
                <input [matDatepicker]="documentDate" matInput type="text" disabled />
                <mat-datepicker-toggle matSuffix [for]="documentDate"></mat-datepicker-toggle>
                <mat-datepicker #documentDate disabled="false"></mat-datepicker>
              </mat-form-field>
            </div>
          </div>
          <div class="col-12">
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>DPDL Place</mat-label>
                <input matInput type="text" />
              </mat-form-field>
            </div>
          </div>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>

<div>
  <jhi-internal-memo [internalMemo]="creditProposal"></jhi-internal-memo>
</div>

<div>
  <jhi-document-legal-upload [creditProposal]="creditProposal"></jhi-document-legal-upload>
</div>

<div>
  <jhi-document-legal [creditProposal]="creditProposal"> </jhi-document-legal>
</div>

<div>
  <jhi-generate-dpdl-draft [item]="creditProposal"></jhi-generate-dpdl-draft>
</div>
