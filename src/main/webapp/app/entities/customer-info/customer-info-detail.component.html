<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.customerInfo.home.viewLabel">Customer Infos</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.customerInfo.detail.title">Customer Info</span> {{ customerInfo.id }} </p-header>
    <jhi-customer-info-view [item]="customerInfo" mode="item"> </jhi-customer-info-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/customer-info', customerInfo.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
