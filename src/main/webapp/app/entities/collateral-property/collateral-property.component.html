<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.collateralProperty.home.title">Collateral Properties</span>
  </h5>
  <p-table
    [value]="collateralProperties"
    dataKey="id"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="rowsPerPage"
    [first]="first"
    [totalRecords]="totalItems"
    [loading]="loading"
    [rowHover]="true"
    [lazy]="true"
    [rowTrackBy]="trackId"
    [responsive]="true"
    [stateKey]="'collateralProperties_grid_state'"
    (onLazyLoad)="loadDataLazy($event)"
    (onPage)="pageSizeChanged($event)"
  >
    <ng-template pTemplate="caption">
      <ul class="nav justify-content-end">
        <li class="nav-item" *ngIf="accountService.hasAnyAuthority(['ROLE_USER'])">
          <a class="btn" [routerLink]="['./new']" [queryParams]="queryParams()" tooltip="Add new Data">
            <span><fa-icon icon="plus"></fa-icon> &nbsp;{{ 'entity.action.add' | translate }}</span>
          </a>
        </li>
      </ul>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 60px; text-align: center"><span jhiTranslate="global.field.sequence">No</span></th>
        <th style="width: 130px; text-align: center"><span jhiTranslate="global.field.id">ID</span></th>
        <th><span jhiTranslate="losgwApp.collateralProperty.propertyType">Property Type</span></th>
        <th><span jhiTranslate="losgwApp.collateralProperty.description">Description</span></th>
        <th style="text-align: left"><span jhiTranslate="losgwApp.collateralProperty.party">Party</span></th>
        <th style="text-align: left"><span jhiTranslate="losgwApp.collateralProperty.collateral">Collateral</span></th>
        <th style="text-align: left"><span jhiTranslate="losgwApp.collateralProperty.appraisal">Appraisal</span></th>
        <th style="width: 140px; text-align: center"><span jhiTranslate="global.field.action">Action</span></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
      <tr>
        <td style="text-align: right">{{ rowIndex + 1 }}</td>
        <td style="text-align: left; width: 120px">{{ rowData.id }}</td>
        <td jhiTranslate="{{ 'losgwApp.CollateralPropertyType.' + rowData.propertyType }}">{{ rowData.propertyType }}</td>
        <td>{{ rowData.description }}</td>
        <td>
          <div *ngIf="rowData.partyId">
            <a [routerLink]="['../party', rowData.partyId, 'view']">{{ rowData.partyId }}</a>
          </div>
        </td>
        <td>
          <div *ngIf="rowData.collateralId">
            <a [routerLink]="['../collateral', rowData.collateralId, 'view']">{{ rowData.collateralId }}</a>
          </div>
        </td>
        <td>
          <div *ngIf="rowData.appraisalId">
            <a [routerLink]="['../collateral-appraisal', rowData.appraisalId, 'view']">{{ rowData.appraisalId }}</a>
          </div>
        </td>
        <td style="text-align: center">
          <button pButton type="submit" [routerLink]="['/collateral-property', rowData.id, 'view']" class="flat-button">
            <fa-icon icon="eye"></fa-icon>
          </button>
          <button pButton type="submit" [routerLink]="['/collateral-property', rowData.id, 'edit']" class="flat-button">
            <fa-icon icon="pencil-alt"></fa-icon>
          </button>
          <button pButton type="button" (click)="deleteItem(rowData.id)" class="flat-button">
            <fa-icon icon="trash-alt"></fa-icon>
          </button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
