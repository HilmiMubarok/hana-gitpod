<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.collateralProperty.home.createOrEditLabel">Collateral Properties</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{collateralProperty.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.collateralProperty.propertyType" for="field_propertyType"
                  >Property Type</label
                >
                <select
                  class="form-control"
                  name="propertyType"
                  [(ngModel)]="item.propertyType"
                  id="field_propertyType"
                  [disabled]="readOnly()"
                >
                  <option value="BUILDING" jhiTranslate="losgwApp.CollateralPropertyType.BUILDING">BUILDING</option>
                  <option value="LAND" jhiTranslate="losgwApp.CollateralPropertyType.LAND">LAND</option>
                  <option value="SPOT" jhiTranslate="losgwApp.CollateralPropertyType.SPOT">SPOT</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.collateralProperty.description" for="field_description"
                  >Description</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="description"
                  id="field_description"
                  [(ngModel)]="item.description"
                  [disabled]="readOnly()"
                />
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.collateralProperty.party" for="field_party">Party</label>
                <select
                  class="form-control"
                  id="field_party"
                  name="party"
                  [(ngModel)]="item.partyId"
                  [disabled]="partyId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">
                    {{ partyOption.id }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.collateralProperty.collateral" for="field_collateral">Collateral</label>
                <select
                  class="form-control"
                  id="field_collateral"
                  name="collateral"
                  [(ngModel)]="item.collateralId"
                  [disabled]="collateralId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="collateralOption.id" *ngFor="let collateralOption of collaterals; trackBy: trackCollateralById">
                    {{ collateralOption.id }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.collateralProperty.appraisal" for="field_appraisal">Appraisal</label>
                <select
                  class="form-control"
                  id="field_appraisal"
                  name="appraisal"
                  [(ngModel)]="item.appraisalId"
                  [disabled]="appraisalId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="collateralAppraisalOption.id"
                    *ngFor="let collateralAppraisalOption of collateralappraisals; trackBy: trackCollateralAppraisalById"
                  >
                    {{ collateralAppraisalOption.id }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
