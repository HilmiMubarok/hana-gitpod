<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.collateralProperty.propertyType" for="field_propertyType"
          >Property Type</label
        >
        <select class="form-control" name="propertyType" [(ngModel)]="item.propertyType" id="field_propertyType" [disabled]="readOnly()">
          <option value="BUILDING" jhiTranslate="losgwApp.CollateralPropertyType.BUILDING">BUILDING</option>
          <option value="LAND" jhiTranslate="losgwApp.CollateralPropertyType.LAND">LAND</option>
          <option value="SPOT" jhiTranslate="losgwApp.CollateralPropertyType.SPOT">SPOT</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.collateralProperty.description" for="field_description">Description</label>
        <input
          type="text"
          class="form-control"
          name="description"
          id="field_description"
          [(ngModel)]="item.description"
          [disabled]="readOnly()"
        />
      </div>

      <div class="form-group">
        <label jhiTranslate="losgwApp.collateralProperty.party" for="field_party">Party</label>
        <select
          class="form-control"
          id="field_party"
          name="party"
          [(ngModel)]="item.partyId"
          [disabled]="partyId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">{{ partyOption.id }}</option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.collateralProperty.collateral" for="field_collateral">Collateral</label>
        <select
          class="form-control"
          id="field_collateral"
          name="collateral"
          [(ngModel)]="item.collateralId"
          [disabled]="collateralId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="collateralOption.id" *ngFor="let collateralOption of collaterals; trackBy: trackCollateralById">
            {{ collateralOption.id }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.collateralProperty.appraisal" for="field_appraisal">Appraisal</label>
        <select
          class="form-control"
          id="field_appraisal"
          name="appraisal"
          [(ngModel)]="item.appraisalId"
          [disabled]="appraisalId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option
            [ngValue]="collateralAppraisalOption.id"
            *ngFor="let collateralAppraisalOption of collateralappraisals; trackBy: trackCollateralAppraisalById"
          >
            {{ collateralAppraisalOption.id }}
          </option>
        </select>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
