<mat-card-header>
  <mat-card-subtitle class="sub-header">Building Info</mat-card-subtitle>
</mat-card-header>
<mat-card-content>
  <div class="e-card mb-3">
    <table mat-table [dataSource]="items" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="buildingSpec">
        <th mat-header-cell *matHeaderCellDef>Building Specification</th>
        <td mat-cell *matCellDef="let element">{{ element.buildingSpec }}</td>
      </ng-container>
      <ng-container matColumnDef="floors">
        <th mat-header-cell *matHeaderCellDef>Numbers of Floors of The Building</th>
        <td mat-cell *matCellDef="let element" align="center">
          {{ element.attributes['floors'] | arrayCount }}
          <a (click)="openDialogFloor(element)">
            <mat-icon style="font-size: 1rem">edit</mat-icon>
          </a>
        </td>
      </ng-container>
      <ng-container matColumnDef="physicalArea">
        <th mat-header-cell *matHeaderCellDef>Physical Area</th>
        <td mat-cell *matCellDef="let element">{{ countTotalArea(element.attributes['floors']) }} M<sup>2</sup></td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="openDialogBuilding(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteBuilding(element)">
            <mat-icon>delete_forever</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</mat-card-content>
<mat-card-actions>
  <div class="d-flex justify-content-end mb-3 mt-3">
    <button mat-raised-button (click)="openDialogBuilding()">Add</button>
  </div>
</mat-card-actions>
