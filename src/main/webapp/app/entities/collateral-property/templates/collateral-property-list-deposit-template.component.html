<table mat-table [dataSource]="dataSource" class="w-100">
  <ng-container matColumnDef="no">
    <th mat-header-cell *matHeaderCellDef>No</th>
    <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
  </ng-container>
  <ng-container matColumnDef="accountNumber">
    <th mat-header-cell *matHeaderCellDef>Account Number</th>
    <td mat-cell *matCellDef="let element">{{ element.attributes.depositCertNumber }}</td>
  </ng-container>
  <ng-container matColumnDef="accountCustomer">
    <th mat-header-cell *matHeaderCellDef>Account Customer</th>
    <td mat-cell *matCellDef="let element">{{ element.attributes.depositAccountCustomer }}</td>
  </ng-container>
  <ng-container matColumnDef="accountOfficer">
    <th mat-header-cell *matHeaderCellDef>Account Officer</th>
    <td mat-cell *matCellDef="let element">{{ element.attributes.depositAccountOfficer }}</td>
  </ng-container>
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button (click)="openDialog(element)">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
  </tr>
  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
</table>
