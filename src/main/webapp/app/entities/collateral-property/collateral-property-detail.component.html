<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.collateralProperty.home.viewLabel">Collateral Properties</span>
  </h5>
  <p-panel>
    <p-header>
      <span jhiTranslate="losgwApp.collateralProperty.detail.title">Collateral Property</span> {{ collateralProperty.id }}
    </p-header>
    <jhi-collateral-property-view [item]="collateralProperty" mode="item"> </jhi-collateral-property-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/collateral-property', collateralProperty.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
