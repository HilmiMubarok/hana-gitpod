<mat-sidenav-container [hasBackdrop]="true">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <div class="e-card-header-title">Collateral Appraisal</div>
      </div>
    </div>
    <div class="e-card-content">
      <div *ngIf="clickedMenu === 'appraisal-info'" class="e-sample-resize-container e-card-resize-container">
        <jhi-survey-batch-collateral-appraisal-info
          [surveyAppraisal]="surveyAppraisal"
          [accountAuthorities]="accountAuthorities"
          (outputTipeOfficerAppraisal)="onValTipeOfficerAppraisalChanged($event)"
        ></jhi-survey-batch-collateral-appraisal-info>
      </div>

      <div *ngIf="clickedMenu === 'customer-info'">
        <jhi-survey-batch-collateral-appraisal-person-view
          mode="view"
          [collateralAppraisal]="collateralAppraisal"
          [id]="surveyAppraisal.cif.partyId"
          *ngIf="surveyAppraisal.cif.customerType === 'PERSONAL'"
        ></jhi-survey-batch-collateral-appraisal-person-view>
        <jhi-survey-batch-collateral-appraisal-party-group-view
          mode="view"
          [collateralAppraisal]="collateralAppraisal"
          [id]="surveyAppraisal.cif.partyId"
          *ngIf="surveyAppraisal.cif.customerType === 'PERSONAL'"
        ></jhi-survey-batch-collateral-appraisal-party-group-view>

        <div class="e-card mb-3">
          <div class="e-card-header mb-1">
            <div class="e-card-header-caption">
              <div class="header-title">Customer Address</div>
            </div>
          </div>
          <div class="e-card-content">
            <jhi-survey-batch-postal-address-view
              [collateralAppraisal]="collateralAppraisal"
              [item]="postalAddress"
              mode="view"
            ></jhi-survey-batch-postal-address-view>
          </div>
        </div>
      </div>

      <div
        *ngIf="clickedMenu === 'collateral-info' && surveyAppraisal.collateral"
        class="e-sample-resize-container e-card-resize-container"
      >
        <jhi-survey-batch-collateral-info
          mode="edit"
          [collateralAppraisal]="collateralAppraisal"
          [collateral]="surveyAppraisal.collateral"
          [collateralAppraisalId]="collateralAppraisal.id"
          [appraisal]="collateralAppraisal"
        ></jhi-survey-batch-collateral-info>
      </div>
      <div *ngIf="clickedMenu === 'report-independent'" class="e-sample-resize-container e-card-resize-container">
        <jhi-report-independent></jhi-report-independent>
      </div>
    </div>
    <div class="e-card-actions mx-auto mb-5 mt-3">
      <button
        style="margin-right: 25px"
        mat-raised-button
        *ngFor="let task of tasks"
        (click)="processTask(task)"
        class="btn-lg text-uppercase"
      >
        {{ task.caption }}
      </button>
      <button mat-raised-button class="btn-lg text-uppercase" (click)="onSave()">Save</button>
    </div>
  </div>
  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav" mode="over">
    <div class="p-3" style="padding-top: 90px !important">
      <div style="font-size: 1.5rem; font-weight: 600">Select your destination:</div>
      <ul class="side-menu">
        <li *ngFor="let item of subMenu">
          <!--SUBMENU DOESNT HAS A CHILD-->
          <a
            *ngIf="!item.hasOwnProperty('child')"
            href="javascript:void(0)"
            class="text-capitalize"
            (click)="routeSubMenu(item); drawer.toggle()"
            [ngClass]="checkCompletedData(item) ? 'completed-data' : ''"
            >{{ item.label }}</a
          >
          <!--SUBMENU HAS A CHILD-->
          <span class="text-capitalize" *ngIf="item.hasOwnProperty('child')">{{ item.text }}</span>
          <ul *ngIf="item.hasOwnProperty('child')">
            <li *ngFor="let itemChild of item.child">
              <a href="javascript:void(0)" (click)="routeSubMenu(itemChild); drawer.toggle()" class="text-capitalize">{{
                itemChild.label
              }}</a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
<button
  matTooltip="Click this for show sub menu of Collateral Appraisal"
  style="z-index: 1"
  class="btn-menu-floating"
  (click)="drawer.toggle()"
  mat-fab
  color="warn"
  matTooltipPosition="before"
>
  <mat-icon>more_vert</mat-icon>
</button>
