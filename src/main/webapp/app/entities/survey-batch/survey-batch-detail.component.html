<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.surveyBatch.home.viewLabel">Survey Batches</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.surveyBatch.detail.title">Survey Batch</span> {{ surveyBatch.id }} </p-header>
    <jhi-survey-batch-view [item]="surveyBatch" mode="item"> </jhi-survey-batch-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/survey-batch', surveyBatch.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
