<div class="row">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Survey Batch</p>
        </div>
      </div>
    </div>
    <div class="e-card-content">
      <!-- <mat-card>
        <mat-card-header>
          <mat-card-subtitle>Status Options</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <mat-chip-list cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="drop($event)">
            <mat-chip class="example-box text-capitalize" (click)="chipClick(item)" cdkDrag *ngFor="let item of statusCodesData">
              {{ item.label }}
            </mat-chip>
          </mat-chip-list>
        </mat-card-content>
      </mat-card> -->
      <!-- <mat-card class="mt-3">
        <mat-card-content>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput placeholder="Search in here..." type="text" [(ngModel)]="currentSearch" />
            <button matSuffix mat-icon-button aria-label="Clear" (click)="doSearch()">
              <mat-icon>search</mat-icon>
            </button>
          </mat-form-field>
        </mat-card-content>
      </mat-card> -->

      <div class="mt-3">
        <button mat-raised-button color="primary" (click)="rebuildIndex()" class="btn-lg w-100" *jhiHasAnyAuthority="['ROLE_ADMIN']">
          REBUILD INDEX
        </button>
      </div>
      <!-- <div class="text-end w-100 mt-3" *ngIf="clickedChip !== ''">
        You search data with status <span class="text-capitalize fw-bold">{{ clickedChip.label }}</span>
      </div> -->
      <table mat-table [dataSource]="items" class="mat-table-expand" multiTemplateDataRows>
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef class="text-center">No</th>
          <td mat-cell *matCellDef="let element; let i = dataIndex" class="text-center">
            {{ i + 1 }}.
            <!-- + paginator.pageIndex * paginator.pageSize  -->
          </td>
        </ng-container>
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="text-center">Id</th>
          <td mat-cell *matCellDef="let element">{{ element.id }}</td>
        </ng-container>
        <ng-container matColumnDef="receivedDate">
          <th mat-header-cell *matHeaderCellDef class="text-center">Received Date</th>
          <td mat-cell *matCellDef="let element">{{ element.receivedDate }}</td>
        </ng-container>
        <ng-container matColumnDef="surveyCompanyId">
          <th mat-header-cell *matHeaderCellDef class="text-center">Survey Company Id</th>
          <td mat-cell *matCellDef="let element">{{ element.surveyCompanyId }}</td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="text-center">Action</th>
          <td mat-cell *matCellDef="let element" class="text-center">
            <a href="javascript:void();" [routerLink]="[element.id, 'edit']" mat-icon-button (click)="$event.stopPropagation()">
              <fa-icon icon="pencil-alt"></fa-icon>
            </a>
            <!-- <button mat-icon-button (click)="$event.stopPropagation(); showTimeLine(element)">
              <fa-icon [icon]="iconTimeline"></fa-icon>
            </button> -->
          </td>
        </ng-container>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumnsExpand.length">No records found.</td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="displayedColumnsExpand"></tr>
        <tr
          mat-row
          *matRowDef="let element; columns: displayedColumnsExpand"
          [class.mat-expanded-row]="expandedElement === element"
          class="mat-element-row"
          (click)="expandedElement = expandedElement === element ? null : element"
        ></tr>
      </table>

      <mat-card *ngIf="loading" id="material-loading-bar">
        <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
      </mat-card>
      <mat-paginator
        showFirstLastButtons
        ngClass="transparant"
        [length]="paginatorLength"
        [pageSize]="paginatorPageSize"
        [pageSizeOptions]="paginatorPageSizeOption"
        (page)="loadDataLazy($event)"
      >
      </mat-paginator>
    </div>
    <div class="e-card-actions">
      <div class="d-flex justify-content-center mb-3 mt-3">
        <button mat-raised-button [routerLink]="['./new']">ADD BATCH</button>
      </div>
    </div>
  </div>
</div>
