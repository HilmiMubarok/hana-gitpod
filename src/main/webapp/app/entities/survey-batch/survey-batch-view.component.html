<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.surveyBatch.surveyCompanyId" for="field_surveyCompanyId"
          >Survey Company Id</label
        >
        <input
          currencyMask
          class="form-control"
          name="surveyCompanyId"
          id="field_surveyCompanyId"
          [(ngModel)]="item.surveyCompanyId"
          [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.surveyBatch.statusId" for="field_statusId">Status Id</label>
        <input type="text" class="form-control" name="statusId" id="field_statusId" [(ngModel)]="item.statusId" [disabled]="readOnly()" />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.surveyBatch.statusDescription" for="field_statusDescription"
          >Status Description</label
        >
        <input
          type="text"
          class="form-control"
          name="statusDescription"
          id="field_statusDescription"
          [(ngModel)]="item.statusDescription"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.surveyBatch.receivedDate" for="field_receivedDate">Received Date</label>
        <div class="input-group">
          <p-calendar
            inputId="field_receivedDate"
            name="input_receivedDate"
            [(ngModel)]="item.receivedDate"
            dateFormat="dd-mm-yy"
            [showTime]="false"
            hourFormat="24"
            [showSeconds]="true"
            [showIcon]="true"
            [hideOnDateTimeSelect]="true"
            [disabled]="readOnly()"
          >
          </p-calendar>
        </div>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
