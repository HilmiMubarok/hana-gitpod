<div class="e-card mb-3">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">RM Info</div>
      <div class="e-card-sub-title"></div>
    </div>
  </div>
  <div class="e-card-content">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <ejs-textbox
            cssClass="e-outline"
            placeholder="RM Name"
            floatLabelType="Always"
            [(ngModel)]="surveyAppraisal.rm.partyName"
            disabled
          ></ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox
            cssClass="e-outline"
            placeholder="Branchs"
            floatLabelType="Always"
            [(ngModel)]="rmBranch.internalTypeDescription"
            disabled
          ></ejs-textbox>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-group">
          <ejs-textbox cssClass="e-outline" placeholder="Regional" floatLabelType="Always" disabled></ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox cssClass="e-outline" placeholder="Segments" floatLabelType="Always" disabled></ejs-textbox>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="e-card mb-3">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Proposal/Appraisal Info</div>
    </div>
  </div>
  <div class="e-card-content">
    <section class="mt-3">
      <ejs-textbox
        cssClass="e-outline"
        placeholder="No Request Appraisal"
        floatLabelType="Always"
        [(ngModel)]="surveyAppraisal.appraisalNumber"
        disabled
      ></ejs-textbox>
    </section>
    <section class="mt-3">
      <ejs-textbox
        cssClass="e-outline"
        placeholder="Tgl Request"
        floatLabelType="Always"
        value="{{ surveyAppraisal.createdDate | date: 'medium' }}"
        disabled
      ></ejs-textbox>
    </section>
    <section class="mt-3">
      <ejs-textbox
        cssClass="e-outline"
        placeholder="Approval Date"
        floatLabelType="Always"
        value="{{ approvalDate | date: 'medium' }}"
        disabled
      ></ejs-textbox>
    </section>
    <section class="mt-3">
      <ejs-textbox
        cssClass="e-outline"
        placeholder="Visited Date"
        floatLabelType="Always"
        value="{{ visitDate | date: 'medium' }}"
        disabled
      ></ejs-textbox>
    </section>
    <section class="mt-3">Jenis Permohonan</section>
    <section class="mt-2">
      <ejs-checkbox
        label="Renewal"
        value="renewal"
        [(ngModel)]="surveyAppraisal.jpRenewal"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
      <ejs-checkbox
        class="ml-2"
        label="New"
        value="new"
        [(ngModel)]="surveyAppraisal.jpNew"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
      <ejs-checkbox
        class="ml-2"
        label="Additional"
        value="additional"
        [(ngModel)]="surveyAppraisal.jpAdditional"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
      <ejs-checkbox
        class="ml-2"
        label="Progress"
        value="progress"
        [(ngModel)]="surveyAppraisal.jpProgress"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
      <ejs-checkbox class="ml-2" label="Reapraisal" value="reappraisal" [disabled]="!isEnableKhususPerpanjanganSub"> </ejs-checkbox>
      <ejs-checkbox
        class="ml-2"
        label="Other"
        value="other"
        [(ngModel)]="surveyAppraisal.jpOther"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
    </section>
    <section class="mt-3">Jenis Object</section>
    <section class="mt-2">
      <ejs-radiobutton
        label="Object Lama"
        value="object_lama"
        [(ngModel)]="surveyAppraisal.attributes['jenisObject']"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-radiobutton>
      <ejs-radiobutton
        label="Object Baru"
        value="object_baru"
        [(ngModel)]="surveyAppraisal.attributes['jenisObject']"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-radiobutton>
    </section>
  </div>
</div>

<div class="e-card mb-3">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Khusus Perpanjangan</div>
      <div class="e-card-sub-title"></div>
    </div>
  </div>
  <div class="e-card-content">
    <section class="mt-3">
      <ejs-numerictextbox
        cssClass="e-outline"
        placeholder="Total Plafond"
        floatLabelType="Auto"
        [(ngModel)]="surveyAppraisal.totalPlafond"
        format="IDR 0,"
        min="0"
        [enabled]="isEnablePlafond"
        [disabled]="externalDisabled()"
      >
      </ejs-numerictextbox>
    </section>
    <section class="mt-3">
      <ejs-datepicker
        cssClass="e-outline"
        placeholder="Tanggal Jatuh Tempo"
        floatLabelType="Auto"
        [(ngModel)]="surveyAppraisal.tglJatuhTempo"
        [enabled]="isEnablePlafond"
        [disabled]="externalDisabled()"
      >
      </ejs-datepicker>
    </section>
  </div>
</div>
