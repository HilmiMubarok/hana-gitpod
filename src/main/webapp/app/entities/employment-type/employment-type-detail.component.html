<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.employmentType.home.viewLabel">Employment Types</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.employmentType.detail.title">Employment Type</span> {{ employmentType.id }} </p-header>
    <jhi-employment-type-view [item]="employmentType" mode="item"> </jhi-employment-type-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/employment-type', employmentType.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
