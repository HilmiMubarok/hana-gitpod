<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.employmentType.home.createOrEditLabel">Employment Types</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{employmentType.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.employmentType.description" for="field_description"
                  >Description</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="description"
                  id="field_description"
                  [(ngModel)]="item.description"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.employmentType.permanent" for="field_permanent">Permanent</label>
                <div class="form-check">
                  <label class="form-check-label">
                    <p-checkbox
                      name="input_permanent"
                      label="{{ 'losgwApp.employmentType.permanent' | translate }}"
                      [(ngModel)]="item.permanent"
                      [binary]="true"
                      [disabled]="readOnly()"
                    >
                    </p-checkbox>
                  </label>
                </div>
                <div [hidden]="!(permanent?.dirty && permanent?.invalid)">
                  <small class="form-text text-danger" [hidden]="!permanent?.errors?.required" jhiTranslate="entity.validation.required">
                    This field is required.
                  </small>
                </div>
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.employmentType.parent" for="field_parent">Parent</label>
                <select
                  class="form-control"
                  id="field_parent"
                  name="parent"
                  [(ngModel)]="item.parentId"
                  [disabled]="parentId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="employmentTypeOption.id"
                    *ngFor="let employmentTypeOption of employmenttypes; trackBy: trackEmploymentTypeById"
                  >
                    {{ employmentTypeOption.description }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
