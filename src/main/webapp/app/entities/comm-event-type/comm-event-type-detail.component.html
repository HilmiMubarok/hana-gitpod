<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.commEventType.home.viewLabel">Comm Event Types</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.commEventType.detail.title">Comm Event Type</span> {{ commEventType.id }} </p-header>
    <jhi-comm-event-type-view [item]="commEventType" mode="item"> </jhi-comm-event-type-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/comm-event-type', commEventType.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
