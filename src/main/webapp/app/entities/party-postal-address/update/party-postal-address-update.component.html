<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-party-postal-address-heading"
        data-cy="PartyPostalAddressCreateUpdateHeading"
        jhiTranslate="losgwApp.partyPostalAddress.home.createOrEditLabel"
      >
        Create or edit a Party Postal Address
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" [hidden]="editForm.get('id')!.value == null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.partyPostalAddress.fromDate" for="field_fromDate">From Date</label>
          <div class="d-flex">
            <input
              id="field_fromDate"
              data-cy="fromDate"
              type="datetime-local"
              class="form-control"
              name="fromDate"
              formControlName="fromDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.partyPostalAddress.thruDate" for="field_thruDate">Thru Date</label>
          <div class="d-flex">
            <input
              id="field_thruDate"
              data-cy="thruDate"
              type="datetime-local"
              class="form-control"
              name="thruDate"
              formControlName="thruDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.partyPostalAddress.partyId" for="field_partyId">Party Id</label>
          <input type="text" class="form-control" name="partyId" id="field_partyId" data-cy="partyId" formControlName="partyId" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.partyPostalAddress.partyName" for="field_partyName">Party Name</label>
          <input type="text" class="form-control" name="partyName" id="field_partyName" data-cy="partyName" formControlName="partyName" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.partyPostalAddress.addressId" for="field_addressId">Address Id</label>
          <input type="number" class="form-control" name="addressId" id="field_addressId" data-cy="addressId" formControlName="addressId" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.partyPostalAddress.addressDescription" for="field_addressDescription"
            >Address Description</label
          >
          <input
            type="text"
            class="form-control"
            name="addressDescription"
            id="field_addressDescription"
            data-cy="addressDescription"
            formControlName="addressDescription"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.partyPostalAddress.purposeTypeId" for="field_purposeTypeId"
            >Purpose Type Id</label
          >
          <input
            type="text"
            class="form-control"
            name="purposeTypeId"
            id="field_purposeTypeId"
            data-cy="purposeTypeId"
            formControlName="purposeTypeId"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="losgwApp.partyPostalAddress.purposeTypeDescription" for="field_purposeTypeDescription"
            >Purpose Type Description</label
          >
          <input
            type="text"
            class="form-control"
            name="purposeTypeDescription"
            id="field_purposeTypeDescription"
            data-cy="purposeTypeDescription"
            formControlName="purposeTypeDescription"
          />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
