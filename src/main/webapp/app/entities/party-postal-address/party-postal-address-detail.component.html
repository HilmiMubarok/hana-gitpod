<div class="page-view">
    <h5 class="page-heading">
        <span jhiTranslate="losgwApp.partyPostalAddress.home.viewLabel">Party Postal Addresses</span>
    </h5>
    <p-panel>
        <p-header>
            <span jhiTranslate="losgwApp.partyPostalAddress.detail.title">Party Postal Address</span> {{partyPostalAddress.id}}
        </p-header>
        <jhi-party-postal-address-view [item]="partyPostalAddress" mode="item">
        </jhi-party-postal-address-view>
        <p-footer>
            <button type="submit"
                    (click)="previousState()"
                    class="btn-info flat-style-button">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/party-postal-address', partyPostalAddress.id, 'edit']"
                    class="btn-info flat-style-button">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </p-footer>
    </p-panel>
</div>
