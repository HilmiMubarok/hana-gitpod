<div style="justify-content: flex-end; display: flex">
  <button style="float: right" mat-raised-button class="button-styling" (click)="donwload()">Download All File</button>
</div>
<div *ngFor="let item of dataArray">
  <mat-card *ngIf="item.statusId === 'ACTIVE'" style="margin-top: 12px">
    <mat-card-header>
      <mat-card-subtitle class="label-font-detail">{{ item.description }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="item.level" class="w-100">
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef width="5%" class="grid-index-number rounding-table-left">No</th>
          <td mat-cell *matCellDef="let i = index" class="grid-index-label">{{ i + 1 }}</td>
        </ng-container>
        <ng-container matColumnDef="document">
          <th mat-header-cell *matHeaderCellDef width="50%" class="grid-index-string">Document Name</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label">{{ element.description }}</td>
        </ng-container>
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef class="grid-index-string">Category</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label-string">{{ element.category }}</td>
        </ng-container>
        <ng-container matColumnDef="dueDate">
          <th mat-header-cell *matHeaderCellDef class="grid-index-string">Due Date</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label-string">{{ element.dueDate | date: 'YYYY-MM-dd' }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="grid-index-string">Status</th>
          <td mat-cell *matCellDef="let element" class="grid-index-label-string">{{ element.status }}</td>
        </ng-container>
        <ng-container matColumnDef="remarks">
          <th mat-header-cell *matHeaderCellDef>Remarks</th>
          <td mat-cell *matCellDef="let element">
            <span *ngIf="element.remarks !== 'null'">{{ convertDan(element.remarks) }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef width="13%" class="grid-index-string-action rounding-table-right">Action</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button (click)="openDialog(element, 'add', item.description)">
              <mat-icon>create</mat-icon>
            </button>
            <button mat-icon-button (click)="openDialog(element, 'view', item.description)">
              <mat-icon>remove_red_eye</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="['no', 'document', 'category', 'remarks', 'dueDate', 'status', 'action'].length">
            No records found.
          </td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="['no', 'document', 'category', 'remarks', 'dueDate', 'status', 'action']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['no', 'document', 'category', 'remarks', 'dueDate', 'status', 'action']"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
