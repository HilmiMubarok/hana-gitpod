<div class="row remove-row-scroll">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <!-- <e-breadcrumb-item text="Debtor Data Details" url="/party-cif/{{partyCif.customerId}}/detail"></e-breadcrumb-item> -->
            <e-breadcrumb-item text="SLIK Checking Request Detail" url=""></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">SLIK Checking Request Detail</p>
        </div>
      </div>
    </div>
    <div style="margin: 1rem">
      <table mat-table [dataSource]="dataSource" class="mat-table-expand" multiTemplateDataRows>
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef>No</th>
          <td mat-cell *matCellDef="let element; let i = dataIndex">{{ i + 1 }}.</td>
        </ng-container>
        <ng-container matColumnDef="fileName">
          <th mat-header-cell *matHeaderCellDef>File Name</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let element">
            {{ element.lastModified | formatMediumDate }}
          </td>
        </ng-container>
        <ng-container matColumnDef="fileSize">
          <th mat-header-cell *matHeaderCellDef>File Size</th>
          <td mat-cell *matCellDef="let element">
            {{ element.size | formatFileSize }}
          </td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <button mat-icon-button (click)="viewDialog(element)">
              <mat-icon>remove_red_eye</mat-icon>
            </button>
            <mat-checkbox [aria-label]="isSubscribedToEmailsMessage" (change)="viewFileBySelection($event, element)"> </mat-checkbox>
          </td>

          <td mat-footer-cell *matFooterCellDef></td>
        </ng-container>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
    <div class="col-12 text-center">
      <button mat-raised-button class="btn-lg text-uppercase confirm-button-no" (click)="openCancelDialog()">Cancel</button>
      <button [hidden]="true"></button>
      <button mat-raised-button class="btn-lg text-uppercase confirm-button-yes" (click)="download()">Save</button>
    </div>
  </div>
</div>
