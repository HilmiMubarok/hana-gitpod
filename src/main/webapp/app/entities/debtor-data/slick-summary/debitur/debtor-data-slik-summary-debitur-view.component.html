<mat-card>
  <mat-card-header>
    <mat-card-title>SLIK IDEB FILE RESULT</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row">
      <div class="col-12">
        <table mat-table [dataSource]="folders" class="mat-table-expand" multiTemplateDataRows>
          <ng-container matColumnDef="no">
            <th mat-header-cell *matHeaderCellDef class="text-center">No</th>
            <td mat-cell *matCellDef="let element; let i = dataIndex" class="text-center">{{ i + 1 }}.</td>
          </ng-container>
          <ng-container matColumnDef="fileName">
            <th mat-header-cell *matHeaderCellDef class="text-center">File Name</th>
            <td mat-cell *matCellDef="let element" class="text-center">{{ element.name }}</td>
          </ng-container>
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef class="text-center">Date</th>
            <td mat-cell *matCellDef="let element" class="text-center">
              {{ element.lastModified | formatMediumDate }}
            </td>
          </ng-container>
          <ng-container matColumnDef="fileSize">
            <th mat-header-cell *matHeaderCellDef class="text-center">File Size</th>
            <td mat-cell *matCellDef="let element" class="text-center">
              {{ element.size | formatFileSize }}
            </td>
          </ng-container>
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let element; let i = index">
              <button mat-icon-button (click)="viewDialog(element)">
                <mat-icon>remove_red_eye</mat-icon>
              </button>
              <mat-checkbox [aria-label]="isSubscribedToEmailsMessage" (change)="viewFileBySelection($event, element)"> </mat-checkbox>
            </td>

            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
          </tr>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-12 text-center">
        <button mat-raised-button class="btn-lg text-uppercase" (click)="download()">Save</button>
        <button [hidden]="true"></button>
        <button mat-raised-button class="btn-lg text-uppercase" (click)="previousState()">Cancel</button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
