<h2 mat-dialog-title>Upload Document</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-12">
      <ngx-dropzone accept="*" multiple="true" (change)="onSelect($event)">
        <ngx-dropzone-label>Drop file here or choose your file</ngx-dropzone-label>
      </ngx-dropzone>

      <div class="row">
        <ngx-dropzone-preview
          class="col-6"
          ngProjectAs="ngx-dropzone-preview"
          *ngFor="let f of files"
          [removable]="true"
          (removed)="onRemove(f)"
        >
          <ngx-dropzone-label *ngIf="f.url === undefined">
            <ngx-dropzone-image-preview ngProjectAs="ngx-dropzone-image-preview" [file]="f"></ngx-dropzone-image-preview>
          </ngx-dropzone-label>

          <ngx-dropzone-label *ngIf="f.url !== undefined">
            <img [src]="f.url" width="100%" height="100%" />
          </ngx-dropzone-label>
        </ngx-dropzone-preview>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button (click)="save()">Save</button>
</mat-dialog-actions>
