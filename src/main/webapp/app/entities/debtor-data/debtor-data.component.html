<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title"></div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <!-- <ejs-combobox cssClass="e-outline" onselect="" placeholder="Proposal Type" [ngModel]="getUpdatekey"
              [dataSource]="proposalType" required>
            </ejs-combobox> -->
            <section *jhiMatrixDirIDD="'input'">
              <ejs-combobox cssClass="e-outline" [dataSource]="proposalType" [(ngModel)]="tempKey"> </ejs-combobox>
              <div class="mt-3">
                <button mat-raised-button class="button-styling" (click)="generate()">generate</button>
              </div>
            </section>
            <section *jhiMatrixDirIDD="''">
              <ejs-combobox cssClass="e-outline" [dataSource]="proposalType" [(ngModel)]="tempKey" [disabled]="true"> </ejs-combobox>
              <div class="mt-2">
                <button mat-raised-button class="button-styling" ejs-button (click)="generate()" [disabled]="true">generate</button>
              </div>
            </section>
            <!-- <ejs-combobox cssClass="e-outline" [dataSource]="proposalType" [(ngModel)]="tempKey"> </ejs-combobox>
            <button class="btn-info" ejs-button (click)="generate()">generate</button> -->

            <!-- <button class="e-btn" (click)="onclick()">Sync</button> -->
            <div class="mt-2">
              <section *jhiMatrixDirIDD="'input'">
                <ejs-spreadsheet
                  #spreadsheet
                  (created)="created()"
                  (beforeOpen)="beforeOpen($event)"
                  (beforeSave)="beforeSave($event)"
                  openUrl="https://services.syncfusion.com/angular/production/api/spreadsheet/open"
                  saveUrl="https://services.syncfusion.com/angular/production/api/spreadsheet/save"
                  allowSave="true"
                  [allowEditing]="true"
                  [height]="700"
                >
                </ejs-spreadsheet>
              </section>
              <section *jhiMatrixDirIDD="''">
                <ejs-spreadsheet
                  #spreadsheet
                  (created)="created()"
                  (beforeOpen)="beforeOpen($event)"
                  (beforeSave)="beforeSave($event)"
                  [showFormulaBar]="false"
                  [showRibbon]="false"
                  [isProtected]="true"
                  openUrl="https://services.syncfusion.com/angular/production/api/spreadsheet/open"
                  saveUrl="https://services.syncfusion.com/angular/production/api/spreadsheet/save"
                  allowSave="true"
                  [allowEditing]="false"
                  [height]="700"
                >
                </ejs-spreadsheet>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
