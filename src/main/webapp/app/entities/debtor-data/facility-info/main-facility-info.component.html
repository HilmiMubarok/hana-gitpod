<table mat-table [dataSource]="dataMainFacility" multiTemplateDataRows class="mat-table-expand">
  <ng-container matColumnDef="no">
    <th mat-header-cell *matHeaderCellDef class="grid-index-center rounding-table-left">No</th>
    <td mat-cell *matCellDef="let element; let i = dataIndex" class="grid-index-center">{{ i + 1 }}</td>
  </ng-container>
  <ng-container matColumnDef="approvalNo">
    <th mat-header-cell *matHeaderCellDef class="grid-index-center">Approval No</th>
    <td mat-cell *matCellDef="let element" class="grid-index-center">{{ element.approvalNumber }}</td>
  </ng-container>
  <ng-container matColumnDef="currency">
    <th mat-header-cell *matHeaderCellDef class="grid-index-center">Currency</th>
    <td mat-cell *matCellDef="let element" class="grid-index-center">{{ element.currency }}</td>
  </ng-container>
  <ng-container matColumnDef="mainPlafond">
    <th mat-header-cell *matHeaderCellDef class="grid-index-center">Main Plafond</th>
    <td mat-cell *matCellDef="let element" class="grid-index-center">{{ element.mainPlafond }}</td>
  </ng-container>
  <ng-container matColumnDef="maturityDate">
    <th mat-header-cell *matHeaderCellDef class="grid-index-center">Maturity Date</th>
    <td mat-cell *matCellDef="let element" class="grid-index-center">{{ element.maturityDate.slice(0, 10) }}</td>
  </ng-container>
  <ng-container matColumnDef="availableLimit">
    <th mat-header-cell *matHeaderCellDef class="grid-index-center">Available Limit</th>
    <td mat-cell *matCellDef="let element" class="grid-index-center">{{ element.availableLimit }}</td>
  </ng-container>
  <ng-container matColumnDef="lastAgreementDate">
    <th mat-header-cell *matHeaderCellDef class="grid-index-center">Last Agreement Date</th>
    <td mat-cell *matCellDef="let element" class="grid-index-center">{{ element.lastAgreementDate?.slice(0, 10) }}</td>
  </ng-container>
  <ng-container matColumnDef="expand">
    <th mat-header-cell *matHeaderCellDef aria-label="row actions" class="grid-index-center rounding-table-right">Action</th>
    <td mat-cell *matCellDef="let element" class="grid-index-center">
      <button
        mat-icon-button
        aria-label="expand row"
        (click)="expanData(element); expandedElement = expandedElement === element ? null : element; $event.stopPropagation()"
      >
        <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
        <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
  <ng-container matColumnDef="expandedDetail">
    <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
      <div class="example-element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
        <div class="w-100">
          <jhi-main-facility-info-child [mainFacility]="dataSendMainFacility"></jhi-main-facility-info-child>
        </div>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
  <tr
    mat-row
    *matRowDef="let element; columns: columnsToDisplayWithExpand"
    class="example-element-row"
    [class.example-expanded-row]="expandedElement === element"
    (click)="expanData(element); expandedElement = expandedElement === element ? null : element"
  ></tr>
  <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
</table>
