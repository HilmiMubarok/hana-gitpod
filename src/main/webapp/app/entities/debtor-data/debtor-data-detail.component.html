<div class="page-view">
    <h5 class="page-heading">
        <span jhiTranslate="losgwApp.debtorData.home.viewLabel">Debtor Data</span>
    </h5>
    <p-panel>
        <p-header>
            <span jhiTranslate="losgwApp.debtorData.detail.title">Debtor Data</span> {{debtorData.id}}
        </p-header>
        <jhi-debtor-data-view [item]="debtorData" mode="item">
        </jhi-debtor-data-view>
        <p-footer>
            <button type="submit"
                    (click)="previousState()"
                    class="btn-info flat-style-button">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/debtor-data', debtorData.id, 'edit']"
                    class="btn-info flat-style-button">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
            </button>
        </p-footer>
    </p-panel>
</div>
