<mat-card>
  <h3>{{ positionAccess[0].parentDescription }}</h3>
  <mat-list>
    <mat-list-item>
      <span matListItemTitle>{{ positionAccess[0].description }}</span>
    </mat-list-item>
  </mat-list>

  <mat-form-field class="w-100" appearance="outline">
    <mat-label>Position</mat-label>
    <mat-select name="status" (selectionChange)="onSelect($event.value)">
      <mat-option *ngFor="let item of position" [value]="item.id">
        {{ item.description }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field class="w-100" appearance="outline">
    <mat-label>Segregation</mat-label>
    <mat-select (selectionChange)="onSelecttype($event.value)">
      <mat-option *ngFor="let item of segregationType" [value]="item.id">
        {{ item.description }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <div style="text-align: center; margin: 0 auto">
    <button mat-raised-button mat-dialog-close (click)="openCancelDialog()" class="confirm-button-no">Close</button>
    <button class="confirm-button-yes" (click)="save()" mat-raised-button>Save</button>
  </div>
</mat-card>
