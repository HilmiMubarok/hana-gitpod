<mat-card>
  <h3>{{ data?.parentDescription }}</h3>
  <mat-list>
    <mat-list-item>
      <span matListItemTitle>{{ data?.description }}</span>
    </mat-list-item>
  </mat-list>

  <button class="button-styling" type="submit" (click)="openDialog(paramType)" mat-raised-button style="margin-bottom: 5px">
    Add Position
  </button>

  <table mat-table [dataSource]="dataPosition" class="mat-elevation-z8 w-100">
    <!--- Note that these columns can be defined in any order.
            The actual rendered columns are set as a property on the row definition" -->

    <!-- No Column -->
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef>Position</th>
      <td mat-cell *matCellDef="let element">{{ element.positionId }}</td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button>
          <mat-icon (click)="openDelete(element.id)">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
