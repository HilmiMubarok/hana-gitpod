<mat-card>
  <h3>{{ data?.parentDescription }}</h3>
  <mat-list>
    <mat-list-item>
      <span matListItemTitle>{{ data?.description }}</span>
    </mat-list-item>
  </mat-list>
  <div class="header-content">
    <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
    <span class="back-prefix" (click)="previousState()">Back | Status</span>
  </div>

  <table mat-table [dataSource]="data?.positions" class="mat-elevation-z8 w-100">
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">{{ element.statusId }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
