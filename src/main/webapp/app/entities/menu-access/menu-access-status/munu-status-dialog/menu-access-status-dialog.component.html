<mat-card>
  <h3>{{ statusMenuAccess[0].parentDescription }}</h3>
  <mat-list>
    <mat-list-item>
      <span matListItemTitle>{{ statusMenuAccess[0].description }}</span>
    </mat-list-item>
  </mat-list>

  <mat-form-field class="w-100" appearance="outline">
    <mat-label>Status</mat-label>
    <mat-select name="status" (selectionChange)="onSelect($event.value)">
      <mat-option *ngFor="let item of status" [value]="item.id">
        {{ item.description }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <div style="text-align: center; margin: 0 auto">
    <button mat-raised-button mat-dialog-close (click)="openCancelDialog()" class="confirm-button-no">Close</button>
    <button class="confirm-button-yes" (click)="save()" mat-raised-button>Save</button>
  </div>

  <!-- <div style="text-align: center; margin: 0 auto">
   <button class="button-styling mb-3" (click)="save()" class="confirm-button-no">ADD</button>
    
  </div> -->
</mat-card>
