<mat-card class="mt-3">
  <mat-card-content>
    <div class="row">
      <div class="col-4">
        <p>Assign To</p>
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Please Select</mat-label>
          <mat-select [(ngModel)]="applicationRoleId" (selectionChange)="onSelectAssignTo($event)" [disabled]="disabledData">
            <mat-option *ngFor="let item of position" [value]="item.id">
              {{ item.employeeFirstName }} {{ item.employeeLastName }} - {{ item.name ? item.name : item.positionTypeDescription }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </mat-card-content>
</mat-card>
