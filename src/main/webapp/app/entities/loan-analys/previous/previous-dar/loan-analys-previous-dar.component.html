<ejs-menu [enableScrolling]="true" cssClass="e-rounded-menu e-custom-scroll" [items]="menuItemsAll" (select)="setMenu($event)"> </ejs-menu>

<div *ngIf="selectedMenu === 'PREVIOUS DAR'">
  <!-- Loan Facility Detail -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">PREVIOUS DAR</div>
  </div>
  <div>
    <ng-container *ngIf="loadingPreviousDar$ | async; else loanFacilityPreviousDar">
      <div class="container">
        <div class="spinner"></div>
        <div class="text">Checking Previous Dar Data....</div>
      </div>
    </ng-container>

    <ng-template #loanFacilityPreviousDar>
      <jhi-compare-data-loan-facility
        [dataFrom]="'previousDar'"
        *ngIf="isDataToCompareExist; else LoanFacilityNotFound"
      ></jhi-compare-data-loan-facility>
    </ng-template>
  </div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">CURRENT PROPOSAL</div>
  </div>
  <div>
    <ng-container *ngIf="creditProposal.attributes['previousHistory']; else loanFacilityEntity">
      <jhi-compare-data-loan-facility [dataFrom]="'previousHistory'"></jhi-compare-data-loan-facility>
    </ng-container>

    <ng-template #loanFacilityEntity>
      <jhi-compare-data-loan-facility [dataFrom]="'entity'"></jhi-compare-data-loan-facility>
    </ng-template>
  </div>

  <!-- Collateral Info -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">PREVIOUS DAR</div>
  </div>
  <div>
    <ng-container *ngIf="loadingPreviousDar$ | async; else CollateralPreviousDar">
      <div class="container">
        <div class="spinner"></div>
        <div class="text">Checking Previous Dar Data....</div>
      </div>
    </ng-container>

    <ng-template #CollateralPreviousDar>
      <jhi-collateral-info-history
        *ngIf="isDataToCompareExist; else CollateralNotFound"
        [isOnCompareData]="true"
        [isCompareDar]="true"
        [source]="'summaryAll'"
        [parentSource]="'loan-analys'"
        [isViewMode]="true"
        [takeOutCompare]="true"
        [creditProposal]="dataToCompare"
        [collateralProperties]="collateralProperties"
      ></jhi-collateral-info-history>
    </ng-template>
  </div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">CURRENT PROPOSAL</div>
  </div>

  <div>
    <jhi-collateral-info-history
      *ngIf="creditProposal.attributes['previousHistory']"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
      [collateralProperties]="collateralProperties"
    >
    </jhi-collateral-info-history>
    <jhi-credit-proposal-collateral-info
      *ngIf="!creditProposal.attributes['previousHistory']"
      [collateralProperties]="collateralProperties"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
    >
    </jhi-credit-proposal-collateral-info>
  </div>

  <div class="e-card-actions"></div>

  <!-- Covenant -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">PREVIOUS DAR</div>
  </div>
  <div>
    <ng-container *ngIf="loadingPreviousDar$ | async; else CovenantPreviousDar">
      <div class="container">
        <div class="spinner"></div>
        <div class="text">Checking Previous Dar Data....</div>
      </div>
    </ng-container>

    <ng-template #CovenantPreviousDar>
      <jhi-compare-data-covenant
        [dataFrom]="'previousDar'"
        *ngIf="isDataToCompareExist; else CovenantNotFound"
        [setActiveMenu]="'COVENANT'"
      ></jhi-compare-data-covenant>
    </ng-template>
  </div>
  <div class="e-card-actions"></div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">CURRENT PROPOSAL</div>
  </div>

  <div>
    <ng-container *ngIf="creditProposal.attributes['previousHistory']; else covenantEntity">
      <jhi-compare-data-covenant [dataFrom]="'previousHistory'" [setActiveMenu]="'COVENANT'"></jhi-compare-data-covenant>
    </ng-container>

    <ng-template #covenantEntity>
      <jhi-compare-data-covenant [dataFrom]="'entity'" [setActiveMenu]="'COVENANT'"></jhi-compare-data-covenant>
    </ng-template>
  </div>

  <div class="e-card-actions"></div>

  <!-- Deviation -->
  <div class="e-card-content mt-3">
    <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
      <div class="e-card-header-title">PREVIOUS DAR</div>
    </div>
    <div>
      <ng-container *ngIf="loadingPreviousDar$ | async; else DeviationPreviousDar">
        <div class="container">
          <div class="spinner"></div>
          <div class="text">Checking Previous Dar Data....</div>
        </div>
      </ng-container>

      <ng-template #DeviationPreviousDar>
        <jhi-compare-data-covenant
          [dataFrom]="'previousDar'"
          *ngIf="isDataToCompareExist; else DeviationNotFound"
          [setActiveMenu]="'DEVIATION'"
        ></jhi-compare-data-covenant>
      </ng-template>
    </div>
  </div>
  <div class="e-card-actions"></div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">CURRENT PROPOSAL</div>
  </div>

  <div>
    <ng-container *ngIf="creditProposal.attributes['previousHistory']; else deviationEntity">
      <jhi-compare-data-covenant [dataFrom]="'previousHistory'" [setActiveMenu]="'DEVIATION'"></jhi-compare-data-covenant>
    </ng-container>

    <ng-template #deviationEntity>
      <jhi-compare-data-covenant [dataFrom]="'entity'" [setActiveMenu]="'DEVIATION'"></jhi-compare-data-covenant>
    </ng-template>
  </div>

  <div class="e-card-actions"></div>
</div>
<div *ngIf="selectedMenu === 'PREVIOUS PROPOSAL'">
  <jhi-loan-analys-previous-proposal [creditProposal]="creditProposal"> </jhi-loan-analys-previous-proposal>
</div>

<!-- Templates -->
<ng-template #LoanFacilityNotFound>
  <jhi-compare-data-not-found headerTitle="Loan Facility Details"></jhi-compare-data-not-found>
</ng-template>

<ng-template #CollateralNotFound>
  <jhi-compare-data-not-found headerTitle="Collateral"></jhi-compare-data-not-found>
</ng-template>

<ng-template #CovenantNotFound>
  <jhi-compare-data-not-found headerTitle="Covenant"></jhi-compare-data-not-found>
</ng-template>

<ng-template #DeviationNotFound>
  <jhi-compare-data-not-found headerTitle="Deviation"></jhi-compare-data-not-found>
</ng-template>
