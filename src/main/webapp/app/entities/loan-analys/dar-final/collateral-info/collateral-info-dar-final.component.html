<div class="row">
  <div *ngIf="creditProposal.attributes['proposalType'] === 'Total Exposure > IDR 15 Bio'">
    <jhi-above-grid-dar-final [creditProposal]="creditProposal" [collateralProperties]="collateralProperties"></jhi-above-grid-dar-final>
  </div>
</div>

<div *ngIf="creditProposal.attributes['proposalType'] === 'Total Exposure <= IDR 15 Bio'">
  <jhi-bellow-grid-dar-final [creditProposal]="creditProposal" [collateralProperties]="collateralProperties"></jhi-bellow-grid-dar-final>
</div>

<div *ngIf="creditProposal.attributes['proposalType'] === 'Total Exposure Back to Back'">
  <jhi-btb-grid-dar-final [creditProposal]="creditProposal" [collateralProperties]="collateralProperties"></jhi-btb-grid-dar-final>
</div>
