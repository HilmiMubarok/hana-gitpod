<table mat-table [dataSource]="creditProposal.attributes['facilityTakeOver']" class="w-100">
  <ng-container matColumnDef="no">
    <th mat-header-cell *matHeaderCellDef>No</th>
    <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
  </ng-container>
  <ng-container matColumnDef="facilityType1">
    <th mat-header-cell *matHeaderCellDef>Facility Type</th>
    <td mat-cell *matCellDef="let element">{{ element.facilityTypeBank }}</td>
  </ng-container>
  <ng-container matColumnDef="initialLimit">
    <th mat-header-cell *matHeaderCellDef>Initial Limit</th>
    <td mat-cell *matCellDef="let element">{{ element.initialLimitBank | currency: 'IDR ':'symbol':'1.0-0' }}</td>
  </ng-container>
  <ng-container matColumnDef="outstanding">
    <th mat-header-cell *matHeaderCellDef>O/S</th>
    <td mat-cell *matCellDef="let element">{{ element.outstandingBank | currency: 'IDR ':'symbol':'1.0-0' }}</td>
  </ng-container>
  <ng-container matColumnDef="tenor">
    <th mat-header-cell *matHeaderCellDef>Tenor</th>
    <td mat-cell *matCellDef="let element">{{ element.maturityBank | number: '1.0-0' }}</td>
  </ng-container>
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button (click)="openDialog(element)">
        <mat-icon>remove_red_eye</mat-icon>
      </button>
      <button mat-icon-button (click)="onDelete(element)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
  </tr>
  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
</table>
<mat-card *ngIf="loading" id="material-loading-bar">
  <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
</mat-card>
<section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
  <div align="right" class="mt-5">
    <button mat-raised-button color="success" (click)="openDialog()">ADD</button>
  </div>
</section>
<section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
  <div class="mt-3 text-center">
    <button mat-raised-button color="primary" hidden (click)="openDialog()">ADD</button>
  </div>
</section>
