<div style="justify-content: flex-end; display: flex">
  <button style="float: right" mat-raised-button class="button-styling" (click)="donwload()">Download All File</button>
</div>
<div *ngFor="let item of dataArray">
  <mat-card *ngIf="item.statusId === 'ACTIVE'" style="margin-top: 12px">
    <mat-card-header>
      <mat-card-subtitle class="header-title">{{ item.description }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="item.level" class="w-100">
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef width="5%">No</th>
          <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
        </ng-container>
        <ng-container matColumnDef="document">
          <th mat-header-cell *matHeaderCellDef width="50%">Document Name</th>
          <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        </ng-container>
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let element">{{ element.category }}</td>
        </ng-container>
        <ng-container matColumnDef="dueDate">
          <th mat-header-cell *matHeaderCellDef>Due Date</th>
          <td mat-cell *matCellDef="let element">
            <span *ngIf="element.dueDate !== 'null'">{{ element.dueDate | date: 'YYYY-MM-dd' }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let element">{{ element.status }}</td>
        </ng-container>

        <ng-container matColumnDef="remarks">
          <th mat-header-cell *matHeaderCellDef>Remarks</th>
          <td mat-cell *matCellDef="let element">
            <span *ngIf="element.remarks !== 'null'">{{ element.remarks }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef width="6%">Action</th>
          <td mat-cell *matCellDef="let element">
            <div>
              <button
                *ngIf="
                  item.parentId === 'DOC_LA' &&
                  matrix === true &&
                  creditProposal.statusCode !== 'PK_RETURN_TO_RM' &&
                  creditProposal.statusCode !== 'PK_DAR_REVISION_CHECKER' &&
                  router.url.includes('dar-revision-checker') === false
                "
                mat-icon-button
                (click)="openDialog(element, 'add', item.description)"
              >
                <mat-icon>create</mat-icon>
              </button>

              <button
                *ngIf="
                  item.parentId !== 'DOC_IDD' &&
                  item.parentId !== 'DOC_LA' &&
                  matrix === true &&
                  creditProposal.statusCode !== 'PK_RETURN_TO_RM' &&
                  creditProposal.statusCode !== 'PK_DAR_REVISION_CHECKER' &&
                  router.url.includes('dar-revision-checker') === false
                "
                mat-icon-button
                (click)="openDialog(element, 'add', item.description)"
              >
                <mat-icon>create</mat-icon>
              </button>
              <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: 'input'">
                <button
                  *ngIf="
                    item.parentId !== 'DOC_IDD' &&
                    item.parentId !== 'DOC_LA' &&
                    creditProposal.statusCode !== 'PK_RETURN_TO_RM' &&
                    router.url.includes('dar-revision-checker') === false
                  "
                  mat-icon-button
                  (click)="openDialog(element, 'add', item.description)"
                >
                  <mat-icon>create</mat-icon>
                </button>

                <button mat-icon-button (click)="openDialog(element, 'view', item.description)">
                  <mat-icon>remove_red_eye</mat-icon>
                </button>
              </section>

              <button
                *ngIf="
                  creditProposal.statusCode === 'PK_RETURN_TO_RM' &&
                  matrix !== true &&
                  item.parentId !== 'DOC_LA' &&
                  router.url.includes('dar-revision-checker') === false
                "
                mat-icon-button
                (click)="openDialog(element, 'add', item.description)"
              >
                <mat-icon>create</mat-icon>
              </button>

              <section class="dppk-button">
                <button
                  *ngIf="
                    (dppkEditable && element.parentId === 'DOC_DPPK_KENDARAAN') ||
                    (dppkEditable && element.parentId === 'DOC_DPPK_JUALBELI') ||
                    (dppkEditable && element.parentId === 'DOC_DPPK_KENDARAAN') ||
                    (dppkEditable && element.parentId === 'DOC_DPPK_NEW')
                  "
                  mat-icon-button
                  (click)="openDialog(element, 'add', item.description)"
                >
                  <mat-icon>create</mat-icon>
                </button>
              </section>
              <section *jhiMatrixDir="creditProposal.statusId; menu: 'credit-proposal'; subMenu: ''; elementType: ''">
                <button mat-icon-button (click)="openDialog(element, 'view', item.description)">
                  <mat-icon>remove_red_eye</mat-icon>
                </button>
              </section>
            </div>
          </td>
        </ng-container>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="['no', 'document', 'category', 'remarks', 'dueDate', 'status', 'action'].length">
            No records found.
          </td>
        </tr>
        <tr mat-header-row *matHeaderRowDef="['no', 'document', 'category', 'remarks', 'dueDate', 'status', 'action']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['no', 'document', 'category', 'remarks', 'dueDate', 'status', 'action']"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
