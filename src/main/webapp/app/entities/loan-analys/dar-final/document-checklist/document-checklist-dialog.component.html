<div class="style-close">
  <button class="button-close" mat-button mat-dialog-close>X</button>
</div>
<h2 mat-dialog-title>ADD / EDIT DOCUMENT CHECKLIST</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-6">
      <ngx-dropzone accept="*" disabled multiple="true" (change)="onSelect($event)">
        <ngx-dropzone-label>Drop file here or choose your file</ngx-dropzone-label>
      </ngx-dropzone>

      <div class="row">
        <ngx-dropzone-preview
          class="col-6"
          ngProjectAs="ngx-dropzone-preview"
          *ngFor="let f of file"
          [removable]="false"
          (removed)="onRemove(f)"
        >
          <ngx-dropzone-label *ngIf="f.url === undefined">
            <ngx-dropzone-image-preview ngProjectAs="ngx-dropzone-image-preview" [file]="f"></ngx-dropzone-image-preview>
          </ngx-dropzone-label>

          <ngx-dropzone-label *ngIf="f.url !== undefined">
            <img [src]="f.url" width="100%" height="100%" />
          </ngx-dropzone-label>
        </ngx-dropzone-preview>
      </div>
    </div>

    <div class="col-6">
      <div class="row">
        <div class="col-12">
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Category type</mat-label>
                <mat-select [(ngModel)]="documentChecklist.documentType" name="documentType" disabled>
                  <mat-option value="">- Please Select -</mat-option>
                  <mat-option
                    *ngFor="let item of ['Debtors Identity', 'Collateral', 'Credit Approval', 'Credit Aggrement', 'Other']"
                    [value]="item"
                  >
                    {{ item }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </section>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Document Name</mat-label>
                <input matInput type="text" [(ngModel)]="documentChecklist.document" disabled />
              </mat-form-field>
            </div>
          </section>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Status</mat-label>
                <mat-select [(ngModel)]="documentChecklist.status" name="status" disabled>
                  <mat-option value="">- Please Select -</mat-option>
                  <mat-option *ngFor="let item of ['Available', 'TBO', 'Waived']" [value]="item">
                    {{ item }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </section>
        </div>
        <div class="col-6">
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Date</mat-label>
                <input [matDatepicker]="date" disabled matInput type="text" [(ngModel)]="documentChecklist.dueDate" />
                <mat-datepicker-toggle matSuffix disabled [for]="date"></mat-datepicker-toggle>
                <mat-datepicker #date disabled></mat-datepicker>
              </mat-form-field>
            </div>
          </section>
        </div>
      </div>

      <div class="row">
        <div class="col-6">
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Category</mat-label>
                <mat-select [(ngModel)]="documentChecklist.category" name="category" disabled>
                  <mat-option value="">- Please Select -</mat-option>
                  <mat-option *ngFor="let item of ['A', 'B', 'C']" [value]="item">
                    {{ item }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </section>
        </div>
        <div class="col-6">
          <section>
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Remarks</mat-label>
                <input matInput type="text" [(ngModel)]="documentChecklist.remarks" disabled />
              </mat-form-field>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <section>
    <button mat-button *ngIf="!view" (click)="save()">Save</button>
    <button mat-button mat-dialog-close>Close</button>
  </section>
</mat-dialog-actions>
