<mat-sidenav-container [hasBackdrop]="true">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <div class="e-card-header-title">Loan Analys</div>
      </div>
    </div>
    <div class="e-card-content">
      <div *ngIf="selectedMenu === 'credit-proposal-summary'" class="e-sample-resize-container e-card-resize-container">
		<jhi-credit-proposal-correspondence [creditProposal]="creditProposal"></jhi-credit-proposal-correspondence>
	  </div>

      <div *ngIf="selectedMenu === 'opinion'" class="e-sample-resize-container e-card-resize-container"></div>

      <div *ngIf="selectedMenu === 'compare-data'" class="e-sample-resize-container e-card-resize-container"></div>
    </div>
    <div class="e-card-actions mx-auto mb-5 mt-3">
      <button
        style="margin-right: 25px"
        mat-raised-button
        *ngFor="let task of tasks"
        (click)="processTask(task)"
        class="btn-lg text-uppercase"
      >
        {{ task.caption }}
      </button>
      <button mat-raised-button class="btn-lg text-uppercase" (clickEv)="onSave()">Save</button>
    </div>
  </div>
  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav" mode="over">
    <div class="p-3" style="padding-top: 90px !important">
      <div style="font-size: 1.5rem; font-weight: 600">Select your destination:</div>
      <mat-list role="list">
        <mat-list-item role="listitem">
          <a (click)="selectedMenu = 'credit-proposal-summary'; drawer.toggle()">Credit Proposal Summary</a>
        </mat-list-item>
        <mat-list-item role="listitem">
          <a (click)="selectedMenu = 'opinion'; drawer.toggle()">Opinion</a>
        </mat-list-item>
        <mat-list-item role="listitem">
          <a (click)="selectedMenu = 'compare-data'; drawer.toggle()">Compare Data</a>
        </mat-list-item>
      </mat-list>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
<button
  matTooltip="Click this for show sub menu of Loan Analys"
  style="z-index: 1"
  class="btn-menu-floating"
  (click)="drawer.toggle()"
  mat-fab
  color="warn"
  matTooltipPosition="before"
>
  <mat-icon>more_vert</mat-icon>
</button>
