<mat-sidenav-container [hasBackdrop]="true">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="{{ appName }}" url="{{ parentPath }}/{{ getText(value) }}"></e-breadcrumb-item>
            <e-breadcrumb-item
              text="Assign"
              url="{{ parentPath }}/{{ getText(value) }}{{ creditProposal.id }}/{{ titleUrl }}"
            ></e-breadcrumb-item>
            <e-breadcrumb-item
              text="{{ getTextMenu() }} {{ titleMenu }}"
              url="{{ parentPath }}/{{ getText(value) }}{{ creditProposal.id }}/{{ titleUrl }}/{{ selectedMenu }}"
            >
            </e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">{{ appName }}</p>
        </div>
      </div>
    </div>

    <div class="">
      <div *ngIf="selectedMenu === 'credit-proposal-summary'" class="e-sample-resize-container e-card-resize-container">
        <!-- Credit proposal -->
        <mat-card class="mb-3">
          <mat-card-content>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <ejs-textbox
                    required
                    disabled
                    [(ngModel)]="creditProposal.applicationNumber"
                    placeholder="Proposal Number"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-textbox>
                </div>
                <div class="form-group mb-3">
                  <ejs-textbox
                    required
                    disabled
                    [value]="creditProposal.createdDate | formatMediumDate"
                    placeholder="Proposal Date"
                    cssClass="e-outline"
                    floatLabelType="Always"
                  ></ejs-textbox>
                </div>
                <div class="form-group mb-3">
                  <ejs-textbox
                    cssClass="e-outline"
                    placeholder="CIF Number"
                    (change)="onProposalTypeChange($event)"
                    [(ngModel)]="creditProposal.customerNumber"
                    [dataSource]="proposalType"
                    disabled
                  ></ejs-textbox>
                </div>
                <div class="form-group mb-3">
                  <ejs-textbox
                    cssClass="e-outline"
                    placeholder="Customer Name"
                    (change)="onProposalTypeChange($event)"
                    [(ngModel)]="creditProposal.cif.name"
                    [dataSource]="proposalType"
                    disabled
                  ></ejs-textbox>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <ejs-combobox
                    cssClass="e-outline"
                    placeholder="Proposal Type"
                    (change)="onProposalTypeChange($event)"
                    [(ngModel)]="creditProposal.attributes.proposalType"
                    [dataSource]="proposalType"
                    disabled
                  >
                  </ejs-combobox>
                </div>
                <div class="form-group mb-3">
                  <ejs-textbox
                    [(ngModel)]="creditProposal.attributes['basicInformation'].refferal"
                    placeholder="Referral"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    disabled
                  ></ejs-textbox>
                </div>
                <div class="form-group mb-3">
                  <ejs-textbox
                    [(ngModel)]="creditProposal.attributes['basicInformation'].bookingBranch"
                    placeholder="Booking Branch"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    disabled
                  ></ejs-textbox>
                </div>
              </div>
            </div>
          </mat-card-content>
        </mat-card>

        <!-- RM -->
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header">RM</div>
          </div>
        </div>
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-personal-info [creditProposal]="creditProposal"></jhi-credit-proposal-personal-info>
          </mat-card-content>
        </mat-card>

        <!-- cust info -->
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header">Customer Info</div>
          </div>
        </div>
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-person
              *ngIf="creditProposal.partyTypeId === 'PERSON'"
              [item]="creditProposal.prospectPerson"
              [deptorData]="creditProposal"
              mode="view"
            >
            </jhi-credit-proposal-person>
            <jhi-party-group-view
              [mode]="'view'"
              *ngIf="creditProposal.partyTypeId !== 'PERSON'"
              [item]="creditProposal"
            ></jhi-party-group-view>
          </mat-card-content>
        </mat-card>

        <!-- postal address -->
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header">Address</div>
          </div>
        </div>

        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-postal-address-view [item]="postalAdresss.address" mode="view"></jhi-postal-address-view>
          </mat-card-content>
        </mat-card>

        <!-- loan facility -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-loan-facility-detail
              *ngIf="!isHistoryExist"
              [isViewMode]="true"
              [parentSource]="'loan-analys'"
              [creditProposal]="creditProposal"
            >
            </jhi-credit-proposal-tab-loan-facility-detail>
            <jhi-loan-facility-detail-history
              *ngIf="isHistoryExist"
              [isViewMode]="true"
              [parentSource]="'loan-analys'"
              [creditProposal]="creditProposal"
            ></jhi-loan-facility-detail-history>
          </mat-card-content>
        </mat-card>

        <!-- tab Exposure -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-exposure [creditProposal]="creditProposal"></jhi-credit-proposal-tab-exposure>
          </mat-card-content>
        </mat-card>

        <!-- collateral info -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-collateral-info
              #creditProposalCollateralInfoComponent
              *ngIf="!isHistoryExist"
              [creditProposal]="creditProposal"
              [parentSource]="'loan-analys'"
              [isViewMode]="true"
            >
            </jhi-credit-proposal-collateral-info>
            <jhi-collateral-info-history
              #creditProposalCollateralInfoComponent
              *ngIf="isHistoryExist"
              [creditProposal]="creditProposal"
              [parentSource]="'loan-analys'"
              [isViewMode]="true"
            >
            </jhi-collateral-info-history>
          </mat-card-content>
        </mat-card>

        <!-- document: summary gabung -->
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-summary [item]="creditProposal" [sourceComponent]="'loan'"> </jhi-credit-proposal-tab-summary>
          </mat-card-content>
        </mat-card>

        <!-- assign to -->
        <!-- ? Component assign to akan muncul ketika status == CP_APPROVE_TO_LA di halaman la-distribution -->
        <jhi-assign-to
          (assignTo)="onAssignTo($event)"
          *ngIf="creditProposal.statusId == 'CP_APPROVE_TO_LA' && url == 'la-distribution'"
          [creditProposal]="creditProposal"
          [url]="url"
        ></jhi-assign-to>

        <!-- ? Component assign to akan muncul ketika status == CP_CC_DISTRIBUTION di halaman cc-distribution -->
        <jhi-assign-to
          (assignTo)="onAssignTo($event)"
          *ngIf="creditProposal.statusId == 'CP_CC_DISTRIBUTION' && url == 'cc-distribution'"
          [creditProposal]="creditProposal"
          [url]="url"
        ></jhi-assign-to>
      </div>

      <!-- Basic Information -->
      <div *ngIf="selectedMenu === 'basic-information'" class="e-sample-resize-container e-card-resize-container">
        <div>
          <mat-card class="mb-3">
            <mat-card-content>
              <jhi-credit-proposal-basic-information [creditProposal]="creditProposal"> </jhi-credit-proposal-basic-information>
            </mat-card-content>
          </mat-card>
        </div>
        <!-- Proposal Info -->

          <mat-card class="mb-3">

                      (change)="onProposalTypeChange($event)" [(ngModel)]="creditProposal.attributes.proposalType"

                  </div>
                </div>
              </div>
            </mat-card-content>
          </mat-card>
        </div> -->

      </div>

      <!-- Document Checklist -->
      <div *ngIf="selectedMenu === 'document-checklist'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-document-checklist [creditProposal]="creditProposal"> </jhi-credit-proposal-document-checklist>
      </div>

      <!-- Bussines Activity -->
      <div *ngIf="selectedMenu === 'business-activity'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-busines-activity [creditProposalItem]="creditProposal" [projectAnalysis]="subMenuItems">
        </jhi-credit-proposal-busines-activity>
      </div>

      <!-- Loan Facility -->
      <div *ngIf="selectedMenu === 'loan-facility'" class="e-sample-resize-container e-card-resize-container">
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-loan-facility-detail
              *ngIf="!isHistoryExist"
              [isViewMode]="true"
              [parentSource]="'loan-analys'"
              [creditProposal]="creditProposal"
            >
            </jhi-credit-proposal-tab-loan-facility-detail>
            <jhi-loan-facility-detail-history
              *ngIf="isHistoryExist"
              [isViewMode]="true"
              [parentSource]="'loan-analys'"
              [creditProposal]="creditProposal"
            ></jhi-loan-facility-detail-history>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Exposure -->
      <div *ngIf="selectedMenu === 'exposure'" class="e-sample-resize-container e-card-resize-container">
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-tab-exposure [creditProposal]="creditProposal"></jhi-credit-proposal-tab-exposure>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Risk Acceptance Criteria -->
      <div *ngIf="selectedMenu === 'risk-acceptance-criteria'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-risk-acceptance-criteria [item]="creditProposal"> </jhi-credit-proposal-risk-acceptance-criteria>
      </div>

      <!-- Collateral Info -->
      <div *ngIf="selectedMenu === 'collateral-info' && !isHistoryExist" class="e-sample-resize-container e-card-resize-container">
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-credit-proposal-collateral-info
              #creditProposalCollateralInfoComponent
              [creditProposal]="creditProposal"
              [parentSource]="'loan-analys'"
              [isViewMode]="true"
            >
            </jhi-credit-proposal-collateral-info>
          </mat-card-content>
        </mat-card>
      </div>

      <div *ngIf="selectedMenu === 'collateral-info' && isHistoryExist" class="e-sample-resize-container e-card-resize-container">
        <mat-card class="mb-3">
          <mat-card-content>
            <jhi-collateral-info-history
              #creditProposalCollateralInfoComponent
              [creditProposal]="creditProposal"
              [parentSource]="'loan-analys'"
              [isViewMode]="true"
            ></jhi-collateral-info-history>
          </mat-card-content>
        </mat-card>
      </div>

      <!-- Management Information -->
      <div *ngIf="selectedMenu === 'management-information'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-management-info [creditProposalItem]="creditProposal"> </jhi-credit-proposal-management-info>
      </div>

      <!-- Financial Statement -->
      <!-- <div [hidden]="selectedMenu !== 'financial-statement'" class="e-sample-resize-container e-card-resize-container"> -->
      <div *ngIf="selectedMenu === 'financial-statement'">
        <jhi-repayment-spreadsheet
          [creditProposalItem]="creditProposal"
          *ngIf="creditProposal.attributes.proposalType === 'Total Exposure <= IDR 15 Bn'"
          [jhifilter]="creditProposal.attributes.proposalType"
          [saveWordMinio]="saveWord"
        ></jhi-repayment-spreadsheet>
        <jhi-repayment-spreadsheet
          [creditProposalItem]="creditProposal"
          *ngIf="
            creditProposal.attributes.proposalType === 'Total Exposure > IDR 15 Bn' ||
            creditProposal.attributes.proposalType === 'Total Exposure Back to Back'
          "
          [jhifilter]="creditProposal.attributes.proposalType"
          [saveWordMinio]="saveWord"
        >
        </jhi-repayment-spreadsheet>
      </div>

      <!-- Slik Checking -->
      <div *ngIf="selectedMenu === 'slik-checking'" class="e-sample-resize-container e-card-resize-container">
        <jhi-loan-analys-slik-main></jhi-loan-analys-slik-main>
      </div>

      <!-- Bank Account Analysis -->
      <div *ngIf="selectedMenu === 'bank-account-analyst'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-bank-account-analyst [creditProposal]="creditProposal"> </jhi-credit-proposal-bank-account-analyst>
      </div>

      <!-- Propose Pricing -->
      <div *ngIf="selectedMenu === 'propose-pricing'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-propose-pricing [creditProposal]="creditProposal"></jhi-credit-proposal-propose-pricing>
      </div>

      <!-- Covenant & TBO -->
      <div *ngIf="selectedMenu === 'convenant-tbo'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-tab-covenant [isViewMode]="true" *ngIf="!isHistoryExist" [creditProposalItem]="creditProposal">
        </jhi-credit-proposal-tab-covenant>
        <jhi-credit-proposal-tab-covenant-history [isViewMode]="true" *ngIf="isHistoryExist" [creditProposalItem]="creditProposal">
        </jhi-credit-proposal-tab-covenant-history>
      </div>

      <!-- Convenant Dar -->
      <div *ngIf="selectedMenu === 'dar-convenant'" class="e-sample-resize-container e-card-resize-container">
        <jhi-covenant-temp [isViewMode]="true" [creditProposalItem]="creditProposal"></jhi-covenant-temp>
      </div>

      <!-- Summary -->
      <div *ngIf="selectedMenu === 'summary'" class="e-sample-resize-container e-card-resize-container">
        <jhi-credit-proposal-tab-summary [item]="creditProposal" [sourceComponent]="'loan'"> </jhi-credit-proposal-tab-summary>
      </div>

      <!-- group guarantor analysis -->
      <div *ngIf="selectedMenu === 'group-guarantor-analyst'" class="e-sample-resize-container e-card-resize-container">
        <jhi-loan-analys-group-guarantor-analysis [saveWordMinio]="saveWord" [creditProposalItem]="creditProposal">
        </jhi-loan-analys-group-guarantor-analysis>
      </div>

      <!-- slik checking in credit proposal -->
      <div *ngIf="selectedMenu === 'slik-summary'" class="e-sample-resize-container e-card-resize-container">
        <jhi-loan-analys-slik-summary [creditProposal]="creditProposal"></jhi-loan-analys-slik-summary>
      </div>

      <!-- credit rating -->
      <div *ngIf="selectedMenu === 'credit-rating'">
        <jhi-loan-analys-credit-rating-view [mode]="'view'" [creditProposalItem]="creditProposal"> </jhi-loan-analys-credit-rating-view>
      </div>

      <!-- opinion -->
      <div *ngIf="selectedMenu === 'opinion'" class="e-sample-resize-container e-card-resize-container">
        <jhi-loan-analys-opinion
          #loanAnalysOpinionComponent
		  (uuidPath)="setUuidPath($event)"
          (nameLoginEmit)="setNameLogin($event)"
          (positionLoginEmit)="setPositionLogin($event)"
          (newItemEvent)="setOpinionRecomendation($event)"
          [creditProposalItem]="creditProposal"
          [cp]="cp"
        >
        </jhi-loan-analys-opinion>
      </div>

      <!-- compare data -->
      <div *ngIf="selectedMenu === 'compare-data'" class="e-sample-resize-container e-card-resize-container">
        <jhi-loan-analys-previous-dar [creditProposal]="creditProposal"></jhi-loan-analys-previous-dar>
      </div>

      <div *ngIf="selectedMenu === 'compliance-recommendation'" class="e-sample-resize-container e-card-resize-container">
        <jhi-loan-analys-compliance [word]="saveDoc"></jhi-loan-analys-compliance>
        <div *ngIf="parentPath === 'cc-review'">
          <jhi-loan-analys-opinion-compliance-part
            #loanAnalysOpinionCompliancePartComponent
			(uuidPath)="setUuidPathCompliance($event)"
            (positionLoginEmitCompliance)="setPositionLoginCompliance($event)"
            (newItemEventCompliance)="setOpinionRecomendationCompliance($event)"
            (typeOpinion)="setTypeOpinion($event)"
            [creditProposalItem]="creditProposal"
            [cp]="cp"
          >
          </jhi-loan-analys-opinion-compliance-part>
        </div>
      </div>
    </div>

    <div *ngIf="selectedMenu === 'mapping-facility'" class="e-sample-resize-container e-card-resize-container">
      <jhi-credit-proposal-collateral-info [isViewMode]="true" [creditProposal]="creditProposal"> </jhi-credit-proposal-collateral-info>
    </div>

    <!-- Temp -->
    <div *ngIf="selectedMenu === 'loan-facility-detail'" class="e-sample-resize-container e-card-resize-container">
      <jhi-loan-facility-detail-temp [creditProposal]="creditProposal"></jhi-loan-facility-detail-temp>
    </div>

    <div *ngIf="selectedMenu === 'facility-mapping'" class="e-sample-resize-container e-card-resize-container">
      <jhi-collateral-info-dar-final [creditProposal]="creditProposal"></jhi-collateral-info-dar-final>
    </div>

    <div *ngIf="selectedMenu === 'covenant'" class="e-sample-resize-container e-card-resize-container">
      <jhi-covenant-temp [creditProposalItem]="creditProposal"></jhi-covenant-temp>
    </div>

    <!-- Trade Checking  -->
    <div *ngIf="selectedMenu === 'trade-checking'">
      <jhi-credit-proposal-trade-checking [creditProposal]="creditProposal"></jhi-credit-proposal-trade-checking>
      <jhi-credit-proposal-trade-checking-remarks [creditProposal]="creditProposal" [saveWord]="saveWord">
      </jhi-credit-proposal-trade-checking-remarks>
    </div>
    <!-- Repayment Capability  -->

    <div *ngIf="parentPath === 'la-analyst' || parentPath === 'la-approval'">
      <div *ngIf="selectedMenu === 'repayment-capability'">
        <jhi-credit-proposal-repayment-capability [creditProposal]="creditProposal"> </jhi-credit-proposal-repayment-capability>
      </div>
    </div>

    <div class="e-card-actions mx-auto mb-5 mt-3">
      <jhi-button-generate-compliance *ngIf="parentPath === 'cc-inquiry'" [creditProposal]="creditProposal">
      </jhi-button-generate-compliance>
      <!-- membatasi button generate DAR hanya muncul ketika di menu loan comitee approval -->
      <jhi-button-generate-dar
        *ngIf="
          parentPath === 'loan-committee-approval' ||
          parentPath === 'dar-checker' ||
          parentPath === 'dar-final' ||
          parentPath === 'dar-notif'
        "
        [creditProposal]="creditProposal"
      ></jhi-button-generate-dar>
      <button
        style="margin-right: 25px"
        mat-raised-button
        *ngFor="let task of tasks"
        (click)="processTask(task)"
        class="btn-lg text-uppercase"
      >
        {{ task.caption }}
      </button>

      <button mat-raised-button class="btn-lg text-uppercase" (click)="onSave('default')">Save</button>
    </div>
  </div>
  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav" mode="over">
    <div class="p-3" style="padding-top: 90px !important">
      <div style="font-size: 1.5rem; font-weight: 600">Select your destination:</div>

      <mat-list role="list">
        <div *ngFor="let item of subMenu">
          <mat-list-item role="listitem">
            <a
              *ngIf="!item.hasOwnProperty('child')"
              href="javascript:void(0)"
              class="text-capitalize"
              (click)="routeSubMenu(item); drawer.toggle()"
              >{{ item.text }}</a
            >
          </mat-list-item>
          <mat-list-item class="text-capitalize" style="margin-top: -45px" *ngIf="item.hasOwnProperty('child')">{{
            item.text
          }}</mat-list-item>
          <mat-list role="list" *ngIf="item.hasOwnProperty('child')" style="margin-left: 10px; margin-top: -10px">
            <mat-list-item role="listitem" *ngFor="let itemChild of item.child">
              <mat-icon matListIcon style="font-size: 10px; display: flex; align-items: center">panorama_fish_eye </mat-icon>
              <a href="javascript:void(0)" (click)="routeSubMenu(itemChild); drawer.toggle()" class="text-capitalize">{{
                itemChild.text
              }}</a>
            </mat-list-item>
          </mat-list>
        </div>
      </mat-list>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
<button
