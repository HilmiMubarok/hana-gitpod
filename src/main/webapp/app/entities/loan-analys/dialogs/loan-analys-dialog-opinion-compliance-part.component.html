<mat-card-subtitle>Opinion History </mat-card-subtitle>
<mat-dialog-content>
  <mat-card>
    <div class="row">
      <div class="col-6">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Reviewer Name</mat-label>
          <input matInput type="text" [(ngModel)]="notes.userId" [disabled]="true" />
        </mat-form-field>

        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Position</mat-label>
          <input matInput type="text" [(ngModel)]="notes.positionUserId" [disabled]="true" />
        </mat-form-field>
      </div>

      <div class="col-6">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Date</mat-label>
          <input matInput type="text" [(ngModel)]="notes.createDate" [disabled]="true" />
        </mat-form-field>
      </div>
    </div>
  </mat-card>

  <mat-card>
    <p class="mb-5">
      <mat-card-subtitle>Opinion</mat-card-subtitle>
      <ejs-documenteditorcontainer
        #document_editor_container
        [enableToolbar]="false"
        [enableLocalPaste]="false"
        height="30vh"
        style="display: block"
        (documentChange)="onDocumentChange()"
        [enableEditor]="false"
        [isReadOnly]="true"
      >
      </ejs-documenteditorcontainer>
    </p>
  </mat-card>
