 <mat-card-subtitle>Opinion History </mat-card-subtitle>
 <mat-dialog-content>
   <mat-card>
     <div class="row">
       <div class="col-6">
         <mat-form-field class="w-100" appearance="outline">
           <mat-label>Approver Name</mat-label>
           <input matInput type="text" [(ngModel)]="notes.userId" [disabled]="true" />
         </mat-form-field>

         <mat-form-field class="w-100" appearance="outline">
           <mat-label>Position</mat-label>
           <input matInput type="text" [disabled]="true" />
         </mat-form-field>
       </div>

       <div class="col-6">
         <mat-form-field class="w-100" appearance="outline">
           <mat-label>Date</mat-label>
           <input matInput type="text" [(ngModel)]="notes.createDate" [disabled]="true" />
         </mat-form-field>
       </div>
     </div>
   </mat-card>

   <mat-card>
     <p class="mb-5">
       <mat-card-subtitle>Opinion</mat-card-subtitle>
       <ejs-documenteditorcontainer #document_editor_container [enableToolbar]="false" [enableLocalPaste]="false"
         height="30vh" style="display: block" (documentChange)="onDocumentChange()" [enableEditor]="false"
         [isReadOnly]="true">
       </ejs-documenteditorcontainer>
     </p>
   </mat-card>

   <mat-card>
     <div class="form-group">
       <mat-card-subtitle>{{ nameLabel }} </mat-card-subtitle>
       <div class="d-flex justify-content-around">
         <div class="mx-2">
           <ejs-radiobutton disabled [(ngModel)]="notes.recomendation" value="{{ valueRadioPurpose }}"
             label="{{ radioButtonPurpose }}"></ejs-radiobutton>
         </div>
         <div class="mx-2">
           <ejs-radiobutton disabled [(ngModel)]="notes.recomendation" value="{{ valueRadioCondition }}"
             label="{{ radioButtonCondition }}"></ejs-radiobutton>
         </div>
         <div class="mx-2">
           <ejs-radiobutton disabled [(ngModel)]="notes.recomendation" value="{{ valueRadioRecommend }}"
             label="{{ radioButtonNotRecommend }}">
           </ejs-radiobutton>
         </div>
       </div>
     </div>
   </mat-card>

   <mat-card>
     <p class="mb-5">
       <mat-card-subtitle>Condition </mat-card-subtitle>
       <ejs-documenteditorcontainer #document_editor_container_condition [enableToolbar]="false"
         [enableLocalPaste]="false" height="30vh" style="display: block" (documentChange)="onDocumentChanges()"
         [enableEditor]="false" [isReadOnly]="true">
       </ejs-documenteditorcontainer>
     </p>
   </mat-card>
 </mat-dialog-content>
