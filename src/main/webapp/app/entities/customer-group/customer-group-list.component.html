<mat-card>
  <mat-card-header>
    <mat-card-subtitle>Business Group</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-table-expand" multiTemplateDataRows>
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef class="text-center">No</th>
        <td mat-cell *matCellDef="let element; let i = dataIndex" class="text-center">
          {{ i + 1 + paginator.pageIndex * paginator.pageSize }}.
        </td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="text-center">Name</th>
        <td mat-cell *matCellDef="let element" class="text-center">{{ element.partyNameTo }}</td>
      </ng-container>
      <ng-container matColumnDef="cif">
        <th mat-header-cell *matHeaderCellDef class="text-center">CIF</th>
        <td mat-cell *matCellDef="let element" class="text-center">{{ element.cifTo }}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef class="text-center">Action</th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <button mat-icon-button (click)="openDelete(element)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <ng-container matColumnDef="expand">
        <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-icon-button
            aria-label="expand row"
            (click)="
              findDetailCustomerGroup(element); expandedElement = expandedElement === element ? null : element; $event.stopPropagation()
            "
          >
            <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
            <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumnsExpand.length">
          <div class="mat-element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'"></div>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumnsExpand.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumnsExpand"></tr>
      <tr
        mat-row
        *matRowDef="let element; columns: displayedColumnsExpand"
        [class.mat-expanded-row]="expandedElement === element"
        class="mat-element-row"
        (click)="findDetailCustomerGroup(element); expandedElement = expandedElement === element ? null : element"
      ></tr>
      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="mat-detail-row"></tr>
    </table>
    <mat-card *ngIf="loading" id="material-loading-bar">
      <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
    </mat-card>
    <mat-paginator
      showFirstLastButtons
      ngClass="transparant"
      [length]="paginatorLength"
      [pageSize]="paginatorPageSize"
      [pageSizeOptions]="paginatorPageSizeOption"
      (page)="loadDataLazy($event)"
    >
    </mat-paginator>
  </mat-card-content>
  <mat-card-actions align="right">
    <button mat-raised-button class="text-uppercase" (click)="openDialog()">ADD NEW BUSINESS GROUP</button>
  </mat-card-actions>
</mat-card>
