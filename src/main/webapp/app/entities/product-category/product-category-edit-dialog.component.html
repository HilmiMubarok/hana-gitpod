<h2 mat-dialog-title>ADD / EDIT PRODUCT CATEGORY</h2>
<mat-dialog-content>
  <div class="row">
    <div class="col-12">
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Category ID</mat-label>
          <input matInput type="text" [(ngModel)]="productParameter.id" [disabled]="true" />
        </mat-form-field>
      </section>
      <section class="mt-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Category Description</mat-label>
          <input matInput type="text" [(ngModel)]="productParameter.description" />
        </mat-form-field>
      </section>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button (click)="save()" style="background: rgba(0, 136, 129, 1); color: #ffffff">SAVE</button>
  <button mat-button (click)="openCancelDialog()" style="background: rgb(228, 39, 39); color: #ffffff">CLOSE</button>
</mat-dialog-actions>
