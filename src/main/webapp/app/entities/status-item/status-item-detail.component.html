<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.statusItem.home.viewLabel">Status Items</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.statusItem.detail.title">Status Item</span> {{ statusItem.id }} </p-header>
    <jhi-status-item-view [item]="statusItem" mode="item"> </jhi-status-item-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/status-item', statusItem.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
