<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.statusItem.statusName" for="field_statusName">Status Name</label>
        <input
          type="text"
          class="form-control"
          name="statusName"
          id="field_statusName"
          [(ngModel)]="item.statusName"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.statusItem.sequence" for="field_sequence">Sequence</label>
        <input
          currencyMask
          class="form-control"
          name="sequence"
          id="field_sequence"
          [(ngModel)]="item.sequence"
          [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.statusItem.statusCode" for="field_statusCode">Status Code</label>
        <input
          type="text"
          class="form-control"
          name="statusCode"
          id="field_statusCode"
          [(ngModel)]="item.statusCode"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.statusItem.description" for="field_description">Description</label>
        <input
          type="text"
          class="form-control"
          name="description"
          id="field_description"
          [(ngModel)]="item.description"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.statusItem.statusTypeId" for="field_statusTypeId">Status Type Id</label>
        <input
          type="text"
          class="form-control"
          name="statusTypeId"
          id="field_statusTypeId"
          [(ngModel)]="item.statusTypeId"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.statusItem.statusTypeDescription" for="field_statusTypeDescription"
          >Status Type Description</label
        >
        <input
          type="text"
          class="form-control"
          name="statusTypeDescription"
          id="field_statusTypeDescription"
          [(ngModel)]="item.statusTypeDescription"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.statusItem.caption" for="field_caption">Caption</label>
        <input type="text" class="form-control" name="caption" id="field_caption" [(ngModel)]="item.caption" [disabled]="readOnly()" />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.statusItem.icon" for="field_icon">Icon</label>
        <input type="text" class="form-control" name="icon" id="field_icon" [(ngModel)]="item.icon" [disabled]="readOnly()" />
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
