<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="cif">
      <h2 data-cy="cifDetailsHeading"><span jhiTranslate="losgwApp.cif.detail.title">Cif</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ cif.id }}</span>
        </dd>
        <dt><span jhiTranslate="losgwApp.cif.number">Number</span></dt>
        <dd>
          <span>{{ cif.number }}</span>
        </dd>
        <dt><span jhiTranslate="losgwApp.cif.partyId">Party Id</span></dt>
        <dd>
          <span>{{ cif.partyId }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/cif', cif.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
  </div>
</div>
