<div class="">
  <div class="card-body">
    <div *ngIf="selectedPartyType === 'Individual'">
      <div class="card-header">
        <p class="text-header">Personal Info</p>
      </div>
      <jhi-person-view (selectMaritalStatus)="updateMaritalStatus($event)" [item]="prospectPerson"></jhi-person-view>
      <div class="card-header">
        <p class="text-header">Spouse</p>
      </div>
      <jhi-person-view [item]="spouse" [mode]="spouseViewMode" disableMaritalStatus="true"></jhi-person-view>
      <div class="card-header">
        <p class="text-header">Address Info</p>
      </div>
      <jhi-postal-address-view [item]="primaryAddress"></jhi-postal-address-view>
      <div class="card-header">
        <p class="text-header">Employment Data</p>
      </div>
      <jhi-employment-view></jhi-employment-view>
    </div>

    <div *ngIf="selectedPartyType === 'Corporate'">
      <div class="card-header">
        <p class="text-header">Company Info</p>
      </div>
      <jhi-party-group-view [item]="prospectOrganization"></jhi-party-group-view>
      <div class="card-header">
        <p class="text-header">Address Info</p>
      </div>
      <jhi-postal-address-view [item]="primaryAddress"></jhi-postal-address-view>
      <div class="card-header">
        <p class="text-header">Management / Shareholder / Group</p>
      </div>
    </div>
  </div>
</div>
