<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.cif.home.viewLabel">Cifs</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.cif.detail.title">Cif</span> {{ cif.id }} </p-header>
    <jhi-cif-view [item]="cif" mode="item"> </jhi-cif-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/cif', cif.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
