<div class="e-card-header-caption mb-3">
  <ejs-breadcrumb cssClass="margin: 1rem;">
    <e-breadcrumb-items>
      <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
      <e-breadcrumb-item text="Dashboard Credit Legal" url=""> </e-breadcrumb-item>
    </e-breadcrumb-items>
  </ejs-breadcrumb>
</div>

<div class="department-header">
  <div class="department-name h4">DASHBOARD CREDIT LEGAL</div>
</div>

<jhi-mis-dashboard-card title="YEARLY REPORT" [content]="yearlyReport"></jhi-mis-dashboard-card>

</ng-template>

<jhi-mis-dashboard-card title="WEEKLY DATA UPDATE" [content]="weeklyDataUpdate" [defaultToggle]="false"></jhi-mis-dashboard-card>

</ng-template>

<jhi-mis-dashboard-card title="WEEKLY STATUS UPDATE" [content]="weeklyReport" [defaultToggle]="false"></jhi-mis-dashboard-card>
<ng-template #weeklyReport>
  <jhi-weekly-report></jhi-weekly-report>
</ng-template>

<jhi-mis-dashboard-card title="DATA PIC" [content]="dataPic" [defaultToggle]="false"></jhi-mis-dashboard-card>
<ng-template #dataPic>
  <jhi-data-pic></jhi-data-pic>
</ng-template>

<jhi-mis-dashboard-card title="SEGMENTATION DATA" [content]="segmentationData" [defaultToggle]="false"></jhi-mis-dashboard-card>
