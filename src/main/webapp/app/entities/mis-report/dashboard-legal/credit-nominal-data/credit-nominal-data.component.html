<div class="credit-nominal-data-container">
    <div class="form-section">
        <mat-form-field appearance="outline" class="form-field">
            <mat-label>Select Credit</mat-label>
            <mat-select [(ngModel)]="selectedCredit" (selectionChange)="onCreditSelected($event)">
                <mat-option *ngFor="
                let option of [
                  {
                    key: 'All',
                    value: 'Credit Legal Head Office (HO + OR)'
                  },
                  {
                    key: 'R1',
                    value: 'Credit Legal Head Office (HO)'
                  },
                  {
                    key: 'R2',
                    value: 'Credit Legal Out Region (OR)'
                  }
                ]
              " [value]="option.key">
                    {{ option.value }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
            <mat-label>Report Year</mat-label>
            <input matInput [matDatepicker]="dp" placeholder="Select year" [formControl]="yearFormControl" />
            <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
            <mat-datepicker #dp startView="multi-year" (yearSelected)="onYearSelected($event, dp)"
                panelClass="example-month-picker">
            </mat-datepicker>
        </mat-form-field>

        <button mat-raised-button class="generate-btn" (click)="generate()">Generate</button>
    </div>
    <div class="table-responsive-material">
        <table mat-table [dataSource]="dataSource" class="w-100">
            <ng-container matColumnDef="month">
                <th mat-header-cell *matHeaderCellDef>Month</th>
                <td mat-cell *matCellDef="let element">{{ element.month }}</td>
            </ng-container>

            <ng-container matColumnDef="totalIDR">
                <th mat-header-cell *matHeaderCellDef class="text-center">Total IDR</th>
                <td mat-cell *matCellDef="let element" class="text-center content">{{ element.formattedIDR }}</td>
            </ng-container>

            <ng-container matColumnDef="totalUSD">
                <th mat-header-cell *matHeaderCellDef class="text-center">Total USD</th>
                <td mat-cell *matCellDef="let element" class="text-center content">{{ element.formattedUSD }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns"></tr>
        </table>
    </div>
</div>
