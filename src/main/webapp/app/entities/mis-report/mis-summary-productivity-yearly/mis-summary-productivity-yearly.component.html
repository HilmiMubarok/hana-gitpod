<div class="e-card-header-caption">
  <ejs-breadcrumb cssClass="margin: 1rem;">
    <e-breadcrumb-items>
      <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
      <e-breadcrumb-item text="Summary Productivity" url=""> </e-breadcrumb-item>
    </e-breadcrumb-items>
  </ejs-breadcrumb>
</div>
<div class="department-header">
  <div class="department-name h4">CREDIT REVIEW DEPARTMENT</div>
</div>
<div class="row my-3">
  <mat-button-toggle-group name="menu" [(ngModel)]="menu" (ngModelChange)="onMenuChanged()">
    <mat-button-toggle value="yearly" checked>Yearly</mat-button-toggle>
    <mat-button-toggle value="monthly">Monthly</mat-button-toggle>
  </mat-button-toggle-group>
</div>
<form [formGroup]="misYearlyReports" (ngSubmit)="generateMISYearlyReport()">
  <mat-card [hidden]="menu === 'yearly'">
    <jhi-mis-monthly [form]="misYearlyReports"></jhi-mis-monthly>
  </mat-card>

  <mat-card [hidden]="menu === 'monthly'">
    <jhi-mis-yearly [form]="misYearlyReports"></jhi-mis-yearly>
  </mat-card>

  <div class="mt-3 text-center">
    <button
      mat-raised-button
      id="generate-btn"
      class="confirm-button-no"
      type="submit"
      [disabled]="misReportService.loadingGenerateDocument$ | async"
      [class.loading]="misReportService.loadingGenerateDocument$ | async"
    >
      {{ misReportService.generateDocumentLabel$ | async }}
    </button>
  </div>
</form>
