<div class="e-card-header-caption">
  <ejs-breadcrumb cssClass="margin: 1rem;">
    <e-breadcrumb-items>
      <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
      <e-breadcrumb-item text="Summary Productivity" url=""> </e-breadcrumb-item>
    </e-breadcrumb-items>
  </ejs-breadcrumb>
</div>

<div class="department-header">
  <div class="department-name h4">CREDIT REVIEW DEPARTMENT</div>
</div>
<div class="row my-3">
  <mat-button-toggle-group name="menu" [(ngModel)]="menu" (ngModelChange)="onMenuChanged()">
    <mat-button-toggle value="yearly" checked>Yearly</mat-button-toggle>
    <mat-button-toggle value="monthly">Monthly</mat-button-toggle>
  </mat-button-toggle-group>
</div>

<form [formGroup]="misYearlyReports" (ngSubmit)="generateMISYearlyReport()">
  <mat-card>
    <mat-card-content>
      <div class="row">
        <div class="col-12 col-md-6 mb-1">
          <div #formContainer>
            <form [formGroup]="misYearlyReports">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Year</mat-label>
                <input matInput [matDatepicker]="yearPicker" placeholder="Select Year" formControlName="year" readonly />
                <mat-datepicker-toggle matSuffix [for]="yearPicker"></mat-datepicker-toggle>
                <mat-datepicker
                  #yearPicker
                  startView="multi-year"
                  (yearSelected)="chosenYearHandler($event, yearPicker)"
                  panelClass="year-picker"
                ></mat-datepicker>
              </mat-form-field>
            </form>
          </div>
        </div>

        <div class="col-12 col-md-6 mb-1">
          <div #formContainer>
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Customer Status</mat-label>
              <mat-select formControlName="customerStatus">
                <mat-option *ngFor="let item of lovCustomerStatus" [value]="item">{{ item }}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="col">
        <div #formContainer>
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Approval Fasilitas</mat-label>
            <mat-select formControlName="approvalFasilitas" multiple>
              <li class="select-all" (click)="toggleSelectApprovalFasilitas()">
                {{ allSelectedApprovalFasilitas ? 'Deselect All' : 'Select All' }}
              </li>
              <mat-option *ngFor="let item of lovApprovalFasilitas" [value]="item">{{ item }} </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="mt-3 text-center">
    <button
      mat-raised-button
      id="generate-btn"
      class="confirm-button-no"
      type="submit"
      [disabled]="misReportService.loadingGenerateDocument$ | async"
      [class.loading]="misReportService.loadingGenerateDocument$ | async"
    >
      {{ misReportService.generateDocumentLabel$ | async }}
    </button>
  </div>
</form>
