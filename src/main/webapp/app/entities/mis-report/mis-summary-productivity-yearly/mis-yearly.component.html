<div [formGroup]="form">
  <div class="row">
    <div class="col-12 col-md-6 mb-1">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Year</mat-label>
        <input matInput [matDatepicker]="yearPicker" formControlName="year" placeholder="Select Year" readonly />
        <mat-datepicker-toggle matSuffix [for]="yearPicker"></mat-datepicker-toggle>
        <mat-datepicker
          #yearPicker
          startView="multi-year"
          (yearSelected)="chosenYearHandler($event, yearPicker)"
          panelClass="year-picker"
        ></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="col-12 col-md-6 mb-1">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Customer Status</mat-label>
        <mat-select formControlName="customerStatus">
          <mat-option *ngFor="let item of lovCustomerStatus" [value]="item">
            {{ item }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div class="col">
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>Approval Fasilitas</mat-label>
      <mat-select formControlName="approvalFasilitas" multiple>
        <li class="select-all" (click)="toggleSelectApprovalFasilitas()">
          {{ allSelectedApprovalFasilitas ? 'Deselect All' : 'Select All' }}
        </li>
        <mat-option *ngFor="let item of lovApprovalFasilitas" [value]="item">
          {{ item }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>
