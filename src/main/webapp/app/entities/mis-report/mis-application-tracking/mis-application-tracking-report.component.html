<form [formGroup]="MISApplicationTracking" (ngSubmit)="generateMISApplicationTracking()">
  <div class="e-card-header-caption">
    <ejs-breadcrumb cssClass="margin: 1rem;">
      <e-breadcrumb-items>
        <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
        <e-breadcrumb-item text="Application Tracking Report" url=""> </e-breadcrumb-item>
      </e-breadcrumb-items>
    </ejs-breadcrumb>
  </div>

  <div class="department-header" style="margin-bottom: 20px">
    <div class="department-name h4">Business Support Department</div>
  </div>

  <mat-card>
    <mat-card-content>
      <div class="row">
        <div class="col-12 col-md-6 mb-1">
          <div #formContainer>
            <mat-form-field
              class="w-100"
              appearance="outline"
              [class.disabled-control]="MISApplicationTracking.get('date1')?.disabled && MISApplicationTracking.get('date2')?.disabled"
              [hideRequiredMarker]="true"
            >
              <mat-label>Enter a date range</mat-label>
              <mat-date-range-input [rangePicker]="picker" (click)="picker.open()">
                <input
                  matStartDate
                  formControlName="date1"
                  placeholder="Start date"
                  (focus)="onDateRangeFocus()"
                  (blur)="onDateRangeBlur()"
                  [class.disabled-control]="MISApplicationTracking.get('date1')?.disabled"
                  readonly
                />
                <input
                  matEndDate
                  formControlName="date2"
                  [class.disabled-control]="MISApplicationTracking.get('date2')?.disabled"
                  placeholder="End date"
                  (focus)="onDateRangeFocus()"
                  readonly
                />
              </mat-date-range-input>
              <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-date-range-picker #picker> </mat-date-range-picker>
              <mat-datepicker-toggle matSuffix (click)="clearDateRange()" *ngIf="dateRangeHasValue()">
                <mat-icon matDatepickerToggleIcon>clear</mat-icon>
              </mat-datepicker-toggle>
            </mat-form-field>
          </div>
        </div>
        <div class="col-12 col-md-6 mb-1">
          <div #formContainer>
            <mat-form-field
              class="w-100"
              appearance="outline"
              [class.disabled-control]="MISApplicationTracking.get('status')?.disabled"
              [hideRequiredMarker]="true"
            >
              <mat-label>Status Proposal</mat-label>
              <mat-select formControlName="status" multiple>
                <li class="select-all" (click)="toggleSelectAll()">
                  {{ allSelected ? 'Deselect All' : 'Select All' }}
                </li>
                <mat-option *ngFor="let item of lovStatus" [value]="item.statusId">{{ item.statusDescription }}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
      <!--  -->
      <div class="row">
        <div class="col-12 col-md-6 mb-1">
          <div #formContainer>
            <mat-form-field
              class="w-100"
              appearance="outline"
              [class.disabled-control]="MISApplicationTracking.get('applicationType')?.disabled"
            >
              <mat-label>Application Type</mat-label>
              <mat-select formControlName="applicationType" multiple>
                <li class="select-all" (click)="toggleSelectApplicationTypeAll()">
                  {{ allSelectedApplicationType ? 'Deselect All' : 'Select All' }}
                </li>
                <mat-option *ngFor="let item of lovApplicationType" [value]="item">{{ item }}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
  <div class="mt-3 text-center">
    <button
      mat-raised-button
      id="generate-btn"
      class="confirm-button-no"
      type="submit"
      [disabled]="misReportService.loadingGenerateDocument$ | async"
      [class.loading]="misReportService.loadingGenerateDocument$ | async"
    >
      {{ misReportService.generateDocumentLabel$ | async }}
    </button>
  </div>
</form>
