<div class="row remove-row-scroll">
  <form [formGroup]="misCpTimeline" (ngSubmit)="generateMISCPTimeline()">
    <div class="e-card" [formGroup]="misCpTimeline" (ngSubmit)="generateMISCPTimeline()">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <ejs-breadcrumb cssClass="margin: 1rem;">
            <e-breadcrumb-items>
              <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
              <e-breadcrumb-item text="Credit proposal timeline" url=""> </e-breadcrumb-item>
            </e-breadcrumb-items>
          </ejs-breadcrumb>
          <div class="header-container">
            <div class="header-content">
              <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
              <span class="back-prefix" (click)="previousState()">Back | </span>
            </div>
            <!-- <p class="e-card-sub-title menu-title-class">{{ showTextMenu() }}</p> -->
            <p class="e-card-sub-title menu-title-class">Credit Proposal Timeline</p>
          </div>
        </div>
      </div>
      <mat-card-content>
        <div class="row my-3">
          <div class="col">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Enter a date range</mat-label>
              <mat-date-range-input [rangePicker]="picker">
                <input
                  matStartDate
                  formControlName="date1"
                  placeholder="Start date"
                  (focus)="onDateRangeFocus()"
                  (blur)="onDateRangeBlur()"
                />
                <input matEndDate formControlName="date2" placeholder="End date" (focus)="onDateRangeFocus()" (blur)="onDateRangeBlur()" />
              </mat-date-range-input>

              <mat-hint>MM/DD/YYYY – MM/DD/YYYY</mat-hint>
              <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-date-range-picker #picker> </mat-date-range-picker>
            </mat-form-field>
          </div>
          <div class="col">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Status</mat-label>
              <mat-select
                formControlName="status"
                (selectionChange)="changeOption($event)"
                multiple
                (openedChange)="onStatusOpenedChange($event)"
              >
                <li class="select-all" (click)="toggleSelectAll()">
                  {{ allSelected ? 'Deselect All' : 'Select All' }}
                </li>
                <mat-option *ngFor="let item of lovStatus" [value]="item.statusId">
                  {{ item.statusDescription }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <mat-form-field appearance="outline" class="w-100">
          <input
            matInput
            placeholder="Search in here..."
            type="text"
            formControlName="search"
            (focus)="onSearchFocus()"
            (blur)="onSearchBlur()"
          />
          <button matSuffix mat-icon-button aria-label="Search">
            <mat-icon>search</mat-icon>
          </button>
          <button matSuffix mat-icon-button aria-label="Clear">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </mat-card-content>
      <div class="mt-3 text-center">
        <button
          mat-raised-button
          id="generate-btn"
          class="confirm-button-no"
          type="submit"
          [disabled]="misReportService.loadingGenerateDocument$ | async"
          [class.loading]="misReportService.loadingGenerateDocument$ | async"
        >
          {{ misReportService.generateDocumentLabel$ | async }}
        </button>
      </div>
    </div>
  </form>
</div>
