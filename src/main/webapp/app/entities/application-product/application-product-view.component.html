<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.applicationProduct.amount" for="field_amount">Amount</label>
        <input
          currencyMask
          class="form-control"
          name="amount"
          id="field_amount"
          [(ngModel)]="item.amount"
          [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.applicationProduct.tenor" for="field_tenor">Tenor</label>
        <input
          currencyMask
          class="form-control"
          name="tenor"
          id="field_tenor"
          [(ngModel)]="item.tenor"
          [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
          [disabled]="readOnly()"
        />
      </div>

      <div class="form-group">
        <label jhiTranslate="losgwApp.applicationProduct.application" for="field_application">Application</label>
        <select
          class="form-control"
          id="field_application"
          name="application"
          [(ngModel)]="item.applicationId"
          [disabled]="applicationId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option
            [ngValue]="baseApplicationOption.id"
            *ngFor="let baseApplicationOption of baseapplications; trackBy: trackBaseApplicationById"
          >
            {{ baseApplicationOption.id }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.applicationProduct.product" for="field_product">Product</label>
        <select
          class="form-control"
          id="field_product"
          name="product"
          [(ngModel)]="item.productId"
          [disabled]="productId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="productOption.id" *ngFor="let productOption of products; trackBy: trackProductById">
            {{ productOption.id }}
          </option>
        </select>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
