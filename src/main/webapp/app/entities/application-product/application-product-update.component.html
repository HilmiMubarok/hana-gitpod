<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.applicationProduct.home.createOrEditLabel">Application Products</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{applicationProduct.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.applicationProduct.amount" for="field_amount">Amount</label>
                <input
                  currencyMask
                  class="form-control"
                  name="amount"
                  id="field_amount"
                  [(ngModel)]="item.amount"
                  [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.applicationProduct.tenor" for="field_tenor">Tenor</label>
                <input
                  currencyMask
                  class="form-control"
                  name="tenor"
                  id="field_tenor"
                  [(ngModel)]="item.tenor"
                  [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
                  [disabled]="readOnly()"
                />
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.applicationProduct.application" for="field_application">Application</label>
                <select
                  class="form-control"
                  id="field_application"
                  name="application"
                  [(ngModel)]="item.applicationId"
                  [disabled]="applicationId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="baseApplicationOption.id"
                    *ngFor="let baseApplicationOption of baseapplications; trackBy: trackBaseApplicationById"
                  >
                    {{ baseApplicationOption.id }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.applicationProduct.product" for="field_product">Product</label>
                <select
                  class="form-control"
                  id="field_product"
                  name="product"
                  [(ngModel)]="item.productId"
                  [disabled]="productId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="productOption.id" *ngFor="let productOption of products; trackBy: trackProductById">
                    {{ productOption.id }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
