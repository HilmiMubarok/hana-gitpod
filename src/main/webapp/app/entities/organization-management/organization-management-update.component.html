<div class="page-view" *ngIf="item$ | async as item">

  <div class="card">
    <div class="card-header d-flex justify-content-between">
      <h3 class="card-title">
        <span jhiTranslate="losgwApp.organizationManagement.home.createOrEditLabel">Organization Managements</span>
      </h3>
    </div>
    <div class="card-body">

      <!-- Form Save -->
      <form name="editForm" role="form" *ngIf="!organizationId" novalidate #editForm="ngForm">

        <div class="row">

          <div class="col">
            <div class="form-group">
              <ejs-datepicker placeholder="From Date" name="input_fromDate" type="date"
                [(ngModel)]="organizationManagement.fromDate" cssClass="e-outline" floatLabelType="Auto"
                format='dd MMMM yyyy'>
              </ejs-datepicker>
            </div>
          </div>

          <div class="col">
            <div class="form-group">
              <ejs-datepicker placeholder="Thru Date" name="input_thruDate" type="date"
                [(ngModel)]="organizationManagement.thruDate" cssClass="e-outline" floatLabelType="Auto"
                format='dd MMMM yyyy'>
              </ejs-datepicker>
            </div>
          </div>

        </div>

      </form>

      <!-- Form Update -->
      <form name="editForm" role="form" *ngIf="organizationId" novalidate (ngSubmit)="update()" #editForm="ngForm">

        <div class="row">

          <div class="col">
            <div class="form-group">
              <ejs-datepicker placeholder="From Date" name="input_fromDate" type="date"
                [(ngModel)]="organizationManagement.fromDate" cssClass="e-outline" floatLabelType="Auto"
                format='dd MMMM yyyy' [value]="organizationManagement.fromDate">
              </ejs-datepicker>
            </div>
          </div>

          <div class="col">
            <div class="form-group">
              <ejs-datepicker placeholder="From Date" name="input_thruDate" type="date"
                [(ngModel)]="organizationManagement.thruDate" cssClass="e-outline" floatLabelType="Auto"
                format='dd MMMM yyyy' [value]="organizationManagement.thruDate">
              </ejs-datepicker>
            </div>
          </div>

        </div>

      </form>

    </div>
    <div class="card-footer">
      <div class="d-flex justify-content-end gap-3">
        <a class="btn" ejs-button cssClass="e-info" (click)="update()" href="javascript:void(0)" style="cursor: pointer"
          aria-disabled="isSaving" tooltip="Back and update current data" *ngIf="organizationId">
          <span>
            <fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}
          </span>
        </a>
        <a class="btn" ejs-button (click)="save()" href="javascript:void(0)" cssClass="e-info" style="cursor: pointer"
          aria-disabled="isSaving" tooltip="Back and save current data" *ngIf="!organizationId">
          <span>
            <fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}
          </span>
        </a>
        <a class="btn" ejs-button cssClass="e-danger" (click)="previousState()" style="cursor: pointer"
          aria-disabled="isSaving" tooltip="Back, cancel save or update">
          <span>
            <fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}
          </span>
        </a>
      </div>
    </div>
  </div>
</div>
