<!-- CSS Styling for pager on data grid -->
<link rel='nofollow' rel='nofollow' href="https://cdn.syncfusion.com/ej2/material.css" rel="stylesheet" />

<div class="page-view">

  <ejs-accordion #element expandMode='Single'>
    <e-accordionitems>
      <e-accordionitem expanded='true'>
        <ng-template #header>
          <h5 class="p-2">
            <span jhiTranslate="losgwApp.organizationManagement.home.title">Organization
              Managements</span>
          </h5>
        </ng-template>
        <ng-template #content>
          <a class="text-white btn btn-success mb-3" ejs-button [routerLink]="['./new']" [queryParams]="queryParams()"
            tooltip="Add new Data">
            <span>
              <fa-icon icon="plus"></fa-icon> &nbsp;{{ 'entity.action.add' | translate }}
            </span>
          </a>
          <ejs-grid #grid [dataSource]='items' [allowPaging]="true" [pageSettings]="pageSettings">
            <e-columns>
              <e-column field='id' headerText='ID' textAlign='Center' width=90></e-column>
              <e-column field='fromDate' [format]="formatOptions" headerText='From Date' textAlign="Center"></e-column>
              <e-column field='thruDate' [format]="formatOptions" headerText='Thru Date' textAlign="Center">
              </e-column>
              <e-column headerText='Actions' textAlign='Center'>
                <ng-template #template let-data>
                  <button pButton type="submit" [routerLink]="['/organization-management', data.id, 'view']"
                    class="flat-button">
                    <fa-icon icon="eye"></fa-icon>
                  </button>
                  <button pButton type="submit" [routerLink]="['/organization-management', data.id, 'edit']"
                    class="flat-button">
                    <fa-icon icon="pencil-alt"></fa-icon>
                  </button>
                  <button pButton type="button" (click)="deleteItem(data.id)" class="flat-button">
                    <fa-icon icon="trash-alt"></fa-icon>
                  </button>
                </ng-template>
              </e-column>
            </e-columns>
          </ejs-grid>
        </ng-template>
      </e-accordionitem>
