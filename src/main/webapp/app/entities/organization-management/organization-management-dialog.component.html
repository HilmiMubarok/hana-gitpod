<mat-card-actions align="right" [hidden]="viewes">
  <button mat-button mat-dialog-close>X</button>
</mat-card-actions>

<h2 *ngIf="this.data.organizationManagement.id === undefined" mat-dialog-title>ADD ORGANIZATION MANAGEMENT</h2>
<h2 *ngIf="this.data.organizationManagement.id !== undefined" mat-dialog-title>EDIT ORGANIZATION MANAGEMENT</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-header>
      <div *ngIf="organizationManagement.person">
        <mat-card-subtitle>Person Info</mat-card-subtitle>
      </div>
      <div *ngIf="!organizationManagement.person">
        <mat-card-subtitle>Organization Info</mat-card-subtitle>
      </div>
    </mat-card-header>
    <mat-card-content>
      <ng-container *ngIf="organizationManagement.person">
        <!-- <jhi-party-cif-customer-info-person [organization]="organizationManagement" [person]="organizationManagement.person"  [spouse]="'spouse'" mode="edit">
        </jhi-party-cif-customer-info-person> -->
        <jhi-party-cif-customer-management
          [managementType]="managementType"
          [organization]="organizationManagement"
          [person]="organizationManagement.person"
          [type]="typeSable"
          mode="edit"
        ></jhi-party-cif-customer-management>
      </ng-container>
      <ng-container *ngIf="!organizationManagement.person">
        <jhi-party-cif-customer-info-party-group
          [organization]="organizationManagement"
          [partyGroup]="organizationManagement.organization"
          mode="edit"
          [type]="typeSable"
        >
        </jhi-party-cif-customer-info-party-group>
      </ng-container>
    </mat-card-content>
  </mat-card>
  <mat-card class="mt-5">
    <mat-card-header>
      <div *ngIf="managementType !== 'MANAGEMENT_DATA'">
        <mat-card-subtitle></mat-card-subtitle>
      </div>
      <div *ngIf="managementType === ' MANAGEMENT_DATA'">
        <mat-card-subtitle>Position</mat-card-subtitle>
      </div>
    </mat-card-header>
    <mat-card-content>
      <div class="row">
        <div class="col-12">
          <div class="form-group" *ngIf="managementType === 'MANAGEMENT_DATA'">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Position</mat-label>
              <mat-select name="posManagement" [(ngModel)]="organizationManagement.attributes.position" [disabled]="dataSource()">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option *ngFor="let item of posManagement" [value]="item.label">
                  {{ item.label }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline" floatLabel="always">
              <mat-label>PEP Status</mat-label>
              <mat-select name="pepStatus" [(ngModel)]="organizationManagement.attributes.pep" [disabled]="dataSource()">
                <mat-option value="">- Please Select -</mat-option>
                <mat-option *ngFor="let item of pepStatus" [value]="item.label">
                  {{ item.label }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div class="form-group" *ngIf="managementType === 'SHAREHOLDER'">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Ownership(%)</mat-label>
              <input matInput type="number" [(ngModel)]="organizationManagement.attributes.ownership" [disabled]="dataSource()" />
            </mat-form-field>
          </div>
          <div class="form-group" *ngIf="managementType === 'SHAREHOLDER'">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>nominal of shares</mat-label>
              <input
                matInput
                currencyMask
                type="text"
                class="nominal"
                [(ngModel)]="organizationManagement.attributes.stockNominal"
                [options]="{ prefix: ' ', thousands: ',', decimal: '.', precision: 0 }"
                [disabled]="dataSource()"
              />
            </mat-form-field>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="mt-5" *ngIf="managementType === 'CONTROL_PERSON'">
    <mat-card-header>
      <mat-card-subtitle>Jurisdiction Country</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-postal-address-jurisdiction-country [countryId]="organizationManagement"></jhi-postal-address-jurisdiction-country>
    </mat-card-content>
  </mat-card>
  <mat-card class="mt-5">
    <mat-card-header>
      <mat-card-subtitle>Postal Address</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-postal-address-view-custom
        [organization]="organizationManagement"
        [postalAddress]="organizationManagement.postalAddress"
        [type]="typeSable"
      >
      </jhi-postal-address-view-custom>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center" [hidden]="view">
  <button mat-button [hidden]="view" (click)="save()">Save</button>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
