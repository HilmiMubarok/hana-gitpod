<h2 mat-dialog-title>ADD ORGANIZATION MANAGEMENT</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-header>
      <div *ngIf="organizationManagement.person">
        <mat-card-subtitle>Person Info</mat-card-subtitle>
      </div>
      <div *ngIf="!organizationManagement.person">
        <mat-card-subtitle>Organization Info</mat-card-subtitle>
      </div>
    </mat-card-header>
    <mat-card-content>
      <ng-container *ngIf="organizationManagement.person">
        <jhi-party-cif-customer-info-person [person]="organizationManagement.person" mode="edit"> </jhi-party-cif-customer-info-person>
      </ng-container>
      <ng-container *ngIf="!organizationManagement.person">
        <jhi-party-cif-customer-info-party-group [partyGroup]="organizationManagement.organization" mode="edit">
        </jhi-party-cif-customer-info-party-group>
      </ng-container>
    </mat-card-content>
  </mat-card>
  <mat-card class="mt-5" *ngIf="managementType === 'MANAGEMENT_DATA' || managementType === 'SHAREHOLDER'">
    <mat-card-header>
      <mat-card-subtitle>Miscellaneous</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="row">
        <div class="col-12">
          <div class="form-group" *ngIf="managementType === 'MANAGEMENT_DATA'">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Position</mat-label>
              <input matInput type="text" [(ngModel)]="organizationManagement.attributes.position" />
            </mat-form-field>
          </div>
          <div class="form-group" *ngIf="managementType === 'SHAREHOLDER'">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Ownership(%)</mat-label>
              <input matInput type="number" [(ngModel)]="organizationManagement.attributes.ownership" />
            </mat-form-field>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="mt-5">
    <mat-card-header>
      <mat-card-subtitle>Postal Address</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-postal-address-view-custom [postalAddress]="organizationManagement.postalAddress"> </jhi-postal-address-view-custom>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button (click)="save()">Save</button>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
