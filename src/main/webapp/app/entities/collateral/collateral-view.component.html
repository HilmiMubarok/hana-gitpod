<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div class="mb-5">
      <div class="e-sample-resize-container e-card-resize-container">
        <div class="row">
          <div class="row card-layout">
            <div class="e-card">
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title">Collateral</div>
                </div>
              </div>
              <div class="e-card-content">
                <div class="page-view">
                  <form name="saveForm" role="form" action="">
                    <div class="row">
                      <div class="col-sm-12">
                        <div class="card">
                          <!-- Feature -->
                          <div class="card-header">
                            <h5>COLLATERAL INFO</h5>
                          </div>
                          <div class="card-body">
                            <div class="card-deck" style="margin-bottom: 15px">
                              <ejs-grid #Grid id="Grid" [dataSource]="data" [pageSettings]="pageSettings" [allowPaging]="true">
                                <e-columns>
                                  <e-column field="indexNum" headerText="No" width="50" textAlign="center"> </e-column>
                                  <e-column field="cif.number" headerText="Collateral Ref No" width="140" textAlign="center"></e-column>
                                  <e-column field="cif.customerName" headerText="Jenis Jaminan" width="170" textAlign="center"></e-column>
                                  <e-column field="cif.customerType" headerText="Alamat Jaminan" width="170" textAlign="center"></e-column>
                                  <e-column field="cif.customerType" headerText="Kelurahan" width="170" textAlign="center"></e-column>
                                  <e-column field="cif.customerType" headerText="Kecamatan" width="170" textAlign="center"></e-column>
                                  <e-column field="cif.customerType" headerText="Kota" width="170" textAlign="center"> </e-column>
                                  <e-column field="cif.customerType" headerText="Ownership Type" width="170" textAlign="center"></e-column>
                                  <e-column field="cif.customerType" headerText="Owner" width="170" textAlign="center"> </e-column>
                                  <e-column field="cif.customerType" headerText="Collateral ID" width="170" textAlign="center"></e-column>
                                  <e-column
                                    field="cif.customerType"
                                    headerText="Collateral Status"
                                    width="170"
                                    textAlign="center"
                                  ></e-column>
                                  <e-column
                                    field="cif.customerType"
                                    headerText="Cross Collateral"
                                    width="170"
                                    textAlign="center"
                                  ></e-column>
                                  <e-column field="cif.customerType" headerText="Action" width="170" textAlign="center"> </e-column>
                                </e-columns>
                              </ejs-grid>
                              <ng-template #childtemplate let-data>
                                <button pButton type="button" [routerLink]="['/collateral-appraisal', data.id, 'edit']" class="flat-button">
                                  <fa-icon icon="pencil-alt"></fa-icon>
                                </button>
                              </ng-template>
                            </div>
                            <div class="body-footer">
                              <button ejs-button type="submit" cssClass="btn-info">ADD</button>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div class="col-sm-12">
                        <div class="card">
                          <!-- Feature -->
                          <div class="card-header">
                            <h5>ADD COLLATERAL</h5>
                          </div>
                          <div class="card-body">
                            <div [ngSwitch]="kondisi">
                              <div class="row">
                                <div class="form-group col-md-6">
                                  <ejs-combobox
                                    [(ngModel)]="item.collateralTypeId"
                                    [(value)]="kondisi"
                                    name="collateralType"
                                    placeholder="Collateral Type"
                                    cssClass="e-outline"
                                    [dataSource]="dataCollateralType"
                                    [autofill]="true"
                                    [fields]="fieldCollateralType"
                                    floatLabelType="Auto"
                                  >
                                  </ejs-combobox>
                                </div>

                                <div class="form-group col-md-4">
                                  <ejs-textbox cssClass="e-outline" placeholder="Collateral Id" floatLabelType="Auto"> </ejs-textbox>
                                </div>
                                <div class="col-2">
                                  <button ejs-button type="submit" style="margin-top: 20px; width: 100% !important" cssClass="btn-info">
                                    Search Collateral
                                  </button>
                                </div>
                                <div class="col-md-6" *ngSwitchCase="realEstate.id">
                                  <ejs-combobox
                                    [(ngModel)]="value"
                                    cssClass="e-outline"
                                    [dataSource]="dataRealEstate"
                                    [autofill]="true"
                                    [fields]="fieldRealEstate"
                                    placeholder="New/Existing"
                                    floatLabelType="Auto"
                                    [(value)]="value"
                                  >
                                  </ejs-combobox>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div class="col-sm-12">

                                <div class="col-md-6">
                                  <ejs-combobox

                                  </ejs-combobox>
                                </div>
                                <div class="col-md-6">

                                    cssClass="e-outline"
                                    [autofill]="true"
                                    floatLabelType="Auto"
                                  >
                                  </ejs-combobox>
                                </div>
                                <div class="col-md-6">
                                  <ejs-combobox
                                    [(ngModel)]="item.colBindingType"

                                </div>
                                <div class="col-md-6">

                                  </ejs-datepicker>
                                </div>
                                <div class="col-md-6">
                                  <ejs-combobox
                                    [(ngModel)]="item.collateralGrading"
                                    name="collateralGrading"
                                    placeholder="Collateral Grading"
                                    cssClass="e-outline"
                                    [autofill]="true"
                                    floatLabelType="Auto"
                                  >
                                  </ejs-combobox>
                                </div>
                                <div class="col-md-6">
                                  <ejs-datepicker
                                    [(ngModel)]="item.contractDate"
                                    name="contractDate"
                                    placeholder="Contract Date"
                                    cssClass="e-outline"
                                    format="dd-MM-yyyy"
                                    floatLabelType="Auto"
                                  >
                                  </ejs-datepicker>
                                </div>
                                <div class="col-md-6">
                                  <ejs-datepicker
                                    [(ngModel)]="item.bindingDate"
                                    name="bindingDate"
                                    placeholder="Binding Date"
                                    cssClass="e-outline"
                                    format="dd-MM-yyyy"
                                    floatLabelType="Auto"
                                  >
                                  </ejs-datepicker>
                                </div>
                                <div class="col-md-6">
                                  <ejs-datepicker
                                    [(ngModel)]="item.releaseDate"
                                    name="releaseDate"
                                    placeholder="Release Date"
                                    cssClass="e-outline"
                                    format="dd-MM-yyyy"
                                    floatLabelType="Auto"
                                  >
                                  </ejs-datepicker>
                                </div>
                                <div class="col-md-6">
                                  <ejs-combobox
                                    [(ngModel)]="item.paripasuStatus"
                                    name="paripasuStatus"
                                    placeholder="Paripasu Status"
                                    cssClass="e-outline"
                                    [autofill]="true"
                                    floatLabelType="Auto"
                                  >
                                  </ejs-combobox>
                                </div>
                                <div class="col-md-6">
                                  <ejs-textbox
                                    [(ngModel)]="item.collateralOwner"
                                    name="collateralOwner"
                                    placeholder="Collateral Owner"
                                    cssClass="e-outline"
                                    floatLabelType="Auto"
                                    class="icon-group"
                                  >
                                  </ejs-textbox>
                                  <fa-icon class="span-icon" [icon]="faSearch"></fa-icon>
                                  <!-- <span class="fa fa-search span-icon"></span> -->
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
