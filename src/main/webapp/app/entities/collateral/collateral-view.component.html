<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div class="row">
      <div class="col-md-6">
        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="No Request Appraisal"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>
        <div class="form">
          <p>Jenis Permohonan</p>
          <ejs-checkbox class="checkbox-content" label="Renewal"></ejs-checkbox>
          <ejs-checkbox class="checkbox-content" label="New"></ejs-checkbox>
          <ejs-checkbox class="checkbox-content" label="Additional"></ejs-checkbox>
          <ejs-checkbox class="checkbox-content" label="Poogress"></ejs-checkbox>
          <ejs-checkbox class="checkbox-content" label="Reapraisal"></ejs-checkbox>
          <ejs-checkbox class="checkbox-content" label="Other"></ejs-checkbox>
        </div>

        <div class="form">
          <p>Jenis Object</p>
          <ejs-radiobutton label="Object Lama"></ejs-radiobutton>
          <ejs-radiobutton label="Object Baru"></ejs-radiobutton>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="Collateral ID"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="Nama Pic"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="No Telpon"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="Nama Pic"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="No Telpon"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <p>Tipe Officer Appraisal</p>
          <ejs-checkbox class="checkbox-content" label="External"></ejs-checkbox>
          <ejs-checkbox class="checkbox-content" label="Internal"></ejs-checkbox>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="Jenis Detail Jaminan"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="Alamat Jaminan"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="Kode Pos"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="Kelurahan"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="Kecamatan"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
        </div>

        <div class="form">
          <div class="form-group">
            <ejs-textbox
              name="firstName"
              placeholder="Kabupaten"
              cssClass="e-outline"
              floatLabelType="Auto"
              [disabled]="readOnly()"
            ></ejs-textbox>
          </div>
          <div class="form">
            <div class="form-group">
              <ejs-textbox
                name="firstName"
                placeholder="Provinsi"
                cssClass="e-outline"
                floatLabelType="Auto"
                [disabled]="readOnly()"
              ></ejs-textbox>
            </div>
          </div>

          <div class="form">
            <div class="form-group">
              <ejs-textbox
                name="firstName"
                placeholder="Pengajuan Fasilitas"
                cssClass="e-outline"
                floatLabelType="Auto"
                [disabled]="readOnly()"
              ></ejs-textbox>
            </div>
          </div>

          <div class="form">
            <div class="form-group">
              <ejs-textbox
                name="firstName"
                placeholder="No Request Appraisal"
                cssClass="e-outline"
                floatLabelType="Auto"
                [disabled]="readOnly()"
              ></ejs-textbox>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
