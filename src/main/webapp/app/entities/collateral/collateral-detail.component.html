<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.collateral.home.viewLabel">Collaterals</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.collateral.detail.title">Collateral</span> {{ collateral.id }} </p-header>
    <jhi-collateral-view [item]="collateral" mode="item"> </jhi-collateral-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/collateral', collateral.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
