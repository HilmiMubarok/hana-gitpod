<div class="e-card mb-3">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Keterangan Objek Jaminan</div>
    </div>
  </div>
  <div class="e-card-content">
    <ejs-richtexteditor
      [(ngModel)]="item.attributes.summary.keterangan"
      id="collateralAppraisalSummaryRTE"
      [toolbarSettings]="tools"
    ></ejs-richtexteditor>
  </div>
</div>

<div class="e-card mb-3">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Marketability</div>
    </div>
  </div>
  <div class="e-card-content" style="display: flex; justify-content: center">
    <div class="row" style="width: 60vh">
      <div class="col-3">
        <ejs-radiobutton
          [value]="'baik'"
          name="baik"
          [(ngModel)]="item.attributes.summary.marketbility"
          label="Baik"
          cssClass="e-primary"
        ></ejs-radiobutton>
      </div>

      <div class="col-3">
        <ejs-radiobutton
          [value]="'cukup'"
          name="cukup"
          [(ngModel)]="item.attributes.summary.marketbility"
          label="Cukup"
          cssClass="e-primary"
        ></ejs-radiobutton>
      </div>

      <div class="col-3">
        <ejs-radiobutton
          label="Kurang"
          [value]="'kurang'"
          name="markebility"
          [(ngModel)]="item.attributes.summary.marketbility"
          cssClass="e-primary"
        ></ejs-radiobutton>
      </div>
    </div>
  </div>
</div>

<div class="e-card mb-3">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Return Notes</div>
    </div>
  </div>
  <div class="e-card-content">
    <ejs-richtexteditor [(ngModel)]="item.attributes.summary.returnNotes" id="rteTool" [toolbarSettings]="tools"></ejs-richtexteditor>
  </div>
</div>
