<section *jhiMatrixDir="collateralAppraisal.statusId; menu: 'collateral-appraisal'; subMenu: ''; elementType: 'input'">
  <div *ngIf="!hideordisable()">
    <div class="e-card mb-3">
      <div class="e-card-header mb-1">
        <div class="e-card-header-caption">
          <div class="e-card-header-title">Keterangan Objek Jaminan</div>
        </div>
      </div>

      <div class="e-card-content">
        <ejs-documenteditorcontainer
          #document_editor_container
          [headers]="customHeadersJWT"
          [enableToolbar]="true"
          [enableLocalPaste]="false"
          height="100vh"
          style="display: block"
          [spellcheck]="false"
          [enableSpellCheck]="false"
          (keyDown)="onKeyDown($event)"
          (created)="onCreate()"
        >
        </ejs-documenteditorcontainer>
      </div>
    </div>
  </div>
  <div *ngIf="hideordisable()">
    <div class="e-card mb-3">
      <div class="e-card-header mb-1">
        <div class="e-card-header-caption">
          <div class="e-card-header-title">Keterangan Objek Jaminan</div>
        </div>
      </div>

      <div class="e-card-content">
        <ejs-documenteditorcontainer
          #document_editor_container
          [headers]="customHeadersJWT"
          [enableToolbar]="false"
          [enableLocalPaste]="false"
          height="100vh"
          style="display: block"
          [spellcheck]="false"
          [enableSpellCheck]="false"
          (keyDown)="onKeyDown($event)"
          (created)="onCreate()"
          (documentChange)="onDocumentChange()"
        >
        </ejs-documenteditorcontainer>
      </div>
    </div>
  </div>

  <div class="e-card mb-3">
    <div class="e-card-header mb-1">
      <div class="e-card-header-caption">
        <div class="e-card-header-title">Marketability</div>
      </div>
    </div>
    <div class="e-card-content" style="display: flex; justify-content: center">
      <div class="row" style="width: 60vh">
        <div class="col-3">
          <ejs-radiobutton
            value="baik"
            name="baik"
            [(ngModel)]="item.attributes['marketbility']"
            label="Baik"
            cssClass="e-primary"
            [disabled]="hideordisable()"
          ></ejs-radiobutton>
        </div>

        <div class="col-3">
          <ejs-radiobutton
            value="cukup"
            name="cukup"
            [(ngModel)]="item.attributes['marketbility']"
            label="Cukup"
            cssClass="e-primary"
            [disabled]="hideordisable()"
          ></ejs-radiobutton>
        </div>

        <div class="col-3">
          <ejs-radiobutton
            label="Kurang"
            value="kurang"
            name="markebility"
            [(ngModel)]="item.attributes['marketbility']"
            cssClass="e-primary"
            [disabled]="hideordisable()"
          >
          </ejs-radiobutton>
        </div>
      </div>
    </div>
  </div>

  <div class="e-card mb-3">
    <div class="e-card-header mb-1">
      <div class="e-card-header-caption"></div>
    </div>
    <div class="e-card-content">
      <div class="form-space" style="display: flex">
        <ejs-dropdownlist
          [(ngModel)]="formatType"
          [(dataSource)]="listOfValue.formatType"
          cssClass="e-outline"
          floatLabelType="Auto"
          placeholder="file template"
        >
        </ejs-dropdownlist>
        <button ejs-button class="btn-info" (click)="generate(formatType)">View Report</button>
      </div>
    </div>
  </div>
</section>
