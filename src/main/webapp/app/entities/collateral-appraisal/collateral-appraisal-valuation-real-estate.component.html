<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title"></div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <ejs-grid [dataSource]="items">
              <e-columns>
                <e-column field="indexNum" headerText="No" width="50" textAlign="center"></e-column>
                <e-column field="" headerText="Collateral Object" width="140" textAlign="center"></e-column>
                <e-column field="" headerText="Area (M2)" width="170" textAlign="center"></e-column>
                <e-column field="" headerText="Market Value / m2" width="170" textAlign="center"></e-column>
                <e-column field="" headerText="Market Value / MV" width="140" textAlign="center"></e-column>
                <e-column field="" headerText="Percentage" width="170" textAlign="center"></e-column>
                <e-column field="" headerText="Liquidation Value Indication" width="170" textAlign="center"></e-column>
                <e-column headerText="Action" width="150" textAlign="Center">
                  <ng-template #template let-data>
                    <button pButton type="button" (click)="onEdit(data)" class="flat-button">
                      <fa-icon icon="pencil-alt"></fa-icon>
                    </button>
                    <button pButton type="button" (click)="onDelete(data)" class="flat-button">
                      <fa-icon icon="trash-alt"></fa-icon>
                    </button>
                  </ng-template>
                </e-column>
              </e-columns>
            </ejs-grid>
            <div class="d-flex justify-content-end">
              <jhi-button typeB="secondary" (clickEv)="add($event)"></jhi-button>
            </div>
            <div class="row justify-content-between mb-3">
              <div class="col-6">
                <div class="e-card-header-title">Total Penilaian Tanah</div>
                <ejs-textbox placeholder="Total Market Value (MV) Land" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Total Liquidation Value Indication Land" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Total Market Value (MV) Land Rounding" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox
                  placeholder="Total Liquidation Value Indication Land Rounding"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                ></ejs-textbox>
              </div>
              <div class="col-6">
                <div style="height: 24px"></div>
                <ejs-textbox placeholder="Total Market Value (MV) Building" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox
                  placeholder="Total Liquidation Value Indication Building"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                ></ejs-textbox>
                <ejs-textbox
                  placeholder="Total Market Value (MV) Building Rounding"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                ></ejs-textbox>
                <ejs-textbox
                  placeholder="Total Liquidation Value Indication Building Rounding"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                ></ejs-textbox>
              </div>
            </div>
            <div class="row justify-content-between mb-3">
              <div class="col-6">
                <div class="e-card-header-title">Total Penilaian Tanah & Bangunan</div>
                <ejs-textbox placeholder="Total Market Value (MV) Land & Building" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox
                  placeholder="Total Liquidation Value Indication Land & Building"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                ></ejs-textbox>
              </div>
              <div class="col-6">
                <div style="height: 24px"></div>
                <ejs-textbox
                  placeholder="Total Market Value (MV) Land & Building Rounding"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                ></ejs-textbox>
                <ejs-textbox
                  placeholder="Total Liquidation Value Indication Land & Building Rounding"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                ></ejs-textbox>
              </div>
            </div>
          </div>
          <div class="e-card-actions"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div [hidden]="state !== 'add'">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title"></div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <div class="row justify-content-between">
              <div class="col-6">
                <ejs-dropdownlist
                  cssClass="e-outline"
                  #dropdownlist
                  [dataSource]="dataDropdown"
                  [fields]="fields"
                  showClearButton="true"
                  placeholder="Collateral Object"
                  floatLabelType="Auto"
                  popupHeight="220px"
                ></ejs-dropdownlist>
                <ejs-textbox placeholder="Bangunan" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Area(M2)" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-checkbox label="Is There Any IMB Valuation?" labelPosition="Before"></ejs-checkbox>
                <ejs-checkbox label="Is There Any Tata Kota Valuation?" labelPosition="Before"></ejs-checkbox>
              </div>
              <div class="col-6">
                <ejs-textbox placeholder="Market Value / m2" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Market Value / MV" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Indication Value / MV" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Precentage" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
              </div>
            </div>
          </div>
          <div class="e-card-actions"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-end">
    <jhi-button typeB="secondary" (clickEv)="addToGrid($event)"></jhi-button>
  </div>
</div>

<ejs-dialog
  id="dialog"
  #ejDialog
  isModal="true"
  (overlayClick)="onOverlayClick()"
  [animationSettings]="animationSettings"
  [visible]="dialogVisible"
  [width]="width"
  [height]="height"
>
  <!--<ng-template #header> </ng-template>-->
  <ng-template #content>
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="row">
        <div class="row card-layout">
          <div class="e-card">
            <div class="e-card-header">
              <div class="e-card-header-caption">
                <div class="e-card-header-title"></div>
                <div class="e-card-sub-title"></div>
              </div>
            </div>
            <div class="e-card-content">
              <div class="row justify-content-between">
                <div class="col-6">
                  <ejs-dropdownlist
                    cssClass="e-outline"
                    #dropdownlist
                    [dataSource]="dataDropdown"
                    [fields]="fields"
                    showClearButton="true"
                    placeholder="Collateral Object"
                    floatLabelType="Auto"
                    popupHeight="220px"
                  ></ejs-dropdownlist>
                  <ejs-textbox placeholder="Bangunan" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                  <ejs-textbox placeholder="Area(M2)" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                  <ejs-checkbox label="Is There Any IMB Valuation?" labelPosition="Before"></ejs-checkbox>
                  <ejs-checkbox label="Is There Any Tata Kota Valuation?" labelPosition="Before"></ejs-checkbox>
                </div>
                <div class="col-6">
                  <ejs-textbox placeholder="Market Value / m2" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                  <ejs-textbox placeholder="Market Value / MV" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                  <ejs-textbox placeholder="Indication Value / MV" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                  <ejs-textbox placeholder="Precentage" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                </div>
              </div>
            </div>
            <div class="e-card-actions"></div>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</ejs-dialog>
