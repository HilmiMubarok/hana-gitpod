<section class="content">
  <div class="sub-content">
    <div class="card-header">
      <p class="text-header">DATA PEMBANDING</p>
    </div>
    <div class="row">
      <div class="col-md-6">
        <!--LEFT SIDE -->
        <div tabindex="0" class="e-card" id="basic">
          <div class="e-card-header">
            <div class="e-card-header-caption"></div>
          </div>
          <div class="e-card-content">
            <img
              src="https://www.yukampus.com/wp-content/uploads/2021/06/contoh-iklan-jual-rumah-di-olx.jpg"
              alt=""
              width="600"
              height="400"
              class="img-thumbnail"
            />
          </div>
          <a>Tampak akses jalan didepan objek.jpg</a>
          <button pButton type="submit" class="flat-button">
            <fa-icon icon="eye"></fa-icon>
          </button>
        </div>
      </div>
      <div class="col-md-6">
        <!--LEFT SIDE -->
        <div class="form-group">
          <ejs-textbox name="typeProperty" placeholder="Type Property" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox name="lokasi" placeholder="Lokasi" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox name="luasTanah" placeholder="Luas Tanah" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox name="luasBangunan" placeholder="Luas Bangunan" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox name="hargaPenawaran" placeholder="Harga Penawaran" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox name="hargaTransaksi" placeholder="Harga Transaksi" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox name="narasumber" placeholder="Narasumber" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox name="handphoneNumber" placeholder="Handphone Number" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
        </div>
        <div class="form-group">
          <ejs-textbox name="titleOfPerson" placeholder="Title Of Person" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
        </div>
        <div class="multiline">
          <ejs-textbox [multiline]="true" name="keterangan" placeholder="Keterangan" cssClass="e-outline" floatLabelType="Auto">
          </ejs-textbox>
        </div>
      </div>
    </div>
    <div style="text-align: right">
      <button ejs-button cssClass="btn-info">Save</button>
    </div>
  </div>
</section>
