<mat-card>
  <mat-card-header>
    <mat-card-title>DATA PEMBANDING</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <ejs-grid #grid [dataSource]="items" [allowPaging]="true" [pageSettings]="pageSettings">
      <e-columns>
        <e-column field="id" headerText="No" textAlign="Center"></e-column>
        <e-column field="propertyType" headerText="Type Property" textAlign="Center"></e-column>
        <e-column field="propertyLoc" headerText="Lokasi" textAlign="Center"></e-column>
        <e-column field="landSize" headerText="Luas Tanah" textAlign="Center"></e-column>
        <e-column field="bidPrice" headerText="Harga Penawaran" textAlign="Center"></e-column>
        <e-column headerText="Action" width="150" textAlign="Center">
          <ng-template #template let-data>
            <div>
              <!--<a [routerLink]="['/credit-proposal', data.id, 'edit2']">
                <mat-icon>Edit</mat-icon>
              </a>-->
              <a><mat-icon>Edit</mat-icon></a>
            </div>
          </ng-template>
        </e-column>
      </e-columns>
    </ejs-grid>
  </mat-card-content>
  <mat-card-actions align="end">
    <a mat-raised-button color="primary" [routerLink]="['/collateral-appraisal/comparison-data/add']">Add New</a>
  </mat-card-actions>
</mat-card>
