<div class="e-card">
  <div class="mx-3 py-3">
    <div class="row justify-content-between mb-1">
      <div class="e-sample-resize-container e-card-resize-container">
        <div class="row">
          <div class="card-layout">
            <div class="e-card">
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title mb-3">Foto Object Jaminan</div>
                  <div class="e-card-sub-title"></div>
                  <div class="row">
                    <div class="col sm-12">
                      <ejs-dropdownlist
                        cssClass="e-outline"
                        floatLabelType="Auto"
                        id="ddlelement"
                        [dataSource]="BlodType"
                        placeholder="Kategori"
                      >
                      </ejs-dropdownlist>
                    </div>
                    <div class="col sm-12">
                      <button class="btn-info" type="file" ejs-button>Add Photo</button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="e-card-content mt-3">
                <div class="row">
                  <div class="col md-6 sm-12 d-flex justify-content-center">
                    <div class="e-card">
                      <div class="row">
                        <img
                          width="100%"
                          height="100%"
                          src="https://tse3.mm.bing.net/th?id=OIP.Iu9hj-LfwrjZYMDpznzGJAHaFj&pid=Api&P=0"
                          alt=""
                        />
                        <div class="col-md-10"><span class="detail-option">Tampak Akses Jalan didepan Objek.png</span></div>
                        <div class="col-md-2 d-flex justify-content-end">
                          <span class="option" ejs-dropdownbutton cssClass="e-caret-hide"><mat-icon>more_vert</mat-icon></span>
                          <!-- <span class="option" ejs-dropdownbutton cssClass="e-caret-hide"><mat-icon>more_vert</mat-icon>[items]="data" </span> -->
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="col md-6 sm-12 d-flex justify-content-center">
                    <div class="e-card">
                      <div class="row">
                        <img
                          width="100%"
                          height="100%"
                          src="https://tse3.mm.bing.net/th?id=OIP.Iu9hj-LfwrjZYMDpznzGJAHaFj&pid=Api&P=0"
                          alt=""
                        />
                        <div class="col-md-10"><span class="detail-option">Tampak Akses Jalan didepan Objek.png</span></div>
                        <div class="col-md-2 d-flex justify-content-end">
                          <span class="option" ejs-dropdownbutton cssClass="e-caret-hide"><mat-icon>more_vert</mat-icon></span>
                          <!-- <span class="option" ejs-dropdownbutton cssClass="e-caret-hide"><mat-icon>more_vert</mat-icon>[items]="data" </span> -->
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="e-card-actions">
                  <div class="d-flex justify-content-center mt-5 mb-5">
                    <button class="btn-info" ejs-button>See More</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="e-sample-resize-container e-card-resize-container mt-3">
          <div class="row">
            <div class="col-12">
              <div class="card-layout">
                <div class="e-card">
                  <div class="e-card-header">
                    <div class="e-card-header-caption">
                      <div class="e-card-header-title">Maps Geo Tagging</div>
                      <div class="e-card-sub-title"></div>
                    </div>
                  </div>
                  <div class="e-card-content mt-3 mb-3">
                    <div class="e-card-actions">
                      <div class="e-card">
                        <div class="d-flex justify-content-center mt-5 mb-5">
                          <button class="btn-info" ejs-button cssClass="e-info ">VIEW GEO-TAGGING</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
