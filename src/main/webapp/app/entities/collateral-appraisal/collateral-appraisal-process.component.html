<link href="//cdn.syncfusion.com/ej2/ej2-splitbuttons/styles/material.css" rel="stylesheet" />
<div class="head">
  <div class="card">
    <span class="title">FOTO OBJECT JAMINAN</span>
    <div class="row px-3">
      <div class="col-6 mt-3">
        <ejs-dropdownlist cssClass="e-outline" floatLabelType="Auto" id="ddlelement" [dataSource]="BlodType" placeholder="Kategori">
        </ejs-dropdownlist>
      </div>
      <div class="col-6 mt-3">
        <div class="d-flex">
          <button class="add" type="file" ejs-button cssClass="e-success">ADD PHOTO</button>
        </div>
      </div>
    </div>

    <div class="e-card-frame mt-3">
      <div class="row">
        <div class="col-md-6">
          <div class="frame">
            <div class="box-image">
              <div class="e-card">
                <div class="e-card-image">
                  <div class="box">
                    <img src="https://tse3.mm.bing.net/th?id=OIP.Iu9hj-LfwrjZYMDpznzGJAHaFj&pid=Api&P=0" alt="" />
                  </div>
                </div>
                <div class="e-card-content">
                  <div class="row">
                    <div class="col-md-10"><span class="detail">Tampak Akses Jalan didepan Objek.png</span></div>
                    <div class="col-md-2 d-flex justify-content-end">
                      <span class="option" ejs-dropdownbutton cssClass="e-caret-hide">
                        <mat-icon>more_vert</mat-icon>
                      </span>
                      <!-- <span class="option" ejs-dropdownbutton cssClass="e-caret-hide">
                        <mat-icon>more_vert</mat-icon>
                        [items]="data" 
                      </span> -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="frame">
            <div class="box-image">
              <div class="e-card">
                <div class="e-card-image">
                  <div class="box">
                    <img src="https://tse3.mm.bing.net/th?id=OIP.Iu9hj-LfwrjZYMDpznzGJAHaFj&pid=Api&P=0" alt="" />
                  </div>
                </div>
                <div class="e-card-content">
                  <div class="row">
                    <div class="col-md-10"><span class="detail">Tampak Akses Jalan didepan Objek.png</span></div>
                    <div class="col-md-2 d-flex justify-content-end">
                      <span class="option" ejs-dropdownbutton cssClass="e-caret-hide"><mat-icon>more_vert</mat-icon></span>
                      <!-- <span class="option" ejs-dropdownbutton cssClass="e-caret-hide"><mat-icon>more_vert</mat-icon>[items]="data" </span> -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-center mt-5 mb-5">
        <button class="see-more" ejs-button>See More</button>
      </div>
    </div>

    <div class="section-maps mt-5">
      <span class="title"> MAPS GEO-TAGGING </span>

      <div class="e-card-frame-maps mt-3">
        <div class="d-flex justify-content-center mt-5 mb-5">
          <button class="see-more" ejs-button cssClass="e-info">VIEW GEO-TAGGING</button>
        </div>
      </div>

      <div class="d-flex justify-content-end mt-5 px-3 mb-5">
        <button class="save" ejs-button cssClass="e-success">SAVE</button>
      </div>
    </div>
  </div>
</div>
