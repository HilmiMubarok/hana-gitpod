<div class="e-card mb-3">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Customer Info</div>
      <div class="e-card-sub-title"></div>
    </div>
  </div>
  <div class="e-card-content">
    <div class="row">
      <div class="col-6">
        <div class="form-group mt-3">
          <div>Tipe Nasabah</div>
          <div class="form-group">
            <mat-radio-group [(ngModel)]="tipeNasabah">
              <mat-radio-button checked disabled value="individu">Individu</mat-radio-button>
              <mat-radio-button disabled value="corporate">Badan Usaha</mat-radio-button>
            </mat-radio-group>
          </div>
        </div>
        <div class="form-group mt-3">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>First Name</mat-label>
            <input matInput type="text" [value]="item.firstName" disabled />
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Last Name</mat-label>
            <input matInput type="text" [value]="item.lastName" disabled />
          </mat-form-field>
        </div>
      </div>
      <div class="col-6">
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Tanggal Lahir</mat-label>
            <input matInput type="text" [value]="item.dob | formatMediumDate" disabled />
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>NIK</mat-label>
            <input matInput type="text" [value]="item.personalIdNumber" disabled />
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>NPWP</mat-label>
            <input matInput type="text" [value]="item.taxIdNumber" disabled />
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>
</div>
