<ejs-breadcrumb [enableNavigation]="false">
  <e-breadcrumb-items>
    <e-breadcrumb-item iconCss="e-icons e-home" url="https://ej2.syncfusion.com/home/angular.html"></e-breadcrumb-item>
    <e-breadcrumb-item text="Components" url="https://ej2.syncfusion.com/angular/demos/#/material/grid/over-view"></e-breadcrumb-item>
    <e-breadcrumb-item text="Navigations" url="https://ej2.syncfusion.com/angular/demos/#/material/breadcrumb/default"></e-breadcrumb-item>
    <e-breadcrumb-item text="Breadcrumb" url="./breadcrumb/default"></e-breadcrumb-item>
  </e-breadcrumb-items>
</ejs-breadcrumb>

<div style="margin-top: 20px" class="e-card-header">
  <div class="e-card-header-caption">
    <img width="34px" height="34px" src="../../../content/images/back-icon.svg" />
    <p style="margin-top: 2px" class="back">Back |</p>
  </div>
  <p class="e-card-sub-title">Add Collateral</p>
</div>

<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title"></div>
              <!-- <div class="e-card-sub-title"></div> -->
            </div>
          </div>
          <div class="e-card-content">
            <div class="row">
              <div class="col-md-5">
                <ejs-textbox
                  name="No Cif"
                  [(ngModel)]="searchInput"
                  placeholder="No Cif"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                ></ejs-textbox>
              </div>
              <div class="col-md-3">
                <button ejs-button style="margin-left: 10px; border-radius: 10px" (click)="onOpenDialog($event)" class="btn-info">
                  Find data
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="responseCif == 'PERSON'">
  <jhi-collateral-appraisal-jaminan [cif]="searchInput"></jhi-collateral-appraisal-jaminan>
</div>
