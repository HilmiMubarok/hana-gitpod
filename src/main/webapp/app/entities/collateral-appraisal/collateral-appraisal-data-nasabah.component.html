<ejs-breadcrumb [enableNavigation]="false">
  <e-breadcrumb-items>
    <e-breadcrumb-item iconCss="e-icons e-home" url="https://ej2.syncfusion.com/home/angular.html"></e-breadcrumb-item>
    <e-breadcrumb-item text="Components" url="https://ej2.syncfusion.com/angular/demos/#/material/grid/over-view"></e-breadcrumb-item>
    <e-breadcrumb-item text="Navigations" url="https://ej2.syncfusion.com/angular/demos/#/material/breadcrumb/default"></e-breadcrumb-item>
    <e-breadcrumb-item text="Breadcrumb" url="./breadcrumb/default"></e-breadcrumb-item>
  </e-breadcrumb-items>
</ejs-breadcrumb>

<div style="margin-top: 12px" class="mx-3">
  <p class="title-header">Add Collateral</p>
</div>
<div class="card-border">
  <div class="row">
    <div class="e-card">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <div class="e-card-header-title"></div>
          <div class="e-card-sub-title"></div>
        </div>
      </div>
      <div class="e-card-content">
        <div class="form-group">
          <div class="input-group input-group-lg">
            <ejs-textbox
              name="No Cif"
              [(ngModel)]="searchInput"
              placeholder="No Cif"
              cssClass="e-outline"
              floatLabelType="Auto"
            ></ejs-textbox>
            <button ejs-button style="margin-left: 10px; border-radius: 10px" (click)="onOpenDialog($event)" class="btn-info">
              Find data
            </button>
          </div>
        </div>
      </div>
      <div class="e-card-actions"></div>
    </div>
  </div>
</div>
