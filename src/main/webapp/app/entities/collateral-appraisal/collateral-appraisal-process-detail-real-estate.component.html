<ejs-menu cssClass="e-rounded-menu e-custom-scroll" [items]="menuItems" (select)="selectMenuItem($event)"></ejs-menu>

<div [hidden]="selectedMenuId !== 'land-condition'" class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
      <ejs-grid #grid [dataSource]="items">
        <e-columns>
          <e-column field="indexNum" headerText="No" textAlign="center"></e-column>
          <e-column field="cNum" headerText="Certificate Number" textAlign="center"></e-column>
          <e-column field="inName" headerText="In The Name Of" textAlign="center"></e-column>
          <e-column field="dateOfIsue" headerText="Date of Issue" textAlign="center">
            <ng-template #template let-data>
              {{ data.dateOfIssue | formatMediumDate }}
            </ng-template>
          </e-column>
          <e-column field="dueDate" headerText="Due Date" textAlign="center">
            <ng-template #template let-data>
              {{ data.dueDate | formatMediumDate }}
            </ng-template>
          </e-column>
          <e-column field="gsNo" headerText="No GS / Su" textAlign="center"></e-column>
          <e-column field="area" headerText="Area" textAlign="center"></e-column>
          <e-column headerText="Action" width="150" textAlign="Center">
            <ng-template #template let-data>
              <button pButton type="button" class="flat-button" (click)="onDetailLandClick()">
                <fa-icon icon="pencil-alt"></fa-icon>
              </button>
              <button pButton type="button" (click)="onDeleteLand(data)" class="flat-button">
                <fa-icon icon="trash-alt"></fa-icon>
              </button>
            </ng-template>
          </e-column>
        </e-columns>
      </ejs-grid>
      <div class="d-flex justify-content-end">
        <jhi-button typeB="secondary" (clickEv)="addLand($event)"></jhi-button>
      </div>
    </div>
  </div>
  <div [hidden]="state !== 'addLand'">
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="row">
        <div class="row card-layout">
          <div class="e-card">
            <div class="e-card-header">
              <div class="e-card-header-caption">
                <div class="e-card-header-title"></div>
                <div class="e-card-sub-title"></div>
              </div>
            </div>
            <div class="e-card-content">
              <div class="row justify-content-between mb-2">
                <div class="col-6">
                  <ejs-textbox
                    placeholder="area truncated by a city planning read plan or ther"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="areaTruncated"
                  ></ejs-textbox>
                  <ejs-textbox
                    placeholder="Total Area Land"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="totalArea"
                  ></ejs-textbox>
                </div>
                <div class="col-6">
                  <ejs-textbox
                    placeholder="Area Jalan & Fasum"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="areaJalan"
                  ></ejs-textbox>
                </div>
              </div>
              <div class="e-card-header-title">Relation between Ownership Right with Debtor</div>
              <div class="row justify-content-between mb-2">
                <div class="col-6">
                  <ejs-textbox
                    placeholder="Property Usage"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="propertyUsage"
                  ></ejs-textbox>
                  <ejs-textbox placeholder="Land Shape" cssClass="e-outline" floatLabelType="Auto" [(ngModel)]="landShaspe"></ejs-textbox>
                  <ejs-textbox
                    placeholder="Land Elevation(cm)"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="landElevation"
                  ></ejs-textbox>
                  <ejs-textbox
                    placeholder="Width of the Road"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="widthOfRoad"
                  ></ejs-textbox>
                  <ejs-textbox
                    placeholder="Unit Condition"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="unitCondition"
                  ></ejs-textbox>
                </div>
                <div class="col-6">
                  <ejs-textbox
                    placeholder="Inhabited By"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="inhabitedBy"
                  ></ejs-textbox>
                  <ejs-textbox
                    placeholder="Land Position"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="landPosition"
                  ></ejs-textbox>
                  <ejs-textbox
                    placeholder="Facing in a Certain Position"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    [(ngModel)]="facingPosition"
                  ></ejs-textbox>
                  <ejs-textbox placeholder="Made With" cssClass="e-outline" floatLabelType="Auto" [(ngModel)]="madeWith"></ejs-textbox>
                </div>
              </div>
              <div class="e-card-header-title">Object Environment</div>
              <div class="row mb-2">
                <div class="col-1"></div>
                <div class="col-2">
                  <ejs-checkbox label="Housing Complex" value="housingComplex" [(ngModel)]="housingComplexVal"></ejs-checkbox>
                </div>
                <div class="col-2">
                  <ejs-checkbox label="Loose Settlement" value="looseSettlement" [(ngModel)]="looseSettlementVal"></ejs-checkbox>
                </div>
                <div class="col-2">
                  <ejs-checkbox label="Office Complex" value="officeComplex" [(ngModel)]="officeComplexVal"></ejs-checkbox>
                </div>
                <div class="col-2">
                  <ejs-checkbox label="Commercial Area" value="commercialArea" [(ngModel)]="commercialAreaVal"></ejs-checkbox>
                </div>
                <div class="col-2">
                  <ejs-checkbox label="Warehousing Area" value="warehousingArea" [(ngModel)]="warehousingAreaVal"></ejs-checkbox>
                </div>
                <div class="col-1"></div>
              </div>
              <div class="e-card-header-title">Borders</div>
              <div class="row justify-content-between mb-2">
                <div class="col-6">
                  <ejs-combobox
                    placeholder="Left Side"
                    [dataSource]="dataLeftSide"
                    [(value)]="valueLeftSide"
                    cssClass="e-outline"
                  ></ejs-combobox>
                  <ejs-combobox
                    placeholder="Right Side"
                    [dataSource]="dataRightSide"
                    [(value)]="valueRightSide"
                    cssClass="e-outline"
                  ></ejs-combobox>
                </div>
                <div class="col-6">
                  <ejs-combobox
                    placeholder="Front Side"
                    [dataSource]="dataFrontSide"
                    [(value)]="valueFrontSide"
                    cssClass="e-outline"
                  ></ejs-combobox>
                  <ejs-combobox
                    placeholder="Back Side"
                    [dataSource]="dataBackSide"
                    [(value)]="valueBackSide"
                    cssClass="e-outline"
                  ></ejs-combobox>
                </div>
              </div>
            </div>
            <div class="e-card-actions"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end">
      <jhi-button typeB="secondary" (clickEv)="addToGridLand($event)"></jhi-button>
    </div>
  </div>
  <ejs-dialog
    id="dialog"
    #ejDialog
    isModal="true"
    (overlayClick)="onOverlayLandClick()"
    [animationSettings]="animationSettings"
    [visible]="dialogLandVisible"
    [width]="width"
    [height]="height"
  >
    <!--<ng-template #header> </ng-template>-->
    <ng-template #content>
      <div class="dialogContent">
        <div class="e-sample-resize-container e-card-resize-container">
          <div class="row">
            <div class="row card-layout">
              <div class="e-card">
                <div class="e-card-header">
                  <div class="e-card-header-caption">
                    <div class="e-card-header-title"></div>
                    <div class="e-card-sub-title"></div>
                  </div>
                </div>
                <div class="e-card-content">
                  <div class="row justify-content-between mb-2">
                    <div class="col-6">
                      <ejs-textbox
                        placeholder="area truncated by a city planning read plan or ther"
                        cssClass="e-outline"
                        floatLabelType="Auto"
                      ></ejs-textbox>
                      <ejs-textbox placeholder="Total Area Land" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="col-6">
                      <ejs-textbox placeholder="Area Jalan & Fasum" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                  </div>
                  <div class="e-card-header-title">Relation between Ownership Right with Debtor</div>
                  <div class="row justify-content-between mb-2">
                    <div class="col-6">
                      <ejs-textbox placeholder="Property Usage" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                      <ejs-textbox placeholder="Land Shape" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                      <ejs-textbox placeholder="Land Elevation(cm)" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                      <ejs-textbox placeholder="Width of the Road" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                      <ejs-textbox placeholder="Unit Condition" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="col-6">
                      <ejs-textbox placeholder="Inhabited By" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                      <ejs-textbox placeholder="Land Position" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                      <ejs-textbox placeholder="Facing in a Certain Position" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                      <ejs-textbox placeholder="Made With" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                  </div>
                  <div class="e-card-header-title">Object Environment</div>
                  <div class="row mb-2">
                    <div class="col-1"></div>
                    <div class="col-2">
                      <ejs-checkbox label="Housing Complex"></ejs-checkbox>
                    </div>
                    <div class="col-2">
                      <ejs-checkbox label="Loose Settlement"></ejs-checkbox>
                    </div>
                    <div class="col-2">
                      <ejs-checkbox label="Office Complex"></ejs-checkbox>
                    </div>
                    <div class="col-2">
                      <ejs-checkbox label="Commercial Area"></ejs-checkbox>
                    </div>
                    <div class="col-2">
                      <ejs-checkbox label="Warehousing Area"></ejs-checkbox>
                    </div>
                    <div class="col-1"></div>
                  </div>
                  <div class="e-card-header-title">Borders</div>
                  <div class="row justify-content-between mb-2">
                    <div class="col-6">
                      <ejs-combobox placeholder="Left Side" cssClass="e-outline"></ejs-combobox>
                      <ejs-combobox placeholder="Right Side" cssClass="e-outline"></ejs-combobox>
                    </div>
                    <div class="col-6">
                      <ejs-combobox placeholder="Front Side" cssClass="e-outline"></ejs-combobox>
                      <ejs-combobox placeholder="Back Side" cssClass="e-outline"></ejs-combobox>
                    </div>
                  </div>
                </div>
                <div class="e-card-actions"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </ejs-dialog>
</div>

                </div>
              </div>
            </div>
            <div class="e-card-actions"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end">
      <jhi-button typeB="secondary" (clickEv)="addToGridBuilding($event)"></jhi-button>

</div>
