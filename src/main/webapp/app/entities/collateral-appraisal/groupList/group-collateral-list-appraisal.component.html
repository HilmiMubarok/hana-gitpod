<mat-card>
  <mat-card-header>
    <mat-card-subtitle>Group Collateral</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="table-responsive-material">
      <table mat-table [dataSource]="listGroupCollateral" multiTemplateDataRows class="w-100">
        <ng-container matColumnDef="no">
          <th mat-header-cell *matHeaderCellDef class="text-left">No</th>
          <td mat-cell *matCellDef="let i = dataIndex">{{ i + 1 }}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">
            {{ element.customerName }}
          </td>
        </ng-container>
        <ng-container matColumnDef="cif">
          <th mat-header-cell *matHeaderCellDef>CIF</th>
          <td mat-cell *matCellDef="let element">
            {{ element.customerCIF }}
          </td>
        </ng-container>

        <ng-container matColumnDef="expand">
          <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
          <td mat-cell *matCellDef="let element">
            <button
              mat-icon-button
              aria-label="expand row"
              (click)="expandedElement = expandedElement === element ? null : element; $event.stopPropagation()"
            >
              <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
              <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
        <ng-container matColumnDef="expandedDetail">
          <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
            <div class="example-element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
              <mat-card class="w-100 mx-auto">
                <mat-card-content>
                  <jhi-group-collateral-appraisal
                    (outputDataGroup)="getGroupData($event)"
                    (outputgroupselected)="getGroupSelected($event)"
                    [isCheckDebColtoChild]="isCheckDebColtoChild"
                    [partyId]="element.partyId"
                    [cifNumber]="cifNumber"
                  ></jhi-group-collateral-appraisal>
                </mat-card-content>
              </mat-card>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
        <tr
          mat-row
          *matRowDef="let element; columns: columnsToDisplayWithExpand"
          class="example-element-row"
          [class.example-expanded-row]="expandedElement === element"
          (click)="expandedElement = expandedElement === element ? null : element"
        ></tr>
        <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
