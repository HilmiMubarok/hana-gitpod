<div class="page-view">
  <h5 class="page-heading">
    <span>Valuation</span>
  </h5>
  <div class="e-card">
    <div class="e-card-content">
      <!--<ejs-grid [dataSource]="data" [allowPaging]="true" [pageSettings]="pageSettings">-->
      <ejs-grid [dataSource]="data" [allowPaging]="true">
        <e-columns>
          <e-column field="collateral_object" headerText="Collateral Object" textAlign="Center"></e-column>
          <e-column field="area" headerText="Area(M2)" format="# 'm2'" textAlign="Center"></e-column>
          <e-column field="market_m" headerText="Market Value/ m2" format="'Rp. ' ##,#" textAlign="Center"> </e-column>
          <e-column field="market_mv" headerText="Market Value/ MV" format="'Rp. ' ##,#" textAlign="Center"> </e-column>
          <e-column field="precentage" headerText="Precentage" format="# '%'" textAlign="Center"></e-column>
          <e-column field="liquidation" headerText="Liquidation Value Indication" format="'Rp. ' ##,#" textAlign="Center"></e-column>
          <e-column headerText="Actions" textAlign="Center">
            <ng-template #template let-data>
              <button pButton type="button" class="flat-button">
                <fa-icon icon="eye"></fa-icon>
              </button>
              <button pButton type="button" class="flat-button">
                <fa-icon icon="pencil-alt"></fa-icon>
              </button>
              <button pButton type="button" class="flat-button">
                <fa-icon icon="trash-alt"></fa-icon>
              </button>
            </ng-template>
          </e-column>
        </e-columns>
      </ejs-grid>

      <div class="mt-5">
        <div class="row my-3">
          <div class="col">
            <p class="mb-3">Total Penilaian Tanah</p>
            <div class="form-group">
              <ejs-textbox placeholder="Total Market Value (MV) Land" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
            </div>
          </div>

          <div class="col">
            <p class="mb-3">Total Penilaian Bangunan</p>
            <div class="form-group">
              <ejs-textbox placeholder="Total Market Value (MV) Building" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
            </div>
          </div>
        </div>

        <div class="row my-3">
          <div class="col">
            <div class="form-group">
              <ejs-textbox placeholder="Total Liquidation Value Indication Land" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
            </div>
          </div>

          <div class="col">
            <div class="form-group">
              <ejs-textbox placeholder="Total Liquidation Value Indication Building" floatLabelType="Auto" cssClass="e-outline">
              </ejs-textbox>
            </div>
          </div>
        </div>

        <div class="row my-3">
          <div class="col">
            <div class="form-group">
              <ejs-textbox placeholder="Total Market Value (MV) Land Rounding" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
            </div>
          </div>

          <div class="col">
            <div class="form-group">
              <ejs-textbox placeholder="Total Market Value (MV) Building Rounding" floatLabelType="Auto" cssClass="e-outline">
              </ejs-textbox>
            </div>
          </div>
        </div>

        <div class="row my-3">
          <p class="mb-3">Total Penilaian Tanah & Bangunan</p>
          <div class="col">
            <div class="form-group">
              <ejs-textbox placeholder="Total Market Value (MV) Land & Building" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
            </div>
          </div>

          <div class="col">
            <div class="form-group">
              <ejs-textbox
                placeholder="Total Market Value (MV) Land & Building Rounding"
                floatLabelType="Auto"
                cssClass="e-outline"
              ></ejs-textbox>
            </div>
          </div>
        </div>

        <div class="row my-3">
          <div class="col">
            <div class="form-group">
              <ejs-textbox
                placeholder="Total Liquidation Value Indication Land & Building"
                floatLabelType="Auto"
                cssClass="e-outline"
              ></ejs-textbox>
            </div>
          </div>

          <div class="col">
            <div class="form-group">
              <ejs-textbox
                placeholder="Total Liquidation Value Indication Land & Building Rounding"
                floatLabelType="Auto"
                cssClass="e-outline"
              ></ejs-textbox>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end my-3">
          <button pButton class="btn btn-success text-white" tooltip="Add new Data">
            <span> <fa-icon icon="plus"></fa-icon> Add </span>
          </button>
        </div>
      </div>

      <div class="mt-5">
        <div class="row my-3">
          <div class="col-6 d-flex gap-3">
            <ejs-radiobutton label="Tanah" name="default"></ejs-radiobutton>
            <ejs-radiobutton label="Bangunan" name="default"></ejs-radiobutton>
          </div>
        </div>

        <div class="row my-3">
          <div class="col">
            <ejs-dropdownlist
              cssClass="e-outline"
              #dropdownlist
              [dataSource]="dataDropdown"
              [fields]="fields"
              showClearButton="true"
              placeholder="Collateral Object"
              floatLabelType="Auto"
              popupHeight="220px"
            ></ejs-dropdownlist>
          </div>
          <div class="col">
            <ejs-textbox placeholder="Market Value / m2" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          </div>
        </div>

        <div class="row my-3">
          <div class="col">
            <ejs-textbox placeholder="Bangunan" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
          </div>
          <div class="col">
            <ejs-textbox placeholder="Market Value / MV" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          </div>
        </div>

        <div class="row my-3">
          <div class="col">
            <ejs-textbox placeholder="Area(M2)" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
          </div>
          <div class="col">
            <ejs-textbox placeholder="Indicationt Value / MV" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          </div>
        </div>

        <div class="row mt-3">
          <div class="col">
            <div class="e-card">
              <div class="e-card-content">
                <ejs-checkbox label="Is There Any IMB Valuation?" labelPosition="Before"></ejs-checkbox>
              </div>
            </div>
            <div class="e-card mt-3">
              <div class="e-card-content">
                <ejs-checkbox label="Is There Any Tata Kota Valuation?" labelPosition="Before"> </ejs-checkbox>
              </div>
            </div>
          </div>
          <div class="col">
            <ejs-textbox placeholder="Precentage" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-3">
          <button pButton class="btn btn-success text-white" tooltip="Save Data">
            <span> <fa-icon icon="plus"></fa-icon> Save </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
