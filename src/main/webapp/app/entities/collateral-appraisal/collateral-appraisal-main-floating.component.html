<mat-sidenav-container [hasBackdrop]="true">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <div class="e-card-header-title">Collateral Appraisal</div>
      </div>
    </div>
    <div class="e-card-content">
      <div *ngIf="clickedMenu === 'appraisal-info'" class="e-sample-resize-container e-card-resize-container">
        <jhi-collateral-appraisal-info
          [surveyAppraisal]="surveyAppraisal"
          [accountAuthorities]="accountAuthorities"
          (outputTipeOfficerAppraisal)="onValTipeOfficerAppraisalChanged($event)"
        ></jhi-collateral-appraisal-info>
      </div>

      <div *ngIf="clickedMenu === 'customer-info'">
        <jhi-collateral-appraisal-person-view
          mode="view"
          [id]="surveyAppraisal.cif.partyId"
          *ngIf="surveyAppraisal.cif.customerType === 'PERSONAL'"
        ></jhi-collateral-appraisal-person-view>
        <jhi-collateral-appraisal-party-group-view
          mode="view"
          [id]="surveyAppraisal.cif.partyId"
          *ngIf="surveyAppraisal.cif.customerType === 'CORPORATE'"
        ></jhi-collateral-appraisal-party-group-view>

        <div class="e-card mb-3">
          <div class="e-card-header mb-1">
            <div class="e-card-header-caption">
              <div class="header-title">Customer Address</div>
            </div>
          </div>
          <div class="e-card-content">
            <jhi-postal-address-view [item]="postalAddress" mode="view"></jhi-postal-address-view>
          </div>
        </div>
      </div>

      <div *ngIf="clickedMenu === 'collateral-info'" class="e-sample-resize-container e-card-resize-container">
        <jhi-collateral-info
          mode="edit"
          [collateral]="collateral"
          [collateralAppraisalId]="collateralAppraisal.id"
          [appraisal]="collateralAppraisal"
        ></jhi-collateral-info>
      </div>

      <div *ngIf="clickedMenu === 'external-officer-info'" class="e-sample-resize-container e-card-resize-container">
        <jhi-collateral-appraisal-external-officer></jhi-collateral-appraisal-external-officer>
      </div>

      <div *ngIf="clickedMenu === 'valuation'" class="e-sample-resize-container e-card-resize-container">
        <jhi-collateral-appraisal-valuation [collateral]="collateral"></jhi-collateral-appraisal-valuation>
      </div>

      <div *ngIf="clickedMenu === 'negative-collateral'" class="e-sample-resize-container e-card-resize-container">
        <jhi-collateral-appraisal-negative-collateral
          [item]="collateralAppraisal.attributes['scoreCard']"
          (criteriaEvent)="addNewCriteria($event)"
        ></jhi-collateral-appraisal-negative-collateral>
      </div>

      <div *ngIf="clickedMenu === 'comparison-data'" class="e-sample-resize-container e-card-resize-container">
        <jhi-collateral-appraisal-comparison [collateralId]="collateralAppraisal.collateralId"> </jhi-collateral-appraisal-comparison>
      </div>

      <div *ngIf="clickedMenu === 'foto-object-jaminan'" class="e-sample-resize-container e-card-resize-container">
        <jhi-collateral-appraisal-process [appraisalId]="collateralAppraisal.id"></jhi-collateral-appraisal-process>
      </div>

      <div *ngIf="clickedMenu === 'summary'" class="e-sample-resize-container e-card-resize-container">
        <div class="row">
          <div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
            <jhi-collateral-appraisal-summary [item]="collateralAppraisal"></jhi-collateral-appraisal-summary>
          </div>
        </div>
      </div>

	  <div *ngIf="clickedMenu === 'correspondence'" class="e-sample-resize-container e-card-resize-container">
		<jhi-credit-proposal-correspondence [creditProposal]="creditProposal"></jhi-credit-proposal-correspondence>
      </div>
    </div>
    <div class="e-card-actions mx-auto mb-5 mt-3">
      <button
        style="margin-right: 25px"
        mat-raised-button
        *ngFor="let task of tasks"
        (click)="processTask(task)"
        class="btn-lg text-uppercase"
      >
        {{ task.caption }}
      </button>
      <button mat-raised-button class="btn-lg text-uppercase" (clickEv)="onSave()">Save</button>
    </div>
  </div>
  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav" mode="over">
    <div class="p-3" style="padding-top: 90px !important">
      <div style="font-size: 1.5rem; font-weight: 600">Select your destination:</div>
      <mat-list role="list">
        <mat-list-item role="listitem">
          <a (click)="clickedMenu = 'appraisal-info'; drawer.toggle()">Appraisal Info</a>
        </mat-list-item>
        <mat-list-item role="listitem">
          <a (click)="clickedMenu = 'customer-info'; drawer.toggle()">Customer Info</a>
        </mat-list-item>
        <mat-list-item role="listitem">
          <a (click)="clickedMenu = 'collateral-info'; drawer.toggle()">Collateral Info</a>
        </mat-list-item>
        <!-- <mat-list-item role="listitem">
          <a (click)="clickedMenu='external-officer-info';drawer.toggle();">External Officer Info</a>
        </mat-list-item> -->
        <mat-list-item role="listitem">
          <a (click)="clickedMenu = 'valuation'; drawer.toggle()">Valuation</a>
        </mat-list-item>
        <mat-list-item role="listitem">
          <a (click)="clickedMenu = 'negative-collateral'; drawer.toggle()">Negative Collateral</a>
        </mat-list-item>
        <mat-list-item role="listitem">
          <a (click)="clickedMenu = 'comparison-data'; drawer.toggle()">Comparison Data</a>
        </mat-list-item>
        <mat-list-item role="listitem">
          <a (click)="clickedMenu = 'foto-object-jaminan'; drawer.toggle()">Foto Object Jaminan</a>
        </mat-list-item>
        <mat-list-item role="listitem">
          <a (click)="clickedMenu = 'summary'; drawer.toggle()">Summary</a>
        </mat-list-item>
      </mat-list>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
<button
  matTooltip="Click this for show sub menu of Collateral Appraisal"
  style="z-index: 1"
  class="btn-menu-floating"
  (click)="drawer.toggle()"
  mat-fab
  color="warn"
  matTooltipPosition="before"
>
  <mat-icon>more_vert</mat-icon>
</button>
