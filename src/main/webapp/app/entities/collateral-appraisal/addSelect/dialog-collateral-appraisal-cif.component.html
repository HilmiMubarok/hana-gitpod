<div *ngIf="dialogSection === 'cif'">
  <div *ngIf="customerType === 'PERSONAL'">
    <jhi-collateral-appraisal-person-view [id]="partyId"> </jhi-collateral-appraisal-person-view>
  </div>
  <div *ngIf="customerType !== 'PERSONAL'">
    <jhi-collateral-appraisal-party-group-view [id]="partyId" [partyId]="partyIds"> </jhi-collateral-appraisal-party-group-view>
  </div>
  <mat-card class="mt-3">
    <mat-card-header>
      <mat-card-subtitle>Customer Address</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <!-- <jhi-postal-address-view mode="view" [item]="postalAddress"></jhi-postal-address-view> -->
      <jhi-party-cif-customer-info-postal-address [disabled]="true" [creditProposal]="creditProposal" [partyPostalAddress]="postalAddress">
      </jhi-party-cif-customer-info-postal-address>
    </mat-card-content>
  </mat-card>
</div>
<div *ngIf="dialogSection === 'collateral'">
  <jhi-collateral-appraisal-info-new [collateral]="collateral"></jhi-collateral-appraisal-info-new>
  <mat-card class="mt-3">
    <mat-card-header>
      <mat-card-subtitle>Customer Address</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label> Address </mat-label>
          <input matInput type="text" [(ngModel)]="collateral.collateralAddress.address1" disabled />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label> Country </mat-label>
          <input matInput type="text" [(ngModel)]="collateral.collateralAddress.countryName" disabled />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label> Province </mat-label>
          <input matInput type="text" [(ngModel)]="collateral.collateralAddress.provinceName" disabled />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label> City </mat-label>
          <input matInput type="text" [(ngModel)]="collateral.collateralAddress.cityName" disabled />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label> District </mat-label>
          <input matInput type="text" [(ngModel)]="collateral.collateralAddress.districtName" disabled />
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label> Village </mat-label>
          <input matInput type="text" [(ngModel)]="collateral.collateralAddress.villageName" disabled />
        </mat-form-field>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label> RT </mat-label>
              <input matInput type="text" [(ngModel)]="collateral.collateralAddress.rt" disabled />
            </mat-form-field>
          </div>
        </div>
        <div class="col-6">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label> RW </mat-label>
              <input matInput type="text" [(ngModel)]="collateral.collateralAddress.rw" disabled />
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label> Kode Pos </mat-label>
          <input matInput type="text" [(ngModel)]="collateral.collateralAddress.postalCode" disabled />
        </mat-form-field>
      </div>
    </mat-card-content>
  </mat-card>
</div>
<mat-card-actions align="center" class="align-center"
  ><button mat-raised-button mat-dialog-close class="confirm-button-no">Cancel</button></mat-card-actions
>
