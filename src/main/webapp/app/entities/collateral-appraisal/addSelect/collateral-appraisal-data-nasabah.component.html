<div style="margin-top: 20px" class="e-card-header">
  <div class="e-card-header-caption">
    <!--<img width="34px" height="34px" src="../../../content/images/back-icon.svg" />-->
    <p style="margin-top: 2px" class="back">Back |</p>
  </div>
  <p class="e-card-sub-title">Add Collateral</p>
</div>

<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title"></div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <div class="row">
              <div class="col-md-5">
                <ejs-textbox
                  name="No Cif"
                  [(ngModel)]="searchInput"
                  placeholder="No Cif"
                  cssClass="e-outline"
                  floatLabelType="Auto"
                ></ejs-textbox>
              </div>
              <div class="col-md-3">
                <button ejs-button style="margin-left: 10px; border-radius: 10px" (click)="onClickFind()" class="btn-info">
                  Find data
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="showCifList">
  <jhi-collateral-appraisal-list [cifNumber]="searchInput"></jhi-collateral-appraisal-list>
</div>
