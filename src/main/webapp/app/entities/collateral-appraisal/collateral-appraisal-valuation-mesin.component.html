<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title"></div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <ejs-grid [dataSource]="items">
              <e-columns>
                <e-column field="indexNum" headerText="No" width="50" textAlign="center"></e-column>
                <e-column field="" headerText="Collateral Object" width="140" textAlign="center"></e-column>
                <e-column field="" headerText="Brand" width="170" textAlign="center"></e-column>
                <e-column field="" headerText="Made By" width="170" textAlign="center"></e-column>
                <e-column field="" headerText="MFG Date" width="140" textAlign="center"></e-column>
                <e-column field="" headerText="Market Value" width="170" textAlign="center"></e-column>
                <e-column field="" headerText="Liquidation Value Indication" width="170" textAlign="center"></e-column>
                <e-column field="" headerText="Percentage" width="170" textAlign="center"></e-column>
                <e-column headerText="Action" width="150" textAlign="Center">
                  <ng-template #template let-data>
                    <button pButton type="button" (click)="onEdit(data)" class="flat-button">
                      <fa-icon icon="pencil-alt"></fa-icon>
                    </button>
                    <button pButton type="button" (click)="onDelete(data)" class="flat-button">
                      <fa-icon icon="trash-alt"></fa-icon>
                    </button>
                  </ng-template>
                </e-column>
              </e-columns>
            </ejs-grid>
            <div class="d-flex justify-content-end">
              <jhi-button typeB="secondary" (clickEv)="add($event)"></jhi-button>
            </div>
            <div class="row justify-content-between">
              <div class="col-6">
                <ejs-textbox placeholder="Total Market Value (MV)" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Total Market Value Rounding" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
              </div>
              <div class="col-6">
                <ejs-textbox placeholder="Total Liquidation Value Indication" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox
                  placeholder="Total Liquidation Value Indication Rounding"
                  floatLabelType="Auto"
                  cssClass="e-outline"
                ></ejs-textbox>
              </div>
            </div>
          </div>
          <div class="e-card-actions"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div [hidden]="state !== 'add'">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title"></div>
              <div class="e-card-sub-title"></div>
            </div>
          </div>
          <div class="e-card-content">
            <div class="row justify-content-between">
              <div class="col-6">
                <ejs-textbox placeholder="Collateral Object" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Brand" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Made By" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
              </div>
              <div class="col-6">
                <ejs-textbox placeholder="MFG Date" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Market Value" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                <ejs-textbox placeholder="Precentage" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
              </div>
            </div>
          </div>
          <div class="e-card-actions"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-end">
    <jhi-button typeB="secondary" (clickEv)="addToGrid($event)"></jhi-button>
  </div>
</div>

<ejs-dialog
  id="dialog"
  #ejDialog
  isModal="true"
  (overlayClick)="onOverlayClick()"
  [animationSettings]="animationSettings"
  [visible]="dialogVisible"
  [width]="width"
  [height]="height"
>
  <!--<ng-template #header> </ng-template>-->
  <ng-template #content>
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="row">
        <div class="row card-layout">
          <div class="e-card">
            <div class="e-card-header">
              <div class="e-card-header-caption">
                <div class="e-card-header-title"></div>
                <div class="e-card-sub-title"></div>
              </div>
            </div>
            <div class="e-card-content">
              <div class="row justify-content-between">
                <div class="col-6">
                  <ejs-textbox placeholder="Collateral Object" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                  <ejs-textbox placeholder="Brand" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                  <ejs-textbox placeholder="Made By" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                </div>
                <div class="col-6">
                  <ejs-textbox placeholder="MFG Date" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                  <ejs-textbox placeholder="Market Value" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                  <ejs-textbox placeholder="Precentage" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                </div>
              </div>
            </div>
            <div class="e-card-actions"></div>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</ejs-dialog>
