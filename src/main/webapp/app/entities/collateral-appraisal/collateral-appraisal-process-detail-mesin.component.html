<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.collateralAppraisal.home.title">Collateral Appraisals</span>
  </h5>

  <div class="table-bg">
    <div class="container-block">
      <div class="block-title">Unit Ownership</div>
    </div>

    <ejs-grid class="ejs-table" #grid [dataSource]="data" [allowPaging]="true" [pageSettings]="pageSettings">
      <e-columns>
        <e-column field="noId" headerText="No" textAlign="left" width="100"></e-column>
        <e-column field="mesinId" headerText="Nama Mesin" textAlign="center" width="200"></e-column>
        <e-column field="tipedocId" headerText="Tipe Document" textAlign="center" format="C2" width="200"></e-column>
        <e-column field="dateId" headerText="Tanggal" textAlign="center" width="180"></e-column>
        <e-column field="fromId" headerText="From" textAlign="center" width="180"></e-column>
        <e-column field="amountId" headerText="Amount" textAlign="center" width="150"></e-column>
        <e-column headerText="Actions" textAlign="center" width="200">
          <ng-template #template let-data>
            <button ejs-button type="submit" [routerLink]="['/collateral', data.id, 'view']" class="submit-button">
              <fa-icon icon="eye"></fa-icon>
            </button>

            <button ejs-button type="submit" [routerLink]="['/collateral', data.id, 'edit']" class="edit-button">
              <fa-icon icon="pencil-alt"></fa-icon>
            </button>

            <button ejs-button type="button" (click)="deleteItem(data.id)">
              <fa-icon icon="trash-alt"></fa-icon>
            </button>
          </ng-template>
        </e-column>
      </e-columns>
    </ejs-grid>

    <button ejs-button class="button-save" (click)="detailClick()">ADD</button>

    <ejs-dialog
      id="dialog"
      #ejDialog
      isModal="true"
      (overlayClick)="onOverlayClick()"
      [animationSettings]="animationSettings"
      [visible]="dialogVisible"
      [width]="width"
      [height]="height"
    >
      <ng-template #header> </ng-template>
      <ng-template #content>
        <div class="dialogContent">
          <div class="bg-form">
            <div class="container-block">
              <div class="block-title">Unit Ownership Right</div>
            </div>
            <div class="row">
              <div class="col-sm">
                <div class="form-input">
                  <ejs-textbox class="textbox-bar" placeholder="Nama Mesin" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>

                <div class="form-input">
                  <ejs-textbox class="textbox-bar" placeholder="Tipe Dokumen" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>

                <div class="form-input">
                  <ejs-textbox class="textbox-bar" placeholder="No Dokumen" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
              </div>

              <div class="col-sm">
                <div class="form-input">
                  <ejs-textbox class="textbox-bar" placeholder="Tanggal" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>

                <div class="form-input">
                  <ejs-textbox class="textbox-bar" placeholder="From" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>

                <div class="form-input">
                  <ejs-textbox class="textbox-bar" placeholder="Amount" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
              </div>
              <div class="col-sm"></div>
            </div>

            <div class="bg-form">
              <div class="container-block">
                <div class="block-title">Unit Information</div>
              </div>

              <div class="row">
                <div class="col-sm">
                  <div class="form-input">
                    <ejs-textbox class="textbox-bar" placeholder="Merk Mesin" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>

                  <div class="form-input">
                    <ejs-textbox class="textbox-bar" placeholder="Buatan" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>

                  <div class="form-input">
                    <ejs-textbox class="textbox-bar" placeholder="Tahun" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>

                  <div class="form-input">
                    <ejs-textbox class="textbox-bar" placeholder="Type Model" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>
                </div>

                <div class="col-sm">
                  <div class="form-input">
                    <ejs-textbox class="textbox-bar" placeholder="Jenis" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>

                  <div class="form-input">
                    <ejs-textbox class="textbox-bar" placeholder="MGF Date" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>

                  <div class="form-input">
                    <ejs-textbox class="textbox-bar" placeholder="Spesifikasi" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>

                  <div class="form-input">
                    <ejs-textbox class="textbox-bar" placeholder="Kondisi" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>

                  <div class="form-input">
                    <ejs-textbox class="textbox-bar" placeholder="Keterangan" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>
                </div>
                <div class="col-sm"></div>
              </div>
            </div>
            <button ejs-button class="button-save">Save</button>
          </div>
        </div>
      </ng-template>
    </ejs-dialog>

  </div>
</div>
