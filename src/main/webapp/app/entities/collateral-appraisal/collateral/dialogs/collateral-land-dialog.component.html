<h2 mat-dialog-title class="sub-header">Certificate Detail</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-content>
      <div class="row">
        <div class="col-6">
          <section class="mt-2">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Certificate Number</mat-label>
              <input matInput type="text" [(ngModel)]="collateralLandAttribute.certNumber" [disabled]="gakbisa()" />
            </mat-form-field>
          </section>
          <section class="mt-2">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>In The Name Of</mat-label>
              <input matInput type="text" [(ngModel)]="collateralLandAttribute.certName" [disabled]="gakbisa()" />
            </mat-form-field>
          </section>
          <section class="mt-2">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>No GS / SU</mat-label>
              <input matInput type="text" [(ngModel)]="collateralLandAttribute.certGSNumber" [disabled]="gakbisa()" />
            </mat-form-field>
          </section>
        </div>
        <div class="col-6">
          <section class="mt-2">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Date of Issue</mat-label>
              <input
                [disabled]="gakbisa()"
                [matDatepicker]="dateOfIssue"
                matInput
                type="text"
                [(ngModel)]="collateralLandAttribute.certIssueDate"
                disabled
              />
              <mat-datepicker-toggle matSuffix [for]="dateOfIssue"></mat-datepicker-toggle>
              <mat-datepicker #dateOfIssue disabled="false" [disabled]="gakbisa()"></mat-datepicker>
            </mat-form-field>
          </section>
          <section class="mt-2">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Due Date</mat-label>
              <input
                [disabled]="gakbisa()"
                [matDatepicker]="dueDate"
                matInput
                type="text"
                [(ngModel)]="collateralLandAttribute.certDueDate"
                disabled
              />
              <mat-datepicker-toggle matSuffix [for]="dueDate"></mat-datepicker-toggle>
              <mat-datepicker #dueDate disabled="false" [disabled]="gakbisa()"></mat-datepicker>
            </mat-form-field>
          </section>
          <section class="mt-2">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Area</mat-label>
              <input
                matInput
                type="text"
                [ngModel]="collateralLandAttribute.certArea | number: '1.0-0'"
                (ngModelChange)="collateralLandAttribute.certArea = numberInputChanged($event)"
                [disabled]="gakbisa()"
              />

              <!-- <input matInput type="number" [(ngModel)]="collateralProp.landSizePerCertificate" /> -->
            </mat-form-field>
          </section>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-button (click)="save()" [disabled]="gakbisa()">Save</button>
</mat-dialog-actions>
