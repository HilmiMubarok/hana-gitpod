<h2 mat-dialog-title class="sub-header">Machine Detail</h2>
<mat-dialog-content>
  <mat-card class="card">
    <mat-card-content>
      <div class="row">
        <div class="col-6">
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="Machine Name"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineName"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Machine Name</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineName" required/>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="Tipe Document"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineDocType"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Tipe Document</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineDocType" required/>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="No Document"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineDocNum"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>No Document</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineDocNum" required/>
            </mat-form-field> -->
          </section>
        </div>
        <div class="col-6">
          <section class="mt-2">
            <ejs-datepicker
              cssClass="e-outline"
              [(ngModel)]="collateralProp.machineDate"
              placeholder="Tanggal"
              cssClass="e-outline"
              floatLabelType="Auto"
              required
            ></ejs-datepicker>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Tanggal</mat-label>
              <input [matDatepicker]="machineDate" matInput type="text" [(ngModel)]="collateralProp.machineDate"
                required isabled />
              <mat-datepicker-toggle matSuffix [for]="machineDate"></mat-datepicker-toggle>
              <mat-datepicker #machineDate disabled="false"></mat-datepicker>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-datepicker
              cssClass="e-outline"
              [(ngModel)]="collateralProp.machineDateFrom"
              placeholder="From"
              cssClass="e-outline"
              floatLabelType="Auto"
              required
            ></ejs-datepicker>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>From</mat-label>
              <input [matDatepicker]="machineDateFrom" matInput type="text" [(ngModel)]="collateralProp.machineDateFrom"
                required disabled />
              <mat-datepicker-toggle matSuffix [for]="machineDateFrom"></mat-datepicker-toggle>
              <mat-datepicker #machineDateFrom disabled="false"></mat-datepicker>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-numerictextbox
              cssClass="e-outline"
              type="text"
              placeholder="Amount"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineAmount"
              format="IDR 0,"
              min="0"
              required
            ></ejs-numerictextbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Amount</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineAmount" required/>
            </mat-form-field> -->
          </section>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="card mt-3">
    <mat-card-content>
      <div class="row">
        <!-- LEFT SIDE -->
        <div class="col-6">
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="Merek Mesin"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineMerk"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Merek Mesin</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineMerk" required/>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="Buatan"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineMadeBy"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Buatan</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineMadeBy" required/>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="number"
              placeholder="Tahun"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineYear"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Tahun</mat-label>
              <input matInput type="number" [(ngModel)]="collateralProp.machineYear" required/>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="Type Model"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineModelType"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Type Model</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineModelType" />
            </mat-form-field> -->
          </section>
        </div>
        <!-- RIGHT SIDE -->
        <div class="col-6">
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="Jenis"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineType"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Jenis</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineType" required/>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-datepicker
              cssClass="e-outline"
              [(ngModel)]="collateralProp.machineMfgDate"
              placeholder="MFG Date"
              cssClass="e-outline"
              floatLabelType="Auto"
              type="date"
              required
            ></ejs-datepicker>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>MFG Date</mat-label>
              <input [matDatepicker]="machineMfgDate" matInput type="text" [(ngModel)]="collateralProp.machineMfgDate" required disabled />
              <mat-datepicker-toggle matSuffix [for]="machineMfgDate"></mat-datepicker-toggle>
              <mat-datepicker #machineMfgDate disabled="false"></mat-datepicker>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="specification"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineSpec"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Spesifikasi</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineSpec" required/>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="Kondisi"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineCondition"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Kondisi</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineCondition" required/>
            </mat-form-field> -->
          </section>
          <section class="mt-2">
            <ejs-textbox
              cssClass="e-outline"
              type="text"
              placeholder="Keterangan"
              floatLabelType="Always"
              [(ngModel)]="collateralProp.machineNotes"
              required
            ></ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Keterangan</mat-label>
              <input matInput type="text" [(ngModel)]="collateralProp.machineNotes" required/>
            </mat-form-field> -->
          </section>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-button (click)="save()">Save</button>
</mat-dialog-actions>
