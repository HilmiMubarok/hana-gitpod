<h2 mat-dialog-title class="sub-header">Land Detail</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-content>
      <div class="row">
        <div class="col-12">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Object Name</mat-label>
              <input
                matInput
                type="text"
                [(ngModel)]="collateralProperty.description"
                [disabled]="hideordisable()"
                [disabled]="hiddenRmAdmin"
                required
              />
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Area</mat-label>
              <input
                matInput
                type="number"
                [(ngModel)]="collateralProperty.landSizePerCertificate"
                (ngModelChange)="collateralProperty.landSizePerCertificate = numberInputChanged($event)"
                [disabled]="hideordisable()"
                [disabled]="hiddenRmAdmin"
                required
              />
            </mat-form-field>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center" class="align-center">
  <button mat-raised-button (click)="openCancelDialog()" class="confirm-button-no">Cancel</button>
  <button mat-raised-button [disabled]="hideordisable()" [disabled]="hiddenRmAdmin" class="confirm-button-yes" (click)="save()">
    Save
  </button>
</mat-dialog-actions>
