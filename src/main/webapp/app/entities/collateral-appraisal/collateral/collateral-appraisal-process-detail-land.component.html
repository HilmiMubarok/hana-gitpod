<mat-card class="mt-3">
  <mat-card-header>
    <mat-card-subtitle class="sub-header">Land Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="collateralProperties" class="mat-table-expand" multiTemplateDataRows>
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let i = dataIndex" class="text-center">{{ i + 1 + paginator.pageIndex * paginator.pageSize }}.</td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>
      <ng-container matColumnDef="objectName">
        <th mat-header-cell *matHeaderCellDef>Object Name</th>
        <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        <td mat-footer-cell *matFooterCellDef>Total</td>
      </ng-container>
      <ng-container matColumnDef="area">
        <th mat-header-cell *matHeaderCellDef>Area</th>
        <td mat-cell *matCellDef="let element">{{ element.landSizePerCertificate }}m<sup>2</sup></td>
        <td mat-footer-cell *matFooterCellDef>{{ getTotalArea() }}m<sup>2</sup></td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="$event.stopPropagation(); delete(element)">
            <mat-icon>delete_forever</mat-icon>
          </button>
        </td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>
      <ng-container matColumnDef="expand">
        <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-icon-button
            aria-label="expand row"
            (click)="expandedElement = expandedElement === element ? null : element; $event.stopPropagation()"
          >
            <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
            <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumnsExpand.length">
          <div class="mat-element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
            <mat-card class="w-100">
              <mat-card-header>
                <mat-card-header-subtitle>Selection Certificate Info</mat-card-header-subtitle>
              </mat-card-header>
              <mat-card-content>
                <mat-list role="list">
                  <mat-list-item
                    role="listitem"
                    *ngFor="let item of parsingSelectionCertificates(element.attributes?.selectionCertificates)"
                    >Certificate Number: {{ item.certNumber }}</mat-list-item
                  >
                </mat-list>
              </mat-card-content>
              <mat-card-actions align="right">
                <button mat-raised-button (click)="openDialogCertificate(expandedElement)">ADD CERTIFICATE</button>
              </mat-card-actions>
            </mat-card>
          </div>
        </td>
      </ng-container>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumnsExpand.length">No records found.</td>
      </tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumnsExpand.length">
          <jhi-no-record-found moduleName="Certificates"></jhi-no-record-found>
        </td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumnsExpand"></tr>
      <tr
        mat-row
        *matRowDef="let element; columns: displayedColumnsExpand"
        [class.mat-expanded-row]="expandedElement === element"
        class="mat-element-row"
        (click)="expandedElement = expandedElement === element ? null : element"
      ></tr>
      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="mat-detail-row"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumnsExpand"></tr>
    </table>
    <mat-card *ngIf="loading" id="material-loading-bar">
      <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
    </mat-card>
    <mat-paginator
      showFirstLastButtons
      ngClass="transparant"
      [length]="paginatorLength"
      [pageSize]="paginatorPageSize"
      [pageSizeOptions]="paginatorPageSizeOption"
      (page)="loadDataLazy($event)"
    >
    </mat-paginator>
  </mat-card-content>
  <mat-card-actions align="right">
    <button mat-raised-button (click)="openDialog()">ADD NEW LAND INFO</button>
  </mat-card-actions>
</mat-card>
