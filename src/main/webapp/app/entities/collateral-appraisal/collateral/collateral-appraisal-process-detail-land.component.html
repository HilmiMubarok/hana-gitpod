<mat-card class="mt-3">
  <mat-card-header>
    <mat-card-subtitle class="sub-header">Land Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="collateralProperties" class="mat-table-expand" multiTemplateDataRows>
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let i = dataIndex" class="text-center">{{ i + 1 + paginator.pageIndex * paginator.pageSize }}.</td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>
      <ng-container matColumnDef="objectName">
        <th mat-header-cell *matHeaderCellDef>Object Name</th>
        <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        <td mat-footer-cell *matFooterCellDef>Total</td>
      </ng-container>
      <ng-container matColumnDef="area">
        <th mat-header-cell *matHeaderCellDef>Area</th>
        <td mat-cell *matCellDef="let element">{{ element.landSizePerCertificate }}m<sup>2</sup></td>
        <td mat-footer-cell *matFooterCellDef>{{ getTotalArea() }}m<sup>2</sup></td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="$event.stopPropagation(); delete(element)">
            <mat-icon>delete_forever</mat-icon>
          </button>
        </td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>
      <ng-container matColumnDef="expand">
        <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-icon-button
            aria-label="expand row"
            (click)="expandedElement = expandedElement === element ? null : element; $event.stopPropagation()"
          >
            <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
            <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
          </button>
        </td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>

      <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumnsExpand.length">
          <div class="mat-element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
            <mat-card class="w-100">
              <mat-card-header>
                <mat-card-header-subtitle>Selection Certificate Info</mat-card-header-subtitle>
              </mat-card-header>
              <mat-card-content>
                <mat-list role="list">
                  <mat-list-item
                    role="listitem"
                    *ngFor="let item of parsingSelectionCertificates(element.attributes?.selectionCertificates)"
                    >Certificate Number: {{ item.certNumber }}</mat-list-item
                  >
                </mat-list>
              </mat-card-content>
              <mat-card-actions align="right">
                <button mat-raised-button (click)="openDialogCertificate(expandedElement)">ADD CERTIFICATE</button>
              </mat-card-actions>
            </mat-card>
          </div>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumnsExpand.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumnsExpand"></tr>
      <tr
        mat-row
        *matRowDef="let element; columns: displayedColumnsExpand"
        [class.mat-expanded-row]="expandedElement === element"
        class="mat-element-row"
        (click)="expandedElement = expandedElement === element ? null : element"
      ></tr>
      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="mat-detail-row"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumnsExpand"></tr>
    </table>
    <mat-card *ngIf="loading" id="material-loading-bar">
      <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
    </mat-card>
    <mat-paginator
      showFirstLastButtons
      ngClass="transparant"
      [length]="paginatorLength"
      [pageSize]="paginatorPageSize"
      [pageSizeOptions]="paginatorPageSizeOption"
      (page)="loadDataLazy($event)"
    >
    </mat-paginator>
  </mat-card-content>
  <mat-card-actions align="right">
    <button mat-raised-button (click)="openDialog()">ADD NEW LAND INFO</button>
  </mat-card-actions>
</mat-card>
<mat-card>
  <label>RELATION BETWEEN OWNERSHIP RIGHT WITH DEBTOR</label>
  <div class="row">
    <!-- LEFT SIDE -->
    <div class="col-6">
      <div class="form-group">
        <ejs-textbox
          placeholder="Relation between Ownership Right with Debtor"
          cssClass="e-outline"
          floatLabelType="Auto"
          required
        ></ejs-textbox>
      </div>
      <div class="form-group">
        <ejs-dropdownlist
          #ddPropoertyUsage
          floatLabelType="Auto"
          [dataSource]="listOfValues.property_usage"
          [(ngModel)]="collateral.propertyUsage"
          cssClass="e-outline"
          placeholder="Property Usage"
          popupHeight="220px"
          required
        >
        </ejs-dropdownlist>
      </div>
      <div class="form-group">
        <ejs-dropdownlist
          #ddPropoertyUsage
          floatLabelType="Auto"
          [dataSource]="listOfValues.land_shape"
          [(ngModel)]="collateral.landShape"
          cssClass="e-outline"
          placeholder="Land Shape"
          popupHeight="220px"
          required
        >
        </ejs-dropdownlist>
      </div>
      <div class="form-group">
        <ejs-numerictextbox
          [(ngModel)]="collateral.landElevation"
          name="landElevation"
          placeholder="Land Elevation (cm)"
          cssClass="e-outline"
          floatLabelType="Auto"
          format="0,"
          min="0"
          required
        ></ejs-numerictextbox>
      </div>
      <div class="form-group">
        <ejs-numerictextbox
          [(ngModel)]="collateral.roadWidth"
          name="roadWidth"
          placeholder="Width of The Road m2"
          cssClass="e-outline"
          floatLabelType="Auto"
          format="0,"
          min="0"
          required
        ></ejs-numerictextbox>
      </div>
      <div class="form-group">
        <ejs-textbox
          [(ngModel)]="collateral.unitCondition"
          name="unitCondition"
          placeholder="Unit Condition"
          cssClass="e-outline"
          floatLabelType="Auto"
          required
        ></ejs-textbox>
      </div>
    </div>
    <!-- RIGHT SIDE -->
    <div class="col-6">
      <div class="form-group">
        <ejs-textbox
          [(ngModel)]="collateral.inhabitedBy"
          name="inhabitedBy"
          placeholder="Inhabited By"
          cssClass="e-outline"
          floatLabelType="Auto"
          required
        ></ejs-textbox>
      </div>
      <div class="form-group">
        <ejs-textbox
          [(ngModel)]="collateral.landPosition"
          name="landPosition"
          placeholder="Land Position"
          cssClass="e-outline"
          floatLabelType="Auto"
          required
        ></ejs-textbox>
      </div>
      <div class="form-group">
        <!-- <ejs-textbox
      [(ngModel)]="item.facingDirection"
      name="facingDirection"
      placeholder="Facing in a Certain Direction"
      cssClass="e-outline"
      floatLabelType="Auto"
      required
    >
    </ejs-textbox> -->
        <ejs-dropdownlist
          #ddPropoertyUsage
          floatLabelType="Auto"
          [dataSource]="listOfValues.direction"
          [(ngModel)]="collateral.facingDirection"
          cssClass="e-outline"
          placeholder="Facing in a Certain Direction"
          popupHeight="220px"
          required
        >
        </ejs-dropdownlist>
      </div>
      <div class="form-group">
        <ejs-dropdownlist
          #ddPropoertyUsage
          floatLabelType="Auto"
          [dataSource]="listOfValues.madeWith"
          [(ngModel)]="collateral.madeWith"
          cssClass="e-outline"
          placeholder="Made With"
          popupHeight="220px"
          required
        >
        </ejs-dropdownlist>
      </div>
    </div>
  </div>
  <label>OBJECT ENVIRONMENT</label>
  <div class="row">
    <div class="col-12">
      <mat-checkbox
        [(ngModel)]="obj.select"
        *ngFor="let obj of objectEnvironments"
        style="margin-left: 10px"
        (change)="selectObjectEnvironment($event.checked, obj)"
      >
        {{ obj.label }}
      </mat-checkbox>
    </div>
  </div>

  <label>BORDERS</label>

    <!-- LEFT SIDE -->
    <div class="col-6">
      <div class="form-group">
        <ejs-textbox
          cssClass="e-outline"
          type="text"
          placeholder="Left Side"
          floatLabelType="Always"
          [(ngModel)]="collateral.leftSide"
          required

      <span matSuffix>

  </div>
