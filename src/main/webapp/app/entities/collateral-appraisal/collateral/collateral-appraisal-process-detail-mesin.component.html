<div class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title"></div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <div class="e-card-content">
          <ejs-grid [dataSource]="items" allowTextWrap="true">
            <e-columns>
              <e-column field="indexNum" headerText="No" width="90" textAlign="center"></e-column>
              <e-column field="namaMsn" headerText="Nama Mesin" width="200" textAlign="center"></e-column>
              <e-column field="tipeDoc" headerText="Tipe Document" width="170" textAlign="center"></e-column>
              <e-column field="noDoc" headerText="No Document" width="170" textAlign="center"></e-column>
              <e-column field="tanggal" headerText="Tanggal" width="140" textAlign="center"></e-column>
              <e-column field="from" headerText="From" width="170" textAlign="center"></e-column>
              <e-column field="amount" headerText="Amount" width="170" textAlign="center"></e-column>
              <e-column headerText="Action" width="150" textAlign="Center">
                <ng-template #template let-data>
                  <button pButton type="button" (click)="onEdit(data)" class="flat-button">
                    <fa-icon icon="pencil-alt"></fa-icon>
                  </button>
                  <button pButton type="button" (click)="onDelete(data)" class="flat-button">
                    <fa-icon icon="trash-alt"></fa-icon>
                  </button>
                </ng-template>
              </e-column>
            </e-columns>
          </ejs-grid>
          <div class="d-flex justify-content-end mt-3">
            <button ejs-button class="btn-info" (click)="onAdd()">Add</button>
          </div>
        </div>
        <div class="e-card-actions"></div>
      </div>
    </div>
  </div>
</div>

<!-- dialog edit -->
<ejs-dialog
  id="dialog"
  #ejDialog
  isModal="true"
  (overlayClick)="onOverlayEditClick()"
  [animationSettings]="animationSettings"
  [visible]="dialogEditVisible"
  [width]="width"
  [height]="height"
>
  <!--<ng-template #header> </ng-template>-->
  <ng-template #content>
    <div class="dialogContent">
      <div class="e-sample-resize-container e-card-resize-container">
        <div class="row">
          <div class="row card-layout">
            <div class="e-card">
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title"></div>
                  <div class="e-card-sub-title"></div>
                </div>
              </div>
              <div class="e-card-content">
                <span class="title-header">Detail Information</span>
                <div class="row justify-content-between">
                  <div class="col-6">
                    <div class="form-space">
                      <ejs-textbox [(ngModel)]="namaMsn" placeholder="Nama Mesin" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox
                        [(ngModel)]="tipeDoc"
                        placeholder="Tipe Document"
                        cssClass="e-outline"
                        floatLabelType="Auto"
                      ></ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox [(ngModel)]="noDoc" placeholder="No Dokumen" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="form-space">
                      <ejs-textbox [(ngModel)]="tanggal" placeholder="Tanggal" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox [(ngModel)]="from" placeholder="From" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox [(ngModel)]="amount" placeholder="Amount" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>
                </div>
              </div>
              <div class="e-card-actions"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="e-sample-resize-container e-card-resize-container">
        <div class="row">
          <div class="row card-layout">
            <div class="e-card">
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title"></div>
                  <div class="e-card-sub-title"></div>
                </div>
              </div>
              <div class="e-card-content">
                <div class="row justify-content-between">
                  <div class="col-6">
                    <div class="form-space">
                      <ejs-textbox placeholder="Merk Mesin" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox placeholder="Buatan" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox placeholder="Tahun" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox placeholder="Type Model" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="form-space">
                      <ejs-textbox placeholder="Jenis" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox placeholder="MFG Date" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox placeholder="Spesifikasi" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox placeholder="Kondisi" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                    <div class="form-space">
                      <ejs-textbox placeholder="Keterangan" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    </div>
                  </div>

              <div class="e-card-actions"></div>

        </div>

    </div>
  </ng-template>
</ejs-dialog>
