<div class="page-content">
  <ejs-menu
    [enableScrolling]="true"
    cssClass="e-rounded-menu e-custom-scroll"
    [items]="menuItems"
    (select)="selectMenuItem($event)"
  ></ejs-menu>
  <div [hidden]="selectedMenuId !== 'customer-info'">
    <div *ngIf="partyType === 'Individual'">
      <jhi-ribbon ribbonN="Personal Info"></jhi-ribbon>
      <jhi-person-view [item]="person" [mode]="'edit'"></jhi-person-view>
      <jhi-ribbon ribbonN="Address Info"></jhi-ribbon>
      <jhi-postal-address-view [item]="primaryAddress"></jhi-postal-address-view>
    </div>
    <div *ngIf="partyType === 'Corporate'">
      <jhi-ribbon ribbonN="Company Info"></jhi-ribbon>
      <jhi-party-group-view [item]="partyGroup"></jhi-party-group-view>
      <jhi-ribbon ribbonN="Address Info"></jhi-ribbon>
      <jhi-postal-address-view [item]="primaryAddress"></jhi-postal-address-view>
    </div>
  </div>

  <div [hidden]="selectedMenuId !== 'collateral-info'">
    <!--<jhi-collateral-view mode="edit" [item]="collateral"></jhi-collateral-view>-->
    <!--<jhi-collateral-view mode="view" [item]="collateral"></jhi-collateral-view>-->
    <div [hidden]="collateralType !== 'kendaraan'">
      <jhi-collateral-appraisal-process-detail-unit [item]="collateral"></jhi-collateral-appraisal-process-detail-unit>
    </div>
    <div [hidden]="collateralType !== 'mesin'">
      <jhi-collateral-appraisal-process-detail [item]="collateral"></jhi-collateral-appraisal-process-detail>
    </div>
  </div>

  <div [hidden]="selectedMenuId !== 'credit-proposal-info'">
    <jhi-textbox nameP="Application ID" dataTypeP="number" dataFormatP="empty" [valNP]="applicationId"></jhi-textbox>
    <ejs-textbox cssClass="e-outline" placeholder="Application Number" floatLabelType="Auto" [(ngModel)]="applicationNumber"></ejs-textbox>
    <!--<jhi-textbox nameP="Application Number" dataTypeP="stringObservable" dataFormatP="empty" [valNP]="applicationNumber | async"></jhi-textbox>-->
    <!--<span>{{ applicationNumber | async }}</span>-->
  </div>

  <div [hidden]="selectedMenuId !== 'valuation-info'">
    <jhi-collateral-appraisal-valuation [item]="collateralAppraisal"></jhi-collateral-appraisal-valuation>
  </div>

  <div [hidden]="selectedMenuId !== 'negative-info'">
    <jhi-collateral-appraisal-negative-collateral></jhi-collateral-appraisal-negative-collateral>
  </div>

  <div [hidden]="selectedMenuId !== 'comparison-info'">
    <jhi-collateral-appraisal-comparison-data></jhi-collateral-appraisal-comparison-data>
  </div>

  <div [hidden]="selectedMenuId !== 'foto-info'">
    <jhi-collateral-appraisal-process></jhi-collateral-appraisal-process>
  </div>

  <div [hidden]="selectedMenuId !== 'summary-info'">
    <jhi-collateral-appraisal-summary></jhi-collateral-appraisal-summary>
    <jhi-collateral-appraisal-summary-return></jhi-collateral-appraisal-summary-return>
    <div class="d-flex justify-content-end my-3">
      <button pButton class="btn btn-success text-white" tooltip="Save" (click)="onSave()">
        <span>Save</span>
      </button>
    </div>
  </div>
</div>
