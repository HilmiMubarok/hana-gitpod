<div class="mb-5">
  <div class="e-sample-resize-container e-card-resize-container mt-3">
    <div class="row">
      <div class="card-layout">
        <div class="e-card">
          <div class="e-card-header">
            <div class="e-card-header-caption">
              <div class="e-card-header-title">Collateral Appraisal</div>
              <mat-card-subtitle style="margin-top: 8px">his is Collateral Appraisal page</mat-card-subtitle>
            </div>
          </div>
          <div class="e-card-content">
            <ejs-menu
              #menu
              [enableScrolling]="true"
              cssClass="e-rounded-menu e-custom-scroll"
              [items]="menuItems"
              [fields]="menuFields"
              (select)="selectMenuItem($event)"
            ></ejs-menu>
            <div [hidden]="selectedMenu !== 'Appraisal Info'" class="e-sample-resize-container e-card-resize-container">
              <jhi-collateral-appraisal-info
                [surveyAppraisal]="surveyAppraisal"
                [accountAuthorities]="accountAuthorities"
                (outputTipeOfficerAppraisal)="onValTipeOfficerAppraisalChanged($event)"
              ></jhi-collateral-appraisal-info>
            </div>

            <div [hidden]="selectedMenu !== 'Customer Info'">
              <jhi-collateral-appraisal-person-view
                mode="view"
                [id]="surveyAppraisal.cif.partyId"
                *ngIf="surveyAppraisal.cif.customerType === 'PERSONAL'"
              ></jhi-collateral-appraisal-person-view>
              <jhi-collateral-appraisal-party-group-view
                mode="view"
                [id]="surveyAppraisal.cif.partyId"
                *ngIf="surveyAppraisal.cif.customerType === 'CORPORATE'"
              ></jhi-collateral-appraisal-party-group-view>

              <div class="e-card mb-3">
                <div class="e-card-header mb-1">
                  <div class="e-card-header-caption">
                    <div class="e-card-header-title">Customer Address</div>
                    <div class="e-card-sub-title"></div>
                  </div>
                </div>
                <div class="e-card-content">
                  <jhi-postal-address-view [item]="postalAddress" mode="view"></jhi-postal-address-view>
                </div>
              </div>
            </div>

            <div [hidden]="selectedMenu !== 'Collateral Info'" class="e-sample-resize-container e-card-resize-container">
              <jhi-collateral-info mode="edit" [collateral]="collateral"></jhi-collateral-info>
            </div>

            <div [hidden]="selectedMenu !== 'External Officer Info'" class="e-sample-resize-container e-card-resize-container">
              <jhi-collateral-appraisal-external-officer></jhi-collateral-appraisal-external-officer>
            </div>

            <div [hidden]="selectedMenu !== 'Valuation'" class="e-sample-resize-container e-card-resize-container">
              <jhi-collateral-appraisal-valuation [collateral]="collateral"></jhi-collateral-appraisal-valuation>
            </div>

            <div *ngIf="selectedMenu === 'Negative Collateral'" class="e-sample-resize-container e-card-resize-container">
              <jhi-collateral-appraisal-negative-collateral
                [item]="collateralAppraisal.attributes['scoreCard']"
                (criteriaEvent)="addNewCriteria($event)"
              ></jhi-collateral-appraisal-negative-collateral>
            </div>

            <div [hidden]="selectedMenu !== 'Comparison Data'" class="e-sample-resize-container e-card-resize-container">
              <jhi-collateral-appraisal-comparison [collateralId]="collateralAppraisal.collateralId"> </jhi-collateral-appraisal-comparison>
            </div>

            <div [hidden]="selectedMenu !== 'Foto Object Jaminan'" class="e-sample-resize-container e-card-resize-container">
              <jhi-collateral-appraisal-process [appraisalId]="collateralAppraisal.id"></jhi-collateral-appraisal-process>
            </div>

            <div *ngIf="selectedMenu === 'Summary'" class="e-sample-resize-container e-card-resize-container">
              <div class="row">
                <div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
                  <jhi-collateral-appraisal-summary [item]="collateralAppraisal"></jhi-collateral-appraisal-summary>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-center mt-1">
              <button style="margin-right: 25px" color="primary" mat-raised-button *ngFor="let task of tasks" (click)="processTask(task)">
                {{ task.caption }}
              </button>
              <jhi-button typeB="info" (clickEv)="onSave()"></jhi-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
