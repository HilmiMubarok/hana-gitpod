<div class="page-content">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="col-12">
        <jhi-collateral-info [collateral]="collateral"></jhi-collateral-info>
      </div>
      <div [hidden]="collateralType !== 'MACHINE'" class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-process-detail-mesin
          [item]="collateralProperty"
          [generalInfo]="collateral"
          (outputItems)="onValCollateralItemChanged($event)"
        ></jhi-collateral-appraisal-process-detail-mesin>
      </div>
    </div>
  </div>

  <ejs-menu
    #menu
    [enableScrolling]="true"
    cssClass="e-rounded-menu e-custom-scroll"
    [items]="menuItems"
    [fields]="menuFields"
    (select)="selectMenuItem($event)"
  ></ejs-menu>

  <div [hidden]="selectedMenu !== 'Appraisal Info'" class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-info
          [collateralAppraisal]="collateralAppraisal"
          [accountAuthorities]="accountAuthorities"
          [partyCif]="partyCif"
          (outputTipeOfficerAppraisal)="onValTipeOfficerAppraisalChanged($event)"
        ></jhi-collateral-appraisal-info>
      </div>
    </div>
  </div>

  <div [hidden]="selectedMenu !== 'Customer Info'" class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div *ngIf="partyType === 'Individual'" class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-person-view [cif]="cif" mode="view"></jhi-collateral-appraisal-person-view>
      </div>
      <div *ngIf="partyType === 'Corporate'" class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-ribbon ribbonN="Company Info"></jhi-ribbon>
        <jhi-party-group-view [item]="partyGroup"></jhi-party-group-view>
        <jhi-ribbon ribbonN="Address Info"></jhi-ribbon>
        <jhi-postal-address-view [item]="primaryAddress"></jhi-postal-address-view>
      </div>
    </div>
  </div>

  <div [hidden]="selectedMenu !== 'Collateral Info'" class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div [hidden]="collateralType !== 'PROPERTY'" class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-process-detail-real-estate
          [collateralId]="collateralAppraisal.collateralId"
          [item]="collateralProperty"
          [generalInfo]="collateral"
        >
        </jhi-collateral-appraisal-process-detail-real-estate>
      </div>
      <div [hidden]="collateralType !== 'VEHICLE'" class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-process-detail-unit-condition
          [item]="collateralProperty"
          [generalInfo]="collateral"
          (outputItems)="onValCollateralItemChanged($event)"
        >
        </jhi-collateral-appraisal-process-detail-unit-condition>
      </div>
      <div [hidden]="collateralType !== 'MACHINE'" class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-process-detail-mesin
          [item]="collateralProperty"
          [generalInfo]="collateral"
          (outputItems)="onValCollateralItemChanged($event)"
        ></jhi-collateral-appraisal-process-detail-mesin>
      </div>
    </div>
  </div>

  <div [hidden]="selectedMenu !== 'External Officer Info'" class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-external-officer></jhi-collateral-appraisal-external-officer>
      </div>
    </div>
  </div>

  <div [hidden]="selectedMenu !== 'Valuation'" class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div [hidden]="collateralType !== 'PROPERTY'" class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-valuation-real-estate
          [item]="collateralProperty"
          [generalInfo]="collateral"
        ></jhi-collateral-appraisal-valuation-real-estate>
      </div>
      <div [hidden]="collateralType !== 'VEHICLE'" class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-valuation-kendaraan
          [item]="collateralProperty"
          [generalInfo]="collateral"
        ></jhi-collateral-appraisal-valuation-kendaraan>
      </div>
      <div [hidden]="collateralType !== 'MACHINE'" class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-valuation-mesin
          [item]="collateralProperty"
          [generalInfo]="collateral"
        ></jhi-collateral-appraisal-valuation-mesin>
      </div>
    </div>
  </div>

  <div
    *ngIf="selectedMenu === 'Negative Collateral' && collateralType === 'PROPERTY'"
    class="e-sample-resize-container e-card-resize-container"
  >
    <div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
      <div class="row">
        <jhi-collateral-appraisal-negative-collateral
          [item]="collateralAppraisal.attributes['scoreCard']"
          (criteriaEvent)="addNewCriteria($event)"
        ></jhi-collateral-appraisal-negative-collateral>
      </div>
    </div>
  </div>

  <div [hidden]="selectedMenu !== 'Comparison Data'" class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-comparison [collateralId]="collateralAppraisal.collateralId"></jhi-collateral-appraisal-comparison>
      </div>
    </div>
  </div>

  <div [hidden]="selectedMenu !== 'Foto Object Jaminan'" class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-process [appraisalId]="collateralAppraisal.id"></jhi-collateral-appraisal-process>
      </div>
    </div>
  </div>

  <div *ngIf="selectedMenu === 'Summary'" class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-lg-12 col-md-12">
        <jhi-collateral-appraisal-summary></jhi-collateral-appraisal-summary>
      </div>
    </div>
  </div>
</div>

<div class="d-flex justify-content-center mt-1">
  <button style="margin-right: 25px" color="primary" mat-raised-button *ngFor="let task of tasks" (click)="processTask(task)">
    {{ task.caption }}
  </button>
  <jhi-button typeB="info" (clickEv)="onSave()"></jhi-button>
</div>
