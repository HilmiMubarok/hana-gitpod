<div class="e-card mb-3">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Proposal/Appraisal Info</div>
    </div>
  </div>
  <div class="e-card-content">
    <section class="mt-3">
      <ejs-textbox
        cssClass="e-outline"
        placeholder="No Request Appraisal"
        floatLabelType="Always"
        [(ngModel)]="surveyAppraisal.appraisalNumber"
        disabled
      ></ejs-textbox>
    </section>
    <section class="mt-3">
      <ejs-textbox
        cssClass="e-outline"
        placeholder="Tgl Request"
        floatLabelType="Always"
        [(ngModel)]="surveyAppraisal.createdDate"
        disabled
      ></ejs-textbox>
    </section>
    <section class="mt-3">Jenis Permohonan</section>
    <section class="mt-2">
      <ejs-checkbox
        label="Renewal"
        value="renewal"
        [(ngModel)]="surveyAppraisal.jpRenewal"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
      <ejs-checkbox
        class="ml-2"
        label="New"
        value="new"
        [(ngModel)]="surveyAppraisal.jpNew"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
      <ejs-checkbox
        class="ml-2"
        label="Additional"
        value="additional"
        [(ngModel)]="surveyAppraisal.jpAdditional"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
      <ejs-checkbox
        class="ml-2"
        label="Progress"
        value="progress"
        [(ngModel)]="surveyAppraisal.jpProgress"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
      <ejs-checkbox class="ml-2" label="Reapraisal" value="reappraisal" [disabled]="!isEnableKhususPerpanjanganSub"> </ejs-checkbox>
      <ejs-checkbox
        class="ml-2"
        label="Other"
        value="other"
        [(ngModel)]="surveyAppraisal.jpOther"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-checkbox>
    </section>
    <section class="mt-3">Jenis Object</section>
    <section class="mt-2">
      <ejs-radiobutton
        label="Object Lama"
        value="object_lama"
        [(ngModel)]="surveyAppraisal.attributes['jenisObject']"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-radiobutton>
      <ejs-radiobutton
        label="Object Baru"
        value="object_baru"
        [(ngModel)]="surveyAppraisal.attributes['jenisObject']"
        [disabled]="!isEnableKhususPerpanjanganSub"
      ></ejs-radiobutton>
    </section>
  </div>
</div>

<div class="e-card mb-3">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Khusus Perpanjangan</div>
      <div class="e-card-sub-title"></div>
    </div>
  </div>
  <div class="e-card-content">
    <section class="mt-3">
      <ejs-numerictextbox
        cssClass="e-outline"
        placeholder="Total Plafond"
        floatLabelType="Auto"
        [(ngModel)]="surveyAppraisal.totalPlafond"
        format="IDR 0,"
        min="0"
        [enabled]="isEnableKhususPerpanjanganSub"
      >
      </ejs-numerictextbox>
    </section>
    <section class="mt-3">
      <ejs-datepicker
        cssClass="e-outline"
        placeholder="Tanggal Jatuh Tempo"
        floatLabelType="Auto"
        [(ngModel)]="surveyAppraisal.tglJatuhTempo"
        [enabled]="isEnableKhususPerpanjanganSub"
      ></ejs-datepicker>
    </section>
  </div>
</div>

<div class="e-card">
  <div class="e-card-header mb-1">
    <div class="e-card-header-caption">
      <div class="e-card-header-title">Tipe Officer Appraisal</div>
    </div>
  </div>
  <div class="e-card-content">
    <section class="mt-3">Assign To:</section>
    <section class="mt-2">
      <ejs-radiobutton
        label="External"
        value="external"
        [(ngModel)]="surveyAppraisal.apprOfficer"
        (change)="selectTipeOfficerAppraisal($event)"
      ></ejs-radiobutton>
      <ejs-radiobutton
        label="Internal"
        value="internal"
        [(ngModel)]="surveyAppraisal.apprOfficer"
        (change)="selectTipeOfficerAppraisal($event)"
      ></ejs-radiobutton>

      <!--<ejs-radiobutton
		label="External"
		value="external"
		[(ngModel)]="surveyAppraisal.apprOfficer"
		disabled="true"
	  ></ejs-radiobutton>
	  <ejs-radiobutton
		label="Internal"
		value="internal"
		[(ngModel)]="surveyAppraisal.apprOfficer"
		disabled="true"
      ></ejs-radiobutton>-->
    </section>
    <section [hidden]="isRoleRM" class="mt-3">
      <section class="mt-2" [hidden]="surveyAppraisal.apprOfficer !== 'external'">
        <ejs-dropdownlist
          floatLabelType="Always"
          [dataSource]="kjppIndependentAppraisal"
          [fields]="kjppIndependentAppraisalFields"
          placeholder="KJPP / Independent Appraisal"
          [(value)]="kjppIndependentAppraisalValue"
          (change)="selectKJPPIndependent($event)"
          [enabled]="isRoleAA"
          required
        >
        </ejs-dropdownlist>
        <ejs-dropdownlist
          floatLabelType="Always"
          [dataSource]="cities"
          [fields]="wilayahKotaFields"
          placeholder="Wilayah / Kota"
          [(value)]="wilayahKotaExternalValue"
          (change)="selectWilayahKota($event)"
          [enabled]="isRoleAA"
          required
        >
        </ejs-dropdownlist>
        <ejs-dropdownlist
          floatLabelType="Always"
          [dataSource]="teamReviewer"
          [fields]="teamReviewerFields"
          placeholder="Team Reviewer"
          [(value)]="teamReviewerValue"
          (change)="selectTeamReviewer($event)"
          [enabled]="isRoleAA"
          required
        >
        </ejs-dropdownlist>
      </section>
      <section class="mt-2" [hidden]="surveyAppraisal.apprOfficer !== 'internal'">
        <div class="form-group">
          <ejs-dropdownlist
            #ddPropoertyUsage
            floatLabelType="Auto"
            (change)="selectWilayahKota($event)"
            [dataSource]="cities"
            [fields]="wilayahKotaFields"
            [(ngModel)]="surveyAppraisal.surveyorArea"
            cssClass="e-outline"
            placeholder="Wilayah/kota"
            popupHeight="220px"
            [enabled]="isRoleAA"
            required
          >
          </ejs-dropdownlist>
        </div>
        <div class="form-group">
          <ejs-dropdownlist
            #ddPropoertyUsage
            floatLabelType="Auto"
            [dataSource]="surveyors"
            [fields]="officerAppraisalFields"
            [(ngModel)]="surveyAppraisal.surveyorId"
            cssClass="e-outline"
            placeholder="Officer Appraisal"
            popupHeight="220px"
            [enabled]="isRoleAA"
            required
          >
          </ejs-dropdownlist>
        </div>
      </section>
    </section>
  </div>
</div>
