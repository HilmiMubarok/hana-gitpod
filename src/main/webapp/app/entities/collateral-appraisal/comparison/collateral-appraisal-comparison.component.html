<div class="e-card mb-3">
  <!-- <button mat-raised-button color="primary" (click)="print()">print</button> -->
  <table mat-table style="width: 100%" [dataSource]="collateralProperties" class="mat-elevation-z8">
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef>No</th>
      <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
    </ng-container>
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element">{{ element.attributes.comparison?.nameFile }}</td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button (click)="edit(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button [disabled]="hideordisable()" (click)="deleteCpRealEstate(element)">
          <mat-icon [hidden]="hideordisable()">delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
    </tr>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <div class="d-flex justify-content-end mb-3 mt-3 text-center">
    <button mat-raised-button class="button-styling" [hidden]="hideordisable()" (click)="openDialog()">New</button>
  </div>
</div>
<!-- </section> -->
