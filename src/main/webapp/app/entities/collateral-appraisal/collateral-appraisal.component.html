<div id="action-description"></div>
<div class="control-section">
  <!-- <ejs-grid #Grid id='Grid' [dataSource]="dataUtama" [childGrid]='childGrid'>
      <e-columns> -->
  <ejs-grid #Grid id="Grid" [childGrid]="childGrid">
    <e-columns>
      <e-column field="id" headerText="No" width="50" textAlign="center"></e-column>
      <e-column field="noCif" headerText="NO CIF" width="140" textAlign="center"></e-column>
      <e-column field="nik" headerText="NIK / No Akte" width="170" textAlign="center"></e-column>
      <e-column field="namaDebitur" headerText="Nama Debitur" width="170" textAlign="center"></e-column>
      <e-column field="tipe" headerText="Tipe Debitur" width="170" textAlign="center"></e-column>
      <e-column field="segmenProduct" headerText="Segmen Product" width="120" format="yMd" textAlign="center"> </e-column>
      <e-column field="status" headerText="Status" width="120" textAlign="center"></e-column>
      <e-column field="Action" headerText="Action" width="120" textAlign="center"></e-column>
    </e-columns>
  </ejs-grid>
</div>
