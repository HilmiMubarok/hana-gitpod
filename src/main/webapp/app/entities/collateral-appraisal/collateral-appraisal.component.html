<div class="row">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Collateral Appraisal" url="/collateral-appraisal"></e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title">Collateral Appraisal</p>
        </div>
      </div>
    </div>
    <div class="e-card-content">
      <div class="e-card">
        <ejs-toolbar #toolBar cssClass="e-outline">
          <e-items>
            <e-item *ngFor="let statusCode of statusCodes">
              <ng-template #template>
                <ejs-chiplist id="chipStatus">
                  <e-chips>
                    <e-chip [text]="statusCode.label"></e-chip>
                  </e-chips>
                </ejs-chiplist>
              </ng-template>
            </e-item>
          </e-items>
        </ejs-toolbar>
        <div class="search-border-container mt-3">
          <div class="row">
            <div class="col-6">
              <ejs-multiselect
                [mode]="box"
                [dataSource]="filterData"
                [fields]="filterFields"
                [allowFiltering]="true"
                [placeholder]="filterPlaceholder"
                (filtering)="onFiltering($event)"
                (tagging)="onTagging($event)"
                (removed)="onRemoved($event)"
              ></ejs-multiselect>
            </div>
            <div class="col-3"></div>
            <div class="col-3">
              <ejs-textbox
                #searchTextBox
                cssClass="e-outline"
                placeholder="Search"
                floatLabelType="auto"
                (created)="onCreateSearchTextBox()"
              ></ejs-textbox>
            </div>
          </div>
        </div>
      </div>

      <div class="e-card">
        <ejs-grid
          #Grid
          id="Grid"
          [dataSource]="items | async"
          [pageSettings]="pageSettings"
          [allowPaging]="true"
          (dataStateChange)="dataStateChange($event)"
        >
          <e-columns>
            <e-column field="indexNum" headerText="No" headerTextAlign="center" textAlign="right"></e-column>
            <e-column field="cif.customerId" headerText="No CIF" headerTextAlign="center" textAlign="left"></e-column>
            <e-column field="appraisalNumber" headerText="No Request Appraisal" headerTextAlign="center" textAlign="left"></e-column>
            <e-column field="fromDate" headerText="Tanggal Request Appraisal" headerTextAlign="center" textAlign="right"></e-column>
            <e-column field="cif.name" headerText="Nama Debitur" headerTextAlign="center" textAlign="left"></e-column>
            <e-column
              field="collateral.collateralTypeDescription"
              headerText="Jenis Jaminan"
              headerTextAlign="center"
              textAlign="left"
            ></e-column>
            <e-column field="" headerText="Alamat Jaminan" headerTextAlign="center" textAlign="left"></e-column>
            <e-column field="" headerText="Kota" headerTextAlign="center" textAlign="left"></e-column>
            <e-column field="" headerText="Jenis Permohonan" headerTextAlign="center" textAlign="left"></e-column>
            <e-column field="" headerText="Tipe Officer Appraisal" headerTextAlign="center" textAlign="left"></e-column>
            <e-column headerText="Status" headerTextAlign="center" textAlign="center" [template]="templateStatus"></e-column>
            <e-column headerText="Action" headerTextAlign="center" textAlign="center" [template]="templateAction"></e-column>
          </e-columns>
        </ejs-grid>
        <ng-template #templateStatus let-data>
          <ejs-chiplist id="chipStatusGrid" [text]="data.statusDescription"></ejs-chiplist>
        </ng-template>
        <ng-template #templateAction let-data>
          <button type="button" [routerLink]="['/collateral-appraisal', data.id, 'edit']" class="flat-button">
            <fa-icon icon="pencil-alt"></fa-icon>
          </button>
        </ng-template>
      </div>
    </div>
    <div *jhiHasAnyAuthority="['ROLE_USER', 'ROLE_ADMIN', 'ROLE_RM']" class="e-card-actions">
      <div class="d-flex justify-content-center mb-3 mt-3">
        <button class="button-info" (click)="goToEdit()">Add Request Appraisal</button>
      </div>
    </div>
  </div>
</div>
