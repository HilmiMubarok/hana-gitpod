<mat-card>
  <mat-card-header>
    <mat-card-title>Valuation</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <jhi-collateral-appraisal-valuation-machine
      *ngIf="collateral.collateralTypeId === 'MACHINE'"
      [collateral]="collateral"
    ></jhi-collateral-appraisal-valuation-machine>
    <jhi-collateral-appraisal-valuation-property
      *ngIf="collateral.collateralTypeId === 'REALESTATE' || collateral.collateralTypeId === 'PROPERTY'"
      [collateral]="collateral"
    ></jhi-collateral-appraisal-valuation-property>
    <jhi-collateral-appraisal-valuation-vehicle
      *ngIf="collateral.collateralTypeId === 'VEHICLE'"
      [collateral]="collateral"
    ></jhi-collateral-appraisal-valuation-vehicle>
  </mat-card-content>
</mat-card>
