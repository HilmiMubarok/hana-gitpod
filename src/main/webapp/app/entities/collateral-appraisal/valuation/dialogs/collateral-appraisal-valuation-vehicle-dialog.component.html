<section *jhiMatrixDir="collateralAppraisal.statusId; menu: 'collateral-appraisal'; subMenu: ''; elementType: 'input'">
  <div class="style-close">
    <button class="button-close" mat-button mat-dialog-close>X</button>
  </div>
  <h2 mat-dialog-title class="header-title">Vehicle Detail</h2>
  <mat-dialog-content>
    <mat-card>
      <mat-card-content>
        <div class="row">
          <div class="col-12">
            <section class="mt-3">
              <ejs-textbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.vehModel"
                type="text"
                placeholder="Collateral Object"
                floatLabelType="auto"
              >
              </ejs-textbox>
              <!-- <mat-form-field class="w-100" appearance="outline">
                <mat-label>Collateral Object</mat-label>
                <input matInput type="text" [(ngModel)]="collateralProp.vehModel" disabled />
              </mat-form-field> -->
            </section>
            <section class="mt-3">
              <ejs-numerictextbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.vehicleMarketValue"
                placeholder="Market Value (MV)"
                floatLabelType="auto"
                format="IDR 0,"
                min="0"
                required
              >
              </ejs-numerictextbox>
              <!-- <mat-form-field class="w-100" appearance="outline">
                <mat-label>Market Value (MV)</mat-label>
                <input matInput type="number" [(ngModel)]="collateralProp.vehicleMarketValue" />
              </mat-form-field> -->
            </section>
            <section class="mt-3">
              <ejs-textbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.vehiclePercentage"
                type="number"
                placeholder="Percentage"
                floatLabelType="auto"
                required
              >
              </ejs-textbox>
              <!-- <mat-form-field class="w-100" appearance="outline">
                <mat-label>Percentage</mat-label>
                <input matInput type="number" [(ngModel)]="collateralProp.vehiclePercentage" />
              </mat-form-field> -->
            </section>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </mat-dialog-content>
  <mat-dialog-actions align="center">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-button (click)="save()">Save</button>
  </mat-dialog-actions>
</section>
