              placeholder="Bangunan" floatLabelType="auto" readonly>
            </ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Bangunan</mat-label>
              <input matInput type="number" [(ngModel)]="collateralProp.buildingSpec" disabled />
            </mat-form-field> -->
          </section>
          <section class="mt-3">
            <ejs-textbox cssClass="e-outline" [(ngModel)]="collateralProp.propertyMarketValuePerMeter" type="number"
              placeholder="Market Value Per Meter" floatLabelType="auto" required>
            </ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
                <mat-label>Market Value Per Meter</mat-label>
                <input matInput type="number" [(ngModel)]="collateralProp.propertyMarketValuePerMeter" />
              </mat-form-field> -->
          </section>
          <section class="mt-3">
            <ejs-textbox cssClass="e-outline" [(ngModel)]="collateralProp.propertyMarketValue" type="number"
              placeholder="Market Value" floatLabelType="auto" required>
            </ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Market Value</mat-label>
              <input matInput type="number" [(ngModel)]="collateralProp.propertyMarketValue" />
            </mat-form-field> -->
          </section>
          <div class="mt-3">
            <ejs-textbox cssClass="e-outline" [(ngModel)]="collateralProp.propertyPercentage" type="number"
              placeholder="Percentage" floatLabelType="auto" required>
            </ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Percentage</mat-label>
              <input matInput type="number" required [(ngModel)]="collateralProp.propertyPercentage" />
            </mat-form-field> -->
          </div>

          <section class="mt-3">
            <ejs-textbox cssClass="e-outline" [(ngModel)]="collateralProp.propertyMarketValueIMBPerMeter" type="number"
              placeholder="Market Value IMB Per Meter" floatLabelType="auto">
            </ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">

            </mat-form-field> -->

            <ejs-textbox cssClass="e-outline" [(ngModel)]="collateralProp.propertyPercentageIMB" type="number"
              placeholder="Percentage IMB" floatLabelType="auto">
            </ejs-textbox>
            <!-- <mat-form-field class="w-100" appearance="outline">

<mat-dialog-actions align="center">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button (click)="save()">Save</button>
</mat-dialog-actions>
