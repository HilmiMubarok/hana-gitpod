<section *jhiMatrixDir="collateralAppraisal.statusId; menu: 'collateral-appraisal'; subMenu: ''; elementType: 'input'">
  <h2 mat-dialog-title class="header-title">Property Detail</h2>
  <mat-dialog-content>
    <mat-card>
      <mat-card-content>
        <div class="row">
          <div class="col-12">
            <section class="mt-3">
              <div *ngIf="collateralProp.propertyType === 'LAND'">
                <ejs-textbox
                  cssClass="e-outline"
                  [(ngModel)]="collateralProp.description"
                  type="text"
                  placeholder=" Collateral Object "
                  floatLabelType="auto"
                  readonly
                  disabled
                >
                </ejs-textbox>
              </div>
              <div *ngIf="collateralProp.propertyType === 'BUILDING'">
                <ejs-textbox
                  cssClass="e-outline"
                  [(ngModel)]="collateralProp.buildingSpec"
                  type="text"
                  placeholder=" Collateral Object "
                  floatLabelType="auto"
                  readonly
                  disabled
                >
                </ejs-textbox>
              </div>
              <!-- <mat-form-field class="w-100" appearance="outline">
              <mat-label>Bangunan</mat-label>
              <input matInput type="number" [(ngModel)]="collateralProp.buildingSpec" disabled />
            </mat-form-field> -->
            </section>
            <section class="mt-3">
              <ejs-numerictextbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.propertyMarketValuePerMeter"
                placeholder="Market Value Per Meter"
                floatLabelType="auto"
                format="IDR 0,"
                min="0"
                required
                [disabled]="hideordisable()"
              >
              </ejs-numerictextbox>
              <!-- <mat-form-field class="w-100" appearance="outline">
                <mat-label>Market Value Per Meter</mat-label>
                <input matInput type="number" [(ngModel)]="collateralProp.propertyMarketValuePerMeter" />
              </mat-form-field> -->
            </section>
            <section class="mt-3">
              <div *ngIf="collateralProp.propertyType === 'LAND'">
                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="collateralProp.landSizePerCertificate * collateralProp.propertyMarketValuePerMeter"
                  [(ngModel)]="collateralProp.propertyMarketValue"
                  placeholder="Market Value"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  disabled
                >
                </ejs-numerictextbox>
              </div>
              <div *ngIf="collateralProp.propertyType === 'BUILDING'">
                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="countTotalArea() * collateralProp.propertyMarketValuePerMeter"
                  [(ngModel)]="collateralProp.propertyMarketValue"
                  placeholder="Market Value"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  disabled
                >
                </ejs-numerictextbox>
              </div>
            </section>
            <div class="mt-3">
              <ejs-textbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.propertyPercentage"
                placeholder="Percentage"
                floatLabelType="auto"
                format="IDR 0,"
                min="0"
                required
                [disabled]="hideordisable()"
              >
              </ejs-textbox>
            </div>

            <section class="mt-3">
              <ejs-numerictextbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.propertyMarketValueIMBPerMeter"
                placeholder="Market Value IMB Per Meter"
                floatLabelType="auto"
                format="IDR 0,"
                min="0"
                required
                [disabled]="hideordisable()"
              >
              </ejs-numerictextbox>
            </section>
            <div class="mt-3" *ngIf="collateralProp.propertyType === 'LAND'">
              <ejs-numerictextbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.landSizePerCertificate"
                placeholder="Area IMB"
                floatLabelType="auto"
                format="IDR 0,"
                min="0"
                required
                disabled
                hidden
              >
              </ejs-numerictextbox>
            </div>
            <div class="mt-3" *ngIf="collateralProp.propertyType === 'BUILDING'">
              <ejs-numerictextbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.imbArea"
                placeholder="Area IMB"
                floatLabelType="auto"
                format="0"
                min="0"
                required
                disabled
                hidden
              >
              </ejs-numerictextbox>
            </div>
            <!-- [value]="collateralProp.landSizePerCertificate * collateralProp.propertyMarketValueIMBPerMeter" -->

            <section class="mt-3">
              <div *ngIf="collateralProp.propertyType === 'LAND'">
                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="calTotalmarket()"
                  [(ngModel)]="collateralProp.propertyMarketValueIMB"
                  placeholder="Market Value (MV) IMB"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  hidden
                >
                </ejs-numerictextbox>
              </div>

              <div *ngIf="collateralProp.propertyType === 'BUILDING'">
                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="calTotalmarketIMBBuilding()"
                  [(ngModel)]="collateralProp.propertyMarketValueIMB"
                  placeholder="Market Value (MV) IMB"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  disabled
                  hidden
                >
                </ejs-numerictextbox>
              </div>
            </section>

            <section class="mt-3">
              <ejs-textbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.propertyPercentageIMB"
                type="number"
                placeholder="Percentage IMB"
                floatLabelType="auto"
                [disabled]="hideordisable()"
              >
              </ejs-textbox>
            </section>
            <section class="mt-3">
              <div *ngIf="collateralProp.propertyType === 'LAND'">
                <!-- [value]="this.collateralProp.imbArea * this.collateralProp.propertyMarketValueIMBPerMeter" -->

                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="collateralProp.propertyMarketValueIMB * (collateralProp.propertyPercentageIMB / 100)"
                  [(ngModel)]="collateralProp.totalLiquid"
                  placeholder="Liquid Value Indication IMB"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  disabled
                  hidden
                >
                </ejs-numerictextbox>
              </div>

              <div *ngIf="collateralProp.propertyType === 'BUILDING'">
                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="collateralProp.propertyMarketValueIMB * (collateralProp.propertyPercentageIMB / 100)"
                  placeholder="Liquid Value Indication IMB"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  disabled
                  hidden
                >
                </ejs-numerictextbox>
              </div>
            </section>

            <section class="mt-3">
              <ejs-numerictextbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.propertyMarketValueTataKotaPerMeter"
                placeholder="Market Value Tata Kota Per Meter"
                floatLabelType="auto"
                format="IDR 0,"
                min="0"
                required
                [disabled]="hideordisable()"
              >
              </ejs-numerictextbox>
            </section>
            <section class="mt-3">
              <div *ngIf="collateralProp.propertyType === 'LAND'">
                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="calTotalmarketTataKotaLand()"
                  [(ngModel)]="collateralProp.propertyMarketValueTataKota"
                  placeholder="Market Value Tata Kota"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  hidden
                >
                </ejs-numerictextbox>
              </div>
              <div *ngIf="collateralProp.propertyType === 'BUILDING'">
                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="calTotalmarketTataKotaBuilding()"
                  [(ngModel)]="collateralProp.propertyMarketValueTataKota"
                  placeholder="Market Value Tata Kota"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  disabled
                  hidden
                >
                </ejs-numerictextbox>
              </div>
            </section>
            <section class="mt-3">
              <ejs-textbox
                cssClass="e-outline"
                [(ngModel)]="collateralProp.propertyPercentageTataKota"
                type="number"
                placeholder="Percentage Tata Kota"
                floatLabelType="auto"
                [disabled]="hideordisable()"
              >
              </ejs-textbox>
            </section>
            <section class="mt-3">
              <div *ngIf="collateralProp.propertyType === 'LAND'">
                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="collateralProp.propertyMarketValueTataKota * (collateralProp.propertyPercentageTataKota / 100)"
                  [(ngModel)]="collateralProp.totalLiquid"
                  placeholder="Liquid Value Indication TataKota"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  disabled
                  hidden
                >
                </ejs-numerictextbox>
              </div>

              <div *ngIf="collateralProp.propertyType === 'BUILDING'">
                <ejs-numerictextbox
                  cssClass="e-outline"
                  [value]="collateralProp.propertyMarketValueTataKota * (collateralProp.propertyPercentageTataKota / 100)"
                  placeholder="Liquid Value Indication TataKota"
                  floatLabelType="auto"
                  format="IDR 0,"
                  min="0"
                  disabled
                  hidden
                >
                </ejs-numerictextbox>
              </div>
            </section>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </mat-dialog-content>
  <mat-dialog-actions align="center">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-button [disabled]="hideordisable()" (click)="save()">Save</button>
  </mat-dialog-actions>
</section>
