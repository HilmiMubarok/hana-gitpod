<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="collateralProperties" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="machineName">
        <th mat-header-cell *matHeaderCellDef>Collateral Object</th>
        <td mat-cell *matCellDef="let element">{{ element.machineName }}</td>
      </ng-container>
      <ng-container matColumnDef="brand">
        <th mat-header-cell *matHeaderCellDef>Brand</th>
        <td mat-cell *matCellDef="let element">{{ element.machineMerk }}</td>
      </ng-container>
      <ng-container matColumnDef="madeBy">
        <th mat-header-cell *matHeaderCellDef>Made By</th>
        <td mat-cell *matCellDef="let element">{{ element.machineMadeBy }}</td>
      </ng-container>
      <ng-container matColumnDef="mfgDate">
        <th mat-header-cell *matHeaderCellDef>MFG Date</th>
        <td mat-cell *matCellDef="let element">{{ element.stnkNum | formatMediumDate }}</td>
      </ng-container>
      <ng-container matColumnDef="marketValue">
        <th mat-header-cell *matHeaderCellDef>Market Value</th>
        <td mat-cell *matCellDef="let element"></td>
      </ng-container>
      <ng-container matColumnDef="liquidVal">
        <th mat-header-cell *matHeaderCellDef>Chassis Number</th>
        <td mat-cell *matCellDef="let element"></td>
      </ng-container>
      <ng-container matColumnDef="percentage">
        <th mat-header-cell *matHeaderCellDef>Machine Number</th>
        <td mat-cell *matCellDef="let element"></td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
