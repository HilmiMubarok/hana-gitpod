<div class="row">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-content">
          <div class="card-border">
            <ejs-grid [dataSource]="items">
              <e-columns>
                <e-column field="indexNum" headerText="No" width="50" textAlign="center"></e-column>
                <e-column field="collObj" headerText="Collateral Object" width="140" textAlign="center"></e-column>
                <e-column field="areaM2" headerText="Area (M2)" width="170" textAlign="center"></e-column>
                <e-column field="marketValM2" headerText="Market Value / m2" width="170" textAlign="center"></e-column>
                <e-column field="marketValMv" headerText="Market Value / MV" width="140" textAlign="center"></e-column>
                <e-column field="percentageVal" headerText="Percentage" width="170" textAlign="center"></e-column>
                <e-column
                  field="ttlLandLiqValIndication"
                  headerText="Liquidation Value Indication"
                  width="170"
                  textAlign="center"
                ></e-column>
                <e-column headerText="Action" width="150" textAlign="Center">
                  <ng-template #template let-data>
                    <button pButton type="button" (click)="onEdit(data)" class="flat-button">
                      <fa-icon icon="pencil-alt"></fa-icon>
                    </button>
                    <button pButton type="button" (click)="onDelete(data)" class="flat-button">
                      <fa-icon icon="trash-alt"></fa-icon>
                    </button>
                  </ng-template>
                </e-column>
              </e-columns>
            </ejs-grid>
            <div class="d-flex justify-content-end mt-3">
              <button ejs-button class="btn-info" (click)="onAdd()">Add</button>
            </div>
          </div>
          <div class="card-border">
            <span class="title-header mb-3">Total Penilaian Tanah</span>
            <div class="row justify-content-between mb-3">
              <div class="col-6">
                <div class="form-space">
                  <ejs-textbox placeholder="Total Market Value (MV) Land" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                </div>
                <div class="form-space">
                  <ejs-textbox
                    placeholder="Total Liquidation Value Indication Land"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  ></ejs-textbox>
                </div>
                <div class="form-space">
                  <ejs-textbox placeholder="Total Market Value (MV) Land Rounding" floatLabelType="Auto" cssClass="e-outline"></ejs-textbox>
                </div>
                <div class="form-space">
                  <ejs-textbox
                    placeholder="Total Liquidation Value Indication Land Rounding"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  ></ejs-textbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-space">
                  <ejs-textbox placeholder="Total Market Value (MV) Building" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
                </div>
                <div class="form-space">
                  <ejs-textbox
                    placeholder="Total Liquidation Value Indication Building"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  ></ejs-textbox>
                </div>
                <div class="form-space">
                  <ejs-textbox
                    placeholder="Total Market Value (MV) Building Rounding"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  ></ejs-textbox>
                </div>
                <div class="form-space">
                  <ejs-textbox
                    placeholder="Total Liquidation Value Indication Building Rounding"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  ></ejs-textbox>
                </div>
              </div>
            </div>
          </div>
          <!-- card-border -->
          <div class="card-border">
            <span class="title-header mb-3">Total Penilaian Tanah & Bangunan</span>
            <div class="row justify-content-between mb-3">
              <div class="col-6">
                <div class="form-space">
                  <ejs-textbox
                    placeholder="Total Market Value (MV) Land & Building"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  ></ejs-textbox>
                </div>
                <div class="form-space">
                  <ejs-textbox
                    placeholder="Total Liquidation Value Indication Land & Building"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  ></ejs-textbox>
                </div>
              </div>
              <div class="col-6">
                <div class="form-space">
                  <ejs-textbox
                    placeholder="Total Market Value (MV) Land & Building Rounding"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  ></ejs-textbox>
                </div>
                <div class="form-space">
                  <ejs-textbox
                    placeholder="Total Liquidation Value Indication Land & Building Rounding"
                    floatLabelType="Auto"
                    cssClass="e-outline"
                  ></ejs-textbox>
                </div>
              </div>
            </div>
          </div>
          <!-- card-border -->
        </div>
        <div class="e-card-actions"></div>
      </div>
    </div>
  </div>
</div>

<!-- Dialog Add -->
<ejs-dialog
  id="dialog"
  #ejDialog
  isModal="true"
  (overlayClick)="onOverlayAddClick()"
  [animationSettings]="animationSettings"
  [visible]="dialogAddVisible"
  [width]="width"
  [height]="height"
>
  <ng-template #content>
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="row p-3">
        <div class="col-6">
          <ejs-dropdownlist
            [(ngModel)]="collObj"
            cssClass="e-outline"
            #dropdownlist
            [dataSource]="dataDropdown"
            [fields]="fields"
            showClearButton="true"
            placeholder="Collateral Object"
            floatLabelType="Auto"
            popupHeight="220px"
          >
          </ejs-dropdownlist>
          <div class="form-space">
            <ejs-textbox placeholder="Bangunan" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          </div>
          <div class="form-space">
            <ejs-textbox [(ngModel)]="areaM2" placeholder="Area(M2)" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          </div>
          <div class="form-space">
            <ejs-checkbox label="Is There Any IMB Valuation?" labelPosition="Before"></ejs-checkbox>
            <ejs-checkbox label="Is There Any Tata Kota Valuation?" labelPosition="Before"> </ejs-checkbox>
          </div>
        </div>
        <div class="col-6">
          <ejs-textbox [(ngModel)]="marketValM2" placeholder="Market Value / m2" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          <div class="form-space">
            <ejs-textbox [(ngModel)]="marketValMv" placeholder="Market Value / MV" floatLabelType="Auto" cssClass="e-outline">
            </ejs-textbox>
          </div>
          <div class="form-space">
            <ejs-textbox
              [(ngModel)]="ttlLandLiqValIndication"
              placeholder="Indication Value / MV"
              floatLabelType="Auto"
              cssClass="e-outline"
            >
            </ejs-textbox>
          </div>
          <div class="form-space">
            <ejs-textbox [(ngModel)]="percentageVal" placeholder="Precentage" floatLabelType="Auto" cssClass="e-outline"> </ejs-textbox>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
  <ng-template #footerTemplate>
    <div class="d-flex justify-content-end my-2">
      <button ejs-button class="btn-info" (click)="addToGrid($event)">Add</button>
    </div>
  </ng-template>
</ejs-dialog>

      </div>
    </div>
  </ng-template>
</ejs-dialog>
