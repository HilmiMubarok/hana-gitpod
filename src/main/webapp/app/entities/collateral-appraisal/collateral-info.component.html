<mat-card>
  <mat-card-header>
    <mat-card-title>Collateral Info</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-card>
      <mat-card-subtitle>General Info</mat-card-subtitle>
      <mat-card-content>
        <!-- <jhi-collateral-view mode="view" [id]="collateral.id"></jhi-collateral-view> -->
      </mat-card-content>
    </mat-card>
    <mat-card class="mt-3">
      <mat-card-subtitle>Address Info</mat-card-subtitle>
      <mat-card-content>
        <jhi-postal-address-view [item]="collateral.collateralAddress" mode="view"></jhi-postal-address-view>
      </mat-card-content>
    </mat-card>
  </mat-card-content>
</mat-card>

<mat-card class="mt-3">
  <mat-card-content>
    <jhi-collateral-appraisal-process-detail-real-estate
      [collateralId]="collateral.id"
      *ngIf="collateral.collateralTypeId === 'PROPERTY'"
    ></jhi-collateral-appraisal-process-detail-real-estate>

    <jhi-collateral-appraisal-process-detail-unit-condition
      [collateralId]="collateral.id"
      *ngIf="collateral.collateralTypeId === 'VEHICLE'"
    ></jhi-collateral-appraisal-process-detail-unit-condition>
  </mat-card-content>
</mat-card>
