<div class="card">
  <div class="card-body">
    <!--<p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>-->
    <div class="form-group">
      <jhi-textbox nameP="Branch" dataTypeP="string" dataFormatP="empty" [valSP]="branch"></jhi-textbox>
    </div>
    <div class="form-group">
      <jhi-textbox nameP="BM/RM" dataTypeP="string" dataFormatP="empty" [valSP]="bmRm"></jhi-textbox>
    </div>
    <div class="form-group">
      <ejs-dropdownlist
        floatLabelType="Always"
        [dataSource]="segmentProduct"
        [fields]="segmentProductFields"
        placeholder="Select Segment Product"
      ></ejs-dropdownlist>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <h5 class="card-title">Khusus Perpanjangan</h5>
    <div class="form-group">
      <jhi-textbox nameP="Total Plafond" dataTypeP="number" dataFormatP="empty" [valNP]="totalPlafond"></jhi-textbox>
    </div>
    <div class="form-group">
      <p class="label label-default">Tanggal Jatuh Tempo</p>
      <input type="text" name="dueDate" [(ngModel)]="dueDate" />
      <!--<ejs-datepicker></ejs-datepicker>-->
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="form-group">
      <jhi-textbox nameP="No Request Appraisal" dataTypeP="string" dataFormatP="empty" [valSP]="noRequestAppraisal"></jhi-textbox>
    </div>

    <p class="label label-default">Jenis Permohonan</p>
    <div class="form-group">
      <ejs-checkbox class="checkbox-content" label="Renewal"></ejs-checkbox>
      <ejs-checkbox class="checkbox-content" label="New"></ejs-checkbox>
      <ejs-checkbox class="checkbox-content" label="Additional"></ejs-checkbox>
      <ejs-checkbox class="checkbox-content" label="Poogress"></ejs-checkbox>
      <ejs-checkbox class="checkbox-content" label="Reapraisal"></ejs-checkbox>
      <ejs-checkbox class="checkbox-content" label="Other"></ejs-checkbox>
    </div>

    <p class="label label-default">Jenis Object</p>
    <div class="form-group">
      <ejs-radiobutton label="Object Lama"></ejs-radiobutton>
      <ejs-radiobutton label="Object Baru"></ejs-radiobutton>
    </div>

    <div class="form-group">
      <jhi-textbox nameP="Collateral ID" dataTypeP="string" dataFormatP="empty" [valSP]="collateralId"></jhi-textbox>
    </div>

    <p class="label label-default">Tipe Officer Appraisal</p>
    <div class="form-group">
      <ejs-checkbox class="checkbox-content" label="External"></ejs-checkbox>
      <ejs-checkbox class="checkbox-content" label="Internal"></ejs-checkbox>
    </div>

    <div class="form-group">
      <jhi-textbox nameP="Nama Pic" dataTypeP="string" dataFormatP="empty" [valSP]="picName1"></jhi-textbox>
    </div>

    <div class="form-group">
      <jhi-textbox nameP="No Telpon" dataTypeP="string" dataFormatP="empty" [valSP]="teleponNo1"></jhi-textbox>
    </div>

    <div class="form-group">
      <jhi-textbox nameP="Nama Pic" dataTypeP="string" dataFormatP="empty" [valSP]="picName2"></jhi-textbox>
    </div>

    <div class="form-group">
      <jhi-textbox nameP="No Telpon" dataTypeP="string" dataFormatP="empty" [valSP]="teleponNo2"></jhi-textbox>
    </div>

    <p class="label label-default">Assign To:</p>
    <div class="form-group">
      <ejs-dropdownlist
        floatLabelType="Always"
        [dataSource]="kjppIndependentAppraisal"
        [fields]="kjppIndependentAppraisalFields"
        placeholder="KJPP / Independent Appraisal"
      ></ejs-dropdownlist>
      <ejs-dropdownlist
        floatLabelType="Always"
        [dataSource]="wilayahKota"
        [fields]="wilayahKotaFields"
        placeholder="Wilayah / Kota"
      ></ejs-dropdownlist>
      <ejs-dropdownlist
        floatLabelType="Always"
        [dataSource]="teamReviewer"
        [fields]="teamReviewerFields"
        placeholder="Team Reviewer"
      ></ejs-dropdownlist>
    </div>
  </div>
</div>
