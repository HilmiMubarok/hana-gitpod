<div class="row justify-content-between mb-1">
  <div class="col-5 colLeft">
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="row">
        <div class="row card-layout">
          <div class="e-card">
            <div class="e-card-header">
              <div class="e-card-header-caption">
                <div class="e-card-header-title">RM Info</div>
                <div class="e-card-sub-title"></div>
              </div>
            </div>
            <div class="e-card-content">
              <!--<jhi-textbox nameP="Branch" dataTypeP="string" dataFormatP="empty" [valSP]="branch"></jhi-textbox>-->
              <ejs-textbox cssClass="e-outline" placeholder="Branch" floatLabelType="Always" [(ngModel)]="branch"></ejs-textbox>
              <!--<jhi-textbox nameP="Relationship Manager Name" dataTypeP="string" dataFormatP="empty" [valSP]="bmRm"></jhi-textbox>-->
              <ejs-textbox cssClass="e-outline" placeholder="Branch" floatLabelType="Always" [(ngModel)]="bmRm"></ejs-textbox>
              <ejs-dropdownlist
                floatLabelType="Always"
                [dataSource]="segmentProduct"
                [fields]="segmentProductFields"
                placeholder="Select Segment Product"
                [value]="segmentProductValue"
              ></ejs-dropdownlist>
            </div>
            <div class="e-card-actions"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-5 colRight">
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="row">
        <div class="row card-layout">
          <div class="e-card">
            <div class="e-card-header">
              <div class="e-card-header-caption">
                <div class="e-card-header-title">Proposal/Appraisal Info</div>
                <div class="e-card-sub-title"></div>
              </div>
            </div>
            <div class="e-card-content">
              <!--<jhi-textbox nameP="No Request Appraisal" dataTypeP="string" dataFormatP="empty" [valSP]="noRequestAppraisal"></jhi-textbox>-->
              <ejs-textbox cssClass="e-outline" placeholder="Branch" floatLabelType="Always" [(ngModel)]="noRequestAppraisal"></ejs-textbox>
              <div class="e-card-sub-title">Jenis Permohonan</div>
              <div class="form-group">
                <ejs-checkbox label="Renewal" value="renewal" [(ngModel)]="renewalVal"></ejs-checkbox>
                <ejs-checkbox label="New" value="new" [(ngModel)]="newVal"></ejs-checkbox>
                <ejs-checkbox label="Additional" value="additional" [(ngModel)]="additionalVal"></ejs-checkbox>
                <ejs-checkbox label="Progress" value="progress" [(ngModel)]="progressVal"></ejs-checkbox>
                <ejs-checkbox label="Reapraisal" value="reappraisal" [(ngModel)]="reappraisalVal"></ejs-checkbox>
                <ejs-checkbox label="Other" value="other" [(ngModel)]="otherVal"></ejs-checkbox>
              </div>
              <div class="e-card-sub-title">Jenis Object</div>
              <div class="form-group">
                <ejs-radiobutton label="Object Lama" value="objectLama" [(ngModel)]="jenisObject"></ejs-radiobutton>
                <ejs-radiobutton label="Object Baru" value="objectBaru" [(ngModel)]="jenisObject"></ejs-radiobutton>
              </div>
            </div>
            <div class="e-card-actions"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row justify-content-between mb-1">
  <div class="col-5 colLeft">
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="row">
        <div class="row card-layout">
          <div class="e-card">
            <div class="e-card-header">
              <div class="e-card-header-caption">
                <div class="e-card-header-title">Khusus Perpanjangan</div>
                <div class="e-card-sub-title"></div>
              </div>
            </div>
            <div class="e-card-content">
              <jhi-textbox nameP="Total Plafond" dataTypeP="number" dataFormatP="empty" [valNP]="totalPlafond"></jhi-textbox>
              <div class="e-card-sub-title">Tanggal Jatuh Tempo</div>
              <ejs-datepicker></ejs-datepicker>
            </div>
            <div class="e-card-actions"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-5 colRight">
    <div class="e-sample-resize-container e-card-resize-container">
      <div class="row">
        <div class="row card-layout">
          <div class="e-card">
            <div class="e-card-header">
              <div class="e-card-header-caption">
                <div class="e-card-header-title">Tipe Officer Appraisal</div>
                <div class="e-card-sub-title"></div>
              </div>
            </div>
            <div class="e-card-content">
              <div class="form-group">
                <ejs-radiobutton
                  label="External"
                  value="external"
                  [(ngModel)]="tipeOfficerAppraisal"
                  (change)="selectTipeOfficerAppraisal($event)"
                ></ejs-radiobutton>
                <ejs-radiobutton
                  label="Internal"
                  value="internal"
                  [(ngModel)]="tipeOfficerAppraisal"
                  (change)="selectTipeOfficerAppraisal($event)"
                ></ejs-radiobutton>
              </div>
              <div class="e-card-sub-title">Assign To:</div>
              <div [hidden]="tipeOfficerAppraisal !== 'external'" class="form-group">
                <ejs-dropdownlist
                  floatLabelType="Always"
                  [dataSource]="kjppIndependentAppraisal"
                  [fields]="kjppIndependentAppraisalFields"
                  placeholder="KJPP / Independent Appraisal"
                ></ejs-dropdownlist>
                <ejs-dropdownlist
                  floatLabelType="Always"
                  [dataSource]="wilayahKota"
                  [fields]="wilayahKotaFields"
                  placeholder="Wilayah / Kota"
                ></ejs-dropdownlist>
                <ejs-dropdownlist
                  floatLabelType="Always"
                  [dataSource]="teamReviewer"
                  [fields]="teamReviewerFields"
                  placeholder="Team Reviewer"
                ></ejs-dropdownlist>
              </div>
              <div [hidden]="tipeOfficerAppraisal !== 'internal'" class="form-group">
                <ejs-dropdownlist
                  floatLabelType="Always"
                  [dataSource]="wilayahKota"
                  [fields]="wilayahKotaFields"
                  placeholder="Wilayah / Kota"
                ></ejs-dropdownlist>
                <ejs-dropdownlist
                  floatLabelType="Always"
                  [dataSource]="officerAppraisal"
                  [fields]="officerAppraisalFields"
                  placeholder="Officer Appraisal"
                ></ejs-dropdownlist>
              </div>
            </div>
            <div class="e-card-actions"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
