<div class="card-border">
  <p class="title-header">CIF</p>
  <ejs-grid #grid [dataSource]="data">
    <e-columns>
      <e-column field="ID" textAlign="center">
        <ng-template #template let-data>
          <ejs-checkbox (change)="checkDumy()"></ejs-checkbox>
        </ng-template>
      </e-column>
      <e-column field="partyId" headerText="No" textAlign="center"></e-column>
      <e-column field="location" headerText="No CIF" textAlign="center"></e-column>
      <e-column field="country" headerText="Nama Depitur" textAlign="center"></e-column>
      <e-column field="qtySize" headerText="Tipe Depitur" textAlign="center"></e-column>

      <!--<e-column headerText="Action" width="150" textAlign="Center">
        <ng-template #template let-data>
          <div (click)="detailClick()">
            <fa-icon [icon]="faEye"></fa-icon>
          </div>
        </ng-template>
      </e-column>-->
    </e-columns>
  </ejs-grid>
</div>

<div *ngIf="formContent == 'open'">
  <div class="card-border">
    <p class="title-header">Collateral</p>
    <ejs-grid #grid [dataSource]="data">
      <e-columns>
        <e-column field="ID" textAlign="center">
          <ng-template #template let-data>
            <ejs-checkbox (change)="checkDumy()"></ejs-checkbox>
          </ng-template>
        </e-column>
        <e-column field="partyId" headerText="Jenis Detail Jaminan" textAlign="center"></e-column>
        <e-column field="location" headerText="Alamat Jaminan" textAlign="center"></e-column>
        <e-column field="country" headerText="Kota" textAlign="center"></e-column>
        <e-column field="qtySize" headerText="Jenis Object" textAlign="center"></e-column>
        <e-column field="qtySize" headerText="Jenis Permohonan" textAlign="center"></e-column>
        <e-column field="qtySize" headerText="Tipe Officer Appraisal" textAlign="center"></e-column>
        <!--<e-column headerText="Action" width="150" textAlign="Center">
          <ng-template #template let-data>
            <div (click)="detailClick()">
              <fa-icon [icon]="faEye"></fa-icon>
            </div>
          </ng-template>
        </e-column>-->
      </e-columns>
    </ejs-grid>
    <div style="margin-top: 10px" class="mx-3" class="content-right">
      <button ejs-button class="btn-info">Add</button>
    </div>
  </div>
</div>

<!--</div>-->

<ejs-dialog
  id="dialog"
  #ejDialog
  isModal="true"
  (overlayClick)="onOverlayClick()"
  [animationSettings]="animationSettings"
  [visible]="dialogVisible"
  [width]="width"
  [height]="height"
>
  <!--<ng-template #header> </ng-template>-->
  <ng-template #content>
    <div class="dialogContent">
      <jhi-collateral-view mode="view"></jhi-collateral-view>
    </div>
  </ng-template>
</ejs-dialog>
