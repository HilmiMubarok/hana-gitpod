<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.collateralAppraisal.home.viewLabel">Collateral Appraisals</span>
  </h5>
  <p-panel>
    <p-header>
      <span jhiTranslate="losgwApp.collateralAppraisal.detail.title">Collateral Appraisal</span> {{ collateralAppraisal.id }}
    </p-header>
    <jhi-collateral-appraisal-view [item]="collateralAppraisal" mode="item"> </jhi-collateral-appraisal-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/collateral-appraisal', collateralAppraisal.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
