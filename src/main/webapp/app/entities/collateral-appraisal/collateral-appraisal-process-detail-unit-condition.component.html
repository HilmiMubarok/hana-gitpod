<div class="e-sample-resize-container e-card-resize-container">
  <div class="row">
    <div class="row card-layout">
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title"></div>
            <div class="e-card-sub-title"></div>
          </div>
        </div>
        <div class="e-card-content">
          <ejs-grid [dataSource]="items">
            <e-columns>
              <e-column field="indexNum" headerText="No" width="50" textAlign="center"></e-column>
              <e-column field="" headerText="Nama Mesin" width="140" textAlign="center"></e-column>
              <e-column field="" headerText="Tipe Dokumen" width="170" textAlign="center"></e-column>
              <e-column field="" headerText="No Dokumen" width="170" textAlign="center"></e-column>
              <e-column field="" headerText="Tanggal" width="140" textAlign="center"></e-column>
              <e-column field="" headerText="From" width="170" textAlign="center"></e-column>
              <e-column field="" headerText="Amount" width="170" textAlign="center"></e-column>
              <e-column headerText="Action" width="150" textAlign="Center">
                <ng-template #template let-data>
                  <button pButton type="button" (click)="onEdit(data)" class="flat-button">
                    <fa-icon icon="pencil-alt"></fa-icon>
                  </button>
                  <button pButton type="button" (click)="onDelete(data)" class="flat-button">
                    <fa-icon icon="trash-alt"></fa-icon>
                  </button>
                </ng-template>
              </e-column>
            </e-columns>
          </ejs-grid>
          <div class="d-flex justify-content-end">
            <jhi-button typeB="secondary" (clickEv)="add($event)"></jhi-button>
          </div>
        </div>
        <div class="e-card-actions"></div>
      </div>
    </div>
  </div>
</div>

<ejs-dialog
  id="dialog"
  #ejDialog
  isModal="true"
  (overlayClick)="onOverlayClick()"
  [animationSettings]="animationSettings"
  [visible]="dialogVisible"
  [width]="width"
  [height]="height"
>
  <!--<ng-template #header> </ng-template>-->
  <ng-template #content>
    <div class="dialogContent">
      <div class="e-sample-resize-container e-card-resize-container">
        <div class="row">
          <div class="row card-layout">
            <div class="e-card">
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title">Unit Ownership Right</div>
                  <div class="e-card-sub-title"></div>
                </div>
              </div>
              <div class="e-card-content">
                <div class="row justify-content-between">
                  <div class="col-6">
                    <ejs-textbox placeholder="BPKB Number" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-textbox placeholder="In The Name Of" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-textbox placeholder="Vehicle Number" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-textbox placeholder="Year" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                  </div>
                  <div class="col-6">
                    <ejs-textbox placeholder="STNK Number" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-textbox placeholder="Chassis" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-textbox placeholder="Machine Number" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-textbox placeholder="Invoice Number" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                  </div>
                </div>
              </div>
              <div class="e-card-actions"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="e-sample-resize-container e-card-resize-container">
        <div class="row">
          <div class="row card-layout">
            <div class="e-card">
              <div class="e-card-header">
                <div class="e-card-header-caption">
                  <div class="e-card-header-title">Unit Information</div>
                  <div class="e-card-sub-title"></div>
                </div>
              </div>
              <div class="e-card-content">
                <div class="row justify-content-between">
                  <div class="col-6">
                    <ejs-textbox placeholder="Used By" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-combobox placeholder="Brand" cssClass="e-outline"></ejs-combobox>
                    <ejs-combobox placeholder="Type" cssClass="e-outline"></ejs-combobox>
                    <ejs-combobox placeholder="Category" cssClass="e-outline"></ejs-combobox>
                    <ejs-textbox placeholder="Model" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-textbox placeholder="Cylinder" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                  </div>
                  <div class="col-6">
                    <ejs-combobox placeholder="Color" cssClass="e-outline"></ejs-combobox>
                    <ejs-combobox placeholder="Fuel" cssClass="e-outline"></ejs-combobox>
                    <ejs-textbox placeholder="Transmission" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-textbox placeholder="Number Of Wheels" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                    <ejs-textbox placeholder="Unit Condition" cssClass="e-outline" floatLabelType="Auto" multiline="true"></ejs-textbox>
                    <ejs-textbox placeholder="Keterangan" cssClass="e-outline" floatLabelType="Auto"></ejs-textbox>
                  </div>
                </div>
              </div>
              <div class="e-card-actions"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</ejs-dialog>
