<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="organizationLegal">
      <h2 data-cy="organizationLegalDetailsHeading">
        <span jhiTranslate="losgwApp.organizationLegal.detail.title">Organization Legal</span>
      </h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ organizationLegal.id }}</span>
        </dd>
        <dt><span jhiTranslate="losgwApp.organizationLegal.fromDate">From Date</span></dt>
        <dd>
          <span>{{ organizationLegal.fromDate | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="losgwApp.organizationLegal.thruDate">Thru Date</span></dt>
        <dd>
          <span>{{ organizationLegal.thruDate | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="losgwApp.organizationLegal.organizationId">Organization Id</span></dt>
        <dd>
          <span>{{ organizationLegal.organizationId }}</span>
        </dd>
        <dt><span jhiTranslate="losgwApp.organizationLegal.organizationName">Organization Name</span></dt>
        <dd>
          <span>{{ organizationLegal.organizationName }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/organization-legal', organizationLegal.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
  </div>
</div>
