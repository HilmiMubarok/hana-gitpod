<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.organizationLegal.home.viewLabel">Organization Legals</span>

  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.organizationLegal.detail.title">Organization Legal</span> {{ organizationLegal.id }} </p-header>
    <jhi-organization-legal-view [item]="organizationLegal" mode="item"> </jhi-organization-legal-view>

      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">

      <button type="button" [routerLink]="['/organization-legal', organizationLegal.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
