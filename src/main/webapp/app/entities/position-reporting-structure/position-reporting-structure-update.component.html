<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.positionReportingStructure.home.createOrEditLabel">Position Reporting Structures</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{positionReportingStructure.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.positionReportingStructure.fromDate" for="field_fromDate"
                  >From Date</label
                >
                <div class="input-group">
                  <p-calendar
                    inputId="field_fromDate"
                    name="input_fromDate"
                    [(ngModel)]="item.fromDate"
                    dateFormat="dd-mm-yy"
                    [showTime]="false"
                    hourFormat="24"
                    [showSeconds]="true"
                    [showIcon]="true"
                    [hideOnDateTimeSelect]="true"
                    [disabled]="readOnly()"
                  ></p-calendar>
                </div>
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.positionReportingStructure.thruDate" for="field_thruDate"
                  >Thru Date</label
                >
                <div class="input-group">
                  <p-calendar
                    inputId="field_thruDate"
                    name="input_thruDate"
                    [(ngModel)]="item.thruDate"
                    dateFormat="dd-mm-yy"
                    [showTime]="false"
                    hourFormat="24"
                    [showSeconds]="true"
                    [showIcon]="true"
                    [hideOnDateTimeSelect]="true"
                    [disabled]="readOnly()"
                  ></p-calendar>
                </div>
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.positionReportingStructure.relationType" for="field_relationType">Relation Type</label>
                <select
                  class="form-control"
                  id="field_relationType"
                  name="relationType"
                  [(ngModel)]="item.relationTypeId"
                  [disabled]="relationTypeId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="relationTypeOption.id"
                    *ngFor="let relationTypeOption of relationtypes; trackBy: trackRelationTypeById"
                  >
                    {{ relationTypeOption.id }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.positionReportingStructure.positionFrom" for="field_positionFrom">Position From</label>
                <select
                  class="form-control"
                  id="field_positionFrom"
                  name="positionFrom"
                  [(ngModel)]="item.positionFromId"
                  [disabled]="positionFromId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="positionOption.id" *ngFor="let positionOption of positions; trackBy: trackPositionById">
                    {{ positionOption.description }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.positionReportingStructure.positionTo" for="field_positionTo">Position To</label>
                <select
                  class="form-control"
                  id="field_positionTo"
                  name="positionTo"
                  [(ngModel)]="item.positionToId"
                  [disabled]="positionToId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="positionOption.id" *ngFor="let positionOption of positions; trackBy: trackPositionById">
                    {{ positionOption.description }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
