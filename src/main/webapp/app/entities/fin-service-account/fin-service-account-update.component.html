<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.finServiceAccount.home.createOrEditLabel">Fin Service Accounts</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{finServiceAccount.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.finServiceAccount.accountNumber" for="field_accountNumber"
                  >Account Number</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="accountNumber"
                  id="field_accountNumber"
                  [(ngModel)]="item.accountNumber"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.finServiceAccount.description" for="field_description"
                  >Description</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="description"
                  id="field_description"
                  [(ngModel)]="item.description"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.finServiceAccount.sequence" for="field_sequence">Sequence</label>
                <input
                  currencyMask
                  class="form-control"
                  name="sequence"
                  id="field_sequence"
                  [(ngModel)]="item.sequence"
                  [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.finServiceAccount.balance" for="field_balance">Balance</label>
                <input
                  currencyMask
                  class="form-control"
                  name="balance"
                  id="field_balance"
                  [(ngModel)]="item.balance"
                  [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
                  [disabled]="readOnly()"
                />
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.finServiceAccount.accountType" for="field_accountType">Account Type</label>
                <select
                  class="form-control"
                  id="field_accountType"
                  name="accountType"
                  [(ngModel)]="item.accountTypeId"
                  [disabled]="accountTypeId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="accountTypeOption.id" *ngFor="let accountTypeOption of accounttypes; trackBy: trackAccountTypeById">
                    {{ accountTypeOption.description }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.finServiceAccount.internal" for="field_internal">Internal</label>
                <select
                  class="form-control"
                  id="field_internal"
                  name="internal"
                  [(ngModel)]="item.internalId"
                  [disabled]="internalId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="internalOption.id" *ngFor="let internalOption of internals; trackBy: trackInternalById">
                    {{ internalOption.name }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.finServiceAccount.owner" for="field_owner">Owner</label>
                <select
                  class="form-control"
                  id="field_owner"
                  name="owner"
                  [(ngModel)]="item.ownerId"
                  [disabled]="ownerId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">
                    {{ partyOption.name }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.finServiceAccount.status" for="field_status">Status</label>
                <select
                  class="form-control"
                  id="field_status"
                  name="status"
                  [(ngModel)]="item.statusId"
                  [disabled]="statusId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="statusItemOption.id" *ngFor="let statusItemOption of statusitems; trackBy: trackStatusItemById">
                    {{ statusItemOption.description }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
