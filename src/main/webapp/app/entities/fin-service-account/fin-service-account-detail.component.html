<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.finServiceAccount.home.viewLabel">Fin Service Accounts</span>
  </h5>
  <p-panel>
    <p-header>
      <span jhiTranslate="losgwApp.finServiceAccount.detail.title">Fin Service Account</span> {{ finServiceAccount.id }}
    </p-header>
    <jhi-fin-service-account-view [item]="finServiceAccount" mode="item"> </jhi-fin-service-account-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/fin-service-account', finServiceAccount.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
