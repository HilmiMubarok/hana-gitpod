<mat-card>
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">RM and Branch Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-party-cif-customer-info-rm-info [partyCif]="partyCif"></jhi-party-cif-customer-info-rm-info>
    <!-- <jhi-no-record-found *ngIf="!partyCif.rm" moduleName="RM and Branch Info"></jhi-no-record-found> -->
  </mat-card-content>
</mat-card>

<mat-card class="mt-4">
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">Customer Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div>
      This customer type is <span class="fw-bold">{{ partyCif.customerPerson ? 'Individu' : 'Badan Usaha' }}</span>
    </div>
    <div class="row mt-5">
      <div class="col-12">
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Cif</mat-label>
            <input matInput type="text" [value]="partyCif.customerNumber" disabled />
          </mat-form-field>
        </div>
      </div>
    </div>
    <jhi-party-cif-customer-info-person *ngIf="partyCif.customerPerson" [person]="partyCif.customerPerson" mode="edit">
    </jhi-party-cif-customer-info-person>
    <jhi-party-cif-customer-info-party-group
      *ngIf="partyCif.customerOrganization"
      [partyGroup]="partyCif.customerOrganization"
    ></jhi-party-cif-customer-info-party-group>
    <jhi-party-cif-customer-info-debtor-data [customerType]="partyCif.customerType" [partyCif]="partyCif" mode="edit">
    </jhi-party-cif-customer-info-debtor-data>
  </mat-card-content>
</mat-card>

<mat-card class="mt-4">
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">Address Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-party-cif-customer-info-postal-address [partyPostalAddresses]="generalAddress"></jhi-party-cif-customer-info-postal-address>
  </mat-card-content>
</mat-card>

<mat-card class="mt-4">
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">Domicilie Address</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-party-cif-customer-info-postal-address
      [domicileAddress]="'domicileAddress'"
      [partyPostalAddresses]="domicileAddress"
    ></jhi-party-cif-customer-info-postal-address>
  </mat-card-content>
</mat-card>

<mat-card class="mt-4" *ngIf="partyCif.customerType === 'CORPORATE'">
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">Warehouse Address</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-party-cif-customer-info-postal-address
      [warehouseAddress]="'warehouseAddress'"
      [partyPostalAddresses]="warehouseAddress"
    ></jhi-party-cif-customer-info-postal-address>
  </mat-card-content>
</mat-card>

<mat-card class="mt-4" *ngIf="partyCif.customerPerson">
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">Spouse Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-party-cif-customer-info-person
      [spouse]="'spouse'"
      [debtorData]="partyCif.debtorData"
      [person]="partyCif.spouse"
      mode="edit"
    ></jhi-party-cif-customer-info-person>
  </mat-card-content>
</mat-card>
