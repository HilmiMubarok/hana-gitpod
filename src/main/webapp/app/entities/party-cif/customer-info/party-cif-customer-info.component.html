<mat-card>
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">RM and Branch Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-party-cif-customer-info-rm-info *ngIf="partyCif.rm" [person]="partyCif.rm"></jhi-party-cif-customer-info-rm-info>
    <jhi-no-record-found *ngIf="!partyCif.rm" moduleName="RM and Branch Info"></jhi-no-record-found>
  </mat-card-content>
</mat-card>

<mat-card class="mt-4">
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">Customer Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div>
      This customer type is <span class="fw-bold">{{ partyCif.customerPerson ? 'Individu' : 'Badan Usaha' }}</span>
    </div>
    <div class="row mt-5">
      <div class="col-12">
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Cif</mat-label>
            <input matInput type="text" [value]="partyCif.customerNumber" disabled />
          </mat-form-field>
        </div>
      </div>
    </div>
    <jhi-party-cif-customer-info-person *ngIf="partyCif.customerPerson" [person]="partyCif.customerPerson" mode="edit">
    </jhi-party-cif-customer-info-person>
    <jhi-party-cif-customer-info-debtor-data [debtorData]="partyCif.debtorData" mode="edit"> </jhi-party-cif-customer-info-debtor-data>
  </mat-card-content>
</mat-card>

<mat-card class="mt-4">
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">Payment Preference</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <mat-list *ngIf="partyCif.paymentPrefs.length > 0">
      <div *ngFor="let item of partyCif.paymentPrefs; index as i">
        <div mat-subheader class="mb-3">Account number {{ i + 1 }}</div>
        <mat-list-item>
          <jhi-party-payment-pref-view class="w-100" mode="view" [item]="item"></jhi-party-payment-pref-view>
        </mat-list-item>
      </div>
    </mat-list>
  </mat-card-content>
</mat-card>

<mat-card class="mt-4">
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">Address Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-party-cif-customer-info-postal-address [partyPostalAddresses]="partyCif.addresses"></jhi-party-cif-customer-info-postal-address>
  </mat-card-content>
</mat-card>

<mat-card class="mt-4" *ngIf="partyCif.customerPerson">
  <mat-card-header>
    <mat-card-subtitle class="fw-bold">Spouse Info</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-party-cif-customer-info-person [person]="partyCif.spouse" mode="edit"></jhi-party-cif-customer-info-person>
  </mat-card-content>
</mat-card>
