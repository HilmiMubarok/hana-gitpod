<div class="row">
  <!-- LEFT SIDE -->
  <div class="col-6">
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Complete Name</mat-label>
        <input matInput type="text" [(ngModel)]="partyGroup.groupName" [disabled]="dataSource()" />
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Company Type</mat-label>
        <mat-select [(ngModel)]="partyGroup.companyType" [disabled]="dataSource()">
          <mat-option value="">Please Select</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="form-group">
      <div class="row">
        <div class="col-4">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Country Code</mat-label>
            <input matInput type="text" [(ngModel)]="countryCode" [disabled]="dataSource()" />
          </mat-form-field>
        </div>
        <div class="col-8 form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input matInput type="text" [(ngModel)]="phoneNumber" [maxlength]="50" [disabled]="dataSource()" />
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="row">
        <div class="col-4">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Country Code</mat-label>
            <input matInput type="text" [(ngModel)]="countryCode" [disabled]="dataSource()" />
          </mat-form-field>
        </div>
        <div class="col-8 form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input matInput type="text" [(ngModel)]="phoneNumber" [maxlength]="50" [disabled]="dataSource()" />
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>
  <!-- RIGHT SIDE -->
  <div class="col-6">
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>NPWP</mat-label>
        <input matInput type="text" [(ngModel)]="partyGroup.taxIdNumber" [disabled]="dataSource()" />
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Identity Type</mat-label>
        <input matInput type="text" [(ngModel)]="partyGroup.organizationIdType" [disabled]="dataSource()" />
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="text" [(ngModel)]="partyGroup.officeMail" [disabled]="dataSource()" />
      </mat-form-field>
    </div>
  </div>
</div>
