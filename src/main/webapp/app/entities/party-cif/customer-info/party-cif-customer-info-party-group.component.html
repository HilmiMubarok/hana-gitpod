<div class="row">
  <!-- LEFT SIDE -->
  <div class="col-6">
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Complete Name</mat-label>
        <input matInput type="text" [(ngModel)]="partyGroup.groupName" />
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Company Type</mat-label>
        <input matInput type="text" [(ngModel)]="partyGroup.companyType" />
      </mat-form-field>
    </div>
    <div class="form-group">
      <div class="row">
        <div class="col-4">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Country Code</mat-label>
            <input matInput type="text" [(ngModel)]="countryCode" />
          </mat-form-field>
        </div>
        <div class="col-8 form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input matInput type="text" [(ngModel)]="phoneNumber" [maxlength]="50" />
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="row">
        <div class="col-4">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Country Code</mat-label>
            <input matInput type="text" [(ngModel)]="countryCode" />
          </mat-form-field>
        </div>
        <div class="col-8 form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input matInput type="text" [(ngModel)]="partyGroup.otherPhone1" [maxlength]="50" />
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="row">
        <div class="col-4">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Country Code</mat-label>
            <input matInput type="text" [(ngModel)]="countryCode" />
          </mat-form-field>
        </div>
        <div class="col-8 form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input matInput type="text" [(ngModel)]="partyGroup.otherPhone2" [maxlength]="50" />
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>
  <!-- RIGHT SIDE -->
  <div class="col-6">
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>NPWP</mat-label>
        <input matInput type="text" [(ngModel)]="partyGroup.taxIdNumber" />
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Identity Type</mat-label>
        <input matInput type="text" [(ngModel)]="partyGroup.organizationIdType" />
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="text" [(ngModel)]="partyGroup.officeMail" />
      </mat-form-field>
    </div>
  </div>
</div>
