<div class="row mt-3" *ngFor="let item of partyPostalAddresses">
  <div class="col-12">
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Purpose Type</mat-label>
        <mat-select [(ngModel)]="item.purposeTypeId" [disabled]="true">
          <mat-option *ngFor="let item of purposeTypes" [value]="item.id">{{ item.description }} </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Address</mat-label>
        <input matInput type="text" [(ngModel)]="item.address.address1" [disabled]="true" />
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Country</mat-label>
        <mat-select [(ngModel)]="item.address.countryName" [disabled]="true">
          <mat-option [value]="item.address.countryName">{{ item.address.countryName }}</mat-option>
          <!-- <mat-option *ngFor="let item of country" [value]="item.code">{{ item.description}} </mat-option> -->
        </mat-select>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Province</mat-label>
        <mat-select [(ngModel)]="item.address.provinceId" [disabled]="true">
          <mat-option *ngFor="let item of provinces" [value]="item.id">{{ item.description }} </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>City</mat-label>
        <mat-select [(ngModel)]="item.address.cityId" [disabled]="true">
          <mat-option *ngFor="let item of cities" [value]="item.id">{{ item.description }} </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>District</mat-label>
        <mat-select [(ngModel)]="item.address.districtId" [disabled]="true">
          <mat-option *ngFor="let item of districts" [value]="item.id">{{ item.description }} </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="form-group">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Village</mat-label>
        <mat-select [(ngModel)]="item.address.villageId" [disabled]="true">
          <mat-option *ngFor="let item of villages" [value]="item.id">{{ item.description }} </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="row">
      <div class="col-6">
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>RT</mat-label>
            <input matInput type="text" [(ngModel)]="item.address.rt" [disabled]="true" />
          </mat-form-field>
        </div>
      </div>
      <div class="col-6">
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>RW</mat-label>
            <input matInput type="text" [(ngModel)]="item.address.rw" [disabled]="true" />
          </mat-form-field>
        </div>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Kode Pos</mat-label>
          <input matInput type="text" [(ngModel)]="item.address.postalCode" [disabled]="true" />
        </mat-form-field>
      </div>
    </div>
  </div>
</div>
