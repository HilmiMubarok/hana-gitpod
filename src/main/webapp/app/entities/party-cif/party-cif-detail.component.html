<mat-sidenav-container [hasBackdrop]="true" (backdropClick)="triggerToggle()">
  <div class="e-card">
    <div class="e-card-header">
      <div class="e-card-header-caption">
        <ejs-breadcrumb cssClass="margin: 1rem;">
          <e-breadcrumb-items>
            <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
            <e-breadcrumb-item text="Initial Debtor Data" url=""> </e-breadcrumb-item>
          </e-breadcrumb-items>
        </ejs-breadcrumb>
        <div class="header-container">
          <div class="header-content">
            <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
            <span class="back-prefix" (click)="previousState()">Back | </span>
          </div>
          <p class="e-card-sub-title menu-title-class">{{ showTextMenu() }}</p>
        </div>
      </div>
    </div>
    <div style="margin: 1rem">
      <div style="margin-bottom: 1rem">
        <jhi-debtor-information
          [cifNumber]="partyCif.customerPerson ? partyCif.customerNumber : partyCif.customerNumber"
          [customerName]="partyCif.customerPerson ? partyCif.customerPerson.name : partyCif.customerOrganization.name"
        ></jhi-debtor-information>
      </div>
      <div>
        <jhi-party-cif-customer-info *ngIf="clickedMenu === 'customer-info'" [partyCif]="partyCif"> </jhi-party-cif-customer-info>
        <jhi-party-cif-organization-legal
          [partyCif]="partyCif"
          [positionTypeId]="positionTypeId"
          *ngIf="clickedMenu === 'organization-legal'"
        >
        </jhi-party-cif-organization-legal>
        <jhi-party-cif-document-checklist [partyCif]="partyCif" *ngIf="clickedMenu === 'document-checklist'">
        </jhi-party-cif-document-checklist>
        <jhi-party-cif-financial-info [partyCif]="partyCif" *ngIf="clickedMenu === 'financial-info'"> </jhi-party-cif-financial-info>
        <jhi-party-cif-retrive-info [partyCif]="partyCif" *ngIf="clickedMenu === 'retrive-info'"></jhi-party-cif-retrive-info>
        <jhi-party-cif-management-data [partyCif]="partyCif" *ngIf="clickedMenu === 'management-data'"> </jhi-party-cif-management-data>
        <jhi-party-cif-business-group [debtorData]="partyCif.debtorData" *ngIf="clickedMenu === 'business-group'">
        </jhi-party-cif-business-group>
        <jhi-party-cif-collateral-info
          [collateralAppraisal]="collateralAppraisal"
          [partyCif]="partyCif"
          [partyId]="partyCif.partyId"
          [collateralInfo]="collateralInfo"
          *ngIf="clickedMenu === 'collateral-info'"
        >
        </jhi-party-cif-collateral-info>
        <jhi-facility-info-cif
          *ngIf="clickedMenu === 'facility-info'"
          [partyCif]="partyCif"
          [positionTypeId]="positionTypeId"
        ></jhi-facility-info-cif>
        <jhi-credit-rating-view [mode]="'edit'" [partyCif]="partyCif" *ngIf="clickedMenu === 'credit-rating'"> </jhi-credit-rating-view>

        <jhi-debtor-data-slik-summary
          (SendSlikToParty)="getPartySlik($event)"
          [mode]="'edit'"
          [partyCif]="partyCif"
          *ngIf="clickedMenu === 'slik'"
        >
        </jhi-debtor-data-slik-summary>
        <jhi-party-cif-decision-approval-report [mode]="'edit'" [partyCif]="partyCif" *ngIf="clickedMenu === 'decision-approval-report'">
        </jhi-party-cif-decision-approval-report>
      </div>
      <mat-card-actions class="align-button-center" align="center">
        <div class="e-card-actions">
          <div class="d-flex justify-content-center mb-3 mt-3">
            <button
              mat-raised-button
              (click)="save()"
              class="button-styling"
              style="display: flex; justify-content: center; align-items: center; margin-top: 25px !important"
              *ngIf="clickedMenu !== 'credit-rating' && positionTypeId === 'RM'"
            >
              Save
            </button>
          </div>
        </div>
      </mat-card-actions>
    </div>
  </div>
  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav subroute-background" mode="over">
    <div class="header-sub-menu"><label style="margin-top: 1rem">Initial Debtor Data :</label></div>

    <ul class="side-menu">
      <li *ngFor="let item of subMenu" class="list-styling">
        <!--SUBMENU DOESNT HAS A CHILD-->
        <a
          *ngIf="!item.hasOwnProperty('child')"
          href="javascript:void(0)"
          class="text-capitalize"
          (click)="routeSubMenu(item); drawer.toggle(); triggerToggle()"
          >{{ item.text }}</a
        >
        <!--SUBMENU HAS A CHILD-->
        <span class="text-capitalize" *ngIf="item.hasOwnProperty('child')" style="font-weight: 400 !important">{{ item.text }}</span>
        <ul *ngIf="item.hasOwnProperty('child')">
          <li *ngFor="let itemChild of item.child">
            <a href="javascript:void(0)" (click)="routeSubMenu(itemChild); drawer.toggle(); triggerToggle()" class="text-capitalize">{{
              itemChild.text
            }}</a>
          </li>
        </ul>
      </li>
    </ul>
  </mat-sidenav>
</mat-sidenav-container>

  (click)="drawer.toggle(); triggerToggle()"
  matTooltipPosition="after"
>
  <mat-icon class="settings-icon rotating">settings</mat-icon>
</button>
