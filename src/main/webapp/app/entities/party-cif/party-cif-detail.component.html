<mat-sidenav-container [hasBackdrop]="true">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Debtor Data Detail</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div>
        <jhi-party-cif-customer-info *ngIf="clickedMenu === 'customer-info'" [partyCif]="partyCif"> </jhi-party-cif-customer-info>
        <jhi-party-cif-document-checklist *ngIf="clickedMenu === 'document-checklist'"> </jhi-party-cif-document-checklist>
      </div>
    </mat-card-content>
    <mat-card-actions align="center">
      <button
        mat-raised-button
        matTooltip="Click this for back to list of initial debtor data"
        class="btn-lg"
        matTooltipPosition="above"
        (click)="previousState()"
      >
        BACK
      </button>
    </mat-card-actions>
  </mat-card>
  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav" mode="over">
    <div class="p-3" style="padding-top: 90px !important">
      <div style="font-size: 1.5rem; font-weight: 600">Select your destination:</div>
      <ul class="side-menu">
        <li>
          <span>Customer</span>
          <ul>
            <li>
              <a (click)="clickedMenu = 'customer-info'; drawer.toggle()">Customer Info</a>
            </li>
            <li>
              <a (click)="clickedMenu = 'organization-legal'; drawer.toggle()">Organization Legal</a>
            </li>
            <li>
              <a (click)="clickedMenu = 'management-data'; drawer.toggle()">Management / Shareholder / Group</a>
            </li>
          </ul>
        </li>
        <li>
          <a (click)="clickedMenu = 'document-checklist'; drawer.toggle()">Document Checklist</a>
        </li>
        <li>
          <a (click)="clickedMenu = 'facility-info'; drawer.toggle()">Facility Info</a>
        </li>
        <li>
          <a (click)="clickedMenu = 'collateral-info'; drawer.toggle()">Collateral Info</a>
        </li>
        <li>
          <a (click)="clickedMenu = 'financial-info'; drawer.toggle()">Financial Info</a>
        </li>
        <li>
          <a (click)="clickedMenu = 'credit-rating'; drawer.toggle()">Credit Rating</a>
        </li>
        <li>
          <a (click)="clickedMenu = 'slik'; drawer.toggle()">Slik</a>
        </li>
        <li>
          <a (click)="clickedMenu = 'decision-approval-report'; drawer.toggle()">Decision Approval Report</a>
        </li>
      </ul>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
<button
  matTooltip="Click this for show sub menu of initial debtor data"
  style="z-index: 1"
  class="btn-menu-floating"
  (click)="drawer.toggle()"
  mat-fab
  color="warn"
  matTooltipPosition="before"
>
  <mat-icon>more_vert</mat-icon>
</button>
