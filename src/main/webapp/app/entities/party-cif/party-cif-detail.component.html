<mat-sidenav-container [hasBackdrop]="true">
  <div class="row">
    <div class="e-card">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <ejs-breadcrumb cssClass="margin: 1rem;">
            <e-breadcrumb-items>
              <e-breadcrumb-item iconCss="e-icons e-home" url="/"></e-breadcrumb-item>
              <e-breadcrumb-item text="Debtor Data Details" url="/position-type"></e-breadcrumb-item>
            </e-breadcrumb-items>
          </ejs-breadcrumb>
          <div class="header-container">
            <div class="header-content">
              <img class="back-image" src="../../../content/images/back-icon.svg" (click)="previousState()" />
              <span class="back-prefix" (click)="previousState()">Back | </span>
            </div>
            <p class="e-card-sub-title">Debtor Data Details</p>
          </div>
        </div>
      </div>
      <div style="margin: 1rem">
        <div>
          <jhi-party-cif-customer-info *ngIf="clickedMenu === 'customer-info'" [partyCif]="partyCif"> </jhi-party-cif-customer-info>
          <jhi-party-cif-organization-legal [partyCif]="partyCif" *ngIf="clickedMenu === 'organization-legal'">
          </jhi-party-cif-organization-legal>
          <jhi-party-cif-document-checklist [partyCif]="partyCif" *ngIf="clickedMenu === 'document-checklist'">
          </jhi-party-cif-document-checklist>
          <jhi-party-cif-financial-info [partyCif]="partyCif" *ngIf="clickedMenu === 'financial-info'"> </jhi-party-cif-financial-info>
          <jhi-party-cif-retrive-info [partyCif]="partyCif" *ngIf="clickedMenu === 'retrive-info'"></jhi-party-cif-retrive-info>
          <jhi-party-cif-management-data [partyCif]="partyCif" *ngIf="clickedMenu === 'management-data'"> </jhi-party-cif-management-data>
          <jhi-party-cif-business-group [debtorData]="partyCif.debtorData" *ngIf="clickedMenu === 'business-group'">
          </jhi-party-cif-business-group>
          <jhi-party-cif-collateral-info
            [collateralAppraisal]="collateralAppraisal"
            [partyCif]="partyCif"
            [partyId]="partyCif.partyId"
            [collateralInfo]="collateralInfo"
            *ngIf="clickedMenu === 'collateral-info'"
          >
          </jhi-party-cif-collateral-info>
          <jhi-facility-info-cif *ngIf="clickedMenu === 'facility-info'" [partyCif]="partyCif"></jhi-facility-info-cif>
          <jhi-credit-rating-view [mode]="'edit'" [partyCif]="partyCif" *ngIf="clickedMenu === 'credit-rating'"> </jhi-credit-rating-view>

          <jhi-debtor-data-slik-summary
            (SendSlikToParty)="getPartySlik($event)"
            [mode]="'edit'"
            [partyCif]="partyCif"
            *ngIf="clickedMenu === 'slik'"
          >
          </jhi-debtor-data-slik-summary>
          <jhi-party-cif-decision-approval-report [mode]="'edit'" [partyCif]="partyCif" *ngIf="clickedMenu === 'decision-approval-report'">
          </jhi-party-cif-decision-approval-report>
        </div>
        <mat-card-actions align="center">
          <div class="e-card-actions">
            <div class="d-flex justify-content-center mb-3 mt-3">
              <button
                mat-raised-button
                (click)="save()"
                style="
                  background: rgba(0, 136, 129, 1);
                  color: #ffffff;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  margin-top: 25px !important;
                "
                *ngIf="clickedMenu !== 'credit-rating'"
              >
                Save
              </button>
              <button
                mat-raised-button
                (click)="previousState()"
                style="background: rgba(0, 136, 129, 1); color: #ffffff; margin-left: 13px !important; margin-top: 25px !important"
                *ngIf="clickedMenu !== 'credit-rating'"
              >
                Back
              </button>
              <button
                mat-raised-button
                (click)="previousState()"
                style="
                  background: rgba(0, 136, 129, 1);
                  color: #ffffff;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  margin-top: 25px !important;
                "
                *ngIf="clickedMenu === 'credit-rating'"
              >
                Back
              </button>
            </div>
          </div>
        </mat-card-actions>
      </div>
    </div>
  </div>
  <mat-sidenav position="end" style="position: fixed !important" #drawer class="example-sidenav" mode="over">
    <div class="p-3" style="padding-top: 90px !important">
      <div style="font-size: 1.5rem; font-weight: 600">Select your destination:</div>

      <ul class="side-menu">
        <li *ngFor="let item of subMenu">
          <!--SUBMENU DOESNT HAS A CHILD-->
          <a
            *ngIf="!item.hasOwnProperty('child')"
            href="javascript:void(0)"
            class="text-capitalize"
            (click)="routeSubMenu(item); drawer.toggle()"
            >{{ item.text }}</a
          >
          <!--SUBMENU HAS A CHILD-->
          <span class="text-capitalize" *ngIf="item.hasOwnProperty('child')">{{ item.text }}</span>
          <ul *ngIf="item.hasOwnProperty('child')">
            <li *ngFor="let itemChild of item.child">
              <a href="javascript:void(0)" (click)="routeSubMenu(itemChild); drawer.toggle()" class="text-capitalize">{{
                itemChild.text
              }}</a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
<button
  matTooltip="Click this for show sub menu of initial debtor data"
  style="z-index: 1"
  class="btn-menu-floating"
  (click)="drawer.toggle()"
  mat-fab
  color="warn"
  matTooltipPosition="before"
>
  <mat-icon>more_vert</mat-icon>
</button>
