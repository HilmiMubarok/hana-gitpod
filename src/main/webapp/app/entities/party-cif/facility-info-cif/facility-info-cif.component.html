<mat-card>
  <mat-card-header>
    <mat-card-header-subtitle class="text-capitalize">Facility Info Debitur</mat-card-header-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-facility-info-debitur [data]="data" [debtorData]="debtorData" [dialogType]="'debitur'"></jhi-facility-info-debitur>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-header>
    <mat-card-header-subtitle class="text-capitalize">Facility Group</mat-card-header-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-facility-info-debitur [dataGroup]="dataGroup" [dialogType]="'group'"></jhi-facility-info-debitur>
  </mat-card-content>

  <button mat-raised-button (click)="loadDataBy(); loadDataGroup()">SYNC from HOBIS</button>
</mat-card>
