<mat-card style="margin-bottom: 15px">
  <mat-card-header>
    <mat-card-header-subtitle class="label-font-detail">Main Facility Info</mat-card-header-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-main-facility-info [partyCif]="partyCif" [data]="data" [debtorData]="debtorData" [dialogType]="'debitur'"></jhi-main-facility-info>
  </mat-card-content>
</mat-card>

<mat-card style="margin-bottom: 15px">
  <mat-card-header>
    <mat-card-header-subtitle class="label-font-detail">Facility Info Debitur</mat-card-header-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-facility-info-debitur
      [partyCif]="partyCif"
      [data]="data"
      [debtorData]="debtorData"
      [dialogType]="'debitur'"
    ></jhi-facility-info-debitur>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-header>
    <mat-card-header-subtitle class="label-font-detail">Facility Group</mat-card-header-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-facility-info-group
      [partyCif]="partyCif"
      [debtorDataGroup]="debtorDataGroup"
      [dataGroup]="dataGroup"
      [dialogType]="'group'"
    ></jhi-facility-info-group>
  </mat-card-content>

  <!-- <button mat-raised-button (click)="loadDataBy()">SYNC from HOBIS</button> -->
</mat-card>
