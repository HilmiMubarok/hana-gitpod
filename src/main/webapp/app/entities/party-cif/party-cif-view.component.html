<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partyCif.number" for="field_number">Number</label>
        <input type="text" class="form-control" name="number" id="field_number" [(ngModel)]="item.number" [disabled]="readOnly()" />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partyCif.customerStatus" for="field_customerStatus">Customer Status</label>
        <input
          type="text"
          class="form-control"
          name="customerStatus"
          id="field_customerStatus"
          [(ngModel)]="item.customerStatus"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.partyCif.customerType" for="field_customerType">Customer Type</label>
        <select class="form-control" name="customerType" [(ngModel)]="item.customerType" id="field_customerType" [disabled]="readOnly()">
          <option value="CORPORATE" jhiTranslate="losgwApp.CustomerType.CORPORATE">CORPORATE</option>
          <option value="PERSONAL" jhiTranslate="losgwApp.CustomerType.PERSONAL">PERSONAL</option>
        </select>
      </div>

      <div class="form-group">
        <label jhiTranslate="losgwApp.partyCif.party" for="field_party">Party</label>
        <select
          class="form-control"
          id="field_party"
          name="party"
          [(ngModel)]="item.partyId"
          [disabled]="partyId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">{{ partyOption.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.partyCif.branch" for="field_branch">Branch</label>
        <select
          class="form-control"
          id="field_branch"
          name="branch"
          [(ngModel)]="item.branchId"
          [disabled]="branchId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="internalOption.id" *ngFor="let internalOption of internals; trackBy: trackInternalById">
            {{ internalOption.name }}
          </option>
        </select>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
