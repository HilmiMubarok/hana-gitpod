<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.partyCif.home.createOrEditLabel">Party Cifs</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{partyCif.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.partyCif.number" for="field_number">Number</label>
                <input type="text" class="form-control" name="number" id="field_number" [(ngModel)]="item.number" [disabled]="readOnly()" />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.partyCif.customerStatus" for="field_customerStatus"
                  >Customer Status</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="customerStatus"
                  id="field_customerStatus"
                  [(ngModel)]="item.customerStatus"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.partyCif.customerType" for="field_customerType"
                  >Customer Type</label
                >
                <select
                  class="form-control"
                  name="customerType"
                  [(ngModel)]="item.customerType"
                  id="field_customerType"
                  [disabled]="readOnly()"
                >
                  <option value="CORPORATE" jhiTranslate="losgwApp.CustomerType.CORPORATE">CORPORATE</option>
                  <option value="PERSONAL" jhiTranslate="losgwApp.CustomerType.PERSONAL">PERSONAL</option>
                </select>
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.partyCif.party" for="field_party">Party</label>
                <select
                  class="form-control"
                  id="field_party"
                  name="party"
                  [(ngModel)]="item.partyId"
                  [disabled]="partyId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="partyOption.id" *ngFor="let partyOption of parties; trackBy: trackPartyById">
                    {{ partyOption.name }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.partyCif.branch" for="field_branch">Branch</label>
                <select
                  class="form-control"
                  id="field_branch"
                  name="branch"
                  [(ngModel)]="item.branchId"
                  [disabled]="branchId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="internalOption.id" *ngFor="let internalOption of internals; trackBy: trackInternalById">
                    {{ internalOption.name }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
