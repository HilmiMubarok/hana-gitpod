<mat-card>
  <mat-card-header>
    <mat-card-subtitle class="text-capitalize">organization legal</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <jhi-organization-legal-list
      *ngIf="partyCif.customerType === 'CORPORATE'"
      [organizationId]="partyCifService.findPartyId(partyCif)"
      [deedNumber]="deedNumber"
      [deedDates]="deedDates"
    ></jhi-organization-legal-list>
    <div *ngIf="partyCif.customerType !== 'CORPORATE'" class="alert-warning">You dont have a permission to see this module</div>
  </mat-card-content>
</mat-card>
