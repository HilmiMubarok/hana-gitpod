<h2 mat-dialog-title>ADD / EDIT COLLATERAL</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-header>
      <mat-card-subtitle>Collateral Info</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-collateral-type-dialog [collateral]="collateral" [disabledOpt]="disabledOpt"></jhi-collateral-type-dialog>
    </mat-card-content>
  </mat-card>
  <mat-card class="mt-5">
    <mat-card-header>
      <mat-card-subtitle>Collateral Address</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-postal-address-view-custom [postalAddress]="collateral.collateralAddress"></jhi-postal-address-view-custom>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
