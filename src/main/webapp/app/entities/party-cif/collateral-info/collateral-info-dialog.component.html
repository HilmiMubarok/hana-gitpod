<h2 mat-dialog-title>ADD / EDIT COLLATERAL</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-header>
      <mat-card-subtitle>Collateral Info</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-collateral-type-dialog
        [collateralAppraisal]="collateralAppraisal"
        [collateral]="collateral"
        [disabledOpt]="disabledOpt"
      ></jhi-collateral-type-dialog>
    </mat-card-content>
  </mat-card>
  <mat-card class="mt-5">
    <mat-card-header>
      <mat-card-subtitle>Collateral Address</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-postal-address-view-custom
        [collateral]="collateral"
        [postalAddress]="collateral.collateralAddress"
      ></jhi-postal-address-view-custom>
    </mat-card-content>
  </mat-card>
  <mat-card class="mt-5">
    <mat-card-header>
      <mat-card-subtitle>Collateral Owner Address</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-collateral-owner-address
        [partyCif]="partyCif"
        [collateral]="collateral"
        [postalAddress]="collateral.collateralAddress"
      ></jhi-collateral-owner-address>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center" class="align-center">
  <section *jhiMatrixDirIDD="'input'">
    <button mat-raised-button class="confirm-button-no" (click)="openCancelDialog()">Close</button>
    <button mat-raised-button class="confirm-button-yes" [mat-dialog-close]="collateral">Save</button>
  </section>
  <section *jhiMatrixDirIDD="''" align="center">
    <button mat-button mat-dialog-close class="confirm-button-no">Close</button>
  </section>
</mat-dialog-actions>
