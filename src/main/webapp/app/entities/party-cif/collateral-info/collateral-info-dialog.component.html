<h2 mat-dialog-title>ADD / EDIT COLLATERAL</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-header>
      <mat-card-subtitle>Collateral Info</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-collateral-type-dialog
        [collateralAppraisal]="collateralAppraisal"
        [collateral]="collateral"
        [disabledOpt]="disabledOpt"
      ></jhi-collateral-type-dialog>
    </mat-card-content>
  </mat-card>
  <mat-card class="mt-5">
    <mat-card-header>
      <mat-card-subtitle>Collateral Address</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <jhi-postal-address-view-custom
        [collateral]="collateral"
        [postalAddress]="collateral.collateralAddress"
      ></jhi-postal-address-view-custom>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<section *jhiMatrixDirIDD="'input'">
  <mat-dialog-actions align="center">
    <button mat-button [mat-dialog-close]="collateral" style="background: rgba(0, 136, 129, 1); color: #ffffff">Save</button>
    <button mat-button (click)="openCancelDialog()" style="background: rgb(228, 39, 39); color: #ffffff">Close</button>
    <!-- <button mat-button (click)="print()">Print</button> -->
    <!-- <button mat-button [mat-dialog-close]="collateral">Save</button> -->
  </mat-dialog-actions>
</section>
<section *jhiMatrixDirIDD="''" align="center">
  <button mat-button mat-dialog-close>Close</button>
</section>
