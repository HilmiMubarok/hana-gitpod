<h2 mat-dialog-title>ADD / EDIT COLLATERAL GENERAL INFO DETAIL</h2>
<mat-dialog-content>
  <jhi-collateral-property-general-dialog-template [collateralProperty]="collateralProperty" [collateral]="collateral">
  </jhi-collateral-property-general-dialog-template>
  <mat-dialog-actions align="center">
    <button mat-button mat-dialog-close>Close</button>
    <button mat-button (click)="save()">Save</button>
    <!-- <button (click)="print()">Print</button> -->
  </mat-dialog-actions>
</mat-dialog-content>
