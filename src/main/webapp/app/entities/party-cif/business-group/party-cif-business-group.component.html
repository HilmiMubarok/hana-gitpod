<mat-card>
  <mat-card-content>
    <div class="col-md-3">
      <mat-form-field class="w-100" appearance="outline">
        <mat-label class="text-capitalize rounding-table-left">Business Group Name</mat-label>
        <input matInput type="text" [(ngModel)]="debtorData.groupCompanyName" disabled />
      </mat-form-field>
    </div>
  </mat-card-content>
  <mat-card-header>
    <mat-card-subtitle class="label-font-detail">Business Group</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="dataItem" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef class="grid-index-center rounding-table-left">No</th>
        <td mat-cell *matCellDef="let element; let i = index" width="5%" class="grid-index-center">
          {{ i + 1 + paginator.pageIndex * paginator.pageSize }}.
        </td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="grid-index-left">Name</th>
        <td mat-cell *matCellDef="let element" class="grid-index-left">
          {{ element.customerName }}
        </td>
      </ng-container>
      <ng-container matColumnDef="cif">
        <th mat-header-cell *matHeaderCellDef class="grid-index-center rounding-table-right">CIF</th>
        <td mat-cell *matCellDef="let element" class="grid-index-center">
          {{ element.customerCIF }}
        </td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let element; columns: displayedColumns" class="mat-element-row"></tr>
    </table>
    <mat-paginator #paginator [pageSizeOptions]="[5, 12, 18]" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
