<h2 mat-dialog-title>FIND CIF</h2>
<mat-dialog-content>
  <mat-form-field class="w-100" appearance="outline">
    <input placeholder="Find CIF in here...." matInput type="text" [(ngModel)]="cif" />
    <button matSuffix mat-icon-button aria-label="Clear" (click)="search()">
      <mat-icon>search</mat-icon>
    </button>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="center" style="text-align: center; margin: 0 auto">
  <button mat-raised-button mat-dialog-close class="confirm-button-no">Close</button>
</mat-dialog-actions>
