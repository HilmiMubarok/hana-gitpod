<mat-card class="mt-3">
  <mat-card-content>
    <div class="row">
      <div class="col-6">
        <p>Assign To Checker 1</p>
        <mat-form-field class="w-100" appearance="outline">
          <mat-select [(ngModel)]="applicationRoleIdOne" (selectionChange)="onSelectAssignOne($event)">
            <!-- Adding "Please Select" option with an empty value -->
            <mat-option [value]="">Please Select</mat-option>
            <mat-option *ngFor="let item of positionCheckerOne" [value]="item.id">
              {{ item.employeeFirstName }} {{ item.employeeLastName }} - {{ item.positionTypeDescription }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-6">
        <p>Assign To Checker 2</p>
        <mat-form-field class="w-100" appearance="outline">
          <mat-select [(ngModel)]="applicationRoleIdTwo" (selectionChange)="onSelectAssignTwo($event)">
            <!-- Adding "Please Select" option with an empty value -->
            <mat-option [value]="">Please Select</mat-option>
            <mat-option *ngFor="let item of positionCheckerTwo" [value]="item.id">
              {{ item.employeeFirstName }} {{ item.employeeLastName }} - {{ item.positionTypeDescription }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </mat-card-content>
</mat-card>
