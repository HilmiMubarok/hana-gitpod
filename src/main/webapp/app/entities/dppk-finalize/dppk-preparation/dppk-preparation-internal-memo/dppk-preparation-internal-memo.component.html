<mat-card-content>
  <table mat-table [dataSource]="folders" class="w-100">
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef width="5%" class="grid-index-number rounding-table-left">No</th>
      <td mat-cell *matCellDef="let i = index" class="grid-index-label">{{ i + 1 }}</td>
    </ng-container>
    <ng-container matColumnDef="documentName">
      <th mat-header-cell *matHeaderCellDef width="50%" class="grid-index-string">Document Name</th>
      <td mat-cell *matCellDef="let element" class="grid-index-label">{{ element.documentName }}</td>
    </ng-container>
    <ng-container matColumnDef="remark">
      <th mat-header-cell *matHeaderCellDef class="grid-index-string">Remark</th>
      <td mat-cell *matCellDef="let element" class="grid-index-label-string">{{ element.remarks }}</td>
    </ng-container>
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef class="grid-index-string">Date</th>
      <td mat-cell *matCellDef="let element" class="grid-index-label-string">
        {{ element.documentDate | date: 'YYYY-MM-dd' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef width="13%" class="grid-index-string-action rounding-table-right">Action</th>
      <td mat-cell *matCellDef="let element">
        <section *ngIf="conditionReviewDppk()">
          <button mat-icon-button (click)="view(element)">
            <mat-icon>remove_red_eye</mat-icon>
          </button>
        </section>
        <ng-container *ngIf="conditionReviewInternalMemoDocument()">
          <section *ngIf="!conditionReviewDppk()">
            <button mat-icon-button (click)="view(element)">
              <mat-icon>remove_red_eye</mat-icon>
            </button>
            <button mat-icon-button (click)="update(element)">
              <mat-icon>create</mat-icon>
            </button>
            <button mat-icon-button (click)="delete(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </section>
        </ng-container>
      </td>
    </ng-container>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="['no', 'documentName', 'remark', 'date', 'action'].length">No records found.</td>
    </tr>
    <tr mat-header-row *matHeaderRowDef="['no', 'documentName', 'remark', 'date', 'action']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['no', 'documentName', 'remark', 'date', 'action']"></tr>
  </table>
</mat-card-content>
<mat-card-actions align="center" class="align-center" *ngIf="!conditionReviewDppk()">
  <button mat-raised-button (click)="openDialog(null)" class="button-styling"><mat-icon>add</mat-icon> ADD NEW DOCUMENT</button>
</mat-card-actions>
