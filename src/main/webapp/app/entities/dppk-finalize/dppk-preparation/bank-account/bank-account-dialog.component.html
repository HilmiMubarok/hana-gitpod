<h2 mat-dialog-title class="header-title">Bank Account</h2>
<mat-dialog-content>
  <div class="row justify-content-between">
    <section>
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Account Type</mat-label>
        <mat-select required [(ngModel)]="dataApplicationPayment.paymentTypeId" (selectionChange)="changePaymentType($event)">
          <mat-option value="">- Please Select -</mat-option>
          <mat-option *ngFor="let item of paymentType" [value]="item.id">
            {{ item.description }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </section>
    <section>
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Bank Name</mat-label>
        <mat-select required (selectionChange)="changeBankAccount($event)" [(ngModel)]="dataApplicationPayment.bankAccountId">
          <mat-option value="">- Please Select -</mat-option>
          <mat-option *ngFor="let item of filteredBankAccount" [value]="item.id">
            {{ item.finInstituteName }} - {{ item.accountNumber }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </section>
    <section>
      <mat-form-field class="w-100" appearance="outline">
        <mat-label>Currency</mat-label>
        <mat-select required [(ngModel)]="dataApplicationPayment.currencyId" disabled>
          <mat-option value="">- Please Select -</mat-option>
          <mat-option *ngFor="let item of currencyData" [value]="item.id">
            {{ item.id }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </section>
    <section>
      <div class="mb-2">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Account Name</mat-label>
          <input matInput type="text" disabled [value]="getAccountName()" />
        </mat-form-field>
      </div>
    </section>
  </div>
  <section class="align-center">
    <div class="mt-3 text-center">
      <button mat-raised-button class="confirm-button-no" (click)="openCancelDialog()">Cancel</button>
      <button mat-raised-button class="confirm-button-yes" (click)="onSave()">Save</button>
    </div>
  </section>
</mat-dialog-content>
