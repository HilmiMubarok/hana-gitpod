<div class="table-responsive-material">
  <table mat-table [dataSource]="dataSource" class="w-100">
    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef>No</th>
      <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
    </ng-container>
    <ng-container matColumnDef="accountType">
      <th mat-header-cell *matHeaderCellDef>Account Type</th>
      <td mat-cell *matCellDef="let element">{{ element.paymentTypeDescription }}</td>
    </ng-container>
    <ng-container matColumnDef="currency">
      <th mat-header-cell *matHeaderCellDef>Currency</th>
      <td mat-cell *matCellDef="let element">{{ element.currencyId }}</td>
    </ng-container>
    <ng-container matColumnDef="accountName">
      <th mat-header-cell *matHeaderCellDef>Account Name</th>
      <td mat-cell *matCellDef="let element">{{ getAccountName(element) }}</td>
    </ng-container>
    <ng-container matColumnDef="accountNumber">
      <th mat-header-cell *matHeaderCellDef>Account Number</th>
      <td mat-cell *matCellDef="let element">{{ element.bankAccountNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let element">
        <section *ngIf="!conditionReviewDppk()">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deletePaymentRef(element)" [hidden]="disable">
            <mat-icon>delete</mat-icon>
          </button>
        </section>
        <section *ngIf="conditionReviewDppk()">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>remove_red_eye</mat-icon>
          </button>
        </section>
      </td>
    </ng-container>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
    </tr>
    <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
  </table>
  <mat-paginator #paginator [pageSizeOptions]="[5, 12, 18]" showFirstLastButtons></mat-paginator>
</div>

<ng-container *ngIf="isCredamOnDppk; else addButtonView">
  <section>
    <div class="mt-3 text-center">
      <button mat-raised-button class="button-styling" (click)="openDialog()">ADD Account</button>
    </div>
  </section>
</ng-container>
<ng-template #addButtonView>
  <section *ngIf="!conditionReviewDppk()">
    <div class="mt-3 text-center">
      <button mat-raised-button class="button-styling" (click)="openDialog()" [hidden]="disable">ADD Account</button>
    </div>
  </section>
</ng-template>
