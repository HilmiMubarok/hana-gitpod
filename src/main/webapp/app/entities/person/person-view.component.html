<div class="card">
  <div class="e-sample-resize-container e-card-resize-container">
    <div class="row">
      <div class="row card-layout">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <!-- <div class="e-card-sub-title"></div> -->
          </div>
        </div>
        <!-- <div class="e-card-content"> -->
        <!-- <ng-container [ngSwitch]="mode">
              <ng-container *ngSwitchCase="'edit'">
                <div class="form-group">
                  <mat-slide-toggle [checked]="item.korean" name="korean" [(ngModel)]="item.korean">Korea</mat-slide-toggle>
                </div> -->

        <ng-container [ngSwitch]="mode">
          <ng-container *ngSwitchCase="'edit'">
            <div class="row mb-5">
              <div class="col-md-6">
                <!--LEFT SIDE -->
                <div class="form-group">
                  <ejs-textbox name="completeName" id="completeName" placeholder="Complete Name" cssClass="e-outline" floatLabelType="Auto">
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox placeholder="Alias Name" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist
                    class="mb-2 mt-2"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                    placeholder="Identity Type"
                  ></ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    name="idCardNumber"
                    id="idCardNumber"
                    placeholder="ID Card Number"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-datepicker
                    cssClass="e-outline"
                    placeholder="ID Expire Date"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-datepicker>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    name="placeOfBirth"
                    id="placeOfBirth"
                    placeholder="Place of Birth"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox name="email" id="email" placeholder="Email" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist
                    class="mb-2 mt-2"
                    placeholder="Relations With Keb Hana Bank"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist
                    class="mb-2 mt-2"
                    placeholder="Line Of Business"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-textbox name="sidCode" id="sidCode" placeholder="SID Code" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox name="sid" id="sid" placeholder="SID" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox name="lbu" id="lbu" placeholder="LBU" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    name="lbuRemark"
                    id="lbuRemark"
                    [multiline]="true"
                    placeholder="LBU Remark"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist
                    class="mb-2 mt-2"
                    placeholder="Collectability Status"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>

                <div class="form-group">
                  <ejs-dropdownlist class="mb-2 mt-2" placeholder="PEP" cssClass="e-outline" floatLabelType="Auto"> </ejs-dropdownlist>
                </div>
              </div>
              <div class="col-6">
                <!-- RIGHT SIDE -->
                <div class="form-group">
                  <ejs-datepicker
                    cssClass="e-outline"
                    placeholder="Date Of Birth"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-datepicker>
                </div>
                <div class="row">
                  <div class="col-5">
                    <div class="form-group">
                      <ejs-textbox placeholder="Age" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>
                  <div class="col-7">
                    <div class="form-group">
                      <ejs-textbox placeholder="Month" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <ejs-textbox placeholder="NPWP" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist
                    class="mb-2 mt-2"
                    placeholder="Marital Status"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist class="mb-2 mt-2" placeholder="Gender" cssClass="e-outline" floatLabelType="Auto"> </ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-textbox placeholder="Mother Maiden Name" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <ejs-textbox placeholder="Handphone Number 1" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <ejs-textbox placeholder="Handphone Number 2" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <ejs-textbox placeholder="Handphone Number 3" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-6">
                      <div class="form-group">
                        <ejs-textbox [multiline]="true" placeholder="Existing Customer Since" cssClass="e-outline" floatLabelType="Auto">
                        </ejs-textbox>
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="form-group">
                        <ejs-textbox [multiline]="true" placeholder="Existing Debtor Since" cssClass="e-outline" floatLabelType="Auto">
                        </ejs-textbox>
                      </div>
                    </div>
                  </div>
                  <div class="form-group">
                    <ejs-textbox placeholder="Account Number (IDR)" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>
                  <div class="form-group">
                    <ejs-textbox placeholder="Account Number (USD)" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>

                  <div class="form-group">
                    <ejs-textbox placeholder="Credit Scoring" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>
                  <div class="form-group">
                    <ejs-textbox placeholder="IFC & Risk Category" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                  </div>
                </div>

                <!-- </div> -->
              </div>

              <div class="form-group">
                <hr />
                <div class="row">
                  <div class="col-6">
                    <div class="form-group">
                      <ejs-textbox placeholder="Modal Disetor" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                    <div class="form-group">
                      <ejs-textbox placeholder="Penjualan Tahunan" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                    <div class="form-group">
                      <ejs-textbox placeholder="Category Debitur" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                    <div class="form-group">
                      <ejs-textbox placeholder="Klasifikiasi UMKM" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>

                  <div class="col-6">
                    <div class="form-group">
                      <ejs-dropdownlist
                        class="mb-2 mt-2"
                        placeholder="Call Report Category"
                        cssClass="e-outline"
                        floatLabelType="Auto"
                      ></ejs-dropdownlist>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>
        </ng-container>

        <ng-container [ngSwitch]="mode">
          <ng-container *ngSwitchCase="'view'">
            <div class="row">
              <div class="col-md-6">
                <!--LEFT SIDE -->

                <div class="form-group">

                    placeholder="Email"
                    cssClass="e-outline"

                <div class="form-group">
                  <ejs-dropdownlist

                <div class="form-group">

                    class="mb-2 mt-2"
                    placeholder="Line Of Business"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-textbox name="sidCode" id="sidCode" placeholder="SID Code" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox readonly name="sid" id="sid" placeholder="SID" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox readonly name="lbu" id="lbu" placeholder="LBU" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-textbox
                    readonly
                    name="lbuRemark"
                    id="lbuRemark"
                    [multiline]="true"
                    placeholder="LBU Remark"
                    cssClass="e-outline"
                    floatLabelType="Auto"

                <div class="form-group">
                  <ejs-dropdownlist

                    placeholder="Collectability Status"

                <div class="form-group">

                <div class="form-group">

                </div>
              </div>
              <div class="col-6">
                <!-- RIGHT SIDE -->
                <div class="form-group">
                  <ejs-datepicker
                    cssClass="e-outline"
                    [(ngModel)]="item.dob"
                    placeholder="Date Of Birth"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-datepicker>
                </div>
                <div class="row">
                  <div class="col-5">
                    <div class="form-group">
                      <ejs-textbox placeholder="Age" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>
                  <div class="col-7">
                    <div class="form-group">
                      <ejs-textbox placeholder="Month" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <ejs-textbox [(ngModel)]="item.taxIdNumber" placeholder="NPWP" cssClass="e-outline" floatLabelType="Auto"> </ejs-textbox>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist

                    [(ngModel)]="item.maritalStatus"
                    placeholder="Marital Status"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  ></ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-dropdownlist
                    class="mb-2 mt-2"
                    [(ngModel)]="item.gender"
                    name="gender"
                    [value]="item.id"
                    placeholder="Gender"
                    cssClass="e-outline"
                    floatLabelType="Auto"
                  >
                  </ejs-dropdownlist>
                </div>
                <div class="form-group">
                  <ejs-textbox [(ngModel)]="item.mothersName" placeholder="Mother Maiden Name" cssClass="e-outline" floatLabelType="Auto">

                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <ejs-textbox
                        [(ngModel)]="item.cellPhone1"

      </div>

  </div>
</div>
