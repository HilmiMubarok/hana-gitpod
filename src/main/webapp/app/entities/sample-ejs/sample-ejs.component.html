<div class="page-content">
  <div>Silahkan gunakan halaman ini untuk explore upload file</div>
  <div class="row">
    <div class="col-md-12">
      <form>
        <div class="mb-3">
          <label for="document_upload" class="form-label">Upload Document V1 - ej</label>
          <div class="control-section">
            <div class="col-lg-9">
              <div class="control_wrapper">
                <div class="imagepreview">
                  <div id="dropArea" style="height: auto">
                    <span id="dropimage">
                      Drop file here or <a href="" id="browse"><u>Browse</u></a>
                    </span>
                    <ejs-uploader
                      #previewupload
                      id="previewfileupload"
                      [asyncSettings]="path"
                      [dropArea]="dropElement"
                      [multiple]="false"
                      (selected)="onSelect($event)"
                      (success)="onUploadSuccess($event)"
                      (progress)="onFileUpload($event)"
                      (failure)="onUploadFailed($event)"
                      (removing)="onFileRemove($event)"
                    >
                    </ejs-uploader>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-lg-3 property-section">
              <div class="property-panel-section">
                <div class="property-panel-content" style="padding-top: 25px">
                  <button class="e-btn e-css" id="uploadbtn" title="Upload" style="width: 130px" (click)="onUpload()">Upload</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">Upload Document V2</label>
          <div *ngIf="files.length === 0" class="container" jhiDragndrop (fileDropped)="onFileDropped($event)">
            <input type="file" #fileDropRef id="fileDropRef" [multiple]="false" (change)="fileBrowseHandler($event.target.files)" />
            <fa-icon [icon]="faCloudUpload" class="fa-2xl" style="font-size: 3em"></fa-icon>
            <h3>Drag and drop file here</h3>
            <h3>or</h3>
            <label for="fileDropRef">Browse for file</label>
          </div>
          <div class="files-list">
            <div class="single-file" *ngFor="let file of files; let i = index">
              <div class="file-icon" style="width: 50px; margin-right: 10px" *ngIf="types_document.includes(file?.type)">
                <svg
                  version="1.1"
                  id="Capa_1"
                  xmlns="http://www.w3.org/2000/svg"
                  xmlns:xlink="http://www.w3.org/1999/xlink"
                  x="0px"
                  y="0px"
                  viewBox="0 0 58 58"
                  style="enable-background: new 0 0 58 58"
                  xml:space="preserve"
                >
                  <polygon style="fill: #edeada" points="51.5,14 37.5,0 6.5,0 6.5,58 51.5,58 " />
                  <g>
                    <path
                      style="fill: #cec9ae"
                      d="M16.5,23h25c0.552,0,1-0.447,1-1s-0.448-1-1-1h-25c-0.552,0-1,0.447-1,1S15.948,23,16.5,23z"
                    />
                    <path
                      style="fill: #cec9ae"
                      d="M16.5,15h10c0.552,0,1-0.447,1-1s-0.448-1-1-1h-10c-0.552,0-1,0.447-1,1S15.948,15,16.5,15z"
                    />
                    <path
                      style="fill: #cec9ae"
                      d="M41.5,29h-25c-0.552,0-1,0.447-1,1s0.448,1,1,1h25c0.552,0,1-0.447,1-1S42.052,29,41.5,29z"
                    />
                    <path
                      style="fill: #cec9ae"
                      d="M41.5,37h-25c-0.552,0-1,0.447-1,1s0.448,1,1,1h25c0.552,0,1-0.447,1-1S42.052,37,41.5,37z"
                    />
                    <path
                      style="fill: #cec9ae"
                      d="M41.5,45h-25c-0.552,0-1,0.447-1,1s0.448,1,1,1h25c0.552,0,1-0.447,1-1S42.052,45,41.5,45z"
                    />
                  </g>
                  <polygon style="fill: #cec9ae" points="37.5,0 37.5,14 51.5,14 " />
                </svg>
              </div>
              <div class="file-icon" style="width: 50px; margin-right: 10px" *ngIf="types_image.includes(file?.type)">
                <img width="100%" [src]="imageUrl" class="image" />
              </div>
              <div class="info">
                <h4 class="name">{{ file?.name }} - {{ file?.type }}</h4>
                <p class="size">
                  {{ formatBytes(file?.size) }}
                </p>
                <app-progress [progress]="file?.progress"></app-progress>
              </div>

              <div class="delete" (click)="deleteFile(i)">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="18" viewBox="0 0 14 18">
                  <path
                    fill="#B1B1B1"
                    fill-rule="nonzero"
                    d="M1 16c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v10zm3.17-7.83a.996.996 0 0 1 1.41 0L7 9.59l1.42-1.42a.996.996 0 1 1 1.41 1.41L8.41 11l1.42 1.42a.996.996 0 1 1-1.41 1.41L7 12.41l-1.42 1.42a.996.996 0 1 1-1.41-1.41L5.59 11 4.17 9.58a.996.996 0 0 1 0-1.41zM10.5 1L9.79.29C9.61.11 9.35 0 9.09 0H4.91c-.26 0-.52.11-.7.29L3.5 1H1c-.55 0-1 .45-1 1s.45 1 1 1h12c.55 0 1-.45 1-1s-.45-1-1-1h-2.5z"
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>
        <div class="mb-3 form-check">
          <div class="property-panel-content" style="padding-top: 25px">
            <button class="e-btn e-css" id="uploadbtn" title="Upload" style="width: 130px" (click)="onUpload2()">Upload</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
