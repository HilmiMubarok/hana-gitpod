<div class="page-view" *ngIf="item$ | async as item">
  <div class="card">
    <ul class="nav justify-content-end">
      <li class="nav-item">
        <a
          class="btn"
          (click)="save()"
          href="javascript:void(0)"
          style="cursor: pointer"
          aria-disabled="isSaving"
          tooltip="Back and save current data"
          *ngIf="!readOnly()"
        >
          <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
          <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
        </a>
      </li>
    </ul>

    <div class="gy-5">
      <div class="col-6 mt-3">
        <ejs-dropdownlist
          (select)="fa($event)"
          cssClass="e-outline"
          floatLabelType="Auto"
          id="ddlelement"
          [dataSource]="BlodType"
          placeholder="Segmentation"
        ></ejs-dropdownlist>
      </div>
    </div>
    <div *ngIf="selected">
      <div class="middle">
        <p class="title">FINANCIAL STATEMENT</p>
      </div>

      <ul class="nav justify-content-end">
        <li class="nav-item" *ngIf="accountService.hasAnyAuthority(['ROLE_ADMIN'])">
          <span>
            <a class="btn" href="javascript:void(0)" style="cursor: pointer" tooltip="Upload File">
              <fa-icon icon="upload"></fa-icon>
              <label for="fileInput" style="cursor: pointer"> &nbsp;&nbsp;{{ 'entity.action.loadFile' | translate }}</label>
              <input
                id="fileInput"
                type="file"
                (change)="onUploadFile($event)"
                multiple="false"
                accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                style="display: none"
                #inputFile
              />
            </a>
          </span>
        </li>
        <li class="nav-item" *ngIf="accountService.hasAnyAuthority(['ROLE_ADMIN'])">
          <a class="btn" (click)="downloadFile('partySlik.xls')" href="javascript:void(0)" style="cursor: pointer" tooltip="Download File">
            <span><fa-icon icon="download"></fa-icon> &nbsp;{{ 'entity.action.downloadFile' | translate }}</span>
          </a>
        </li>
      </ul>
    </div>

    <div *ngIf="!selected">
      <div class="middle">
        <span><button (click)="previousState()" ejs-button>ASSUMTION</button></span>
        <span><button ejs-button>PROJECTION</button></span>
        <span><button [routerLink]="['view']" ejs-button>FINANCIAL STATEMENT</button></span>
        <p class="title">ASSET</p>
      </div>
      <ul class="nav justify-content-end">
        <li class="nav-item" *ngIf="accountService.hasAnyAuthority(['ROLE_ADMIN'])">
          <span>
            <a class="btn" href="javascript:void(0)" style="cursor: pointer" tooltip="Upload File">
              <fa-icon icon="upload"></fa-icon>
              <label for="fileInput" style="cursor: pointer"> &nbsp;&nbsp;{{ 'entity.action.loadFile' | translate }}</label>
              <input
                id="fileInput"
                type="file"
                (change)="onUploadFile($event)"
                multiple="false"
                accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                style="display: none"
                #inputFile
              />
            </a>
          </span>
        </li>
        <li class="nav-item" *ngIf="accountService.hasAnyAuthority(['ROLE_ADMIN'])">
          <a class="btn" (click)="downloadFile('partySlik.xls')" href="javascript:void(0)" style="cursor: pointer" tooltip="Download File">
            <span><fa-icon icon="download"></fa-icon> &nbsp;{{ 'entity.action.downloadFile' | translate }}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
  <p>push</p>
</div>
