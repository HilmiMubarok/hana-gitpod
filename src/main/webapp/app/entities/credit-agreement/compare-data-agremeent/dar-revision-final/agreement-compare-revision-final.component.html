<ejs-menu [enableScrolling]="true" cssClass="e-rounded-menu e-custom-scroll" [items]="menuItemsAll" (select)="setMenu($event)"> </ejs-menu>

<div *ngIf="selectedMenu === 'DAR REVISION FINAL'">
  <!-- Loan Facility Detail -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">DAR REVISION</div>
  </div>
  <div>
    <!-- <jhi-loan-facility-detail-history
      *ngIf="isDataToCompareExist"
      [isOnCompareData]="true"
      [isCompareDar]="true"
      [isViewMode]="true"
      [takeOutCompare]="true"
      [creditProposal]="dataToCompare"
    ></jhi-loan-facility-detail-history> -->

    <!-- Dar Revision get Entity -->
    <jhi-credit-proposal-tab-loan-facility-detail [takeOutCompare]="true" [isViewMode]="true" [creditProposal]="creditProposal">
    </jhi-credit-proposal-tab-loan-facility-detail>
  </div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>
  <div>
    <!-- Dar Final Get Previous History -->
    <jhi-loan-facility-detail-history
      *ngIf="creditProposal.attributes['previousHistory']"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
    >
    </jhi-loan-facility-detail-history>
    <div class="e-card" *ngIf="!creditProposal.attributes['previousHistory']">
      <div class="e-card-header">
        <!-- <div class="e-card-header-caption"> -->
        <div class="e-card-header-title">Faciity Details</div>
        <!-- </div> -->
      </div>
      <div class="alert alert-warning m-3" role="alert">
        <span style="font-weight: bold">No previous data was found!</span>
      </div>
    </div>
    <!-- <jhi-credit-proposal-tab-loan-facility-detail
      *ngIf="!creditProposal.attributes['previousHistory']"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
    >
    </jhi-credit-proposal-tab-loan-facility-detail> -->
  </div>

  <!-- Collateral Info -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">DAR REVISION</div>
  </div>
  <div>
    <!-- <jhi-collateral-info-history *ngIf="isDataToCompareExist" [isOnCompareData]="true" [isCompareDar]="true"
      [source]="'summaryAll'" [parentSource]="'loan-analys'" [isViewMode]="true" [creditProposal]="dataToCompare">
    </jhi-collateral-info-history> -->
    <jhi-credit-proposal-collateral-info
      [collateralProperties]="collateralProperties"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
    >
    </jhi-credit-proposal-collateral-info>
  </div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>

  <div>
    <jhi-collateral-info-history
      *ngIf="creditProposal.attributes['previousHistory']"
      [takeOutCompare]="true"
      [isViewMode]="true"
      [creditProposal]="creditProposal"
    >
    </jhi-collateral-info-history>
    <!-- <jhi-credit-proposal-collateral-info *ngIf="!creditProposal.attributes['previousHistory']"
      [collateralProperties]="collateralProperties" [takeOutCompare]="true" [isViewMode]="true"
      [creditProposal]="creditProposal">
    </jhi-credit-proposal-collateral-info> -->

    <div class="e-card" *ngIf="!creditProposal.attributes['previousHistory']">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <div class="e-card-header-title">Collateral Info</div>
        </div>
      </div>
      <div class="alert alert-warning m-3" role="alert">
        <span style="font-weight: bold">No previous data was found!</span>
      </div>
    </div>
  </div>

  <div class="e-card-actions"></div>

  <!-- Covenant -->
  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">DAR REVISION</div>
  </div>
  <div>
    <jhi-credit-proposal-tab-covenant-history
      [isOnCreditAgreement]="true"
      [creditAgreement]="'DAR REVISION'"
      [isViewMode]="true"
      [takeOutCompare]="true"
      [creditProposalItem]="creditProposal"
      [setActiveMenu]="menuCovenant"
    >
    </jhi-credit-proposal-tab-covenant-history>
    <!-- <div class="e-card" *ngIf="!isDataToCompareExist">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <div class="e-card-header-title">Standard Covenant</div>
        </div>
      </div>
      <div class="alert alert-warning m-3" role="alert">
        <span style="font-weight: bold">No previous data was found!</span>
      </div>
    </div> -->
  </div>
  <div class="e-card-actions"></div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>

  <div>
    <jhi-credit-proposal-tab-covenant-history
      [takeOutCompare]="true"
      *ngIf="creditProposal.attributes['previousHistory']; else noCovenantPreviousHistory"
      [isViewMode]="true"
      [creditProposalItem]="creditProposal"
      [setActiveMenu]="menuCovenant"
      [isOnCreditAgreement]="true"
      [creditAgreement]="'FINAL CP'"
    >
    </jhi-credit-proposal-tab-covenant-history>

    <ng-template #noCovenantPreviousHistory>
      <div class="e-card">
        <div class="e-card-header">
          <div class="e-card-header-caption">
            <div class="e-card-header-title">Convenant</div>
          </div>
        </div>
        <div class="alert alert-warning m-3" role="alert">
          <span style="font-weight: bold">No previous data was found!</span>
        </div>
      </div>
    </ng-template>
  </div>

  <div class="e-card-actions"></div>

  <!-- Deviation -->
  <div class="e-card-content mt-3">
    <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
      <div class="e-card-header-title">DAR REVISION</div>
    </div>
    <div>
      <jhi-credit-proposal-tab-covenant-history
        [isOnCreditAgreement]="true"
        [creditAgreement]="'DAR REVISION'"
        [isViewMode]="true"
        [takeOutCompare]="true"
        [creditProposalItem]="creditProposal"
        [setActiveMenu]="menuDeviation"
      >
      </jhi-credit-proposal-tab-covenant-history>
    </div>
  </div>
  <div class="e-card-actions"></div>

  <div style="width: 100%; display: flex; justify-content: center; font-size: 20px; color: #008881">
    <div class="e-card-header-title">FINAL CP</div>
  </div>

  <jhi-credit-proposal-tab-covenant-history
    *ngIf="creditProposal.attributes['previousHistory']; else noDeviationPreviousHistory"
    [takeOutCompare]="true"
    [isViewMode]="true"
    [isOnCreditAgreement]="true"
    [creditAgreement]="'FINAL CP'"
    [creditProposalItem]="creditProposal"
    [setActiveMenu]="menuDeviation"
  >
  </jhi-credit-proposal-tab-covenant-history>

  <ng-template #noDeviationPreviousHistory>
    <div class="e-card">
      <div class="e-card-header">
        <div class="e-card-header-caption">
          <div class="e-card-header-title">Deviation</div>
        </div>
      </div>
      <div class="alert alert-warning m-3" role="alert">
        <span style="font-weight: bold">No previous data was found!</span>
      </div>
    </div>
  </ng-template>

  <div class="e-card-actions"></div>
</div>

<div *ngIf="selectedMenu === 'PREVIOUS DAR'">
  <jhi-agreement-compare-previous-dar [creditProposal]="creditProposal"> </jhi-agreement-compare-previous-dar>
</div>
