<div class="style-close">
  <button class="button-close" mat-button (click)="cancel()">X</button>
</div>
<h2 mat-dialog-title class="header-title">SIGNER</h2>
<mat-dialog-content>
  <div class="row justify-content-between">
    <div class="col-6">
      <div class="mb-2">
        <section>
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Debitor / Pt. Bank Keb Hana Indonesia</mat-label>
            <mat-select [(ngModel)]="debitor" (selectionChange)="onSelectPositon($event)" >
              <mat-option value="">- Please Select -</mat-option>
              <mat-option *ngFor="let item of ['Debitor', 'PT Keb Hana Bank Indonesia']" [value]="item">
                {{ item }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </section>
      </div>

      <div class="mb-2">
        <section>
          <mat-form-field [hidden]="data.creditProposal.customerType !== 'CORPORATE' && debitor !== 'PT Keb Hana Bank Indonesia'" class="w-100" appearance="outline">
            <mat-label>Position</mat-label>
            <input matInput type="text" [(ngModel)]="position" matInput [formControl]="myOption" [matAutocomplete]="auto"/>

            <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete" (optionSelected)="onOptionSelected($event)">
              <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
                {{option}}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </section>
      </div>
    </div>

    <!-- batas -->
    <div class="col-6">
      <div class="mb-2">
        <div class="row">
    
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput type="text" matInput [(ngModel)]="nameDebitor" [formControl]="myName" [matAutocomplete]="name"/>

            <mat-autocomplete autoActiveFirstOption #name="matAutocomplete" >
              <mat-option *ngFor="let nama of filteredName | async" [value]="nama">
                {{nama}}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="center">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-button (click)="onSave()" [disabled]="data.agreements < 1">Save</button>
</mat-dialog-actions>
