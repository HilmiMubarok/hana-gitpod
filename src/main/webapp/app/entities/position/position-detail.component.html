<div class="page-view">
  <h5 class="page-heading">
    <span jhiTranslate="losgwApp.position.home.viewLabel">Positions</span>
  </h5>
  <p-panel>
    <p-header> <span jhiTranslate="losgwApp.position.detail.title">Position</span> {{ position.id }} </p-header>
    <jhi-position-view [item]="position" mode="item"> </jhi-position-view>
    <p-footer>
      <button type="submit" (click)="previousState()" class="btn-info flat-style-button">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back"> Back</span>
      </button>

      <button type="button" [routerLink]="['/position', position.id, 'edit']" class="btn-info flat-style-button">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit"> Edit</span>
      </button>
    </p-footer>
  </p-panel>
</div>
