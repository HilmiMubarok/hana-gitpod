<div class="page-view" *ngIf="item$ | async as item">
  <form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm" style="margin-bottom: 30px">
    <p-panel>
      <ng-template pTemplate="header">
        <h5><span jhiTranslate="losgwApp.position.home.createOrEditLabel">Positions</span></h5>
      </ng-template>
      <ng-template pTemplate="icons">
        <!-- {{'global.field.id' | translate}} : {{position.id}} -->
        <ul class="nav justify-content-end">
          <li class="nav-item" *ngFor="let task of tasks$ | async">
            <a class="btn" (click)="processTask(task)" style="cursor: pointer" tooltip="{{ task.description }}" *ngIf="!readOnly()">
              <span><fa-icon [icon]="task.icon"></fa-icon> &nbsp;{{ task.caption }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="print()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Print current data">
              <span><fa-icon icon="print"></fa-icon> &nbsp;{{ 'entity.action.print' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a
              class="btn"
              (click)="save()"
              href="javascript:void(0)"
              style="cursor: pointer"
              aria-disabled="isSaving"
              tooltip="Back and save current data"
              *ngIf="!readOnly()"
            >
              <span><fa-icon icon="save"></fa-icon> &nbsp;{{ 'entity.action.save' | translate }}</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn" (click)="previousState()" style="cursor: pointer" aria-disabled="isSaving" tooltip="Back, cancel save">
              <span><fa-icon icon="arrow-left"></fa-icon> &nbsp;{{ 'entity.action.back' | translate }}</span>
            </a>
          </li>
        </ul>
      </ng-template>
      <div class="card-deck" style="margin-bottom: 15px">
        <div class="card">
          <div class="card-block">
            <div>
              <div class="form-group" [hidden]="!item.id">
                <label for="id" jhiTranslate="global.field.id">ID</label>
                <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.position.sequence" for="field_sequence">Sequence</label>
                <input
                  currencyMask
                  class="form-control"
                  name="sequence"
                  id="field_sequence"
                  [(ngModel)]="item.sequence"
                  [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
                  [disabled]="readOnly()"
                />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.position.name" for="field_name">Name</label>
                <input type="text" class="form-control" name="name" id="field_name" [(ngModel)]="item.name" [disabled]="readOnly()" />
              </div>
              <div class="form-group">
                <label class="form-control-label" jhiTranslate="losgwApp.position.description" for="field_description">Description</label>
                <input
                  type="text"
                  class="form-control"
                  name="description"
                  id="field_description"
                  [(ngModel)]="item.description"
                  [disabled]="readOnly()"
                />
              </div>

              <div class="form-group">
                <label jhiTranslate="losgwApp.position.positionType" for="field_positionType">Position Type</label>
                <select
                  class="form-control"
                  id="field_positionType"
                  name="positionType"
                  [(ngModel)]="item.positionTypeId"
                  [disabled]="positionTypeId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option
                    [ngValue]="positionTypeOption.id"
                    *ngFor="let positionTypeOption of positiontypes; trackBy: trackPositionTypeById"
                  >
                    {{ positionTypeOption.description }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.position.employee" for="field_employee">Employee</label>
                <select
                  class="form-control"
                  id="field_employee"
                  name="employee"
                  [(ngModel)]="item.employeeId"
                  [disabled]="employeeId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="employeeOption.id" *ngFor="let employeeOption of employees; trackBy: trackEmployeeById">
                    {{ employeeOption.name }}
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label jhiTranslate="losgwApp.position.internal" for="field_internal">Internal</label>
                <select
                  class="form-control"
                  id="field_internal"
                  name="internal"
                  [(ngModel)]="item.internalId"
                  [disabled]="internalId !== undefined"
                  [disabled]="readOnly()"
                >
                  <option [ngValue]="null"></option>
                  <option [ngValue]="internalOption.id" *ngFor="let internalOption of internals; trackBy: trackInternalById">
                    {{ internalOption.name }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-panel>
  </form>
</div>
