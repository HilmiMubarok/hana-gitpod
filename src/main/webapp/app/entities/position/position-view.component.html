<div [hidden]="hiddenHeader">
  <ng-container *ngTemplateOutlet="headerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
<ng-container [ngSwitch]="mode">
  <ng-container *ngSwitchCase="'edit'">
    <div [hidden]="hiddenDefaultEdit">
      <div class="form-group" [hidden]="!item.id">
        <label for="id" jhiTranslate="global.field.id">ID</label>
        <input type="text" class="form-control" id="id" name="id" [(ngModel)]="item.id" readonly />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.position.sequence" for="field_sequence">Sequence</label>
        <input
          currencyMask
          class="form-control"
          name="sequence"
          id="field_sequence"
          [(ngModel)]="item.sequence"
          [options]="{ prefix: '', thousands: '.', decimal: ',', precision: 0 }"
          [disabled]="readOnly()"
        />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.position.name" for="field_name">Name</label>
        <input type="text" class="form-control" name="name" id="field_name" [(ngModel)]="item.name" [disabled]="readOnly()" />
      </div>
      <div class="form-group">
        <label class="form-control-label" jhiTranslate="losgwApp.position.description" for="field_description">Description</label>
        <input
          type="text"
          class="form-control"
          name="description"
          id="field_description"
          [(ngModel)]="item.description"
          [disabled]="readOnly()"
        />
      </div>

      <div class="form-group">
        <label jhiTranslate="losgwApp.position.positionType" for="field_positionType">Position Type</label>
        <select
          class="form-control"
          id="field_positionType"
          name="positionType"
          [(ngModel)]="item.positionTypeId"
          [disabled]="positionTypeId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="positionTypeOption.id" *ngFor="let positionTypeOption of positiontypes; trackBy: trackPositionTypeById">
            {{ positionTypeOption.description }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.position.employee" for="field_employee">Employee</label>
        <select
          class="form-control"
          id="field_employee"
          name="employee"
          [(ngModel)]="item.employeeId"
          [disabled]="employeeId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="employeeOption.id" *ngFor="let employeeOption of employees; trackBy: trackEmployeeById">
            {{ employeeOption.name }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label jhiTranslate="losgwApp.position.internal" for="field_internal">Internal</label>
        <select
          class="form-control"
          id="field_internal"
          name="internal"
          [(ngModel)]="item.internalId"
          [disabled]="internalId !== undefined"
          [disabled]="readOnly()"
        >
          <option [ngValue]="null"></option>
          <option [ngValue]="internalOption.id" *ngFor="let internalOption of internals; trackBy: trackInternalById">
            {{ internalOption.name }}
          </option>
        </select>
      </div>
    </div>
    <ng-container *ngTemplateOutlet="editViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
  <ng-container *ngSwitchCase="'card'">
    <div [hidden]="hiddenDefaultCard">
      <p-card title="{{ item.id }}" subtitle="Subtitle" styleClass="col-sm-4">
        <p-header> </p-header>
        <div>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt quisquam
          repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
        </div>
        <p-footer>
          <button pButton type="button" label="Save" icon="pi pi-check" style="margin-right: 0.25em"></button>
          <button pButton type="button" label="Cancel" icon="pi pi-times" class="ui-button-secondary"></button>
        </p-footer>
      </p-card>
    </div>
    <ng-container *ngTemplateOutlet="cardViewTemplate; context: { $implicit: item }"> </ng-container>
  </ng-container>
</ng-container>
<div [hidden]="hiddenFooter">
  <ng-container *ngTemplateOutlet="footerViewTemplate; context: { $implicit: item }"></ng-container>
</div>
