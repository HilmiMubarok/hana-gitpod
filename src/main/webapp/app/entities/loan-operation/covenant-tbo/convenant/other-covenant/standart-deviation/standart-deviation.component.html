<div>
  <div class="table-responsive-material">
    <table mat-table id="tblOtherCovenant" class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let i = index"></td>
      </ng-container>
      <ng-container matColumnDef="convenant">
        <th mat-header-cell *matHeaderCellDef class="grid-index-left">Convenant</th>
        <td mat-cell *matCellDef="let element" class="grid-index-left"></td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="grid-index-left">Status</th>
        <td mat-cell *matCellDef="let element" class="grid-index-left"></td>
      </ng-container>
      <ng-container matColumnDef="deviation">
        <th mat-header-cell *matHeaderCellDef>Deviation</th>
        <td mat-cell *matCellDef="let element"></td>
      </ng-container>
      <ng-container matColumnDef="justification">
        <th mat-header-cell *matHeaderCellDef>Justification</th>
        <td mat-cell *matCellDef="let element"></td>
      </ng-container>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
    </table>
  </div>
  <!-- <mat-card *ngIf="loading" id="material-loading-bar">
      <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
    </mat-card> -->
</div>
