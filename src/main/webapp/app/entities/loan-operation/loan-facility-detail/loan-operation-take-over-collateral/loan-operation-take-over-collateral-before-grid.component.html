<mat-label style="margin: 1rem">Collateral Info</mat-label>
<mat-card-content>
  <div class="table-responsive-material">
    <table mat-table *ngIf="creditProposal && !loading" class="w-100" [dataSource]="creditProposal.attributes['collateralPrevious']">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef>No</th>
        <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>
      <ng-container matColumnDef="collateralType">
        <th mat-header-cell *matHeaderCellDef>Collateral Type</th>
        <td mat-cell *matCellDef="let element">{{ element.collateralType }}</td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>
      <ng-container matColumnDef="marketValue">
        <th mat-header-cell *matHeaderCellDef>MV Internal in IDR</th>
        <td mat-cell *matCellDef="let element">
          {{ element.marketValue | currency: 'IDR ':'symbol':'1.0-0' }}
        </td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>
      <ng-container matColumnDef="liquidValue">
        <th mat-header-cell *matHeaderCellDef>LV Internal in IDR</th>
        <td mat-cell *matCellDef="let element">
          {{ element.liquidValue | currency: 'IDR ':'symbol':'1.0-0' }}
        </td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="openDialog(element)">
            <mat-icon>remove_red_eye</mat-icon>
          </button>
          <section *ngIf="!isViewMode">
            <button mat-icon-button (click)="onDelete(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </section>
        </td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No records found.</td>
      </tr>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
    </table>
  </div>
</mat-card-content>
<section *ngIf="!isViewMode">
  <div align="right" class="mt-3 align-right">
    <button mat-raised-button (click)="openDialog()" class="button-styling" style="margin-right: 0.6rem">ADD</button>
  </div>
</section>
