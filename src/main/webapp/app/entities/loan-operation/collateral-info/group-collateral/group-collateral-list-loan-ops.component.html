<mat-card-header>
  <mat-card-header-subtitle class="e-card-header-title">Group Collateral</mat-card-header-subtitle>
</mat-card-header>
<mat-card-content>
  <div style="margin: 30px">
    <section *ngIf="isElement">
      <mat-slide-toggle [(ngModel)]="isChecked" (ngModelChange)="slideChange($event)"
        >Is Collateral Cross col, All Facillities?</mat-slide-toggle
      >
    </section>
    <section *ngIf="isLabel">
      <mat-slide-toggle [(ngModel)]="isChecked" (ngModelChange)="slideChange($event)" disabled
        >Is Collateral Cross col, All Facillities?</mat-slide-toggle
      >
    </section>
  </div>
  <div class="table-responsive-material">
    <table mat-table [dataSource]="listGroupCollateral" multiTemplateDataRows class="w-100">
      <ng-container matColumnDef="no">
        <th mat-header-cell *matHeaderCellDef class="rounding-table-left grid-index-center">No</th>
        <td mat-cell *matCellDef="let i = dataIndex" class="grid-index-center">{{ i + 1 }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="grid-index-left">Name</th>
        <td mat-cell *matCellDef="let element" class="grid-index-left">
          {{ element.customerName }}
        </td>
      </ng-container>
      <ng-container matColumnDef="cif">
        <th mat-header-cell *matHeaderCellDef class="grid-index-left">CIF</th>
        <td mat-cell *matCellDef="let element" class="grid-index-left">
          {{ element.customerCIF }}
        </td>
      </ng-container>

      <ng-container matColumnDef="expand">
        <th mat-header-cell *matHeaderCellDef aria-label="row actions" class="grid-index-left rounding-table-right">&nbsp;</th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-icon-button
            aria-label="expand row"
            (click)="expandedElement = expandedElement === element ? null : element; $event.stopPropagation()"
          >
            <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
            <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
          <div class="example-element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
            <mat-card class="w-100 mx-auto">
              <mat-card-content>
                <jhi-group-collateral-loan-ops
                  [collateralProperties]="collateralProperties"
                  [cif]="element.customerCIF"
                  [partyId]="element.partyId"
                  [isViewMode]="isViewMode"
                  [creditProposal]="creditProposal"
                  [group]="'group'"
                ></jhi-group-collateral-loan-ops>
              </mat-card-content>
            </mat-card>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
      <tr
        mat-row
        *matRowDef="let element; columns: columnsToDisplayWithExpand"
        class="example-element-row"
        [class.example-expanded-row]="expandedElement === element"
        (click)="expandedElement = expandedElement === element ? null : element"
      ></tr>
      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
    </table>
  </div>
  <mat-card *ngIf="loading" id="material-loading-bar">
    <mat-progress-spinner color="warn" mode="indeterminate"> </mat-progress-spinner>
  </mat-card>
  <mat-paginator
    showFirstLastButtons
    ngClass="transparant"
    [length]="paginatorLength"
    [pageSize]="paginatorPageSize"
    [pageSizeOptions]="paginatorPageSizeOption"
    (page)="loadDataLazy($event)"
  >
  </mat-paginator>
</mat-card-content>
