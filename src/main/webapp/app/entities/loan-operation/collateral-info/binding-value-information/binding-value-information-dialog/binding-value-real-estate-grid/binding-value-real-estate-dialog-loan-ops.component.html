<h2 mat-dialog-title class="header-title">Binding Value Information</h2>
<mat-dialog-content>
  <mat-card>
    <mat-card-content>
      <div class="row">
        <div class="col-6">
          <section *ngIf="isElement">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Rank</mat-label>
              <mat-select name="rank">
                <mat-option value=" ">- Please Select -</mat-option>
                <mat-option *ngFor="let item of lovRank" [value]="item.code">
                  {{ item.value }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </section>
          <section *ngIf="isElement">
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Binding Value</mat-label>
                <input matInput type="text" [(ngModel)]="dataFidusia.value" />
              </mat-form-field>
            </div>
          </section>
          <section *ngIf="isElement">
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Binding Number</mat-label>
                <input matInput type="text" [(ngModel)]="dataFidusia.agreementNumber" />
              </mat-form-field>
            </div>
          </section>
        </div>
        <div class="col-6">
          <section *ngIf="isElement">
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Binding Date</mat-label>
                <input [matDatepicker]="bindingDate" [formControl]="date" matInput type="text" [(ngModel)]="dataFidusia.dateAgreement" />
                <mat-datepicker-toggle matSuffix [for]="bindingDate"></mat-datepicker-toggle>
                <mat-datepicker #bindingDate></mat-datepicker>
              </mat-form-field>
            </div>
          </section>
          <section *ngIf="isElement">
            <div class="form-group">
              <mat-form-field class="w-100" appearance="outline">
                <mat-label>Cover</mat-label>
                <input matInput type="text" [(ngModel)]="dataFidusia.cover" />
              </mat-form-field>
            </div>
          </section>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>
<mat-dialog-actions align="center" class="align-center">
  <section>
    <button mat-raised-button class="confirm-button-no" (click)="openCancelDialog()">Cancel</button>
    <button mat-raised-button class="confirm-button-yes" (click)="save()">Save</button>
  </section>
  <!-- <section *jhiMatrixDir="creditProposal.statusId; menu: 'cp-and-memo'; subMenu: ''; elementType: ''">
      <button mat-raised-button mat-dialog-close class="confirm-button-no">Cancel</button>
    </section> -->
</mat-dialog-actions>
